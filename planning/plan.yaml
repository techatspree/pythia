project:
  name: estimation-tool
  description: Project effort estimation tool for software development tasks
  version: 0.1.0

stack:
  frontend:
    framework: sveltekit
    language: typescript
    build: vite
    rendering: adapter-static-spa
    styling: tailwind
    api_client: openapi-fetch
    auth: modular   # dev | entra | keycloak
  backend:
    framework: quarkus
    language: java
    java_version: "21"
    persistence: hibernate-orm-panache
    migrations: flyway
    auth: quarkus-oidc
  database:
    engine: postgresql
    version: "16"
  platform:
    orchestrator: kubernetes
    local: minikube
    manifests: kustomize
    image_build: jib

domain_entities:
  - name: Project
    fields: [id, name, description, client, status, owner, created_at, updated_at]
  - name: Estimation
    fields: [id, project_id, title, description, current_version_id, created_at, updated_at]
  - name: EstimationVersion
    fields: [id, estimation_id, version_number, status, created_by, created_at, total_effort, notes]
    constraints: [unique(estimation_id, version_number), immutable_when_status_not_draft]
  - name: EstimationItem
    fields: [id, version_id, description, category, optimistic, likely, pessimistic, assumptions]
  - name: User
    fields: [id, subject_id, provider, email, display_name, roles]
  - name: AuditLog
    fields: [id, user_id, entity_type, entity_id, action, payload, created_at]

# Phase MEMBERSHIP is not recorded here. A task's phase lives in its own file
# (`planning/tasks/task-NNN.yaml`, the `phase:` field), and `./scripts/status.sh`
# groups the plan by it — that is already the only thing that reads this block,
# and it reads `id`/`name` only. The per-phase `tasks:` lists that used to sit
# here were a second copy nothing consulted, and 37 of them had gone stale
# (task-165). Do not re-add them; run `./scripts/phase-check.sh` to audit.
phases:
  - id: phase-1
    name: Foundation and Local Environment
    duration_weeks: 1
  - id: phase-2
    name: Modular Authentication and Authorization
    duration_weeks: 1
  - id: phase-3
    name: Core Domain and Persistence
    duration_weeks: 1
  - id: phase-4
    name: REST API and Business Logic
    duration_weeks: 1
  - id: phase-5
    name: Frontend Application
    duration_weeks: 2
  - id: phase-6
    name: Containerization and Kubernetes
    duration_weeks: 1
  - id: phase-7
    name: Observability, CI/CD, Hardening
    duration_weeks: 1
  - id: phase-8
    name: Polish and Production Readiness
    duration_weeks: 1
  - id: phase-9
    name: Tree-shaped Estimation Hierarchy
    duration_weeks: 1
  - id: phase-10
    name: Code Quality and Static Analysis
    duration_weeks: 1
  - id: phase-11
    name: Collaborative Estimation Sessions
    duration_weeks: 2
  - id: phase-12
    name: Persistent Undo Across Sessions
    duration_weeks: 2
  - id: phase-13
    name: Excel-aligned Domain, KMP & Build Reactor
    duration_weeks: 3
  - id: phase-14
    name: Post-MVP Hardening & Build Modernization
    duration_weeks: 3
  - id: phase-15
    name: Pluggable Estimation Methods
    duration_weeks: 4
  - id: phase-16
    name: Internationalization
    duration_weeks: 2
  - id: phase-17
    name: Branding & Visual Identity
    duration_weeks: 1
  - id: phase-18
    name: Open Source Release
    duration_weeks: 1
  - id: phase-19
    name: Dependency tracking and Gant Chart
    duration_weeks: 3
  - id: phase-20
    name: Phase-aware scheduling
    duration_weeks: 2

execution:
  task_format: tasks/<task-id>.yaml
  status_file: status.json
  default_state: pending
  states: [pending, in_progress, blocked, done, skipped]
