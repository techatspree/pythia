id: task-199
phase: phase-18
title: "Publish releases: GHCR images + digest-pinned deploy bundle"
depends_on: [task-193, task-196]
description: |
  After task-193 a release is a CI-gated tag `v<MAJOR>.<MINOR>.<PATCH>` on
  `main`, but a release still PUBLISHES nothing: the `images` job builds both
  images and pushes them nowhere. A downstream installation therefore has to
  build Pythia itself, which needs a copy of the source inside its network,
  a job keeping that copy current, and the whole Gradle/npm/Node toolchain on
  its runner. It ALSO needs the Kubernetes manifests and `scripts/deploy.sh`
  from exactly the same version as the images, which today it can only get
  from a git checkout of this repository.

  After this task every release publishes everything a deployment needs, and
  a consumer builds nothing and clones nothing:

  1. **Both images, multi-arch, on GHCR**:
     `ghcr.io/<owner>/pythia/pythia-backend:<version>` and
     `ghcr.io/<owner>/pythia/pythia-frontend:<version>`, where `<owner>` is the
     GitHub owner of this repository, lower-cased, and `<version>` is the
     tag WITHOUT its `v` (`v1.2.0` → `1.2.0`). That is the application
     version task-193 puts in `gradle.properties` on the release commit, the
     value `frontendImageTag` already defaults to, and the API's
     `info.version`, so the image tag, the version the app reports and the
     Gradle version are one string. Only the tag, the GitHub Release and the
     bundle keep the `v`. The `pythia/pythia-*`
     part deliberately equals the image names the overlays already use
     (`${REGISTRY}/pythia/pythia-backend`), so `REGISTRY=ghcr.io/<owner>`
     pulls straight from GHCR and a consumer that copies the images into its
     own registry keeps the same paths. Both packages are PUBLIC.
  2. **A deploy bundle attached to the GitHub Release of the tag**:
     `pythia-deploy-<tag>.tar.gz` plus `pythia-deploy-<tag>.tar.gz.sha256`.

  ## The bundle is a public contract

  Downstream consumers depend on the bundle, NOT on this repository's
  layout, so its shape is documented in `docs/deployment.md` and changed
  only deliberately:

  ```
  pythia-deploy-v1.2.0/
    release.env                 the release's identity, see below
    LICENSE  NOTICE             Apache-2.0 requires NOTICE to travel along
    scripts/deploy.sh
    scripts/smoke.sh
    k8s/base/**
    k8s/overlays/staging/**
    k8s/overlays/production/**  (NOT the minikube overlay)
  ```

  `release.env`, `KEY=value` lines only, no quoting, no comments:

  ```
  PYTHIA_VERSION=v1.2.0
  SOURCE_COMMIT=<40-hex commit the tag points at>
  BACKEND_IMAGE=ghcr.io/<owner>/pythia/pythia-backend
  BACKEND_DIGEST=sha256:<64 hex>
  FRONTEND_IMAGE=ghcr.io/<owner>/pythia/pythia-frontend
  FRONTEND_DIGEST=sha256:<64 hex>
  ```

  The digests are those of the multi-arch INDEXES this release run pushed.
  The digest, not the tag, is the contract: GHCR tags can be overwritten, a
  digest cannot, and our image build is not byte-reproducible (root
  CLAUDE.md), so a re-run would produce different digests under the same
  tag.

  **The bundle is built with `git archive` from the tag**, with `release.env`
  added via `--add-virtual-file`. That makes it (a) exactly the tagged
  content, never a dirty working tree, and (b) byte-reproducible: verified
  2026-10-11 with git 2.54, two runs give the same SHA-256 (git's internal
  gzip writes no timestamp, entries carry the commit time). No GNU tar, no
  new tool.

  ## The overlays pin images by digest

  `k8s/overlays/{staging,production}/kustomization.yaml` replace
  `newTag: ${IMAGE_TAG}` with `digest: ${BACKEND_DIGEST}` /
  `digest: ${FRONTEND_DIGEST}`. Verified 2026-10-11 with kubectl 1.37:
  kustomize passes the placeholder through and renders
  `${REGISTRY}/pythia/pythia-backend@${BACKEND_DIGEST}`, which `deploy.sh`'s
  existing envsubst step resolves. `IMAGE_TAG` disappears from both
  overlays. The minikube overlay is untouched (it uses its own registry and
  tag, task-196).

  ## The images are linked to this repository

  Jib images carry no `org.opencontainers.image.source` label, so GHCR
  cannot link the packages to this repository on its own. The publish job
  therefore sets that label to `${{ github.server_url }}/${{ github.repository }}`
  on BOTH images, passed as a build argument in that job ONLY:
    - backend: `-Dquarkus.container-image.labels."org.opencontainers.image.source"=…`
      (Quarkus 3.40 has no `quarkus.jib.labels`; the generic key is it);
    - frontend: a new optional Gradle property `frontendImageSourceUrl` that
      `:frontend:imageBuild` turns into the same label when set.
  The value is constant per repository, never clock- or host-derived, so the
  reproducibility rules (root CLAUDE.md, CI's assertions) are unaffected.
  Local and CI builds without the property stay byte-identical to today.

  ## deploy.sh reads release.env

  When `$PROJECT_ROOT/release.env` exists (i.e. `deploy.sh` runs from an
  unpacked bundle), `deploy.sh` takes `BACKEND_DIGEST`, `FRONTEND_DIGEST`
  and `PYTHIA_VERSION` from it, BEFORE rendering anything:
  - It parses the file, never `source`s it: only lines matching
    `^[A-Z_]+=[^[:space:]]*$`, only the keys listed above, anything else is
    an error. The bundle is downloaded data.
  - ALL six keys must be present, each exactly once. A bundle missing
    `FRONTEND_DIGEST` would otherwise fall through to whatever the caller's
    environment holds, the exact ambiguity the refusal below exists to
    prevent.
  - If the caller ALSO set `BACKEND_DIGEST` or `FRONTEND_DIGEST` to a
    DIFFERENT value, it refuses. The bundle's pin wins by refusal, not by
    silently overriding either side.
  - It exports them, because envsubst reads the environment.
  Without `release.env` (a git checkout, e.g. testing against a local
  minikube) the caller supplies both digests, and the existing
  placeholder check already names them when they are missing. In BOTH cases
  every `*_DIGEST` value must match `^sha256:[0-9a-f]{64}$`, or `deploy.sh`
  refuses: an envsubst of a malformed digest would only fail at pull time.
  The final message names `PYTHIA_VERSION` (or "unversioned") and both
  digests instead of `IMAGE_TAG`.

  ## The publish job

  A `publish` job in `.github/workflows/ci.yaml`, only for `v*` tags, after
  every gating job has passed. Its permissions are raised at JOB level only
  (`contents: write` for the release, `packages: write` for GHCR); the
  workflow-level `permissions: contents: read` stays, and it uses the
  built-in `GITHUB_TOKEN` and no secret. The owner is never written as a
  literal: `ci.yaml` must not contain it (task-027's validation greps the
  workflow for it), so the job derives it from
  `${{ github.repository_owner }}`. That also makes the job work unchanged in
  a fork, which the dry run below relies on.

  Order, and why: push the backend → `_Bean` check (task-194) on the
  augmentation that was just pushed → push the frontend → read both index
  digests from the registry, assert amd64 + arm64, and cross-check each
  against the digest Jib itself recorded for its push (the backend's
  `build/quarkus-app/jib-image.digest`, the frontend's
  `build/frontend-image/jib-image.digest` at the ROOT, which `:frontend:imageBuild`
  writes — its own build/ is the SPA and would ship the file),
  so a tag overwritten between push and read fails the job → build the bundle →
  create the release as a DRAFT with both assets → publish the draft. A
  consumer can only see a release whose images exist and passed the check;
  a failed run leaves at most unreferenced images on GHCR and a draft.

  Re-runs: if a PUBLISHED release for the tag already exists, the job fails
  ("releases are immutable; tag the next patch version", task-193). A DRAFT
  left by a failed run is deleted and recreated (`gh release delete` without
  `--cleanup-tag` keeps the tag).

  ## Dry run in a fork, before any real release

  Nothing exercises the `publish` job until a real `v*` tag, and tags are
  immutable (task-193), so a defect found that way costs a version number.
  Since the job derives its owner, registry path and release target from
  the repository it runs in, a personal fork runs it end to end against the
  FORK's own GHCR namespace and Releases: push the branch to the fork, cut a
  throwaway tag there (e.g. `v0.0.1`, on a commit whose `gradle.properties`
  says `version=0.0.1`, so `release-tag` passes), and let the workflow run.
  Then download the fork's bundle and run the consumer-side verification
  from `docs/deployment.md` against it. This touches only the fork, never
  this repository's origin, tags, packages or releases. It is an outward
  action on the user's GitHub account, so the implementer asks the user
  before pushing anything and records the run URL. The task is NOT done
  until that run is green.

  ## Downstream consequences (internal, reported, not done here)

  Dropping the mirror model changes the internal side, which this public
  repository must not name. The implementer's final report lists, without
  internal names:
    - the GitLab sync job becomes obsolete (and the open follow-up "make it
      push `refs/tags/v*`" is withdrawn);
    - the deploy pipeline project must be rewritten to poll releases,
      download and verify the bundle, optionally copy the images, and run
      `deploy.sh` from the bundle;
    - the server must reach `github.com`, its release-asset host and
      `ghcr.io` (or the internal registry holding copies);
    - the workspace-level notes describing the mirror wiring become stale.

  ## One-time GitHub settings (documented, not automated)

  - After the first publish, set both GHCR packages to PUBLIC (package page →
    Package settings → Change visibility) and check they are linked to this
    repository. If the first push is refused with 403, the organisation's
    package settings must grant this repository write access (Package
    settings → Manage Actions access).
  - Enable immutable releases for the repository if the plan offers it
    (Settings → General → Releases), so a published release's assets cannot
    be replaced afterwards. The `.sha256` asset detects corruption, not a
    replaced pair; immutability is what covers that.

  ## Out of scope

  Signing or attestations (cosign, GitHub artifact attestations), SBOMs,
  publishing the minikube overlay, and any downstream pipeline. (The
  version model is settled by task-193: the release commit carries
  `version=X.Y.Z`, `release-tag` enforces that the tag matches it, and
  `main` moves on to the next `-SNAPSHOT`. This task relies on that.)

  ## What does NOT go here

  Any internal hostname, registry, group or project name. Refer to the
  internal deployment only as `<internal-group>/<deploy-project>`.

steps:
  - |
    Read `.github/workflows/ci.yaml` as task-193 left it (the `release-tag`
    job, the `v*` trigger) and the push commands task-196 established in
    `scripts/minikube-deploy.sh` and the `images` job. The publish job copies
    those forms; it does not invent new ones.
  - |
    `k8s/overlays/staging/kustomization.yaml` and
    `k8s/overlays/production/kustomization.yaml`: in both `images:` entries
    replace `newTag: ${IMAGE_TAG}` with `digest: ${BACKEND_DIGEST}` resp.
    `digest: ${FRONTEND_DIGEST}`. Rewrite the comment above them: the image is
    pinned by the digest of a released multi-arch index, which a release's
    `release.env` provides; drop the "short commit SHA" sentence. Keep
    production's point that a floating tag must never be deployed.
  - |
    `k8s/base/backend/deployment.yaml` and `k8s/base/frontend/deployment.yaml`:
    their image comment (line ~20) says the overlays set
    `newTag (staging/production: ${IMAGE_TAG}, …)`. Rewrite it for the digest
    pin (`staging/production: digest ${BACKEND_DIGEST}` /
    `${FRONTEND_DIGEST}`; minikube unchanged).
  - |
    `scripts/deploy.sh`: implement "deploy.sh reads release.env" exactly as
    described (all six keys required), placed BEFORE `kubectl kustomize` (and before the tool check,
    so a mismatch fails with no cluster contact). Validate every `*_DIGEST`
    the rendered overlay requires after the existing placeholder check.
    Update the header comment and the usage text (they name `IMAGE_TAG`
    today) and the final message. Keep the refuse-to-be-sourced guard and
    `set -euo pipefail`.
  - |
    Create `scripts/release-bundle.sh`, executable, same refuse-to-be-sourced
    guard and `set -euo pipefail` as `deploy.sh`:
      scripts/release-bundle.sh <version> <image-base> <backend-digest> \
                                <frontend-digest> <out-dir> [<git-ref>]
    `<image-base>` is e.g. `ghcr.io/<owner>/pythia`; `<git-ref>` defaults to
    `<version>`. It validates `<version>` against
    `^v[0-9]+\.[0-9]+\.[0-9]+$` and both digests against
    `^sha256:[0-9a-f]{64}$`, writes `release.env` content (SOURCE_COMMIT =
    `git rev-parse "<git-ref>^{commit}"`), and runs
      git archive --format=tar.gz --prefix="pythia-deploy-$V/" \
        --add-virtual-file="pythia-deploy-$V/release.env:$ENV" \
        "<git-ref>^{commit}" -- LICENSE NOTICE scripts/deploy.sh \
        scripts/smoke.sh k8s/base k8s/overlays/staging k8s/overlays/production
    into `<out-dir>/pythia-deploy-$V.tar.gz`, then writes
    `pythia-deploy-$V.tar.gz.sha256` in `sha256sum` format
    (`<hex>  pythia-deploy-$V.tar.gz`, so `sha256sum -c` works from
    `<out-dir>`). Use `shasum -a 256` when `sha256sum` is missing (macOS).
    Comment WHY `git archive`: tagged content only, and byte-reproducible.
  - |
    `ci.yaml`: add the `publish` job.
      if: startsWith(github.ref, 'refs/tags/v')
      needs: [build, e2e, images, release-tag]   # every gating job
      permissions: { contents: write, packages: write }
      concurrency: { group: publish-${{ github.ref }}, cancel-in-progress: false }
    Same checkout / setup-java / setup-gradle steps and pinning as the
    `images` job. Shell steps, with `GH_TOKEN: ${{ github.token }}`:
      V="$GITHUB_REF_NAME"
      OWNER="${GITHUB_REPOSITORY_OWNER,,}"
      BASE="ghcr.io/$OWNER/pythia"
    a. Release state: `gh release view "$V" --json isDraft -q .isDraft`;
       `false` → fail with the immutability message; `true` → delete the
       draft; not found → continue.
    Also `VER="${V#v}"` (the image tag, see the description) and
    `SRC="${{ github.server_url }}/${{ github.repository }}"`.
    b. Backend, credentials as environment variables only
       (`QUARKUS_CONTAINER_IMAGE_USERNAME=${{ github.actor }}`,
       `QUARKUS_CONTAINER_IMAGE_PASSWORD=${{ github.token }}`):
         ./gradlew :backend:implementation:quarkusAppPartsBuild --rerun \
           :backend:implementation:imageBuild \
           -Dquarkus.container-image.push=true \
           -Dquarkus.container-image.image="$BASE/pythia-backend:$VER" \
           -Dquarkus.container-image.labels.\"org.opencontainers.image.source\"="$SRC" \
           --no-build-cache
       `quarkus.container-image.image` replaces registry/group/name/tag in
       one value. Confirm in the log that the pushed reference is exactly
       `$BASE/pythia-backend:$VER`, and that the label reached the image config
       (task-198 lesson: Quarkus 3.40 ignores keys it does not read), and that task-196's push-implies-multi-arch
       still triggers (it keys on `quarkus.container-image.push`). If Quarkus
       ignores `image`, use `registry=ghcr.io`, `group=$OWNER/pythia`,
       `tag=$VER` instead, and say so in a comment.
    c. The task-194 `_Bean` check on
       `src/backend/implementation/build/quarkus-app/quarkus/generated-bytecode.jar`
       of THIS augmentation: `EntraAuthModule_Bean.class` present,
       `DevAuthModule_Bean.class` absent. Reuse the `build` job's check
       rather than duplicating its wording.
    d. Frontend (`ORG_GRADLE_PROJECT_frontendImageUsername` / `…Password`
       from the same token):
         ./gradlew :frontend:imageBuild -PfrontendImagePush=true \
           -PfrontendImageRegistry="ghcr.io/$OWNER" -PfrontendImageTag="$VER" \
           -PfrontendImageSourceUrl="$SRC"
       which yields `$BASE/pythia-frontend:$VER`. Add `frontendImageSourceUrl`
       to `src/frontend/build.gradle.kts` (optional; when set, jib-core adds
       the `org.opencontainers.image.source` label; when unset, the image is
       unchanged) and to the property table in `src/frontend/CLAUDE.md`.
    e. Digests: for each image, `skopeo inspect --raw --creds
       "${{ github.actor }}:$GH_TOKEN" "docker://$BASE/pythia-<x>:$VER"` into a
       file; assert with jq that `.manifests[].platform.architecture`
       contains `amd64` and `arm64`; digest = `sha256:` + SHA-256 of those
       raw bytes (the definition of a manifest digest). Fail unless it equals
       the digest Jib recorded for that push (see the description). Install skopeo with
       apt only if `command -v skopeo` fails.
    f. `scripts/release-bundle.sh "$V" "$BASE" "$BD" "$FD" dist`, then
       `(cd dist && sha256sum -c pythia-deploy-$V.tar.gz.sha256)`.
    g. `gh release create "$V" --verify-tag --draft --title "Pythia $VER"
       --notes-file notes.md dist/*` where notes.md lists both image
       references WITH digests and the bundle checksum; then
       `gh release edit "$V" --draft=false`.
    Comment the order (see description) above the job.
  - |
    `docs/deployment.md` — rewrite for the published-release model. This
    task, not task-193, owns the downstream flow:
    - Overview and "GitLab setup": there is no mirror and no external CI
      configuration any more. A downstream pipeline
      (`<internal-group>/<deploy-project>`) polls for the newest `v*` tag,
      downloads that release's bundle, optionally copies the images into its
      own registry, and runs `deploy.sh` from the unpacked bundle on the
      server. Drop the "Pull mirror" and "External CI configuration" steps.
    - Replace "## Pipeline stages" stage 1 ("Build and push images") with
      "## What a release publishes": both GHCR references, the bundle layout
      and the `release.env` keys above (as the contract), the checksum, and
      how a consumer verifies and copies:
        sha256sum -c pythia-deploy-v1.2.0.tar.gz.sha256
        skopeo copy --all --preserve-digests \
          docker://ghcr.io/<owner>/pythia/pythia-backend@$BACKEND_DIGEST \
          docker://$REGISTRY/pythia/pythia-backend:1.2.0
      (`--all` keeps every platform, `--preserve-digests` keeps the digest
      the overlay pins). Keep the paragraphs from tasks 194/195/196 about how
      the images are built (no auth provider, no Docker daemon, multi-arch,
      reproducibility inputs) under that heading: they describe what is
      published.
    - Variables table: remove `IMAGE_TAG`; add `BACKEND_DIGEST` /
      `FRONTEND_DIGEST` ("from the bundle's release.env; set by hand only
      when deploying from a git checkout"); `REGISTRY` may be
      `ghcr.io/<owner>` or a registry holding copies. Fix the
      `REGISTRY_USER` / `REGISTRY_PASSWORD` row (no `docker login`; pull
      credentials for the cluster, not needed for public GHCR).
    - "Runner requirements": no Docker, no build toolchain; HTTPS to
      `github.com` (tags and release assets, which redirect to a
      `*.githubusercontent.com` host), `ghcr.io` (blobs redirect to
      `pkg-containers.githubusercontent.com`), and the consumer's own
      registry if it copies.
    - Remove "### Mirrors must sync release tags" (task-193): there is no
      mirror. Rewrite "### Why the pipeline is not in this repository" so it
      still explains the publishability split but describes the downstream
      as a CONSUMER of releases, not a mirror running this repo's CI.
    - "Image tags: always immutable" → digests; "Deploying by hand" →
      download, verify, unpack, run `./scripts/deploy.sh <stage>` inside the
      bundle directory; "Rollback" → deploy the previous release's bundle.
      Flyway migrations are forward-only: rolling back across a release that
      added a migration is not safe — say so there.
    - "## Releasing" (task-193): add the one-time GHCR visibility and
      immutable-releases settings, and what `publish` does on a re-run.
    - `git grep -n IMAGE_TAG` afterwards: only `MINIKUBE_IMAGE_TAG` hits may
      remain, anywhere in the repository except `planning/`.
  - |
    Root `CLAUDE.md`, paragraph "Deployment (task-028) is NOT in this
    repository": replace "pull-mirrors the GitHub repo" and the
    `${IMAGE_TAG}` mention. Releases publish GHCR images and a deploy bundle
    (task-199); the overlays carry `${BACKEND_DIGEST}`/`${FRONTEND_DIGEST}`;
    the bundle layout and `release.env` keys are a public contract
    documented in `docs/deployment.md`. Keep "never commit a real one".
  - |
    DRY RUN IN A FORK (see the description). Ask the user first — it pushes
    to their GitHub account. Then: push this branch to the fork, set the
    fork's version to `0.0.1` on a throwaway commit there and tag `v0.0.1`,
    and watch the fork's workflow. Required: `publish` green; both packages
    on the fork's GHCR as multi-arch indexes carrying the source label; a
    published release with the bundle and `.sha256`; and the consumer flow
    from `docs/deployment.md` (download, `sha256sum -c`, unpack,
    `release.env` digests equal the registry's) succeeding against it.
    Re-running the job must fail with the immutability message. Record the
    run URL. Afterwards delete the throwaway release, tag and packages in the
    fork. Do not mark the task done before this step passes.
  - |
    Re-read every changed line for an internal hostname, registry, group,
    project or organisation name; and `ci.yaml` for the literal repository
    owner (must be absent, see the description).
  - |
    ./gradlew build
  - |
    In the final report, list the downstream consequences from the
    description WITHOUT internal names: obsolete sync job, rewritten deploy
    pipeline, the server's new egress, stale workspace notes.

validation:
  - |
    ruby -ryaml -e '
      w = YAML.load_file(".github/workflows/ci.yaml")
      abort "top-level permissions changed" unless w["permissions"] == {"contents" => "read"}
      p = w["jobs"]["publish"] or abort "no publish job"
      abort "publish permissions" unless p["permissions"] == {"contents" => "write", "packages" => "write"}
      w["jobs"].each { |n, j| abort "#{n} has elevated permissions" if n != "publish" && j["permissions"] }
      abort "publish must need the gate" unless (%w[build e2e images release-tag] - Array(p["needs"])).empty?
      abort "publish if" unless p["if"].to_s.include?("refs/tags/v")'
  - |
    ! grep -qi "techatspree" .github/workflows/ci.yaml
  - |
    grep -q "repository_owner" .github/workflows/ci.yaml && grep -q "draft=false" .github/workflows/ci.yaml && grep -q "quarkusAppPartsBuild --rerun" .github/workflows/ci.yaml
  - |
    ! grep -rq 'IMAGE_TAG' k8s/overlays/staging k8s/overlays/production scripts/deploy.sh
  - |
    D="sha256:$(printf 'a%.0s' $(seq 64))"; F="sha256:$(printf 'b%.0s' $(seq 64))"
    for s in staging production; do
      kubectl kustomize k8s/overlays/$s | REGISTRY=r.example BACKEND_DIGEST=$D FRONTEND_DIGEST=$F \
        envsubst '${REGISTRY} ${BACKEND_DIGEST} ${FRONTEND_DIGEST}' > /tmp/r.yaml
      grep -q "image: r.example/pythia/pythia-backend@$D" /tmp/r.yaml
      grep -q "image: r.example/pythia/pythia-frontend@$F" /tmp/r.yaml
    done
  - |
    # The bundle: deterministic, the documented layout, valid release.env.
    # `git stash create` gives a commit of the working tree, so this runs
    # before the change is committed (falls back to HEAD when clean).
    REF=$(git stash create); REF=${REF:-HEAD}
    D="sha256:$(printf 'a%.0s' $(seq 64))"; F="sha256:$(printf 'b%.0s' $(seq 64))"
    O=$(mktemp -d)
    scripts/release-bundle.sh v0.0.0 ghcr.io/acme/pythia "$D" "$F" "$O/1" "$REF"
    scripts/release-bundle.sh v0.0.0 ghcr.io/acme/pythia "$D" "$F" "$O/2" "$REF"
    cmp "$O/1/pythia-deploy-v0.0.0.tar.gz" "$O/2/pythia-deploy-v0.0.0.tar.gz"
    (cd "$O/1" && shasum -a 256 -c pythia-deploy-v0.0.0.tar.gz.sha256)
    L=$(tar -tzf "$O/1/pythia-deploy-v0.0.0.tar.gz")
    for f in release.env LICENSE NOTICE scripts/deploy.sh scripts/smoke.sh \
             k8s/base/kustomization.yaml k8s/overlays/staging/kustomization.yaml \
             k8s/overlays/production/kustomization.yaml; do
      echo "$L" | grep -qx "pythia-deploy-v0.0.0/$f" || { echo "missing $f"; exit 1; }
    done
    ! echo "$L" | grep -q "overlays/minikube"
    tar -xzOf "$O/1/pythia-deploy-v0.0.0.tar.gz" pythia-deploy-v0.0.0/release.env > "$O/env"
    grep -qx "PYTHIA_VERSION=v0.0.0" "$O/env" && grep -qx "BACKEND_DIGEST=$D" "$O/env" \
      && grep -qx "FRONTEND_IMAGE=ghcr.io/acme/pythia/pythia-frontend" "$O/env" \
      && grep -qE "^SOURCE_COMMIT=[0-9a-f]{40}$" "$O/env"
    rm -rf "$O"
  - |
    # Bad input is refused.
    O=$(mktemp -d)
    ! scripts/release-bundle.sh v1.2 ghcr.io/acme/pythia "sha256:$(printf 'a%.0s' $(seq 64))" "sha256:$(printf 'b%.0s' $(seq 64))" "$O" HEAD
    ! scripts/release-bundle.sh v1.2.0 ghcr.io/acme/pythia sha256:abc "sha256:$(printf 'b%.0s' $(seq 64))" "$O" HEAD
    rm -rf "$O"
  - |
    # deploy.sh from a bundle refuses a conflicting digest BEFORE touching a
    # cluster, and refuses a malformed one.
    REF=$(git stash create); REF=${REF:-HEAD}
    D="sha256:$(printf 'a%.0s' $(seq 64))"; F="sha256:$(printf 'b%.0s' $(seq 64))"
    O=$(mktemp -d)
    scripts/release-bundle.sh v0.0.0 ghcr.io/acme/pythia "$D" "$F" "$O" "$REF"
    tar -xzf "$O/pythia-deploy-v0.0.0.tar.gz" -C "$O"
    ! BACKEND_DIGEST="sha256:$(printf 'c%.0s' $(seq 64))" "$O/pythia-deploy-v0.0.0/scripts/deploy.sh" staging 2> "$O/err"
    grep -q "release.env" "$O/err"
    echo "BACKEND_DIGEST=sha256:nothex" > "$O/bad.env"
    cp "$O/bad.env" "$O/pythia-deploy-v0.0.0/release.env"
    ! "$O/pythia-deploy-v0.0.0/scripts/deploy.sh" staging
    rm -rf "$O"
  - |
    # A release.env missing a key is refused.
    REF=$(git stash create); REF=${REF:-HEAD}
    D="sha256:$(printf 'a%.0s' $(seq 64))"; F="sha256:$(printf 'b%.0s' $(seq 64))"
    O=$(mktemp -d)
    scripts/release-bundle.sh v0.0.0 ghcr.io/acme/pythia "$D" "$F" "$O" "$REF"
    tar -xzf "$O/pythia-deploy-v0.0.0.tar.gz" -C "$O"
    grep -v '^FRONTEND_DIGEST=' "$O/pythia-deploy-v0.0.0/release.env" > "$O/e" && mv "$O/e" "$O/pythia-deploy-v0.0.0/release.env"
    ! FRONTEND_DIGEST="$F" "$O/pythia-deploy-v0.0.0/scripts/deploy.sh" staging
    rm -rf "$O"
  - |
    # Image tags are the version without `v`; the source label is set; the
    # Jib digest is cross-checked.
    W=.github/workflows/ci.yaml
    grep -q 'VER="${V#v}"' $W
    grep -q 'org.opencontainers.image.source' $W
    grep -q 'frontendImageSourceUrl' $W src/frontend/build.gradle.kts src/frontend/CLAUDE.md
    grep -q 'jib-image.digest' $W
  - |
    shellcheck scripts/deploy.sh scripts/release-bundle.sh
  - |
    grep -q "^## What a release publishes" docs/deployment.md && grep -q "release.env" docs/deployment.md && grep -q -- "--preserve-digests" docs/deployment.md
  - |
    ! grep -qi "pull mirror" docs/deployment.md
    ! grep -q "Mirrors must sync" docs/deployment.md
  - |
    grep -q "<internal-group>/<deploy-project>" docs/deployment.md
  - |
    test -z "$(git grep -n 'IMAGE_TAG' -- ':!planning' | grep -v MINIKUBE_IMAGE_TAG)"
  - |
    grep -q "BACKEND_DIGEST" CLAUDE.md && grep -q "task-199" CLAUDE.md
  - |
    ./gradlew build

outputs:
  - modified: .github/workflows/ci.yaml
  - created: scripts/release-bundle.sh
  - created: scripts/verify-auth-modules.sh   # the task-194 check, shared by `build` and `publish`
  - modified: scripts/deploy.sh
  - modified: k8s/overlays/staging/kustomization.yaml
  - modified: k8s/overlays/production/kustomization.yaml
  - modified: k8s/base/backend/deployment.yaml
  - modified: k8s/base/frontend/deployment.yaml
  - modified: src/frontend/build.gradle.kts
  - modified: src/frontend/CLAUDE.md
  - modified: docs/deployment.md
  - modified: CLAUDE.md
