id: task-055
phase: phase-9
title: Remove the legacy group abstraction and refresh seed data and docs
depends_on: [task-054]
description: |
  By the time task-054 lands, every layer of the system speaks trees.
  Most of the cleanup work this task originally planned is already
  done by side-effects of earlier tasks (audit notes below). The two
  remaining items of real substance are:

    A) Deepen the test data seed to depth ≥ 3 (the seeder was rewired
       to the tree shape in task-050 but still produces depth-1 trees).
    B) Update planning/README.md so the phase table lists phase-9 with
       its tasks (task-049 through task-055).

  Audit of what's already clean (verified via grep before this task
  starts — do not waste time re-searching):
    - EstimationItemGroup.kt was deleted in task-054 (the validation
      grep `! grep "EstimationItemGroup" domain.d.ts` forced the move).
      `grep -r "EstimationItemGroup" src` returns empty.
    - README.md, docs/architecture.md, docs/development.md, planning/
      plan.yaml, and CLAUDE.md have no remaining `itemGroup` / "estimation
      group" mentions.
    - phase-9 is already listed in planning/plan.yaml with the full
      task list [task-049 … task-055].
    - Memory files in ~/.claude/projects/.../memory/ (user-specific
      path, outside the repo) have no stale references.

  Scope:
    1. (Optional / cosmetic) Re-verify EstimationItemGroup.kt is gone.
       `git rm` will already fail (file gone); use `test ! -f` for the
       check.

    2. TestDataSeeder
       (src/backend/implementation/src/main/kotlin/io/github/theestimator/
       testdata/TestDataSeeder.kt) currently builds tree entities but
       only depth-1 (each top-level group containing leaves directly).
       Restructure at least one of the three drafts (seedWebshop's
       draft1, draft2, or seedMobileApp's draft) so that at least one
       top-level group contains a nested sub-group containing leaves —
       i.e. depth ≥ 3 from root → inner group → leaf. Match the existing
       German seed style ("U01: Konzeption" etc.) — don't introduce
       Backend/Auth/Token-endpoint English placeholder names.

       The seeder must build DraftEstimationNode / DraftGroupNode /
       DraftFixedItemNode entities (parent_id linkage + position).
       Keep parameters / drivers / phases / additional costs and the
       overall draft count unchanged.

    3. Documentation sweep — only planning/README.md still has work
       (its phase table is missing phase-9). All other docs are
       already clean per the audit above; do NOT touch them.

    4. After everything compiles, run the full build and the e2e
       suite once more end-to-end to confirm nothing regressed since
       task-054.

steps:
  - |
    Pre-flight audit — verify the already-done cleanup:
      ! grep -r "EstimationItemGroup" src
      test ! -f src/domain/src/main/kotlin/io/github/theestimator/model/EstimationItemGroup.kt
      grep -q "phase-9" planning/plan.yaml
    All three must already pass before doing any work.

  - |
    Deepen TestDataSeeder.kt to at least one depth-≥3 subtree. The
    seeder already builds DraftGroupNode / DraftFixedItemNode /
    DraftTimeRelativeItemNode entities (per task-050). What it doesn't
    do is nest groups inside groups. Pick one of the three drafts and
    introduce a sub-group:

      // Before: depth 1
      group(draft1, "U03: Backend & Datenbank", listOf(
          fixedLeaf(draft1, "REST API Endpoints (CRUD)", ...),
          fixedLeaf(draft1, "Authentifizierung & Autorisierung", ...),
          ...
      ))

      // After: depth 2 (root + nested group + leaves under it)
      group(draft1, "U03: Backend & Datenbank", listOf(
          fixedLeaf(draft1, "REST API Endpoints (CRUD)", ...),
          group(draft1, "Authentifizierung", listOf(
              fixedLeaf(draft1, "Login & Session", ...),
              fixedLeaf(draft1, "OAuth2 Provider Integration", ...)
          )),
          fixedLeaf(draft1, "Datenbankmigrationen & Seeding", ...)
      ))

    The existing `group(...)` helper already accepts a children list of
    DraftEstimationNode (mixed leaves + nested groups) — no new helper
    needed. Keep parameters / drivers / phases / additional costs and
    the overall draft count unchanged. Use German titles matching the
    surrounding seed style.

  - |
    Update planning/README.md so the phase table contains phase-9 with
    its full task list (task-049 through task-055) and a brief
    description ("Tree-shaped Estimation Hierarchy"). The plan.yaml
    side is already up to date; only README.md needs the row.

  - |
    Run the full build:
      mvn -DskipTests package
      mvn -pl src/backend/implementation -am test
      cd src/frontend && npm run check

  - |
    Run the e2e suite. There is no `npm run test:e2e` script — invoke
    Playwright directly. Backend + frontend must be running on :8080
    and :5173 (use ./scripts/dev-local.sh in another shell):
      cd src/frontend && npx playwright test

validation:
  - |
    EstimationItemGroup is gone from the source tree (already true
    after task-054 — verifies nothing crept back in):
      ! grep -r "EstimationItemGroup" src
      test ! -f src/domain/src/main/kotlin/io/github/theestimator/model/EstimationItemGroup.kt
  - |
    TestDataSeeder builds tree entities AND has at least one nested
    group inside another group (depth ≥ 3 from root):
      grep -q "DraftEstimationNode" \
            src/backend/implementation/src/main/kotlin/io/github/theestimator/testdata/TestDataSeeder.kt
      # Mechanical depth ≥ 3 check: count `group(` calls whose line is
      # indented deeper than a top-level group. Top-level groups in the
      # seeder are at 12-space indent (inside `addRoots(version, listOf(`);
      # a nested group inside another group's children sits at ≥ 16-space
      # indent. A depth-1 seeder has zero such lines; a depth-≥3 seeder
      # has at least one.
      python3 -c "
      import sys
      src = open('src/backend/implementation/src/main/kotlin/io/github/theestimator/testdata/TestDataSeeder.kt').read()
      nested = sum(1 for line in src.split('\n')
                   if line.lstrip().startswith('group(')
                   and (len(line) - len(line.lstrip())) >= 16)
      sys.exit(0 if nested > 0 else 1)
      "
  - |
    phase-9 is listed in BOTH plan.yaml and README.md:
      grep -q "phase-9" planning/plan.yaml
      grep -q "phase-9\|Tree-shaped" planning/README.md
  - |
    Full build + backend tests + frontend type-check all pass:
      mvn -DskipTests package
      mvn -pl src/backend/implementation -am test
      cd src/frontend && npm run check
  - |
    Playwright e2e passes (requires dev-local servers running):
      cd src/frontend && npx playwright test

outputs:
  - modified: src/backend/implementation/src/main/kotlin/io/github/theestimator/testdata/TestDataSeeder.kt
  - modified: planning/README.md
