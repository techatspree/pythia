id: task-015
phase: phase-4
title: Implement version comparison endpoint
depends_on: [task-014]
description: |
  Add an endpoint that diffs two versions of the same estimation and returns
  added, removed, and modified items. Requires stable identifiers across versions.

  Stable identity approach:
    - Add a `logicalId` (UUID) field to EstimationItem and EstimationItemGroup
    - When an item/group is first created (import or manual), a new logicalId is generated
    - When items are cloned via deepClone (createNewVersion), the logicalId is preserved
    - The primary key (id) changes per version, but logicalId stays the same across versions
    - This allows matching "the same item" across two versions for comparison

  Endpoint:
    GET /api/estimations/{estimationId}/versions/{versionA}/compare/{versionB}
      - Compares version A to version B
      - Response: VersionComparisonDto

  Response structure:
    VersionComparisonDto:
      versionA: int (version number)
      versionB: int (version number)
      addedItems: List<EstimationItemDto>        — items in B not in A (by logicalId)
      removedItems: List<EstimationItemDto>      — items in A not in B (by logicalId)
      modifiedItems: List<ItemModificationDto>   — items in both but with changed values
      addedGroups: List<EstimationItemGroupDto>  — groups in B not in A
      removedGroups: List<EstimationItemGroupDto>— groups in A not in B
      parameterChanges: List<ParameterChangeDto> — changed/added/removed parameters

    ItemModificationDto:
      logicalId: UUID
      description: String
      before: EstimationItemDto
      after: EstimationItemDto
      changedFields: List<String>  — field names that differ (e.g. ["minEffort", "maxEffort"])

    ParameterChangeDto:
      name: String
      oldValue: Double?
      newValue: Double?
      changeType: "ADDED" | "REMOVED" | "MODIFIED"

  Implementation:
    - VersionComparisonService: takes two EstimationVersion objects, produces VersionComparisonDto
    - Matching logic: group items by logicalId, then diff field-by-field
    - Parameters matched by name (not id)
    - Groups matched by logicalId

steps:
  - add logicalId (UUID) field to EstimationItem entity (nullable for migration, with default generation)
  - add logicalId (UUID) field to EstimationItemGroup entity
  - add logicalId to domain model classes (src/domain)
  - add logicalId column to Flyway migration (V2__add_logical_id.sql)
  - update deepClone in EstimationVersionService to preserve logicalId
  - update ExcelImporter to generate logicalId on import
  - create VersionComparisonService with compare(versionA, versionB) method
  - create VersionComparisonDto, ItemModificationDto, ParameterChangeDto
  - add GET endpoint to EstimationVersionResource
  - write unit tests for VersionComparisonService (added, removed, modified detection)
  - write integration test for the comparison endpoint
  - verify all existing tests still pass
  - run full build from project root
validation:
  - comparing two identical versions returns empty added/removed/modified lists
  - comparing v1 to v2 where an item changed shows it under modifiedItems with changedFields
  - removing an item produces one removedItem, adding one produces one addedItem
  - parameter changes are detected (added, removed, value changed)
  - logicalId is preserved across version cloning
  - endpoint returns 404 for nonexistent versions
  - all existing tests (68) still pass
  - `mvn clean install` from project root succeeds
outputs:
  - src/backend/implementation/src/main/resources/db/migration/V2__add_logical_id.sql
  - src/backend/implementation/src/main/kotlin/io/github/theestimator/service/VersionComparisonService.kt
  - src/backend/implementation/src/main/kotlin/io/github/theestimator/rest/dto/VersionComparisonDtos.kt
  - src/backend/implementation/src/test/kotlin/io/github/theestimator/service/VersionComparisonServiceTest.kt
  - src/backend/implementation/src/test/kotlin/io/github/theestimator/rest/VersionComparisonResourceIT.kt
  - modified: EstimationItem.kt, EstimationItemGroup.kt (logicalId field)
  - modified: EstimationVersionService.kt (preserve logicalId in deepClone)
  - modified: ExcelImporter.kt (generate logicalId)
  - modified: EstimationVersionResource.kt (new compare endpoint)
