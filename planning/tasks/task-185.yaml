    test -f src/backend/implementation/src/main/kotlin/io/pythia/service/ExcelStyles.kt
  - |
    grep -q "internal class ExcelStyles" src/backend/implementation/src/main/kotlin/io/pythia/service/ExcelStyles.kt
  - |
    grep -q "009E5A\|0x9E" src/backend/implementation/src/main/kotlin/io/pythia/service/ExcelStyles.kt
  - |
    grep -q "createFreezePane" src/backend/implementation/src/main/kotlin/io/pythia/service/ExcelExporter.kt
  - |
    grep -q "setColumnWidth" src/backend/implementation/src/main/kotlin/io/pythia/service/ExcelExporter.kt
  - |
    grep -q "indention" src/backend/implementation/src/main/kotlin/io/pythia/service/ExcelStyles.kt
  - |
    ! grep -q "autoSizeColumn" src/backend/implementation/src/main/kotlin/io/pythia/service/ExcelExporter.kt
  - |
    ! grep -q '"  ".repeat' src/backend/implementation/src/main/kotlin/io/pythia/service/ExcelExporter.kt
  - |
    grep -q "Log\." src/backend/implementation/src/main/kotlin/io/pythia/service/ExcelExporter.kt
  - |
    test -f src/backend/implementation/src/test/kotlin/io/pythia/service/ExcelStyleTest.kt
  - |
    git diff --quiet -- src/backend/implementation/src/main/kotlin/io/pythia/service/ExcelImporter.kt
  - |
    ./gradlew :backend:implementation:test
  - |
    ./gradlew staticAnalysis

