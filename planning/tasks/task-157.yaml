id: task-157
phase: phase-19
title: Graphical dependency editor for the project schedule
depends_on: [task-156, task-164, task-166]
description: |
  Third task of phase-19. task-155 computes a schedule and task-156 stores its
  inputs; both are invisible. This task adds the way a user actually declares
  them: a **team-FTE field** and a **graphical editor** for the finish-to-start
  dependencies between root nodes.

  The Gantt view and the export are task-158 — this task ends with a schedule
  that is editable and saved, surfaced as a plain list of computed durations.

  ## Graphical means hand-rolled SVG

  Draw one box per scheduling unit, drag from a box's handle to another box to
  create an edge, click an edge to delete it. **Add no charting or graph
  library.** This repo hand-rolls `TreeTable`, generates its icons with
  Playwright's bundled Chromium rather than adding `sharp`, and builds its own
  drop-zone geometry — a graph dependency editor of this size is squarely in
  that tradition, and a library would own the interaction model that the next
  task's Gantt has to match.

  Layout is **layered top-down**: nodes in dependency order, each card placed in
  the earliest layer its predecessors allow, with edges as SVG paths between
  cards. Do not implement free-placement dragging or zoom — position is computed
  from the graph, is not part of the model, and must not be persisted.

  ## It is a TREE, and groups collapse (task-164)

  task-164 replaced task-155's roots-only rule: every node is now a scheduling
  unit, leaves are atomic, and a **group's dates are a roll-up** of its
  children. `ProjectSchedule.tasks` is a flat list covering every node, each
  carrying `parentLogicalId`, `depth` and `isGroup`, in tree order — rebuild the
  tree from that, do not walk `EstimationVersion` again.

  This is the model Merlin's **Flow** (net plan) view uses, and it is why the
  editor must collapse: `MerlinImporter` reconstructs a whole WBS as nested
  groups, so an imported project can be one root with everything beneath it.

  - A **collapsed group** renders as ONE card showing its rolled-up span, with
    every edge touching its subtree drawn on that card.
  - **Expanding** reveals its children as cards one layer deeper.
  - Collapse state is **view-only** — never persisted, never sent to the
    backend. Follow `TreeTable`'s established shape: `defaultCollapsed` is a
    RULE consulted per node, not a seed copied into `$state`, so a node that
    appears later is collapsed too. Default: groups start collapsed, so a
    freshly imported project opens readable.
  - An edge may be drawn between **any two nodes** — group-to-group,
    group-to-leaf, leaf-to-leaf. task-164 lowers it to leaf constraints; the
    editor stores exactly what the user drew.

  A group's `durationDays` is its **span**, not `effortPT / teamFte`. Render it
  as such and never recompute it.

  ## The domain owns the math

  The component renders `ProjectSchedule` and never computes a duration, a
  start, or a critical path itself. `adapter.ts` gains a `computeSchedule(...)`
  bridge calling task-155's `Array`-taking `DomainFactory` factory — an
  `@JsExport` function taking `List<T>` is not callable from JS with a plain
  array, which is why that factory exists.

  ## Errors are shown, not prevented — and there are TWO kinds

  There is no `cycleError` field. task-155 shipped a structured
  `error: ScheduleError?` carrying `kind: ScheduleErrorKind` — `CYCLE` or
  `INVALID_TEAM_FTE` — plus `involvedLogicalIds`. It was made structured
  precisely so THIS task maps `kind` to an i18n key rather than rendering a
  domain-composed English sentence.

  Note also that after task-166 `onCriticalPath` means a **critical chain**: a
  card can be critical because the team was busy, not only because of a
  dependency. Word any tooltip or legend accordingly — "critical" alone will be
  read as "longest dependency chain" and be wrong.

  - **`CYCLE`** — let the user draw it. Render the error inline, highlight the
    cards in `involvedLogicalIds` (task-164 reports the ids the user actually
    drew, group ids included), and hide the computed durations until it is
    resolved. Blocking the gesture would need the editor to reimplement cycle
    detection — the exact duplication phase-19 is arranged to avoid.
  - **`INVALID_TEAM_FTE`** — this task adds the very field that produces it. A
    user typing `0` or a negative team size gets this kind back; render it on
    the field, not as a graph error.

  Map both to `schedule.error.cycle` / `schedule.error.invalidTeamFte`.

  ## The project length is a RANGE, and the caveat is part of the UI

  `ProjectSchedule` carries `expectedDurationDays`, `durationStdDevDays`,
  `optimisticDurationDays` and `pessimisticDurationDays` beside
  `projectDurationDays`. task-155 delegated their presentation here explicitly:
  `projectDurationDays` is the risk-loaded plan and **sits at the TOP of that
  band by construction** — `offerPT` already carries a `stdDevFactor` loading —
  so show the range and never present the loaded figure as the band's midpoint.

  ## teamFte is a WORKER COUNT, and the caveat has changed

  task-166 redefines `teamFte`: it is the number of people working
  concurrently, not a divisor on effort. A leaf takes `effortPT` days worked by
  one person, and the scheduler never runs more than `floor(teamFte)` items at
  once.

  So the field is "how many people", not "how much team" — label and hint it
  that way, and make it an integer-ish input (a fractional value rounds DOWN,
  with a floor of one; say so in the hint rather than silently truncating).

  The old caveat — "every branch gets the full team, so parallel branches are
  optimistic" — is **obsolete**: after task-166 the plan cannot over-commit the
  team. Do NOT render it. The honest hint now is the remaining limitation: one
  person per item, so a single large item cannot be shortened by adding people —
  it has to be broken down.

steps:
  - |
    Add the domain bridge to `src/frontend/src/lib/adapter.ts`.

    The factory is `scheduleVersion(version: EstimationVersion, dependencies:
    Array<ScheduleDependency>, teamFte: number)` — an `@JsExport` function taking
    `List<T>` is not callable from JS with a plain array, which is why the
    Array-taking form exists.

    **It takes an already-CALCULATED `EstimationVersion`, not roots.** A
    `computeSchedule(roots, …)` that builds and `calculate()`s its own version
    would recompute the whole estimate a second time on every keystroke —
    exactly the double-compute task-139 removed, and which
    `src/frontend/CLAUDE.md` documents as "a SINGLE build+`calculate()`". So
    extend the existing single round-trip instead: have `computeEstimation(...)`
    accept the schedule inputs and return the `ProjectSchedule` alongside
    `calcMap` and `totals`, or expose the calculated version it already builds so
    a sibling bridge can schedule it. One build+calculate per render, not two.

    `ProjectSchedule.tasks` arrives as a Kotlin `KtList`, not a JS array — walk
    it via `.asJsReadonlyArrayView()`, the same call `adapter.ts` already makes
    on `calculated.roots` and `children` (lines ~208, ~212) to read a Kotlin
    `List` from TypeScript. Reimplementing any
    part of the critical path, the roll-up or the layering maths in TypeScript is
    out of bounds; the domain is the single source of truth. Layout POSITIONS
    are the editor's own concern and are not domain data.
  - |
    Add `src/frontend/src/lib/components/schedule/DependencyEditor.svelte`:
      - a `$bindable()` `dependencies` prop the parent owns and this component
        mutates directly (the established editor pattern — no snapshot + local
        `$state` + onchange)
      - one card per `ScheduledTask`, laid out in LAYERS: each card in the
        earliest layer its predecessors allow, tree order within a layer
      - **collapse/expand for groups** (`isGroup`), rebuilt from the flat
        `tasks` list via `parentLogicalId` / `depth`. Collapse state is
        view-only and never persisted; express it as a RULE consulted per node
        (`TreeTable`'s `defaultCollapsed` pattern), not a seed copied into
        `$state`, so a node appearing later is collapsed too. Groups start
        collapsed.
      - a collapsed group shows its rolled-up span and carries every edge that
        touches its subtree
      - drag from a card's handle onto another card to add an edge — between any
        two nodes, group or leaf; dropping on empty space cancels
      - edges as SVG paths; click an edge to remove it
      - a duplicate edge is refused silently (task-156's unique constraint would
        reject it anyway)
      - a self-edge is refused (task-155 reports it as a one-node CYCLE)
      - `error.kind == CYCLE` rendered inline, with the cards named in
        `involvedLogicalIds` highlighted
      - an empty state when the tree has fewer than two nodes — with one there
        is nothing to connect

    Buttons come from `$lib/ui/`; colours from `@theme` tokens in `app.css`
    (an arbitrary `bg-[#…]` fails `:frontend:check`); failures go through `log`
    from `$lib/log.ts`, never bare `console.*`.

    Give the drag handle and each edge an `aria-label` — both are i18n keys, not
    literals.
  - |
    Wire it into the version editor route
    `src/frontend/src/routes/estimations/[id]/versions/[versionNumber]/+page.svelte`
    as a collapsible section below `EstimationSummaryPanel`:
      - `currentTeamFte` and `currentDependencies` as route-owned `$state`,
        hydrated in `applyVersionData` (so an undo or reload does not resurrect
        stale values and does not trigger a spurious autosave)
      - both included in the autosave PUT payload
      - `currentTeamFte` from `EstimationVersionDto.teamFte` and
        `currentDependencies` from `.dependencies`, PUT back as `DraftUpdateDto`'s
        optional `teamFte` / `dependencies` (task-156's wire shape)
      - a team-size number field ("how many people work concurrently") with the
        rounding hint beneath it, rendering `error.kind == INVALID_TEAM_FTE` on
        the field itself
      - `DependencyEditor` bound to the state
      - TWO separate facts, not one range with a labelled point inside it:
        (1) the LEVELLED plan length, `projectDurationDays` — what the team, at
        its capacity, actually delivers; and (2) the ESTIMATE-UNCERTAINTY band,
        `optimisticDurationDays` … `pessimisticDurationDays` around
        `expectedDurationDays`, measured along the critical CHAIN with capacity
        ignored (task-166). **Do not present `projectDurationDays` as a point
        inside the band, and do not call it the top of it** — that was true
        under task-155's `offerPT / teamFte` formula, where the two were the
        same scale; after levelling they measure different things and the
        makespan can fall entirely outside the band (three independent 10-day
        leaves at `teamFte = 1`: makespan 30, band [10, 10]). Label each for
        what it is: "planned length" and "estimate uncertainty on the critical
        chain", not one merged range
      - a plain list of the computed per-node durations, so the task is useful
        before task-158 adds the chart
      - every number through `$lib/format.ts` — `.toFixed()`/`toLocale*()` and a
        hardcoded locale are banned
      - read-only for a submitted version, like the rest of the editor

    Any `try`/`catch` surfaces failure through `ErrorBanner` as well as `log` —
    logging is in addition to, never instead of, user-facing surfacing.
  - |
    Add every new visible string to **both** `src/frontend/src/lib/i18n/de.json`
    and `en.json`, key-for-key, under a `schedule.*` prefix: the section title,
    the team-FTE label and its hint, the editor's empty state, the edge-delete
    tooltip, **both** error kinds as `schedule.error.cycle` and
    `schedule.error.invalidTeamFte` (the names task-155 chose when it made the
    error structured), the project-length and range labels, and the
    `aria-label`s on the drag handle, the edges, and the group expand/collapse
    control. Real German, not the English sentence pasted across. Never inline a
    literal — render via `$_('key')`.
  - |
    Add `src/frontend/e2e/schedule.test.ts`: seed a draft with at least two root
    groups through the REST API (the pattern the other specs use), open the
    draft, set the team FTE, drag one dependency, and assert the computed
    project length changes and survives a reload.

    Also assert that a group collapses and expands, and that an edge drawn to a
    collapsed group survives expanding it.

    Mouse-driven drag in this codebase is timing-sensitive: re-read the target's
    `boundingBox()` between moves and release only once it has settled, as
    `settleAndDrop` in `e2e/bucket-views.test.ts` does — note it is now
    DEADLINE-based, not a fixed pass count, so copy the current shape rather
    than the one earlier tasks described.

    Be aware this is not a solved problem: **task-163 is open** on a drag that
    settles and releases correctly and still lands as a silent no-op. If this
    spec flakes the same way, report it against task-163 rather than papering
    over it here — and do NOT add Playwright `retries`, which `playwright.config.ts`
    argues against at length.
  - |
    Document the new bridge and component in `src/frontend/CLAUDE.md`. That file
    already enumerates `adapter.ts`'s entry points — `computeEstimation(...)`
    and the Kotlin/JS factories it calls — so a second entry point that is not
    listed there is invisible to the next reader. Record: `computeSchedule(...)`
    and the `Array`-taking factory it needs, that `ProjectSchedule.tasks`
    arrives as a Kotlin `List` rather than a JS array, and that the editor
    renders the domain's schedule and computes nothing itself. A short paragraph
    beside the existing adapter notes, not a tutorial.
  - |
    Run the gate: `./gradlew :frontend:check`, then `./gradlew build`, then the
    Playwright suite with the dev stack up (`./scripts/dev.sh`; backend :8090,
    Vite :5173; stop it with SIGTERM, never by killing the child JVMs):
    `cd src/frontend && npm run test:e2e`.

validation:
  - |
    The bridge exists and the frontend does not re-derive the schedule.
    NOTE the ordering: these blocks run without `set -e`, so only the LAST
    command's status counts — a block that ends on a negation passes whenever
    the directory is simply absent, which is how this check used to succeed
    before any work was done. Positive assertions go last.
      F=src/frontend/src
      test -f "$F/lib/components/schedule/DependencyEditor.svelte"
      if grep -rqiE "criticalpath[[:space:]]*=" "$F/lib/components/schedule/"; then echo "unexpected match in $F/lib/components/schedule/"; exit 1; fi
      # scheduleVersion is the real factory, and it must be reached from the
      # SINGLE existing build+calculate, not a second one.
      grep -q "scheduleVersion" "$F/lib/adapter.ts"
  - |
    The component obeys the frontend hard rules:
      # set -e: without it only the LAST command's status counts, so a block
      # ending on a negation passes whenever the files are simply absent.
      set -e
      S=src/frontend/src/lib/components/schedule
      if grep -rq "console\." "$S"; then echo "unexpected match in the target"; exit 1; fi
      grep -rq "log\." "$S"
      if grep -rqE "bg-\[#" "$S"; then echo "unexpected match in the target"; exit 1; fi
      if grep -rqE "toFixed\(|toLocale" "$S"; then echo "unexpected match in the target"; exit 1; fi
      grep -rq "aria-label" "$S"
  - |
    The route owns the state, saves it, and re-hydrates it:
      # set -e: without it only the LAST command's status counts, so a block
      # ending on a negation passes whenever the files are simply absent.
      set -e
      P="src/frontend/src/routes/estimations/[id]/versions/[versionNumber]/+page.svelte"
      grep -q "DependencyEditor" "$P"
      grep -q "teamFte" "$P"
      grep -q "dependencies" "$P"
      # numbers go through format.ts; toFixed/toLocale* are banned app-wide
      if grep -qE "toFixed\(|toLocale" "$P"; then echo "unexpected match in the target"; exit 1; fi
  - |
    Both catalogs carry the new keys, key-for-key, and the German ones are
    translated rather than copied:
      # python3 -c, NOT a heredoc: inside a YAML block scalar the heredoc body
      # keeps its indentation and python dies with IndentationError (verified).
      # set -e: without it only the LAST command's status counts, so a block
      # ending on a negation passes whenever the files are simply absent.
      set -e
      python3 -c "
      import json, pathlib, sys
      d = pathlib.Path('src/frontend/src/lib/i18n')
      cats = {p.stem: json.loads(p.read_text()) for p in d.glob('*.json')}
      def flat(o, p=''):
          out = {}
          for k, v in o.items():
              n = f'{p}.{k}' if p else k
              out.update(flat(v, n) if isinstance(v, dict) else {n: v})
          return out
      f = {l: flat(c) for l, c in cats.items()}
      ref = set().union(*(set(x) for x in f.values()))
      bad = {l: sorted(ref - set(x)) for l, x in f.items() if ref - set(x)}
      no_sched = [l for l, x in f.items() if not any(k.startswith('schedule.') for k in x)]
      de, en = f.get('de', {}), f.get('en', {})
      copied = [k for k in de if k.startswith('schedule.') and len(str(de[k])) > 3 and de[k] == en.get(k)]
      need = ['schedule.error.cycle', 'schedule.error.invalidTeamFte']
      absent = [k for k in need if k not in de or k not in en]
      print('catalogs:', sorted(cats), '| mismatch:', bad or 'none', '| no schedule.*:', no_sched or 'none')
      print('untranslated:', copied or 'none', '| missing error keys:', absent or 'none')
      sys.exit(1 if (bad or no_sched or copied or absent) else 0)
      "
  - |
    The editor is a TREE over task-164's shape, not a flat root list — this is
    what the revision is for:
      # set -e: without it only the LAST command's status counts, so a block
      # ending on a negation passes whenever the files are simply absent.
      set -e
      S=src/frontend/src/lib/components/schedule/DependencyEditor.svelte
      grep -q "parentLogicalId" "$S"
      grep -q "isGroup" "$S"
      grep -qiE "collaps|expand" "$S"
      # collapse is a view rule, never persisted or sent to the backend
      if grep -qiE "collapsed.*(PUT|save|dependencies:)" "$S"; then echo "unexpected match in the target"; exit 1; fi
  - |
    Both error kinds are handled — the team-FTE field this task adds is exactly
    what produces INVALID_TEAM_FTE:
      # set -e: without it only the LAST command's status counts, so a block
      # ending on a negation passes whenever the files are simply absent.
      set -e
      P="src/frontend/src/routes/estimations/[id]/versions/[versionNumber]/+page.svelte"
      S=src/frontend/src/lib/components/schedule
      grep -rqE "schedule\.error\.cycle" "$S" "$P"
      grep -rqE "schedule\.error\.invalidTeamFte" "$S" "$P"
      # and the range is presented, not just the loaded figure
      grep -qE "optimisticDurationDays|pessimisticDurationDays" "$P"
  - |
    The e2e spec exists and does not reintroduce the fixed-pass drag race.
    Two shapes are acceptable, because the race depends on the DnD mechanism.
    NATIVE HTML5 drag (`draggable` + `ondrop`, driven by Playwright's `dragTo`)
    has no cursor geometry to race, so there is nothing to settle — that is what
    this editor uses, since svelte-dnd-action's `useCursorForDetection` is a
    TreeTable concern rather than this component's. A MOUSE-driven drag instead
    must re-read the target's `boundingBox()` between moves, deadline-based, as
    `settleAndDrop` now does. Note all prose in these blocks stays at this
    indent; only shell is indented further, or an extractor cannot tell them
    apart.
      set -e
      T=src/frontend/e2e/schedule.test.ts
      test -f "$T"
      if grep -q "page.mouse" "$T"; then
        grep -qi "boundingBox" "$T" || { echo "mouse drag without boundingBox re-read"; exit 1; }
      else
        grep -q "dragTo" "$T" || { echo "neither native dragTo nor a settled mouse drag"; exit 1; }
      fi
  - |
    The new adapter entry point is documented where the others are — an
    undocumented second bridge is how `adapter.ts` drifts:
      # set -e: without it only the LAST command's status counts, so a block
      # ending on a negation passes whenever the files are simply absent.
      set -e
      grep -q "computeSchedule" src/frontend/CLAUDE.md
  - |
    ./gradlew :frontend:check
  - |
    ./gradlew build
  - |
    With the dev stack running (`./scripts/dev.sh`, backend :8090, Vite :5173):
      # set -e: without it only the LAST command's status counts, so a block
      # ending on a negation passes whenever the files are simply absent.
      set -e
      cd src/frontend && npm run test:e2e

