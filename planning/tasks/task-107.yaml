id: task-107
phase: phase-15
title: Export dispatch — xlsx/csv writers dispatched by method
depends_on: [task-102, task-098, task-103]
description: |
  The xlsx/csv export is hardwired to PERT. It must take its method-specific
  column shape from the estimation's OWN method, via the SPI.

  ## What is already there (checked, not assumed)

  task-098 did half of this and the task text used to describe the other half
  wrongly. The actual state:

  - **Headers already come from the SPI** — both `CsvExporter` and
    `ExcelExporter` call
    `EstimationMethodRegistry.require(EstimationMethod.THREE_POINT_PERT).exportColumnHeaders()`.
    The module indirection exists; the METHOD is the hardcoded part.
  - **`exportRow` is dead code.** Nothing in the backend calls it. Leaf cells are
    built inline: `CsvExporter.nodeCells` emits `minEffort/expectedEffort/maxEffort`
    directly, and a group emits the literal `"", "", ""`.
  - **The exporters cannot see the method.** `CsvExporter.export(version, output)`
    takes a `SubmittedEstimationVersion`, which has no method. The method has to be
    threaded in from `EstimationVersionResource.exportVersion`, which has the
    `estimationId` and already calls `ensureEstimationExists(estimationId)`.

  ## The bug this actually fixes: 3 is hardcoded, bucket needs 5

  `ThreePointMethodModule.exportColumnHeaders()` is `Min, Expected, Max` — three
  columns. `BucketMethodModule.exportColumnHeaders()` is
  `Bucket, Is Sample, Optimistic, Likely, Pessimistic` — **five**. Three places
  assume three, and all three silently corrupt a bucket export:

  1. `CsvExporter.nodeCells` writes `"", "", ""` for a group.
  2. `CsvExporter.nodeCells` writes exactly three effort cells for a leaf.
  3. The CSV totals row is the literal `",Total,,,,,,${version.totalEffort},"` —
     nine columns with the total at index 7. `EstimationVersionResourceIT`
     (`csv export total matches the version total effort`) pins that index.

  Every one of these must be derived from `exportColumnHeaders().size`. This is
  the part with real consequences; the registry rewiring is comparatively
  cosmetic.

  ## Column ORDER is frozen as it is — do not "tidy" it

  An earlier version of this task said neutral columns come first and
  method-specific ones are appended at the end. **That is wrong and would break
  two things.** The implemented layouts put the method columns in the middle:

  - CSV: `Path, Group, Description, <method columns>, Mean, OfferPT, Node type`
  - xlsx: `Beschreibung, <method columns>, <German labels…>`

  Moving them would (a) change a customer-facing CSV column order, and (b) break
  the **Excel round-trip** — `ExcelImporter` reads back what `ExcelExporter`
  writes, so the sheet's column order is a contract, not a preference. Keep the
  method columns exactly where they are; only their NUMBER and CONTENT become
  method-driven.

  ## Getting cells out of the module

  `exportRow(item: EstimationItem)` takes a **KMP domain** item, while the
  exporters walk `SubmittedEstimationNode` — a JPA entity in
  `io.pythia.domain.submitted`. There is no submitted → domain mapper today, so
  this task adds a small one. That is the backend's job by design ("the backend
  and frontend exist to map persisted state ↔ domain"), and it must NOT be solved
  by rebuilding the column shape in the backend — that is precisely what the SPI
  exists to prevent.

  The data is all present: `SubmittedFixedItemNode` carries
  `minEffort/expectedEffort/maxEffort`, and `SubmittedBucketedItemNode` carries
  `bucket` and `isSample` alongside the same triple. The backend may import both
  `FixedEstimationItem` and `BucketedEstimationItem` — it depends on the `:domain`
  aggregator, and the compiler-enforced ban is on CROSS-METHOD imports inside the
  domain, not on a consumer using both.

  ## Frozen decisions

  - **Dispatch layer only.** No method module changes.
  - **Endpoint unchanged.** `GET /api/estimations/{eid}/versions/{n}/export?format=xlsx|csv`
    is refactored in place; filename and content-type headers stay.
  - **Logging.** `Log.info` on export start (estimation id + method + format),
    `Log.debug` on rows written, `Log.error` on a failure path — the static
    `io.quarkus.logging.Log` API, per `src/backend/CLAUDE.md`.
  - **CLAUDE.md.** Note in "REST API surface" that export dispatches on the
    estimation's method and that the column shape comes from the method module.
  - **No frontend change.** The download link behaviour is untouched.

steps:
  - |
    Thread the method in. In
    `src/backend/implementation/src/main/kotlin/io/pythia/rest/EstimationVersionResource.kt`,
    `exportVersion` already resolves the estimation; take its `method` and pass it
    to the exporters. Change both signatures to
    `export(version: SubmittedEstimationVersion, method: EstimationMethod, output: OutputStream)`.
    Add the `Log.info` here or in the exporters — estimation id, method, format.
  - |
    Add the submitted → domain mapping, once, in a new
    `src/backend/implementation/src/main/kotlin/io/pythia/service/SubmittedItemMapper.kt`
    (`io.pythia.service`). It maps one leaf `SubmittedEstimationNode` to the
    domain `EstimationItem` the SPI expects:
      * `SubmittedBucketedItemNode` → `BucketedEstimationItem` with `bucketId`
        (the bucket's id as a String), `isSample`, and the optimistic/likely/
        pessimistic triple from `minEffort/expectedEffort/maxEffort`.
      * anything else → `FixedEstimationItem` with the same triple and the
        description.
    Keep it a pure function; it exists only to feed `exportRow`.
  - |
    In `src/backend/implementation/src/main/kotlin/io/pythia/service/CsvExporter.kt`:
      1. `val module = EstimationMethodRegistry.require(method)` — delete the
         hardcoded `EstimationMethod.THREE_POINT_PERT`.
      2. `val methodColumns = module.exportColumnHeaders()`; keep the header in its
         current ORDER (`Path, Group, Description, <method>, Mean, OfferPT, Node type`).
      3. In `nodeCells`, replace the three inline effort cells with
         `module.exportRow(SubmittedItemMapper.toDomain(node))`, and replace the
         group's `"", "", ""` with `List(methodColumns.size) { "" }`.
      4. Build the totals row from the assembled header list instead of the literal
         `",Total,,,,,,${'$'}{version.totalEffort},"`: the total belongs in the
         `OfferPT` column, whose index is now
         `3 + methodColumns.size + 1`. Compute it; do not re-hardcode 7.
      5. `Log.debug` the row count.
  - |
    Do the same in
    `src/backend/implementation/src/main/kotlin/io/pythia/service/ExcelExporter.kt`:
    registry lookup from the passed method, method columns kept at their current
    position (immediately after `Beschreibung`), cells from
    `module.exportRow(...)`, and any place that assumes three method columns
    derived from `exportColumnHeaders().size` instead. Do not touch the German
    labels in `ExcelGermanLabels` — they are the customer's sheet and are
    deliberately external data.
  - |
    Extend `src/backend/implementation/src/test/kotlin/io/pythia/rest/EstimationVersionResourceIT.kt`:
      * PERT csv export — header row is `Path,Group,Description,Min,Expected,Max,Mean,OfferPT,Node type`,
        and the existing total-column assertion still holds.
      * BUCKET csv export — header row carries the five bucket columns, a group row
        has five empty method cells, and the TOTAL lands in the OfferPT column at
        its new index. This is the assertion that would have caught the hardcoded
        nine-column totals row, so it must not be omitted.
      * PERT xlsx export — the sheet's header row still matches the round-trip
        shape `ExcelImporter` expects.
  - |
    Update `src/backend/CLAUDE.md` "REST API surface" per the frozen decision —
    that is where the section lives; the root CLAUDE.md has no such heading.
  - |
    Build:
      ./gradlew :backend:implementation:test
      ./gradlew build

validation:
  - |
    Neither exporter hardcodes a method any more — this is the core of the task
    and it must be checked on BOTH writers:
      set -e
      for F in src/backend/implementation/src/main/kotlin/io/pythia/service/CsvExporter.kt \
               src/backend/implementation/src/main/kotlin/io/pythia/service/ExcelExporter.kt; do
        if grep -q "THREE_POINT_PERT" "$F"; then echo "$F still hardcodes the method"; exit 1; fi
        grep -q "exportColumnHeaders" "$F"
        grep -q "exportRow" "$F"
      done
  - |
    The method reaches the exporters as a parameter rather than being guessed:
      set -e
      grep -qE "method: EstimationMethod" src/backend/implementation/src/main/kotlin/io/pythia/service/CsvExporter.kt
      grep -qE "method: EstimationMethod" src/backend/implementation/src/main/kotlin/io/pythia/service/ExcelExporter.kt
      # the resource must PASS the estimation's method to both writers
      grep -qE "export\(version, method" src/backend/implementation/src/main/kotlin/io/pythia/rest/EstimationVersionResource.kt
      grep -qE "estimation\.method" src/backend/implementation/src/main/kotlin/io/pythia/rest/EstimationVersionResource.kt
  - |
    Nothing assumes three method columns any more. The literal nine-column totals
    row and the three-empty-cell group row are both gone:
      set -e
      C=src/backend/implementation/src/main/kotlin/io/pythia/service/CsvExporter.kt
      if grep -q ',Total,,,,,,' "$C"; then echo "totals row still hardcodes nine columns"; exit 1; fi
      if grep -qE '"", "", ""' "$C"; then echo "group row still hardcodes three empty method cells"; exit 1; fi
      grep -qE "exportColumnHeaders\(\)|methodColumns" "$C"
  - |
    The submitted → domain mapper exists and is used by both writers, so the
    column shape is not rebuilt in the backend:
      set -e
      M=src/backend/implementation/src/main/kotlin/io/pythia/service/SubmittedItemMapper.kt
      test -f "$M"
      grep -qE "BucketedEstimationItem" "$M"
      grep -qE "FixedEstimationItem" "$M"
      grep -q "SubmittedItemMapper" src/backend/implementation/src/main/kotlin/io/pythia/service/CsvExporter.kt
      grep -q "SubmittedItemMapper" src/backend/implementation/src/main/kotlin/io/pythia/service/ExcelExporter.kt
  - |
    Column ORDER is unchanged — the Excel round-trip and the CSV layout are
    contracts. The CSV header must still start Path,Group,Description and the
    method columns must still precede Mean:
      set -e
      grep -qE 'leading = listOf\("Path", "Group", "Description"\)' src/backend/implementation/src/main/kotlin/io/pythia/service/CsvExporter.kt
      grep -qE "leading \+ methodColumns \+ trailing" src/backend/implementation/src/main/kotlin/io/pythia/service/CsvExporter.kt
      grep -qE 'trailing = listOf\("Mean", "OfferPT", "Node type"\)' src/backend/implementation/src/main/kotlin/io/pythia/service/CsvExporter.kt
  - |
    Logging follows the backend convention (static Log, not a per-class logger):
      set -e
      # Log.info on export start belongs in the resource — it is the only place
      # holding the estimation id, the method AND the format together. The writers
      # own the row-count debug line.
      grep -qE "Log\.info.*Exporting" src/backend/implementation/src/main/kotlin/io/pythia/rest/EstimationVersionResource.kt
      grep -qE "Log\.debug" src/backend/implementation/src/main/kotlin/io/pythia/service/CsvExporter.kt
      grep -qE "Log\.debug" src/backend/implementation/src/main/kotlin/io/pythia/service/ExcelExporter.kt
  - |
    The bucket export is actually covered by a test — a PERT-only test would not
    have caught any of the hardcoded-three bugs:
      set -e
      T=src/backend/implementation/src/test/kotlin/io/pythia/rest/EstimationVersionResourceIT.kt
      grep -qiE "BUCKET_SAMPLED_PERT|bucket" "$T"
      grep -qE "Is Sample|Bucket," "$T"
  - |
    CLAUDE.md documents the dispatch, not merely the word "export":
      set -e
      # the "REST API surface" section lives in the BACKEND CLAUDE.md, not the root one
      grep -qE "export.*method module|method module.*export|dispatches on the estimation" src/backend/CLAUDE.md
  - |
    Backend tests and the full build are green:
      ./gradlew :backend:implementation:test
      ./gradlew build

outputs:
  - modified: src/backend/implementation/src/main/kotlin/io/pythia/rest/EstimationVersionResource.kt
  - modified: src/backend/implementation/src/main/kotlin/io/pythia/service/CsvExporter.kt
  - modified: src/backend/implementation/src/main/kotlin/io/pythia/service/ExcelExporter.kt
  - created: src/backend/implementation/src/main/kotlin/io/pythia/service/SubmittedItemMapper.kt
  - modified: src/backend/implementation/src/test/kotlin/io/pythia/rest/EstimationVersionResourceIT.kt
  - modified: src/backend/CLAUDE.md
