id: task-077
phase: phase-12
title: GUI — Undo/Redo toolbar, history panel, conflict dialog
depends_on: [task-076]
description: |
  Visible UI for the persisted Undo system. Up to now (task-076) the
  store and the keyboard shortcuts exist; this task makes Undo
  discoverable on screen and gives the user a graceful path when a
  conflict makes their undo impossible.

  Where this lives (IMPORTANT): the `UndoStore`, the draft `$state`,
  `EstimationGrid`, and the Submit/action area all live in the VERSION
  EDITOR page
  `src/frontend/src/routes/estimations/[id]/versions/[versionNumber]/+page.svelte`
  (wired there in task-076). ALL of the undo UI in this task goes on that
  page — NOT in `EstimationDetail.svelte`, which is a stateless header
  component on the estimation detail page `/estimations/[id]` and has no
  access to the store.

  Target UI:

  1. Toolbar on the version editor `+page.svelte`:
       - Two icon buttons "Rückgängig" and "Wiederholen" added to the
         existing action-area row (the `flex items-center gap-3` div that
         holds the Saving/Saved indicator, the "Submit" button, and the
         Export menu), placed before the "Submit" button.
         Disabled when `undoStore.canUndo` / `canRedo` is false.
         Tooltip shows the keyboard shortcut and, when enabled, the
         display name + relative time of the entry that will be
         undone/redone (drawn from `undoStore.history`).
       - The buttons simply call `undoStore.undo()` / `undoStore.redo()`.
         The page already registers `undoStore.onResult` (task-076), so a
         successful (non-null) result replaces the draft `$state`
         AUTOMATICALLY via that hook — do NOT re-implement the state
         replacement in the buttons.

  2. History side panel (collapsible), rendered on the editor
     `+page.svelte` directly below `<EstimationGrid>`:
       - New component
         `src/frontend/src/lib/components/UndoHistoryPanel.svelte`
         shown when the user opens "Verlauf" from the toolbar.
       - Renders `undoStore.history` newest-first: one row per entry
         with kind label, user display name, relative timestamp, and a
         status badge (`Aktiv` / `Rückgängig gemacht`).

  3. Conflict resolution dialog:
       - New component
         `src/frontend/src/lib/components/UndoConflictDialog.svelte`
         shown whenever `undoStore.conflict` is non-null.
       - The body explains in German that another user (named via
         `conflict.blockingUserDisplayName`) made a newer change
         (`conflict.blockingKind`, `conflict.blockingCreatedAt`) so the
         undo cannot be performed without overwriting their work.
       - Two actions:
           "Aktuellen Stand neu laden" — calls the editor page's
             existing `loadVersion()` (pass it in as a callback prop),
             then `undoStore.refresh()`, then
             `undoStore.clearConflict()`. This is the recommended
             path. (Note `loadVersion()` already refreshes history for
             a draft, so the explicit `refresh()` is belt-and-braces.)
           "Abbrechen" — only calls `undoStore.clearConflict()` and
             keeps the local view as-is (no further undo possible
             until something changes).
       - The dialog uses the same modal styling as
         `CreateProjectDialog.svelte` / `DevLoginDialog.svelte`
         (verify by reading those components — match patterns
         verbatim per the CLAUDE.md "match existing pattern" rule for
         dialogs).

  4. Error surfacing:
       - 409 conflicts go to the dialog above (NOT to ErrorBanner —
         this is a structured, recoverable user-facing state, not a
         generic error).
       - All other failures (network, 5xx, …) still go to the shared
         `ErrorBanner` per the CLAUDE.md error-surfacing rule. The
         `UndoStore` from task-076 already routes these; this task
         must NOT add a `console.error` fallback that swallows them.

  5. Accessibility:
       - Toolbar buttons get `aria-label` + tooltip text.
       - Dialog is keyboard-trappable; ESC triggers "Abbrechen".
       - History entries are a `<ul>` with `<li>` rows, not divs.

  6. E2E (Playwright):
       - Extend `src/frontend/e2e/undo.test.ts` (created in task-076 —
         note the `.test.ts` suffix, matching the suite convention) with:
           * click-the-toolbar variant of the keyboard test (proves
             the buttons wire up),
           * conflict scenario: after the UI (running as dev-admin)
             makes an edit, simulate a SECOND user's PUT by issuing
             `page.request.put(url, { headers: { Authorization:
             'Dev dev-estimator' } })` (a valid ESTIMATOR dev user,
             backend display name "Dev Estimator"); then attempt undo,
             expect `<UndoConflictDialog>` to appear naming the other
             user, click "Aktuellen Stand neu laden", assert the dialog
             closes and the grid shows the second user's value.

  Out of scope:
    - Finer-grained per-cell undo highlights (animations, flashing
      diff highlighting) — nice-to-have, defer.
    - Multi-user real-time collaboration (planned separately in
      phase-11). Undo here is per-user and synchronous.

steps:
  - |
    Create `src/frontend/src/lib/components/UndoHistoryPanel.svelte`
    rendering `undoStore.history` newest-first with kind, user,
    relative time, status badge.

  - |
    Create `src/frontend/src/lib/components/UndoConflictDialog.svelte`
    matching the modal pattern from `CreateProjectDialog.svelte`. Two
    actions ("Aktuellen Stand neu laden", "Abbrechen") as described.

  - |
    Edit the version editor page
    `src/frontend/src/routes/estimations/[id]/versions/[versionNumber]/+page.svelte`
    (where `undoStore`, the draft state, and `<EstimationGrid>` already
    live):
      - Add the two toolbar buttons (Rückgängig / Wiederholen) into the
        existing `flex items-center gap-3` action-area row, before the
        Submit button, bound to `undoStore.canUndo` / `canRedo`; they
        call `undoStore.undo()` / `undoStore.redo()` (the `onResult`
        hook already replaces the draft state).
      - Render `<UndoConflictDialog>` whenever
        `undoStore.conflict != null`, passing `loadVersion` as the
        reload callback.
      - Add a "Verlauf" toggle button that opens `<UndoHistoryPanel>`
        (fed `undoStore.history`) in a collapsible region below
        `<EstimationGrid>`.

  - |
    Extend `src/frontend/e2e/undo.test.ts` with the two scenarios
    described (button-driven undo + conflict dialog flow).

  - |
    Update the CLAUDE.md "Frontend — undo/redo store (`UndoStore`)"
    paragraph: its final sentence currently reads "Visible
    toolbar/history/conflict UI lands in task-077" — replace it to note
    that the toolbar (Rückgängig/Wiederholen), the `UndoHistoryPanel`,
    and the `UndoConflictDialog` now exist on the version editor page.

  - |
    Build + tests (the dev stack must be running for e2e —
    `./scripts/dev.sh` with Docker up, backend on :8080 + Vite on :5173):
      ./gradlew :frontend:check
      cd src/frontend && npx playwright test undo

  - |
    Manual UI sanity check via `./scripts/dev.sh`:
    open a draft in the version editor, edit a value, click "Rückgängig",
    confirm the grid reverts; click "Wiederholen", confirm it re-applies;
    force a conflict by editing through a second dev user in another
    browser profile and confirm the dialog renders.

validation:
  - |
    Components exist and the toolbar is wired up on the editor page:
      test -f src/frontend/src/lib/components/UndoHistoryPanel.svelte
      test -f src/frontend/src/lib/components/UndoConflictDialog.svelte
      grep -q "UndoConflictDialog" "src/frontend/src/routes/estimations/[id]/versions/[versionNumber]/+page.svelte"
      grep -q "UndoHistoryPanel" "src/frontend/src/routes/estimations/[id]/versions/[versionNumber]/+page.svelte"
      grep -q "canUndo" "src/frontend/src/routes/estimations/[id]/versions/[versionNumber]/+page.svelte"
      grep -q "canRedo" "src/frontend/src/routes/estimations/[id]/versions/[versionNumber]/+page.svelte"
  - |
    No bare console.* introduced; ErrorBanner still wired up for
    non-conflict failures:
      ! grep -q "console\\." src/frontend/src/lib/components/UndoHistoryPanel.svelte
      ! grep -q "console\\." src/frontend/src/lib/components/UndoConflictDialog.svelte
  - |
    Builds + e2e passes (dev stack running for e2e):
      ./gradlew :frontend:check
      cd src/frontend && npx playwright test undo

