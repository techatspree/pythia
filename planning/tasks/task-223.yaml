steps:
  - |
    Read `MerlinExporter.kt` (as left by task-222, including
    `ObsoleteDeletion` and `ObsoleteCascade`), `MerlinImporter.kt` (as left by
    task-221), `MerlinStructureChangedException.kt`,
    `rest/MerlinStructureChangedExceptionMapper.kt`,
    `EstimationVersionResource.exportMerlin`, `MerlinStructureDiffDto.kt`,
    `MerlinExporterTest.kt`, `MerlinExportResourceIT.kt`, the page
    `src/frontend/src/routes/estimations/[id]/+page.svelte`,
    `MerlinStructureDialog.svelte`, `#lib/api/download.ts`, `#lib/format.ts`,
    `e2e/merlin-export.test.ts`, `e2e/pages/MerlinStructureDialog.ts`,
    `e2e/pages/ImportExportMenu.ts`, `src/frontend/CLAUDE.md` and
    `.claude/skills/merlin-integration/SKILL.md`.
  - |
    Rename with `git mv` so history follows: `MerlinExporter.kt` →
    `MerlinMerger.kt` (class `MerlinMerger`, `export` → `merge`),
    `MerlinExporterTest.kt` → `MerlinMergerTest.kt`,
    `MerlinExportResourceIT.kt` → `MerlinMergeResourceIT.kt`,
    `e2e/merlin-export.test.ts` → `e2e/merlin-merge.test.ts`. Update every
    reference, including `MerlinStructureChangedException.kt`
    (`MerlinMerger.MerlinStructureDiff`). Reword "export" to "merge" in the
    `Log` lines of `MerlinMerger` ("Merlin merge: …", the temp-file prefix
    `merlin-merge-`), in `MerlinStructureChangedExceptionMapper.kt`'s log
    ("Merlin merge refused: …"), and in the comments of
    `MerlinStructureDiffDto.kt`, `MerlinStructureDialog.svelte` and the page.
    In `README.md` the mermaid node becomes `Export xlsx / CSV · Merge into
    Merlin`. `grep -rn 'MerlinExporter\|exportMerlin\|export/merlin' src`
    must come back empty apart from the regenerated OpenAPI files, which the
    build rewrites.
  - |
    Give `MerlinMerger.merge(input, version, overwriteStructure)` the return
    type `MerlinMergeResult(document: ByteArray, report: MerlinMergeReport)`.
    `MerlinMergeReport` is a backend data class with the DTO's fields
    (`MerlinRemovedContent` for the counts, `MerlinDependencySkipReason`
    enum with `WOULD_CREATE_CYCLE` and `PARENT_CHILD`). Build it as the
    merge runs:
    - `activitiesAdded`/`activitiesMoved` from `computeDiff`
      (`missingInMerlin`/`reordered`) when `overwriteStructure` applied them;
    - `activitiesRemoved`, `dependenciesRemoved` and `contentRemoved` from
      `ObsoleteDeletion`. Add `assignments: Int` to `ObsoleteDeletion` (in
      `ObsoleteCascade.delete`: the size of the `ZACTIVITY_` selection, i.e.
      `items.size - obsoletePks.size`), and map `removedRows` by table as
      the Target state lists;
    - `effortChanges` from `writeWork`, which now reads the current
      `ZGIVENWORK_` of each leaf first (as a string, as the importer does),
      compares with `formatDays` on both sides and skips unchanged leaves
      (see Target state). `beforePT` is null for no work, else the parsed
      value; `afterPT` null for `offerPT <= 0`, else `offerPT` rounded to 2
      decimals;
    - dependency results from the new `mergeDependencies` (next step).
  - |
    Add `mergeDependencies(conn, version, entries)`, called after
    `writeWork` and before commit. It re-reads the activities, so after an
    overwrite it sees the newly created ones:
    1. Extend `EstimationEntry` with the node's `logicalId` (captured in
       `estimationEntries`), and map `version.scheduleDependencies`
       (`SubmittedScheduleDependency.fromLogicalId/toLogicalId`) →
       entry path → Merlin pk via `merlinPaths(current activities)`. Skip
       silently (DEBUG log) an edge whose logicalId is not in the version or
       whose path has no activity. The domain ignores such edges too.
    2. Skip if Merlin already has a `ZDEPENDENCY` row from → to (any `ZTYPE`).
    3. Skip and report `PARENT_CHILD` if one pk is an ancestor of the other
       (walk `parentPk` of the re-read activities).
    4. Skip and report `WOULD_CREATE_CYCLE` if `to` reaches `from` through
       the current dependency edges (including the ones added in this merge).
    5. Otherwise INSERT `ZDEPENDENCY (Z_PK, Z_ENT, Z_OPT, ZTYPE,
       ZPREVIOUSACTIVITY_, Z49_PREVIOUSACTIVITY_, ZNEXTACTIVITY_,
       Z49_NEXTACTIVITY_, ZPROJECT, ZUNIQUEID, ZLAG_)` with `ZTYPE = 0`,
       `Z_OPT = 1`, `ZLAG_` NULL, `Z49_*` = 49 (the Activity entity id, the
       assumption `insertActivity` already makes), and `ZPROJECT` copied from
       the root activity's `ZPROJECT` (read it; 1 in the demo file). `Z_ENT`
       and the pk come from the `Z_PRIMARYKEY` row WHERE
       `Z_NAME = 'Dependency'` (Z_ENT 24, Z_MAX 4 in the demo file; read by
       name, not hardcoded), advancing its `Z_MAX` like `allocatePks` does
       for ScheduleItem. A document without that row or without `ZDEPENDENCY`
       gets no edges and a WARN. `ZUNIQUEID` from `newUniqueId()`.
    Log INFO with added/skipped counts and DEBUG per edge.
  - |
    REST, in `EstimationVersionResource`: replace `exportMerlin` with
    `mergeIntoMerlin` on `@Path("/{versionNumber}/merge/merlin")`,
    `@Produces(MediaType.APPLICATION_JSON)`, same roles, same `400`/`404`/`409`
    handling, `200` documented with `@Schema(implementation =
    MerlinMergeResultDto::class)`. Rename the injected field to
    `merlinMerger`. The DTOs go in a new `rest/dto/MerlinMergeDtos.kt` beside
    `MerlinStructureDiffDto.kt`, with a mapper from `MerlinMergeReport`.
    `fileName` is `merlin-<draft|vN>-merged.<ext>` with `ext` from
    `filenameExtension(document)`. `document` is `Base64.getEncoder()`
    (standard, padded). Log INFO on the request with estimation id, version
    and overwriteStructure, as the old method did.
  - |
    Backend tests (`MerlinMergerTest`, `MerlinMergeResourceIT`), adapting the
    renamed existing ones to the new return type. First make the test helper
    `convert(...)` copy `logicalId = node.logicalId` onto every submitted
    node, so edges resolve. Then add:
    - `an unchanged leaf is not rewritten`: build the version so that each
      leaf's `offerPT` equals that leaf's own work in the sample ("1d" → 1.0,
      no work → 0.0; `versionFromSample` stamps ONE value on every leaf, so
      give it a per-leaf variant), merge, and assert `effortChanges` is empty
      and no activity's `Z_OPT` changed.
    - `merging the merged document again changes nothing`: merge a version
      with offerPT 1.0833 per leaf, merge the RESULT again with the same
      version, and assert the second report is entirely empty (pins the
      `formatDays` comparison at a rounding boundary).
    - `a Pythia edge Merlin lacks is added as finish-to-start`: give the
      version an edge Initialisation → Closure (by their entries'
      logicalIds), merge, assert one new `ZDEPENDENCY` row with `ZTYPE = 0`
      from pk 4 to pk 9, the Dependency row of `Z_PRIMARYKEY` advanced to 5,
      and the report's `dependenciesAdded` = `[Initialisation → Closure]`.
    - `an edge Merlin already has is not duplicated`: the version carries
      Initialisation → Implementation, merge, assert still 2 rows and no
      report entry.
    - `a Merlin-only dependency is never deleted`: the version has NO edges,
      merge, assert both demo rows remain.
    - `an edge that closes a cycle is skipped and reported`: the version
      carries Closure → Initialisation (Merlin has Initialisation →
      Implementation → Closure), merge, assert no row added and
      `dependenciesSkipped` = one `WOULD_CREATE_CYCLE`.
    - `an edge between a group and its own child is skipped`: the version
      carries Implementation → its first child, merge, assert no row added and
      one `PARENT_CHILD`.
    - `overwrite re-adds the edges of a renamed group`: rename
      "Implementation" to "Implementierung", keep its logicalId and its two
      edges in the version, merge with overwrite, assert
      `dependenciesRemoved` lists the two old edges, `dependenciesAdded` the
      two new ones against the new activity, `contentRemoved.assignments`
      = 24, `activitiesRemoved` has 31 entries, and no dangling
      `ZDEPENDENCY` reference.
    - Resource IT: `200`, `Content-Type` JSON, `fileName` ends with
      `-merged.sql`, `document` decodes to a SQLite file (magic
      `SQLite format 3`), `report` present. `409` and `400` as before.
      `POST …/export/merlin` now answers `404` or `405`.
  - |
    Prove the new tests can fail, one mutation at a time, restoring the file
    after each (`git diff` shows only the intended change afterwards):
    remove the existing-edge check → `an edge Merlin already has is not
    duplicated` fails; remove the cycle DFS → the cycle test fails; remove
    the ancestor check → the parent-child test fails; compare raw values
    instead of `formatDays` → `merging the merged document again changes
    nothing` fails. Name each in the report.
  - |
    Frontend download helper: add `downloadBlob(blob: Blob, fileName: string)`
    to `#lib/api/download.ts` and make `downloadResponse` delegate to it.
    Add a small `base64ToBlob(b64: string, type: string): Blob` beside it.
  - |
    Create `src/frontend/src/lib/components/MerlinMergeReportDialog.svelte`
    as wireframed (three states, the fixed section order). Export its
    `MerlinMergeResult` / `MerlinMergeReport` types from the module script,
    as `MerlinStructureDialog` does for `MerlinStructureDiff`. Props
    `{ result: MerlinMergeResult; onclose: () => void }`. No inline strings,
    no raw palette classes, `Button` from `#lib/ui/`, numbers via
    `#lib/format.ts`.
  - |
    In `src/routes/estimations/[id]/+page.svelte`: rename the export state and
    functions to merge (`merging`, `mergeVersionRef`, `runMerlinMerge`,
    `onMerlinMergeFileSelected`, `pendingMergeFile`, `mergeInput`), call
    `…/merge/merlin`, read the JSON, call
    `downloadBlob(base64ToBlob(result.document, 'application/octet-stream'),
    result.fileName)`, then set `mergeResult = result` to open the dialog.
    Give the button `data-testid="estimation-detail.merge-merlin"` and the
    renamed keys, as wireframed. Errors still go to `bannerMessage`
    (ErrorBanner) plus `log.error`. Never a bare `console.*`.
  - |
    i18n: add every key named in the wireframes and "Renamed i18n keys" to
    BOTH `de.json` and `en.json` (`merlinMerge.skipReason` is a nested object
    with the two enum names as keys), delete the four
    `estimation.exportMerlin*` keys, and keep the catalogs key-for-key.
  - |
    e2e through the POM:
    - New `e2e/pages/MerlinMergeReportDialog.ts` (`dialog`, `expectVisible()`,
      `section(key: MerlinMergeReportSection)` where
      `MerlinMergeReportSection` is a union of the eight section keys,
      `expectEmpty()`, `close()`), exported from `e2e/pages/index.ts`. Add
      `mergeMerlinButton` to `ImportExportMenu.ts`.
    - `e2e/merlin-merge.test.ts` (renamed): the three existing tests,
      asserting `suggestedFilename()` contains `merged`, that the request URL
      contains `/merge/merlin`, and that the report dialog is visible after
      the download. The first test also asserts
      `ImportExportMenu.mergeMerlinButton` is enabled. The 409 test also
      asserts `section('activities-added')` contains `Added after the import`
      (test data, so a literal is legal). New:
      `merging adds a Pythia dependency and reports it`. Via the API, GET
      the draft, read the logicalIds of the roots titled Initialisation and
      Closure, PUT `{ dependencies: [...existing, {fromLogicalId,
      toLogicalId}] }`, merge through the UI, and assert
      `section('dependencies-added')` contains both titles. New:
      `merging the merged file again reports no changes`. Merge, close the
      report, take the downloaded file (`download.path()`), merge it again,
      and assert `expectEmpty()`.
    - No translated literal anywhere in `e2e/**` outside `e2e/pages/**`.
  - |
    Port protocol before Playwright: check that :8090, :5173 and :5432 are
    free (`lsof -nP -iTCP:<port> -sTCP:LISTEN`). If any is taken, stop and
    report. Start `./scripts/dev.sh` in the background, wait for
    `/api/ping` and `:5173`, then run the FULL suite
    `cd src/frontend && E2E_LANG=en npx playwright test`, then the same with
    `E2E_LANG=de` (the renamed keys and testids live on a page other specs
    drive). Afterwards stop ONLY the `dev.sh` this task started (SIGTERM,
    never `pkill` the JVMs), and confirm the ports are free and no Dev
    Services PostgreSQL container is left.
  - |
    Docs: `.claude/skills/merlin-integration/SKILL.md`. Rename the section
    and the endpoint, and describe the add-only dependency merge, the two
    skip reasons, the "only changed efforts" rule (`formatDays` on both
    sides), the JSON result with base64 document and the report (including
    where `contentRemoved` comes from). Update its frontmatter `description`
    (it names `MerlinExporter`, "effort export" and
    `/versions/{n}/export/merlin`). Update the `MerlinMerger` header comment.
  - |
    ./gradlew build
  - |
    ./gradlew :frontend:check && ./gradlew staticAnalysis
  - |
    `./gradlew build` regenerates `src/frontend/src/lib/api/openapi.json`
    and `schema.d.ts`. Leave them in the working tree for the user to commit
    with the change (CI's `verifyOpenApiSchemaCommitted` gate checks them).
    Do not commit.

validation:
  - |
    B=src/backend/implementation/src/main/kotlin/io/pythia
    test -f $B/service/MerlinMerger.kt
    test ! -f $B/service/MerlinExporter.kt
    grep -q 'fun mergeDependencies' $B/service/MerlinMerger.kt
    grep -q "Z_NAME = 'Dependency'" $B/service/MerlinMerger.kt
    grep -q 'WOULD_CREATE_CYCLE' $B/service/MerlinMerger.kt
    grep -q 'PARENT_CHILD' $B/service/MerlinMerger.kt
    grep -q 'val assignments: Int' $B/service/MerlinMerger.kt
    awk '/fun mergeDependencies/,/^    }$/' $B/service/MerlinMerger.kt | grep -q 'Log\.info'
    awk '/private fun writeWork/,/^    }$/' $B/service/MerlinMerger.kt | grep -q 'formatDays'
    grep -q 'MerlinMerger.MerlinStructureDiff' $B/service/MerlinStructureChangedException.kt
  - |
    B=src/backend/implementation/src/main/kotlin/io/pythia
    grep -q '@Path("/{versionNumber}/merge/merlin")' $B/rest/EstimationVersionResource.kt
    grep -q 'fun mergeIntoMerlin' $B/rest/EstimationVersionResource.kt
    ! grep -q 'export/merlin' $B/rest/EstimationVersionResource.kt
    grep -q 'class MerlinMergeResultDto' $B/rest/dto/MerlinMergeDtos.kt
    grep -q 'class MerlinMergeReportDto' $B/rest/dto/MerlinMergeDtos.kt
    grep -q 'assignments' $B/rest/dto/MerlinMergeDtos.kt
  - |
    ! grep -rn 'MerlinExporter\|exportMerlin\|export/merlin' src/backend/implementation/src src/frontend/src src/frontend/e2e --include='*.kt' --include='*.ts' --include='*.svelte' --include='*.json' | grep -v 'openapi.json\|schema.d.ts'
    ! grep -rn -i 'merlin export' src/backend/implementation/src/main src/frontend/src
    ! grep -q 'Export xlsx / CSV / Merlin' README.md
  - |
    T=src/backend/implementation/src/test/kotlin/io/pythia
    test -f $T/service/MerlinMergerTest.kt
    test -f $T/rest/MerlinMergeResourceIT.kt
    grep -q 'WOULD_CREATE_CYCLE' $T/service/MerlinMergerTest.kt
    grep -q 'PARENT_CHILD' $T/service/MerlinMergerTest.kt
    grep -q 'never deleted' $T/service/MerlinMergerTest.kt
    grep -q 'logicalId = node.logicalId' $T/service/MerlinMergerTest.kt
  - |
    C=src/frontend/src/lib/components/MerlinMergeReportDialog.svelte
    test -f $C
    grep -q 'data-testid="merlin-merge-report.dialog"' $C
    grep -q 'data-testid="merlin-merge-report.close"' $C
    grep -q 'merlin-merge-report.empty' $C
    grep -q 'merlin-merge-report.section' $C
    grep -q 'formatNumber' $C
    ! grep -q 'console\.' $C
  - |
    P='src/frontend/src/routes/estimations/[id]/+page.svelte'
    grep -q 'data-testid="estimation-detail.merge-merlin"' "$P"
    grep -q 'merge/merlin' "$P"
    grep -q 'MerlinMergeReportDialog' "$P"
    grep -q 'downloadBlob' "$P"
    grep -q 'log\.error' "$P"
  - |
    for f in de en; do
      J=src/frontend/src/lib/i18n/$f.json
      jq -e '.estimation.mergeMerlin and .estimation.mergeMerlinHint and .estimation.mergeMerlinFailed and .estimation.mergeMerlinNoVersion' $J
      jq -e '.estimation.exportMerlin == null and .estimation.exportMerlinHint == null and .estimation.exportMerlinFailed == null and .estimation.exportMerlinNoVersion == null' $J
      jq -e '.merlinMerge.title and .merlinMerge.intro and .merlinMerge.introNoChanges and .merlinMerge.empty and .merlinMerge.close and .merlinMerge.addOnlyNote' $J
      jq -e '.merlinMerge.efforts and .merlinMerge.effortChange and .merlinMerge.noEffort and .merlinMerge.dependency and .merlinMerge.skippedDependency' $J
      jq -e '.merlinMerge.dependenciesAdded and .merlinMerge.dependenciesRemoved and .merlinMerge.dependenciesSkipped' $J
      jq -e '.merlinMerge.skipReason.WOULD_CREATE_CYCLE and .merlinMerge.skipReason.PARENT_CHILD' $J
      jq -e '.merlinMerge.activitiesAdded and .merlinMerge.activitiesRemoved and .merlinMerge.activitiesMoved' $J
      jq -e '.merlinMerge.contentRemoved and .merlinMerge.assignments and .merlinMerge.comments and .merlinMerge.attachments and .merlinMerge.costs and .merlinMerge.customAttributeValues' $J
    done
    jq -e '.estimation.mergeMerlin == "In Merlin zusammenführen"' src/frontend/src/lib/i18n/de.json
    jq -e '.estimation.mergeMerlin == "Merge into Merlin"' src/frontend/src/lib/i18n/en.json
  - |
    python3 - <<'PY'
    import json, pathlib, sys
    cats = {p.stem: json.loads(p.read_text())
            for p in pathlib.Path('src/frontend/src/lib/i18n').glob('*.json')}
    def flat(o, p=''):
        s = set()
        for k, v in o.items():
            n = f'{p}.{k}' if p else k
            s |= flat(v, n) if isinstance(v, dict) else {n}
        return s
    keys = {l: flat(d) for l, d in cats.items()}
    ref = set().union(*keys.values())
    bad = {l: sorted(ref - k) for l, k in keys.items() if ref - k}
    print(f'catalogs: {sorted(cats)}')
    print('missing keys:', bad or 'none')
    sys.exit(1 if bad else 0)
    PY
  - |
    E=src/frontend/e2e
    test -f $E/merlin-merge.test.ts
    test ! -f $E/merlin-export.test.ts
    test -f $E/pages/MerlinMergeReportDialog.ts
    grep -q "MerlinMergeReportDialog" $E/pages/index.ts
    grep -q "mergeMerlinButton" $E/pages/ImportExportMenu.ts
    grep -q "from './pages'" $E/merlin-merge.test.ts
    grep -q 'merged' $E/merlin-merge.test.ts
    grep -q 'dependencies-added' $E/merlin-merge.test.ts
    grep -q 'expectEmpty' $E/merlin-merge.test.ts
  - |
    S=.claude/skills/merlin-integration/SKILL.md
    grep -q 'merge/merlin' $S
    grep -q 'add-only\|ADD-ONLY\|Add-only' $S
    grep -q 'PARENT_CHILD' $S
    ! grep -q 'MerlinExporter\|export/merlin' $S
  - |
    ./gradlew build
  - |
    ./gradlew :frontend:check
  - |
    # with a dev.sh stack started per the port protocol
    cd src/frontend && E2E_LANG=en npx playwright test && E2E_LANG=de npx playwright test

