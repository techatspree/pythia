id: task-158
phase: phase-19
title: Gantt chart view and Mermaid export
depends_on: [task-157, task-166, task-170, task-175]
description: |
  Last task of phase-19. task-157 leaves the schedule editable and saved, shown
  as a list of durations. This task makes it a **Gantt chart** on screen and an
  **export** the user can paste into a plan, a wiki or a report — which is where
  the whole phase was heading: "how long will the project take", in a form
  somebody else will read.

  ## Export format: Mermaid

  Export a Mermaid `gantt` block, downloaded as `project-plan.mmd`.

  It is text — diffable, reviewable, and it renders natively in GitHub, GitLab
  and Confluence, so the answer travels without a screenshot. It also adds **no
  dependency**: the README already carries a Mermaid diagram, and this repo
  consistently declines to pull a library for a rendering job it can do itself
  (icons via Playwright's bundled Chromium rather than `sharp`). Do not add a
  charting or Gantt library, and do not export an image.

  Do not invent a second download mechanism either. Build the text into a
  `Blob` and hand it to `downloadResponse(...)` from `$lib/api/download.ts`, the
  same seam the xlsx/csv and Merlin exports use. A plain `<a href download>` is
  banned repo-wide.

  ## Working days become calendar dates here, and only here

  task-155 deliberately keeps the domain in working days. The export takes a
  **project start date** from the user and maps working-day offsets onto
  calendar dates, skipping Saturdays and Sundays. That mapping belongs to the
  export because it is a presentation concern — do not push it back into the
  domain, and do not model holidays (out of scope for the phase).

  All date and number rendering goes through `$lib/format.ts`; `.toFixed()`,
  `toLocale*()` and a hardcoded locale are banned, so an English user sees
  English date order.

  ## Logging on the export path

  The export builds a Blob and hands it to `downloadResponse(...)` — a
  user-triggered path that can throw, so per the CLAUDE.md frontend rules its
  `catch` must BOTH surface via `ErrorBanner` and log through `log` from
  `$lib/log.ts`. A `catch` that only logs and returns is explicitly not
  acceptable in this repo, and a bare `console.*` is banned outright. The chart
  itself renders and computes nothing, so it needs no logging of its own.

  ## The chart

  One row per `ScheduledTask`: a bar positioned by `earliestStart` and sized by
  `durationDays`, against a working-day axis. Colours come from `@theme` tokens
  in `app.css`; an arbitrary `bg-[#…]` fails `:frontend:check`.

  **It is a tree** (task-164). `ProjectSchedule.tasks` is a flat list covering
  every node with `parentLogicalId`, `depth` and `isGroup`, in tree order —
  indent rows by `depth`, and draw a group's bar as its rolled-up SPAN
  (`earliestFinish - earliestStart`), which is deliberately not an effort
  quotient and will not equal the sum of its children when they overlap. Do NOT try to mirror the
  graph's collapse state: since task-167 it lives inside `DependencyEditor` as
  private `SvelteSet` state, so a sibling cannot read it. Give the chart its own
  collapse or none at all, and persist neither.

  **The plan is resource-levelled** (task-166). `teamFte` is a worker count and
  the scheduler never runs more than `floor(teamFte)` leaves at once, so the
  bars are a plan the team can actually deliver — that is the whole reason this
  chart is worth drawing. Two consequences for the UI:

  - `onCriticalPath` is a **critical chain**: a bar can be critical because the
    team was busy, not only because of a dependency. Highlight it as the answer
    to "what makes the project this long" — that is still true — but do not
    label it "longest dependency chain" anywhere.
  - The duration BAND (`optimisticDurationDays` … `pessimisticDurationDays`)
    follows the dependency path, not the levelled makespan. If the chart shows
    it, say what it is: estimate uncertainty, not a confidence interval on the
    levelled dates.

  **There is no `cycleError` field.** task-155 shipped a structured
  `error: ScheduleError?` with `kind` — `CYCLE` or `INVALID_TEAM_FTE`. Render
  the error in place of the chart for either kind, mapped through the
  `schedule.error.*` i18n keys task-157 adds: a Gantt drawn from an empty task
  list would read as "zero days".

steps:
  - |
    Add `src/frontend/src/lib/components/schedule/GanttChart.svelte`:
      - a `schedule: ProjectScheduleView | null` prop (read-only; this component
        computes nothing). `ProjectScheduleView` is the FRONTEND type from
        `$lib/adapter`; `ProjectSchedule` is the Kotlin name and does not exist
        in TypeScript
      - one row per task in TREE order, indented by `depth`, with a group's bar
        drawn from its rolled-up span (`isGroup`)
      - a bar offset by `earliestStart` and sized by `durationDays`, both as a
        percentage of `projectDurationDays`
      - critical-CHAIN bars in the brand colour, others muted, with the
        distinction also carried by an `aria-label` so it is not colour-only
      - a working-day axis with a handful of ticks
      - `schedule.error` rendered in place of the chart for EITHER kind
        (`CYCLE`, `INVALID_TEAM_FTE`), via the `schedule.error.*` keys
      - horizontal overflow scrolls inside the component rather than widening
        the page
  - |
    Add the export beside it: a project-start-date input, and a button that
    builds a Mermaid `gantt` block and downloads it as `project-plan.mmd`.

    Shape:

      gantt
        title <estimation title>
        dateFormat YYYY-MM-DD
        axisFormat %d.%m
        section <unit title>
        <unit title> :<crit,> <id>, <start-date>, <n>d

    Mark critical-path units with Mermaid's `crit` tag so the exported chart
    carries the same emphasis as the on-screen one. Map working-day offsets to
    calendar dates from the chosen start date, skipping weekends. Escape or
    strip characters that would break Mermaid syntax in a unit title (`:` and
    newlines in particular) — a title is free text.

    Download via `downloadResponse(...)` from `$lib/api/download.ts` with a
    locally-built `Blob`; never a plain `<a download>`.
  - |
    Render it on the SCHEDULE ROUTE
    `src/frontend/src/routes/estimations/[id]/versions/[versionNumber]/schedule/+page.svelte`,
    below the `DependencyEditor`.

    NOT in the version editor, which is where an earlier draft of this task
    pointed. Two later tasks moved the ground: task-167 gave the graph its own
    full-viewport route (`Page width="full"`) because a plan needs the space,
    and task-170 DELETED the per-item duration list from the version editor —
    `src/frontend/CLAUDE.md` now records that it "deliberately no longer lists
    per-item rows … Do not restore it as a missing feature." A Gantt is one row
    per task, so putting it there would reinstate exactly what that task
    removed, on the same page. The version editor keeps the numbers and links
    out; the plan lives with the graph.

    The export controls sit with the chart, and both are available for
    submitted versions too (exporting a snapshot's plan is exactly the point) —
    the route already computes `editable` from `isDraft` and renders for either.
  - |
    Add the new strings to **both** `src/frontend/src/lib/i18n/de.json` and
    `en.json`, key-for-key under `schedule.*`: the chart heading, the axis label,
    the start-date label, the export button, the download's fallback file name,
    the critical/non-critical `aria-label`s, and the cycle notice. Real German,
    not the English text pasted across. No inline literals — `$_('key')`.
  - |
    Extend `src/frontend/e2e/schedule.test.ts` from task-157: after setting a
    team size and a dependency, assert the chart renders one bar per root, that
    at least one bar is marked as critical, and that the export downloads a file
    whose bytes start with `gantt` and contain a `crit` entry — the same
    "assert the downloaded bytes, not just that a click happened" approach
    `e2e/export.test.ts` uses.
  - |
    Extend the schedule note in `src/frontend/CLAUDE.md` that task-157 started:
    the Gantt renders `ProjectSchedule` and computes nothing; the export is
    Mermaid text through `downloadResponse(...)` and deliberately adds no
    charting library; and working days become calendar dates **only** in the
    export, skipping weekends, never in the domain. That last one is the rule a
    future change is most likely to violate by "helpfully" moving date handling
    into the domain.
  - |
    Run the gate: `./gradlew :frontend:check`, then `./gradlew build`, then
    Playwright with the dev stack up (`./scripts/dev.sh`; backend :8090, Vite
    :5173; stop with SIGTERM, never by killing the child JVMs):
    `cd src/frontend && npm run test:e2e`.

validation:
  - |
    The chart exists and reads the STRUCTURED error, not the field name an
    earlier draft of this task invented. `set -e` matters here: without it only
    the last command decides the block and every assertion above it is
    decorative.
      set -e
      S=src/frontend/src/lib/components/schedule
      test -f "$S/GanttChart.svelte"
      grep -q "onCriticalPath" "$S/GanttChart.svelte"
      # task-155 shipped `error: ScheduleError?` with `kind`; there is no
      # `cycleError` field and never was.
      grep -q "error" "$S/GanttChart.svelte"
      grep -qE "CYCLE|error\.kind|kind ===" "$S/GanttChart.svelte" \
        || { echo "the chart does not branch on error.kind"; exit 1; }
      if grep -q "cycleError" "$S/GanttChart.svelte"; then
        echo "cycleError does not exist; use error.kind"; exit 1
      fi
  - |
    The export is Mermaid, goes through the shared download seam, and adds no
    library. Uses `python3 -c`, NOT a heredoc: inside a YAML block scalar the
    `PY` terminator carries the block's indentation, and the interpreter then
    receives an indented body and dies with `IndentationError` — verified.
      set -e
      S=src/frontend/src/lib/components/schedule
      grep -q "gantt" "$S/GanttChart.svelte"
      grep -q "crit" "$S/GanttChart.svelte"
      grep -q "downloadResponse" "$S/GanttChart.svelte"
      # `set -e` does NOT abort on a !-negated command (POSIX), so assert the
      # ban with an explicit if/exit instead.
      if grep -rqE "<a [^>]*download" "$S"; then
        echo "a plain <a download> crept in; use downloadResponse"; exit 1
      fi
      python3 -c "import json,sys;p=json.load(open('src/frontend/package.json'));d={**p.get('dependencies',{}),**p.get('devDependencies',{})};bad=[k for k in d if any(t in k.lower() for t in ('gantt','chart','mermaid','dhtmlx','frappe'))];print('charting deps:',bad or 'none');sys.exit(1 if bad else 0)"
  - |
    The frontend hard rules still hold across the schedule components. Each ban
    is an explicit if/exit: `set -e` is ignored for a !-negated command, so the
    original `! grep …` form silently passed whatever it found.
      set -e
      S=src/frontend/src/lib/components/schedule
      if grep -rqE "(^|[^.[:alnum:]_])console\." "$S"; then echo "bare console"; exit 1; fi
      if grep -rqE "bg-\[#" "$S"; then echo "arbitrary colour value"; exit 1; fi
      if grep -rqE "toFixed\(|toLocale" "$S"; then echo "raw number/date formatting"; exit 1; fi
      grep -rq "aria-label" "$S"
  - |
    The chart is wired into the SCHEDULE route — not the version editor, whose
    per-item list task-170 removed on purpose:
      set -e
      P="src/frontend/src/routes/estimations/[id]/versions/[versionNumber]/schedule/+page.svelte"
      V="src/frontend/src/routes/estimations/[id]/versions/[versionNumber]/+page.svelte"
      test -f "$P"
      grep -q "GanttChart" "$P"
      if grep -q "GanttChart" "$V"; then
        echo "the chart landed in the version editor; task-170 removed per-item rows there"; exit 1
      fi
  - |
    Both catalogs stay key-for-key identical, carry `schedule.*`, and the German
    strings are translated rather than copied. `python3 -c`, not a heredoc: the
    YAML block scalar indents the terminator and the body, and the interpreter
    dies with `IndentationError`.
      set -e
      python3 -c "import json,pathlib,sys;d=pathlib.Path('src/frontend/src/lib/i18n');cats={p.stem:json.loads(p.read_text()) for p in d.glob('*.json')};flat=lambda o,p='': {kk:vv for k,v in o.items() for kk,vv in (flat(v,(p+'.'+k) if p else k).items() if isinstance(v,dict) else [((p+'.'+k) if p else k, v)])};f={l:flat(c) for l,c in cats.items()};ref=set().union(*(set(x) for x in f.values()));bad={l:sorted(ref-set(x)) for l,x in f.items() if ref-set(x)};de=f.get('de',{});en=f.get('en',{});copied=[k for k in de if k.startswith('schedule.') and len(str(de[k]))>3 and de[k]==en.get(k)];print('key mismatch:',bad or 'none','| untranslated:',copied or 'none');sys.exit(1 if (bad or copied) else 0)"
  - |
    The e2e asserts the exported BYTES, not merely that a click happened:
      set -e
      T=src/frontend/e2e/schedule.test.ts
      grep -q "gantt" "$T"
      grep -qE "crit" "$T"
      # a download assertion, not just a click
      grep -qE "waitForEvent\('download'\)|suggestedFilename|createReadStream|\.path\(\)" "$T" \
        || { echo "no assertion on the downloaded file"; exit 1; }
  - |
    The export's load-bearing rules are written down, not just implemented —
    including the one a future change is most likely to violate:
      set -e
      C=src/frontend/CLAUDE.md
      grep -qi "mermaid" "$C"
      grep -qi "working day" "$C"
      grep -q "task-158" "$C"
      grep -qi "GanttChart" "$C"
  - |
    The export's failure path both logs and surfaces, per the CLAUDE.md
    frontend rules — a catch that only logs is explicitly not acceptable:
      set -e
      S=src/frontend/src/lib/components/schedule
      G="$S/GanttChart.svelte"
      P="src/frontend/src/routes/estimations/[id]/versions/[versionNumber]/schedule/+page.svelte"
      if grep -q "catch" "$G"; then
        grep -qE "log\.(error|debug)" "$G" \
          || { echo "the export catch does not log via \$lib/log"; exit 1; }
      fi
      # the banner may live on the route rather than in the component
      grep -q "ErrorBanner" "$P" || grep -q "ErrorBanner" "$G" \
        || { echo "no ErrorBanner on the export path"; exit 1; }
  - |
    ./gradlew :frontend:check
  - |
    ./gradlew build
  - |
    With the dev stack running (`./scripts/dev.sh`, backend :8090, Vite :5173):
      cd src/frontend && npm run test:e2e

