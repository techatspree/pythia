id: task-075
phase: phase-12
title: REST API — undo / redo / history endpoints
depends_on: [task-074]
description: |
  Expose `UndoService` (task-074) over HTTP. All endpoints live on
  `EstimationVersionResource` under the existing
  `/api/estimations/{eid}/versions/draft` prefix, so they share auth,
  path conventions, and the draft-scoped semantics already in place.

  Endpoints:

    POST /api/estimations/{eid}/versions/draft/undo
        Auth: @RolesAllowed("ESTIMATOR")  (a write; admin already has
              ESTIMATOR — matches updateDraft, task-091)
        Body: none
        200 → EstimationVersionDto         (the draft after undo, with
                                            on-the-fly calculated values
                                            populated as today)
        404 → no draft / nothing to undo
        409 → UndoConflictException — body is ConflictDetailsDto
              (see below)

    POST /api/estimations/{eid}/versions/draft/redo
        Same auth and shape as undo. 409 with ConflictDetailsDto if a
        newer ACTIVE mutation supplants the redo target.

    GET  /api/estimations/{eid}/versions/draft/history
        Auth: covered by the class-level @RolesAllowed("VIEWER") — a read,
              so no method-level annotation needed (task-091)
        200 → List<MutationLogEntryDto>
        Ordered by sequence_number ASC; both ACTIVE and UNDONE entries
        included so the GUI can render the timeline.

  DTOs (under
  src/backend/implementation/src/main/kotlin/io/github/theestimator/rest/dto/):

    data class ConflictDetailsDto(
        val message: String,
        val blockingSequenceNumber: Long,
        val blockingUserId: UUID,
        val blockingUserDisplayName: String,
        val blockingKind: String,                  // DraftMutation.kind
        val blockingCreatedAt: Instant,
        val currentDraftRevision: Long
    )

    data class MutationLogEntryDto(
        val id: UUID,
        val sequenceNumber: Long,
        val revisionBefore: Long,
        val revisionAfter: Long,
        val userId: UUID,
        val userDisplayName: String,
        val kind: String,
        val status: String,                        // ACTIVE | UNDONE
        val createdAt: Instant,
        val undoneAt: Instant?
    )

  Mapping helpers live in
  `rest/dto/MutationLogMapper.kt`.

  Exception handling:
    Add `UndoConflictExceptionMapper` (JAX-RS `ExceptionMapper`) that
    serialises `UndoConflictException` → HTTP 409 with a
    `ConflictDetailsDto` body. Place it under
    src/backend/implementation/src/main/kotlin/io/github/theestimator/rest/.
    IMPORTANT: an `ExceptionMapper` runs AFTER the resource method, so the
    `@Transactional` scope has already ended (the service threw, the tx
    rolled back). `blockingEntry.user` and `blockingEntry.draftVersion`
    are `@ManyToOne(LAZY)`, so reading `user.displayName` /
    `draftVersion.revision` in the mapper would throw
    `LazyInitializationException`. Build the `ConflictDetailsDto` inside a
    FRESH transaction that re-loads the entry by id and reads the fields
    while attached — inject `DraftMutationLogRepository` and wrap the read
    in `QuarkusTransaction.requiringNew().call { … }` (or `.requiringNew`
    with an explicit fetch). `currentDraftRevision` comes from the
    re-loaded `blockingEntry.draftVersion.revision`.

  OpenAPI:
    The Quarkus build regenerates the OpenAPI document to
    `src/backend/implementation/target/openapi/openapi.json` (via
    `quarkus.smallrye-openapi.store-schema-directory=target/openapi`);
    verify the new paths and DTOs appear there after the build. Copying
    that into the frontend's committed `src/frontend/src/lib/api/openapi.json`
    and regenerating the openapi-fetch types (`npm run gen:api`) is
    task-076's job — task-075 only ensures the backend document is correct.

  Tests:
    REST IT under
    src/backend/implementation/src/test/kotlin/io/github/theestimator/rest/UndoEndpointsIT.kt:
      - 200 happy path for undo + redo (state matches expectations).
      - 404 when no draft exists.
      - 404 when undo has nothing to undo / redo has nothing to redo.
      - 409 conflict from a second user, body contains a non-empty
        `blockingUserDisplayName` and a positive `blockingSequenceNumber`.
      - `GET history` returns expected sequence after an update + undo.

steps:
  - |
    Add the DTOs and the mapper:
      - rest/dto/ConflictDetailsDto.kt
      - rest/dto/MutationLogEntryDto.kt
      - rest/dto/MutationLogMapper.kt   (helper that joins on the user
        repository to populate display names)

  - |
    Add `UndoConflictExceptionMapper.kt` under rest/. Re-load the
    `blockingEntry` by id in a fresh transaction
    (`QuarkusTransaction.requiringNew().call { … }`, injecting
    `DraftMutationLogRepository`) so the `@ManyToOne(LAZY)` `user` and
    `draftVersion` can be read while attached; map them (+
    `draftVersion.revision` as `currentDraftRevision`) into a
    `ConflictDetailsDto` and return `Response.status(409).entity(...)`.

  - |
    Extend `EstimationVersionResource.kt` with three new methods, all
    `@Transactional` (so entities stay attached — needed for the history
    mapping and to run the undo/redo mutation):
      - `undo` / `redo`: `@POST` + `@Path("/draft/undo" | "/draft/redo")`
        + `@RolesAllowed("ESTIMATOR")`. Resolve the actor as `updateDraft`
        does (`currentUserService.ensureUser(currentUserProvider.get())`),
        call `undoService.undoLastForUser(eid, user)` /
        `redoLastForUser(...)` (which mutate the draft entity), then build
        the response exactly like `updateDraft` does — re-fetch the draft
        and `draft.toDto(versionService.calculateDraft(draft))` (NOT map
        the domain `EstimationVersion` the service returns; `toDto` maps
        the entity + calc result).
      - `history`: `@GET` + `@Path("/draft/history")`; no method-level
        role (class-level `@RolesAllowed("VIEWER")` covers it). Delegate
        to `undoService.historyFor(eid)` and map via `MutationLogMapper`.

  - |
    REST IT under
    src/backend/implementation/src/test/kotlin/io/github/theestimator/rest/UndoEndpointsIT.kt
    covering the five scenarios in the description. Use the existing
    test helpers (`buildRealisticDraft`, the dev-auth header pattern
    from `EstimationVersionResourceIT`) for setup.

  - |
    Update CLAUDE.md's "REST API surface" section to list the three new
    endpoints under `EstimationVersionResource`: `POST …/draft/undo`,
    `POST …/draft/redo` (both `409` on `UndoConflictException`), and
    `GET …/draft/history`.

  - |
    Build + verify OpenAPI is updated:
      ./gradlew :backend:implementation:test
      grep -q "/versions/draft/undo" src/backend/implementation/target/openapi/openapi.json
      grep -q "/versions/draft/redo" src/backend/implementation/target/openapi/openapi.json
      grep -q "ConflictDetailsDto" src/backend/implementation/target/openapi/openapi.json

validation:
  - |
    Resource and DTOs exist:
      grep -q "/draft/undo" src/backend/implementation/src/main/kotlin/io/github/theestimator/rest/EstimationVersionResource.kt
      grep -q "/draft/redo" src/backend/implementation/src/main/kotlin/io/github/theestimator/rest/EstimationVersionResource.kt
      grep -q "/draft/history" src/backend/implementation/src/main/kotlin/io/github/theestimator/rest/EstimationVersionResource.kt
      test -f src/backend/implementation/src/main/kotlin/io/github/theestimator/rest/dto/ConflictDetailsDto.kt
      test -f src/backend/implementation/src/main/kotlin/io/github/theestimator/rest/dto/MutationLogEntryDto.kt
      test -f src/backend/implementation/src/main/kotlin/io/github/theestimator/rest/UndoConflictExceptionMapper.kt
      grep -q "/draft/undo" CLAUDE.md
  - |
    Tests pass and OpenAPI is updated:
      ./gradlew :backend:implementation:test
      grep -q "/versions/draft/undo" src/backend/implementation/target/openapi/openapi.json
      grep -q "/versions/draft/redo" src/backend/implementation/target/openapi/openapi.json

outputs:
  - created: src/backend/implementation/src/main/kotlin/io/github/theestimator/rest/dto/ConflictDetailsDto.kt
  - created: src/backend/implementation/src/main/kotlin/io/github/theestimator/rest/dto/MutationLogEntryDto.kt
  - created: src/backend/implementation/src/main/kotlin/io/github/theestimator/rest/dto/MutationLogMapper.kt
  - created: src/backend/implementation/src/main/kotlin/io/github/theestimator/rest/UndoConflictExceptionMapper.kt
  - modified: src/backend/implementation/src/main/kotlin/io/github/theestimator/rest/EstimationVersionResource.kt
  - modified: CLAUDE.md
