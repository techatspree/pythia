  - created: src/backend/implementation/src/main/kotlin/io/github/theestimator/rest/dto/MutationLogEntryDto.kt
  - created: src/backend/implementation/src/main/kotlin/io/github/theestimator/rest/dto/MutationLogMapper.kt
  - created: src/backend/implementation/src/main/kotlin/io/github/theestimator/rest/UndoConflictExceptionMapper.kt
  - modified: src/backend/implementation/src/main/kotlin/io/github/theestimator/rest/EstimationVersionResource.kt
  - created: src/backend/implementation/src/test/kotlin/io/github/theestimator/rest/UndoEndpointsIT.kt
