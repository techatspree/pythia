    grep -q 'quarkus-mcp-server-bom' src/backend/implementation/build.gradle.kts
    grep -qE '"io.quarkiverse.mcp:quarkus-mcp-server-http"\)' src/backend/implementation/build.gradle.kts
  - |
    # migration + entity parity
