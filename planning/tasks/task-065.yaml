id: task-065
phase: phase-11
title: Backend — real-time session WebSocket channel
depends_on: [task-064]
description: |
  Push session state to every participant in real time so all
  browsers show the same thing (vote counts ticking up, phase changes,
  reveal, finalize) without polling. The HTTP control plane (task-064)
  remains the only way to MUTATE state; the WebSocket is push-only:
  whenever the service publishes a change, the server broadcasts the
  fresh SessionDto to all sockets joined to that session.

  Technology: Quarkus 3.35 → use `io.quarkus:quarkus-websockets-next`
  (NOT the legacy `quarkus-websockets`). Server endpoint, in-memory
  per-session connection registry via `OpenConnections`, broadcast on
  the task-064 `SessionEventPublisher` hook.

  Browser auth constraint + solution (authenticated-users decision):
    - Browsers cannot set an Authorization header on a WebSocket
      handshake, and the modular auth (dev/entra/keycloak) is
      provider-specific. To stay provider-agnostic, use a short-lived
      one-time ticket:
        * Add `POST /api/sessions/{id}/ws-ticket` to SessionResource
          (authenticated, `@RolesAllowed` ESTIMATOR, must be a joined
          participant) returning `{ticket}` — a random opaque token
          stored in an in-memory `SessionTicketStore` mapping
          ticket → (sessionId, subjectId), TTL ~30s, single use.
        * The client opens `wss://…/ws/sessions/{id}?ticket=…`.
        * `@OnOpen` validates the ticket against the store (matching
          sessionId), resolves the subjectId, confirms the user is a
          participant, then registers the connection. Invalid/expired
          ticket → close with a policy-violation code.
      Document this exchange in CLAUDE.md.

  Message protocol (server → client JSON, push-only):
    {type: "session", session: SessionDto}        on every change
    {type: "error", message: string}              on a handshake/runtime problem
  The client does not send domain messages over the socket (mutations
  go through REST); a periodic ping/keepalive is fine.

  Plumbing the publisher: task-064's `SessionEventPublisher` is a concrete
  bean that fires a CDI `Event<SessionChangedEvent>`. The `SessionBroadcaster`
  therefore does NOT implement an interface — it declares an observer
  `@Observes SessionChangedEvent` (prefer
  `@Observes(during = TransactionPhase.AFTER_SUCCESS)` so the broadcast
  reflects committed state and does not do socket I/O inside the mutating
  transaction), loads the session via `EstimationSessionService.getSession`,
  and sends it to every open connection for that session.

  Vote hiding: task-064 already hides blind-PHASE1 votes UNIFORMLY (an item
  exposes `votes`/`aggregate` only once its status is PHASE2/FINALIZED — no
  one, including the moderator, sees PHASE1 values). So there is NO
  role-scoped DTO to compute here: broadcast the single `getSession(id)`
  DTO to every connection. Do NOT add per-recipient scoping.

  Gateway wiring is handled on the frontend side (task-066) for nginx /
  vite; this task only needs the Quarkus endpoint to answer at
  `/ws/sessions/{id}`.

steps:
  - |
    Add the dependency to
    src/backend/implementation/build.gradle.kts (Gradle project — there is
    NO pom.xml), in the `dependencies { }` block alongside the other
    `implementation("io.quarkus:…")` lines:
      implementation("io.quarkus:quarkus-websockets-next")

  - |
    Add the in-memory ticket store
    src/backend/implementation/src/main/kotlin/io/pythia/service/SessionTicketStore.kt
    (`@ApplicationScoped`; concurrent map; issue(sessionId, subjectId)
    → ticket; consume(ticket, sessionId) → subjectId?; TTL + single
    use). Add `POST /api/sessions/{id}/ws-ticket` to SessionResource
    (task-064's file) returning `{ticket}`; it inherits the class-level
    `@RolesAllowed("ESTIMATOR")`, and the joined-participant check goes in
    the service/store (403/409 for a non-participant). Log at INFO/DEBUG.

  - |
    Add the WebSocket endpoint
    src/backend/implementation/src/main/kotlin/io/pythia/ws/SessionSocket.kt
    annotated `@WebSocket(path = "/ws/sessions/{sessionId}")`, with
    `@OnOpen` (ticket validation + participant check + register),
    `@OnClose` (deregister), using `WebSocketConnection` /
    `OpenConnections`. Read the ticket from the query string (scheme is
    `ws://` in dev). Log INFO on connect/disconnect (session id + subject)
    and WARN/DEBUG on an invalid/expired ticket rejection (close with a
    policy-violation code) — via `io.quarkus.logging.Log` (CLAUDE.md
    backend logging convention).

  - |
    Add
    src/backend/implementation/src/main/kotlin/io/pythia/ws/SessionBroadcaster.kt
    with an observer `@Observes(during = TransactionPhase.AFTER_SUCCESS)
    SessionChangedEvent` (task-064 fires this CDI event; observing
    AFTER_SUCCESS broadcasts committed state without socket I/O inside the
    DB transaction). On each event it loads the DTO via
    `EstimationSessionService.getSession(sessionId)` and sends the SAME
    `{type:"session", session:…}` text message to every open connection for
    that session (no per-recipient scoping — PHASE1 hiding is uniform).
    Log DEBUG on fan-out (session id + connection count).

  - |
    Add a test
    src/backend/implementation/src/test/kotlin/io/pythia/ws/SessionSocketIT.kt
    using Quarkus' websockets-next test client (or a basic client): a
    joined participant obtains a ws-ticket, connects, and receives a
    `session` message after a moderator action (e.g. start or a vote);
    a connection with a bogus ticket is rejected.

  - |
    Update CLAUDE.md: add the `/ws/sessions/{id}` endpoint, the
    ws-ticket handshake, and the push-only protocol to the REST/realtime
    section.

  - |
    Build + test (Docker required for Dev Services PostgreSQL):
      ./gradlew :backend:implementation:test

  - |
    Record the realtime pattern as a `project` memory via the
    auto-memory system: "Session realtime = quarkus-websockets-next,
    push-only; mutations stay on REST; browser WS auth uses a
    short-lived single-use ticket from POST /api/sessions/{id}/ws-ticket
    because browsers can't set an Authorization header on the
    handshake." Doc-only step; skip if an equivalent memory exists.

validation:
  - |
    websockets-next dependency added:
      grep -q "quarkus-websockets-next" src/backend/implementation/build.gradle.kts
  - |
    Socket endpoint, broadcaster, ticket store and IT exist:
      test -f src/backend/implementation/src/main/kotlin/io/pythia/ws/SessionSocket.kt
      test -f src/backend/implementation/src/main/kotlin/io/pythia/ws/SessionBroadcaster.kt
      test -f src/backend/implementation/src/main/kotlin/io/pythia/service/SessionTicketStore.kt
      test -f src/backend/implementation/src/test/kotlin/io/pythia/ws/SessionSocketIT.kt
  - |
    The endpoint path and ticket endpoint are wired:
      grep -q "/ws/sessions" src/backend/implementation/src/main/kotlin/io/pythia/ws/SessionSocket.kt
      grep -q "ws-ticket" src/backend/implementation/src/main/kotlin/io/pythia/rest/SessionResource.kt
  - |
    CLAUDE.md documents the realtime channel:
      grep -q "/ws/sessions" CLAUDE.md
  - |
    The broadcaster observes the task-064 CDI event and logs:
      grep -q "SessionChangedEvent" src/backend/implementation/src/main/kotlin/io/pythia/ws/SessionBroadcaster.kt
      grep -qE "Log\.(info|debug|warn)" src/backend/implementation/src/main/kotlin/io/pythia/ws/SessionSocket.kt
  - |
    Backend builds and the socket IT passes:
      ./gradlew :backend:implementation:test

outputs:
  - modified: src/backend/implementation/build.gradle.kts
  - created: src/backend/implementation/src/main/kotlin/io/pythia/service/SessionTicketStore.kt
  - created: src/backend/implementation/src/main/kotlin/io/pythia/ws/SessionSocket.kt
  - created: src/backend/implementation/src/main/kotlin/io/pythia/ws/SessionBroadcaster.kt
  - created: src/backend/implementation/src/test/kotlin/io/pythia/ws/SessionSocketIT.kt
  - modified: src/backend/implementation/src/main/kotlin/io/pythia/rest/SessionResource.kt
  - modified: CLAUDE.md
