  - |
    sed -n '/private fun seedDataPlatform/,$p' src/backend/implementation/src/main/kotlin/io/pythia/testdata/TestDataSeeder.kt | grep -q "draft.phases.addAll"
  - |
    grep -q "Log\." src/backend/implementation/src/main/kotlin/io/pythia/testdata/TestDataSeeder.kt
