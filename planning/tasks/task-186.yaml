  - |
    grep -q "_assumptions" src/domain/method-bucketsampled/src/main/kotlin/io/pythia/method/bucketsampled/BucketedEstimationItem.kt
  - |
    grep -q 'LeafDiffField.text("assumptions"' src/domain/method-bucketsampled/src/main/kotlin/io/pythia/method/bucketsampled/BucketedEstimationItem.kt
