  - |
    ! grep -q "console\." src/frontend/src/lib/methods/bucketSampled/EditorModule.svelte
  - |
    python3 - <<'PY'
    import json, pathlib, sys
    cats = {p.stem: json.loads(p.read_text())
            for p in pathlib.Path('src/frontend/src/lib/i18n').glob('*.json')}
    def flat(o, p=''):
        s = set()
        for k, v in o.items():
            n = f'{p}.{k}' if p else k
            s |= flat(v, n) if isinstance(v, dict) else {n}
        return s
    keys = {l: flat(d) for l, d in cats.items()}
    ref = set().union(*keys.values())
    bad = {l: sorted(ref - k) for l, k in keys.items() if ref - k}
    need = {'bucket.colPhase', 'bucket.colAssumptions', 'bucket.bucketNone'}
    missing = {l: sorted(need - k) for l, k in keys.items() if need - k}
    print('key parity:', bad or 'ok', '| new keys:', missing or 'ok')
    sys.exit(1 if (bad or missing) else 0)
    PY
  - |
    # No REST change: the node DTO already carried both fields, so `./gradlew build`
    # must regenerate an openapi.json that still contains them and nothing new.
    # (A commit-time `git diff` check would pass or fail on timing, not on content.)
    python3 -c "import json;d=json.load(open('src/frontend/src/lib/api/openapi.json'));s=json.dumps(d);assert 'assumptions' in s and 'phaseAbbreviation' in s"
