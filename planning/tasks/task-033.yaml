  - src/backend/implementation/src/main/kotlin/io/github/theestimator/domain/ProjectPhase.kt
  - src/backend/implementation/src/main/kotlin/io/github/theestimator/domain/AdditionalCost.kt
  - src/backend/implementation/src/main/kotlin/io/github/theestimator/domain/AdditionalCostType.kt
