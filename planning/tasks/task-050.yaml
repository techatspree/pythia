id: task-050
phase: phase-9
title: Draft persistence and REST API rewired onto the tree model
depends_on: [task-049]
description: |
  task-049 introduced EstimationNode/EstimationGroup in the shared domain
  but left the JVM side talking to the old EstimationItemGroup shim. This
  task makes the draft side speak trees end to end: persistence, mapper,
  DTOs, the REST PUT endpoint, and integration tests. The submitted side
  remains on the old shape until task-051.

  Database (Flyway V6, src/backend/implementation/src/main/resources/db/migration/):
    - CREATE TABLE draft_estimation_nodes (
          id UUID PRIMARY KEY,
          logical_id UUID NOT NULL,
          version_id UUID NOT NULL,
          parent_id UUID NULL,
          node_type VARCHAR(31) NOT NULL,   -- GROUP | FIXED | TIME_RELATIVE
          position INT NOT NULL,            -- order among siblings
          title VARCHAR(255) NULL,          -- group label, NULL for leaves
          description VARCHAR(255) NULL,    -- leaf only
          code VARCHAR(255) NULL,
          min_effort DOUBLE PRECISION NULL,
          expected_effort DOUBLE PRECISION NULL,
          max_effort DOUBLE PRECISION NULL,
          assumptions TEXT NULL,
          unit VARCHAR(255) NULL,
          phase_id UUID NULL,
          created_at TIMESTAMP NOT NULL,
          updated_at TIMESTAMP NULL,
          CONSTRAINT fk_draft_nodes_version FOREIGN KEY (version_id)
              REFERENCES draft_estimation_versions(id) ON DELETE CASCADE,
          CONSTRAINT fk_draft_nodes_parent FOREIGN KEY (parent_id)
              REFERENCES draft_estimation_nodes(id) ON DELETE CASCADE,
          CONSTRAINT fk_draft_nodes_phase FOREIGN KEY (phase_id)
              REFERENCES draft_project_phases(id)
      );
      CREATE INDEX idx_draft_nodes_version ON draft_estimation_nodes(version_id);
      CREATE INDEX idx_draft_nodes_parent  ON draft_estimation_nodes(parent_id);
      CREATE INDEX idx_draft_nodes_phase   ON draft_estimation_nodes(phase_id);

    - Data migration in the same V6 file: for every row in
      draft_estimation_item_groups, insert one node_type='GROUP' row with
      parent_id = NULL, position = row_number() over its version
      (ORDER BY id — the V3 groups table has no created_at column, so id
      is the only stable per-version ordering). For every row in
      draft_estimation_items, insert one node_type = item_type row with
      parent_id = the new GROUP id derived from group_id, position =
      row_number() over its group (ORDER BY created_at, id — items DO
      have created_at). For GROUP rows set every leaf-only column to
      NULL; for leaf rows set title NULL. The old groups.phase_id is
      DROPPED in the migration — tree-model groups carry no phase, and
      legacy fixed-side items in those groups already had their own
      item-level phase_id (V5 migration); no propagation is needed.

    - After the data migration, DROP TABLE draft_estimation_items, then
      DROP TABLE draft_estimation_item_groups (order matters for FKs).

  JPA layer (src/backend/implementation/src/main/kotlin/io/pythia/domain/draft/):
    - Delete DraftEstimationItemGroup.kt, DraftEstimationItem.kt,
      DraftFixedEstimationItem.kt, DraftTimeRelativeEstimationItem.kt.
    - Add DraftEstimationNode.kt — single @Entity with SINGLE_TABLE
      @Inheritance and a `node_type` discriminator. Nullable leaf-only
      fields directly on the base. Two @DiscriminatorValue subclasses for
      'FIXED' / 'TIME_RELATIVE' carrying the same shape (unit is only
      meaningful for TIME_RELATIVE), plus a 'GROUP' subclass that carries
      title and a @OneToMany List<DraftEstimationNode> children mapped by
      parent_id with @OrderColumn(name = "position"). Self-referential
      parent_id (nullable, NULL for roots).
    - Update DraftEstimationVersion to expose
        roots: List<DraftEstimationNode>
      via @OneToMany(mappedBy = "version") with @SQLRestriction("parent_id
      IS NULL") and @OrderColumn(name = "position"). Use @SQLRestriction,
      not @Where — @Where is deprecated in Hibernate 6 and Quarkus 3.x
      ships Hibernate 6. Remove itemGroups.

  DTOs (src/backend/implementation/src/main/kotlin/io/pythia/rest/dto/
  EstimationVersionDtos.kt):
    - Replace EstimationItemGroupDto and EstimationItemDto with a single
      recursive EstimationNodeDto:

        data class EstimationNodeDto(
            val logicalId: UUID?,
            val type: String,                 // "GROUP" | "FIXED" | "TIME_RELATIVE"
            val title: String?,               // group only
            val description: String?,         // leaf only
            val code: String?,
            val minEffort: Double?,           // leaf only
            val expectedEffort: Double?,
            val maxEffort: Double?,
            val assumptions: String?,
            val mean: Double,                 // present at every level
            val variance: Double,
            val riskSurcharge: Double,
            val driverSurcharge: Double,
            val offerPT: Double,
            val cost: Double,
            val offerPrice: Double,
            val unit: String?,
            val phaseAbbreviation: String?,
            val children: List<EstimationNodeDto>
        )

    - Replace ItemGroupUpdateDto and EstimationItemUpdateDto with a single
      EstimationNodeUpdateDto that mirrors the structure above but only
      keeps the user-editable fields (logicalId, type, title,
      description, min/expected/max effort, assumptions, unit,
      phaseAbbreviation, children).

    - EstimationVersionDto: replace itemGroups with roots:
      List<EstimationNodeDto>.
    - DraftUpdateDto: replace itemGroups with roots:
      List<EstimationNodeUpdateDto>?.

  Mapper (DraftVersionMapper.kt):
    - Drop the DraftEstimationItemGroup/DraftEstimationItem branches; emit
      EstimationGroup/EstimationItem directly from DraftEstimationNode.
    - The mapping is recursive: a GROUP entity → EstimationGroup whose
      children are recursive maps; a FIXED entity → FixedEstimationItem;
      TIME_RELATIVE → TimeRelativeEstimationItem.

  Resource (EstimationVersionResource.updateDraft):
    - Replace the itemGroups branch with a roots branch that recursively
      materialises the entity tree:
        update.roots?.let { rootDtos ->
            draft.roots.clear()
            rootDtos.forEachIndexed { idx, dto ->
                draft.roots.add(buildNode(dto, parent = null, position = idx,
                                          version = draft, phases = draft.phases))
            }
        }
      where buildNode recursively constructs the entity, sets parent =
      passed-in parent (nullable), and recurses for children. Use a local
      function — do NOT introduce a separate service class.

  EstimationVersionService has THREE call sites that touch itemGroups
  and all three need rewiring in this task:
    - calculateDraft already delegates to EstimationVersion.calculate()
      which is tree-aware after task-049; the only change is that the
      mapper now produces the tree directly.
    - snapshotDraft (the "compare against draft" path, ~lines 128-136
      today) must still produce a SubmittedEstimationVersion; for now
      it flattens the tree into the old SubmittedEstimationItemGroup
      shape (depth ≥ 2 trees temporarily lose their internal structure
      on submit). task-051 removes that flattening when the submitted
      side moves to the tree shape.
    - The deep-copy path that creates a new draft from an existing
      submitted version (~lines 218-224 today, `source.itemGroups
      .forEach { ... target.itemGroups.add(draftGroup) }`) must be
      rewritten to walk the submitted entity's still-flat itemGroups
      and emit a one-level tree of DraftEstimationNode entities into
      `target.roots`. (Submitted is still flat until task-051, so this
      path produces depth-1 trees only; once task-051 lands the same
      path will naturally preserve depth.)

  Tests:
    - Update existing EstimationVersionResourceIT cases that PUT itemGroups
      to PUT roots instead. Add at least one case that posts a 3-level
      tree (Group(Group(Item, Item), Item)) and confirms a GET returns
      the same structure with children intact.
    - Add a DraftVersionMapperTest that builds a 3-level entity tree
      manually and asserts the mapped EstimationVersion.roots has the
      expected nested shape.

  The deprecated EstimationVersion.itemGroups shim added by task-049
  STAYS in place — adapter.ts on the frontend still uses
  `version.itemGroups.asJsReadonlyArrayView()` to compute the local
  calc map, and that rewrite happens in task-054. After this task the
  JVM side should not reference EstimationItemGroup anywhere except in
  the submitted-side files that task-051 will rewrite (and the
  remaining JS-export shim path).

  Files that ALSO need to be rewritten (entity rename DraftEstimationVersion
  .itemGroups → .roots and switch from DraftEstimationItemGroup/
  DraftEstimationItem to DraftEstimationNode entities):
    - src/backend/.../testdata/TestDataSeeder.kt — 3 draft seeds, each
      with 4 groups and several leaves. Convert to building
      DraftEstimationNode trees (depth-1 is fine here; task-055 will
      give it depth ≥ 3).
    - src/backend/.../service/ExcelImporter.kt — the importEstimationItems
      helper currently maintains a `currentGroup: DraftEstimationItemGroup?`
      and appends items. Convert to building DraftEstimationNode roots
      with GROUP+LEAF children (still a flat depth-1 tree on import;
      task-053 will teach the importer about depth).

  Submitted-side files (ExcelExporter, CsvExporter, VersionComparisonService,
  and the SUBMITTED branches of EstimationVersionService) keep using
  SubmittedEstimationVersion.itemGroups in this task. task-051 rewrites
  them. The .itemGroups validation grep is scoped so it does not catch
  these.

steps:
  - |
    Write src/backend/implementation/src/main/resources/db/migration/V6__draft_tree.sql
    with: CREATE TABLE draft_estimation_nodes, indexes, data migration
    from the two old draft tables, and the two DROP TABLE statements.
    Remember: groups have no created_at (ORDER BY id only); items do
    (ORDER BY created_at, id). Old groups.phase_id is dropped, not
    propagated. Test it locally with `mvn -pl src/backend/implementation
    flyway:migrate` against a populated dev database (or trust the
    Testcontainers IT run in the validation step) and verify row counts
    match (groups → GROUP nodes, items → leaf nodes).

  - |
    Delete the four old draft entity files:
      git rm src/backend/implementation/src/main/kotlin/io/pythia/domain/draft/DraftEstimationItemGroup.kt
      git rm src/backend/implementation/src/main/kotlin/io/pythia/domain/draft/DraftEstimationItem.kt
      git rm src/backend/implementation/src/main/kotlin/io/pythia/domain/draft/DraftFixedEstimationItem.kt
      git rm src/backend/implementation/src/main/kotlin/io/pythia/domain/draft/DraftTimeRelativeEstimationItem.kt
    Add DraftEstimationNode.kt + DraftGroupNode/DraftFixedItemNode/
    DraftTimeRelativeItemNode as @DiscriminatorValue subclasses in the
    same file. Update DraftEstimationVersion to replace itemGroups with
    roots (filtered to parent IS NULL, ordered by position).

  - |
    Update EstimationVersionDtos.kt: replace EstimationItemGroupDto,
    EstimationItemDto, ItemGroupUpdateDto, EstimationItemUpdateDto with
    the recursive EstimationNodeDto and EstimationNodeUpdateDto;
    rename EstimationVersionDto.itemGroups → roots and
    DraftUpdateDto.itemGroups → roots.

  - |
    Rewrite DraftVersionMapper.toDomain so it walks the entity tree
    recursively and emits EstimationGroup / FixedEstimationItem /
    TimeRelativeEstimationItem nodes.

  - |
    Rewrite EstimationVersionResource.updateDraft: replace the
    `update.itemGroups?.let { … }` block with the `update.roots?.let { … }`
    block described above. Use a local recursive `buildNode` helper.
    Update toDto / toSummaryDto and EstimationVersionMapper to emit the
    `roots` field with the recursive EstimationNodeDto including the
    calculated per-node values from the calculate() result.

  - |
    Leave the deprecated `itemGroups` shim on EstimationVersion in place
    (task-049 added it; the frontend still depends on it via adapter.ts
    until task-054). Any JVM-side caller of the DRAFT entity's
    .itemGroups must be rewritten to use .roots in this task.

  - |
    Rewrite all three EstimationVersionService.kt call sites:
      a) calculateDraft — only the inner read of `calculated.itemGroups`
         (~line 128) needs updating to walk `calculated.roots.flatMap
         { it.leaves().toList() }`.
      b) snapshotDraft (~lines 128-136) — still produces a
         SubmittedEstimationVersion. Flatten the tree: every leaf
         becomes a SubmittedEstimationItem whose group is the closest
         GROUP ancestor; deeper nesting is dropped. Add a short comment
         marking this as task-050's temporary behaviour.
      c) The deep-copy-from-submitted path (~lines 218-224) — convert
         `source.itemGroups.forEach { ... target.itemGroups.add(...) }`
         to emit a depth-1 tree of DraftEstimationNode entities into
         `target.roots`.

  - |
    Rewrite TestDataSeeder.kt: each of the three draft seeds currently
    builds 4 DraftEstimationItemGroup instances and calls
    `draftN.itemGroups.addAll(...)`. Convert to building
    DraftEstimationNode roots (one per group) with leaf children; keep
    the existing titles and item content unchanged. Depth stays at 1
    in this task — task-055 introduces depth ≥ 3 sample data.

  - |
    Rewrite ExcelImporter.kt importEstimationItems: replace the
    `currentGroup: DraftEstimationItemGroup?` accumulator with a
    `currentGroup: DraftEstimationNode?` (a GROUP-discriminator node)
    and append leaf nodes as children. Set parent linkage and position.
    The import stays depth-1 in this task — task-053 teaches the
    importer about depth.

  - |
    Update existing tests:
      - EstimationVersionResourceIT and any other IT that builds DraftUpdateDto
        — switch itemGroups → roots; convert flat helpers to nested
        helpers.
      - Add a 3-level POST/GET round-trip case.
      - Add DraftVersionMapperTest covering nested mapping.

  - |
    Run the backend tests:
      mvn -pl src/backend/implementation -am test
    All tests, including the IT classes that exercise Flyway via the
    Testcontainers Dev Services, must pass.

  - |
    Run the full Maven build:
      mvn -DskipTests package
    The frontend will still build because adapter.ts and the generated
    TS types do not change shape until task-054 wires the frontend.
    However the openapi schema regeneration (if part of the build) will
    now expose roots/EstimationNodeDto — this is intentional, and
    src/frontend/src/lib/api/schema.d.ts widens accordingly. Any
    consuming code in src/frontend that breaks gets a follow-up TODO
    referencing task-054.

validation:
  - |
    The V6 migration exists and drops both old draft tables:
      test -f src/backend/implementation/src/main/resources/db/migration/V6__draft_tree.sql
      grep -q "DROP TABLE draft_estimation_items"       src/backend/implementation/src/main/resources/db/migration/V6__draft_tree.sql
      grep -q "DROP TABLE draft_estimation_item_groups" src/backend/implementation/src/main/resources/db/migration/V6__draft_tree.sql
  - |
    No reference to the old DRAFT entities remains in backend source
    (portable: explicit class names via -E alternation, follow-on
    char must not be a letter):
      ! grep -rE "DraftEstimationItemGroup|DraftEstimationItem([^A-Za-z]|$)" \
              src/backend/implementation/src/main/kotlin
  - |
    EstimationVersion still carries the deprecated itemGroups shim
    (frontend uses it until task-054):
      grep -q "@Deprecated" src/domain/src/main/kotlin/io/pythia/model/EstimationVersion.kt
  - |
    No DRAFT-side Kotlin file still reads `.itemGroups`. The submitted
    side (ExcelExporter, CsvExporter, VersionComparisonService, and
    submitted branches of EstimationVersionService) is excluded — that
    is task-051's territory. The grep targets the draft files this task
    rewrites:
      ! grep -n "\.itemGroups" \
            src/backend/implementation/src/main/kotlin/io/pythia/rest/EstimationVersionResource.kt \
            src/backend/implementation/src/main/kotlin/io/pythia/rest/dto/EstimationVersionMapper.kt \
            src/backend/implementation/src/main/kotlin/io/pythia/service/DraftVersionMapper.kt \
            src/backend/implementation/src/main/kotlin/io/pythia/service/ExcelImporter.kt \
            src/backend/implementation/src/main/kotlin/io/pythia/testdata/TestDataSeeder.kt
    EstimationVersionService is allowed to read submitted.itemGroups in
    the snapshotDraft + deep-copy paths until task-051 — that file is
    intentionally NOT in the list above. After task-051 the global
    grep below replaces this one.
  - |
    DraftUpdateDto and EstimationVersionDto expose `roots`, not
    `itemGroups`:
      grep -q "val roots: List<EstimationNodeUpdateDto>" \
            src/backend/implementation/src/main/kotlin/io/pythia/rest/dto/EstimationVersionDtos.kt
      grep -q "val roots: List<EstimationNodeDto>" \
            src/backend/implementation/src/main/kotlin/io/pythia/rest/dto/EstimationVersionDtos.kt
  - |
    Backend tests pass:
      mvn -pl src/backend/implementation -am test
  - |
    Full build succeeds:
      mvn -DskipTests package

