      grep -q "bind:this={scrollHost}" src/frontend/src/lib/components/treetable/TreeTable.svelte
  - |
    EstimationGrid marks exactly TWO columns as collapsible (the
    cost + offerPrice keys still appear elsewhere in the file as
    column descriptors, so we don't need a per-key proximity grep
    — the count-of-2 is sufficient to lock the intent). Tolerant
    of `collapsible:true` (no space) just in case prettier or
    the implementer omits it:
      test "$(grep -cE 'collapsible: *true' src/frontend/src/lib/components/EstimationGrid.svelte)" -eq 2
      grep -q "key: 'cost'" src/frontend/src/lib/components/EstimationGrid.svelte
