      grep -q "collapseBreakpointPx" src/frontend/src/lib/components/treetable/types.ts
  - |
    TreeTable wires ResizeObserver + collapse logic + scroll
    wrapper:
      grep -q "ResizeObserver" src/frontend/src/lib/components/treetable/TreeTable.svelte
      grep -q "isCollapsed" src/frontend/src/lib/components/treetable/TreeTable.svelte
