id: task-193
phase: phase-18
title: "Releases: v<semver> tags, versioned builds, release script"
depends_on: [task-198]
description: |
  Pythia has no notion of a release. There are no git tags, the Gradle version
  is a permanent `1.0.0-SNAPSHOT`, and `docs/deployment.md` describes a
  downstream pipeline that builds and deploys on every push to `main`.

  The internal deployment (`<internal-group>/<deploy-project>`, see
  `docs/deployment.md`) is moving to "deploy only what Pythia publishes as a
  release". That needs a definition of "a release" that is owned HERE,
  publicly, because it is a property of the project and not of any one
  installation. This task supplies the definition and the tooling to cut one.
  It pushes nothing itself; task-199 makes a release publish images and a
  deploy bundle.

  ## The convention (decided)

  - A release is an **annotated git tag `v<MAJOR>.<MINOR>.<PATCH>`** (e.g.
    `v1.2.0`; no pre-release or build suffix) pointing at a commit that is
    **on `main`**. A GitHub Release may be attached for notes, but the tag is
    the release; downstream consumers key on the tag only.
  - **The application version IS the release version (decided: "option B",
    the Maven release model).** The version lives in the source as ONE line,
    `version=…` in the root `gradle.properties`:
      * between releases it is `<next>-SNAPSHOT`;
      * a release is a commit that sets it to `X.Y.Z`, with the tag
        `vX.Y.Z` on EXACTLY that commit;
      * the next commit moves `main` to the following SNAPSHOT (default: the
        next patch version, `X.Y.(Z+1)-SNAPSHOT`).
    So a released build identifies itself everywhere the version already
    flows: the backend and frontend image tags, the jar manifest
    (`Implementation-Version`), and the OpenAPI document's `info.version`.
    This does not violate the reproducibility rule in the root CLAUDE.md:
    the version is committed source, not derived from the time, the
    environment, or git metadata at build time. Never derive it from
    `git describe`.
  - **The OpenAPI client changes with every release, deliberately.** The
    committed `src/frontend/src/lib/api/openapi.json` carries `info.version`
    = the application version, so the release commit regenerates it with
    `X.Y.Z`, and the drift gate guarantees the committed client matches that
    exact backend. Keep `quarkus.smallrye-openapi.info-version` tied to the
    application version; do NOT decouple it.
  - **The first release is `v1.0.0`.** The current `1.0.0-SNAPSHOT` becomes
    `1.0.0`, and `main` continues as `1.0.1-SNAPSHOT`. This task prepares it
    and documents the command. It does NOT cut it: creating the tag and
    pushing to `main` are the maintainer's action (see the last step).
  - **Tags are immutable.** A wrongly tagged commit gets the next patch
    version; a tag is never moved or deleted. A moved tag would mean an
    image named after it points at two different builds.
  - **The tag must pass the same CI gate as `main`, plus release checks.**
    `ci.yaml` gains a `push: tags: ['v*']` trigger, and a `release-tag` job
    that fails unless ALL of these hold:
      * the tag name is strict `v<int>.<int>.<int>`;
      * the tagged commit is an ancestor of `origin/main`;
      * the tagged commit's `gradle.properties` says `version=<tag without v>`,
        so a tag can never sit on a SNAPSHOT or mismatched commit.
    The `images` job also runs for such a tag. It still pushes nothing.

  ## Downstream mirrors must sync `v*` tags

  A mirror of this repository only sees a release if it receives the tag. So
  a mirror must sync `refs/tags/v*`, **without force and without pruning**:
  without force so a moved tag is rejected loudly, and without pruning so
  tags the mirror writes itself survive. A mirror that syncs only `main`
  never sees a release. State this requirement in `docs/deployment.md`,
  generically (no internal names).

  ## Releasing: `scripts/release.sh`

  Because tags are immutable, a mistaken push burns a version number
  forever. The script catches mistakes BEFORE the push; CI's `release-tag`
  job stays the authority afterwards.

      ./scripts/release.sh <X.Y.Z> [--next <A.B.C-SNAPSHOT>] [--skip-tests] [--dry-run] [--yes]

  It refuses to run, with a message naming the problem, unless:
  - `<X.Y.Z>` is strict `MAJOR.MINOR.PATCH`, and `--next` (if given) is
    strict `MAJOR.MINOR.PATCH-SNAPSHOT` and greater than `X.Y.Z`;
  - the working tree is clean and the current branch is `main`, equal to
    `origin/main` after `git fetch origin --tags`;
  - the current version in `gradle.properties` is a `-SNAPSHOT`, and
    `X.Y.Z` is not lower than its base (from `1.0.0-SNAPSHOT` you can
    release `1.0.0` or higher, never `0.9.0`);
  - `vX.Y.Z` exists neither locally nor on `origin`, and `X.Y.Z` is greater
    than the newest existing `v*` tag (releases are monotonic).

  Then it:
  1. sets `version=X.Y.Z`, runs `./gradlew build` (tests included unless
     `--skip-tests`; this also regenerates `openapi.json` / `schema.d.ts`),
     and commits `gradle.properties` plus the regenerated client as
     "Release X.Y.Z";
  2. creates `git tag -a vX.Y.Z -m "Pythia X.Y.Z"` on that commit;
  3. sets the next SNAPSHOT (`--next` or `X.Y.(Z+1)-SNAPSHOT`), regenerates
     the OpenAPI client (`./gradlew build -x test`), and commits "Start
     <next>";
  4. shows a summary (both commits, the tag, `git log` since the previous
     release) and asks for confirmation (`--yes` skips the prompt);
  5. pushes atomically: `git push --atomic origin main refs/tags/vX.Y.Z`, so
     `main` and the tag land together or not at all. It never force-pushes.

  `--dry-run` runs every check and prints the plan, but changes nothing. If
  anything fails before the push, the script tells the maintainer how to
  discard the local commits and tag (`git reset --hard origin/main`,
  `git tag -d vX.Y.Z`); nothing has been published at that point. The same
  applies when the ATOMIC PUSH is rejected, e.g. because someone pushed to
  `main` between the script's fetch and its push. `--atomic` then refuses
  BOTH refs, so nothing was published. The script says exactly that, prints
  the two discard commands, and suggests simply rerunning it. History
  has no merge commits, because `main` takes direct pushes. If `main` ever
  requires pull requests, the script must open one instead; note that in the
  script's header comment.

  ## The hard-coded `1.0.0-SNAPSHOT`: decouple, don't chase

  Under this model the version changes with every release, so nothing may
  hard-code it except the one `version=` line. Today the literal appears in
  these places, each with a decided treatment:

  | Where | Treatment |
  |---|---|
  | `build.gradle.kts` (`version = "1.0.0-SNAPSHOT"` in `allprojects`) | replaced by reading the root `gradle.properties` `version`, the single source |
  | `.github/workflows/ci.yaml`, `images` job (5×: two inspects, the registry manifest URL, the timestamp check, the Trivy `image-ref`) | the job reads `V` from `gradle.properties` once (`grep '^version=' gradle.properties \| cut -d= -f2`) and uses `$V`; the Trivy step gets it via a step output or `env` |
  | `k8s/base/{backend,frontend}/deployment.yaml` | the base drops the tag (`image: pythia/pythia-backend`); EVERY overlay sets `newTag` (staging/production already do with `${IMAGE_TAG}`; minikube gains `newTag: ${MINIKUBE_IMAGE_TAG}`) |
  | `scripts/minikube-env.sh` (`MINIKUBE_IMAGE_TAG:=1.0.0-SNAPSHOT`) and its header note tying it to the Gradle version | a fixed LOCAL tag, `local`, deliberately decoupled from the version. The deploy already passes it explicitly to both image builds; add `${MINIKUBE_IMAGE_TAG}` to the deploy's `envsubst` allow-list, as was done for `${MINIKUBE_IMAGE_REGISTRY}`. Update the header note: the tag no longer mirrors the Gradle version |
  | `k8s/overlays/minikube/kustomization.yaml` comment ("fixed 1.0.0-SNAPSHOT") | reworded to the fixed `MINIKUBE_IMAGE_TAG` |
  | `k8s/overlays/production/kustomization.yaml` and `docs/deployment.md` ("never the floating 1.0.0-SNAPSHOT") | reworded: "never a SNAPSHOT tag" |
  | `src/frontend/src/lib/api/openapi.json` | changes in each release commit, by design (see above) |
  | `src/backend/implementation/README.md` | untouched: an outdated Quarkus scaffold line about a Maven `target/` path, unrelated |

  ## Consequence for task-199

  task-199 (publishing images and a deploy bundle per release) was written
  assuming "task-193 keeps `1.0.0-SNAPSHOT`" and lists deriving the Gradle
  version from the tag as out of scope. After this task that assumption is
  false: a release build already carries version `X.Y.Z`, so its image tags
  default to the release version. task-199 must be updated, and reviewed
  with /improve-task, before it is implemented. This task does not edit it.

  ## What does NOT go here

  Any hostname, registry, group or project name of the internal deployment.
  Refer to it only as `<internal-group>/<deploy-project>`, as
  `docs/deployment.md` already does. The internal project's name must not
  appear anywhere in this repository.

steps:
  - |
    Read the root `build.gradle.kts` and `gradle.properties`,
    `.github/workflows/ci.yaml` (triggers, the `images` job, every job's
    `if:`), `k8s/base/{backend,frontend}/deployment.yaml`, the three
    overlays, `scripts/minikube-env.sh`, `scripts/minikube-deploy.sh` (its
    `envsubst` allow-list), and `docs/deployment.md`.
  - |
    Single version source: add `version=1.0.0-SNAPSHOT` to the root
    `gradle.properties`, with a comment: the ONE place the application version
    lives, changed only by `scripts/release.sh`, and `-SNAPSHOT` between
    releases. In `build.gradle.kts`'s `allprojects`, replace the literal with
    the property (e.g. `version = providers.gradleProperty("version").get()`).
    Verify every project resolves it:
      ./gradlew -q properties | grep '^version:'
      ./gradlew -q :backend:implementation:properties | grep '^version:'
      ./gradlew -q :frontend:properties | grep '^version:'
  - |
    Decouple the hard-coded literal exactly as the table in the description
    says: the CI `images` job reads `V` from `gradle.properties`; the base
    manifests drop the tag; the minikube overlay sets
    `newTag: ${MINIKUBE_IMAGE_TAG}`; `MINIKUBE_IMAGE_TAG` defaults to
    `local`; `minikube-deploy.sh` adds `${MINIKUBE_IMAGE_TAG}` to its
    `envsubst` allow-list (passed explicitly; the settings file does not
    export); reword the comments listed in the table.
  - |
    `.github/workflows/ci.yaml`: extend `on.push` with `tags: ['v*']` next to
    `branches: [main]`. Extend the `images` job's `if:` with
    `|| startsWith(github.ref, 'refs/tags/v')`. Keep `pull_request` (never
    `pull_request_target`) and `permissions: contents: read` unchanged.
    Add the `release-tag` job, `if: startsWith(github.ref, 'refs/tags/v')`,
    `actions/checkout@v7` with `fetch-depth: 0`, failing with a message
    naming the problem unless:
      [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      test "$(grep '^version=' gradle.properties | cut -d= -f2)" = "${GITHUB_REF_NAME#v}"
    Comment WHY: releases are published from this tag (task-199) and
    downstream deploys key on it, so a tag that is not on `main`, or whose
    commit carries a different version, would ship something that never
    passed review as that release.
  - |
    Create `scripts/release.sh` (executable) as specified in "Releasing:
    scripts/release.sh": the refusal checks, the two commits, the annotated
    tag, the summary and confirmation, the atomic push, `--next`,
    `--skip-tests`, `--dry-run`, `--yes`, and a `--help` that prints the
    usage. Follow the style of the existing scripts (a header comment
    explaining the model, `set -euo pipefail`, refuse to be sourced like
    `minikube-deploy.sh`). Compare versions numerically per component, not
    as strings (`1.10.0` > `1.9.0`), e.g. with `sort -V`. `bash -n` and
    `shellcheck` it.
  - |
    Test the script WITHOUT touching the real repository or GitHub. A plain
    `git clone` would NOT do: it contains only committed state, and at this
    point `scripts/release.sh` and every other change of this task are
    uncommitted. So build the test fixture from a COPY of the working tree,
    and commit inside the copy's OWN `.git`. Every commit, tag and push below
    happens only in scratch repositories, never in this repository:
      W=<scratch>/work; B=<scratch>/origin.git; C=<scratch>/clone
      rsync -a --exclude '.gradle/' --exclude 'build/' --exclude 'node_modules/' \
        --exclude '.svelte-kit/' --exclude 'src/frontend/node/' --exclude 'test-results/' ./ "$W/"
      (cd "$W" && git checkout -q -B main && git add -A && git commit -qm "fixture: working tree")
      git clone -q --bare "$W" "$B" && git clone -q "$B" "$C" && cd "$C"
    Then, in "$C":
      * `./scripts/release.sh 1.0.0 --dry-run` exits 0 and changes nothing
        (`git status` clean, no new tag, `HEAD` unchanged);
      * the refusals each exit non-zero: `1.0` (not semver), `0.9.0` (below
        the SNAPSHOT base), a dirty tree, and a branch other than `main`;
      * `./scripts/release.sh 1.0.0 --skip-tests --yes` succeeds, and in
        "$B" (the "origin"):
          - `v1.0.0` is an ANNOTATED tag (`git cat-file -t v1.0.0` = `tag`);
          - `git show v1.0.0:gradle.properties` has `version=1.0.0`;
          - `git show v1.0.0:src/frontend/src/lib/api/openapi.json` has
            `"version" : "1.0.0"`;
          - `main` has `version=1.0.1-SNAPSHOT`, and its parent is the
            tagged commit;
      * a second `./scripts/release.sh 1.0.0 …` is refused (tag exists), and
        `./scripts/release.sh 0.9.9 …` is refused (not monotonic).
    Also verify the rejected-push path: in a second clone of "$B", push one
    extra commit to `main` while the release is between its fetch and its
    push (or simply: make "$B"'s `main` move ahead before running the release
    from a clone that is not up to date). The script must refuse up front
    (`main` differs from `origin/main`), or, if the race happens at push
    time, report the atomic rejection with the discard commands. "$B" must
    hold no new tag afterwards.
    Delete the scratch repositories afterwards. Never run the script against
    the real `origin`.
  - |
    `docs/deployment.md`: add a `## Releasing` section covering the
    convention, the version model (`version=` in `gradle.properties`,
    SNAPSHOT between releases, the OpenAPI client stamped per release), the
    `scripts/release.sh` usage and what it checks, the immutability rule and
    what to do instead of moving a tag, the mirror requirement (sync
    `refs/tags/v*`, no force, no prune), and that a tag-protection ruleset
    for `v*` should be set on the GitHub repository (Settings → Rules →
    Rulesets: restrict deletions and updates). State that the first release
    is `v1.0.0`, cut with `./scripts/release.sh 1.0.0`.
    Do NOT rewrite the downstream flow in `docs/deployment.md` (overview,
    "GitLab setup", "Pipeline stages", variables table, runner requirements,
    rollback). task-199 replaces all of it; editing it here would be thrown
    away.
  - |
    Root `CLAUDE.md`, paragraph "Deployment (task-028) is NOT in this
    repository": add that downstream deploys only `v<semver>` release tags,
    that the application version lives in the root `gradle.properties` and
    is changed only by `scripts/release.sh`, and that `docs/deployment.md` →
    "Releasing" defines them. In "Build & run", add the
    `./scripts/release.sh <X.Y.Z>` entry point.
  - |
    Re-read every changed line for an internal hostname, registry, group,
    project or organisation name. Only `<internal-group>/<deploy-project>`
    may stand for the downstream pipeline.
  - |
    ./gradlew build
  - |
    Report to the maintainer, and do NOT do it yourself: the first release
    is cut with `./scripts/release.sh 1.0.0` once this task is committed and
    the internal mirror syncs `v*` tags. Creating the tag and pushing to
    `main` is the maintainer's decision, not part of this task.

validation:
  - |
    grep -qx 'version=1.0.0-SNAPSHOT' gradle.properties
    ! grep -q 'version = "1.0.0-SNAPSHOT"' build.gradle.kts
    test "$(./gradlew -q :backend:implementation:properties | grep '^version:' | awk '{print $2}')" = 1.0.0-SNAPSHOT
    test "$(./gradlew -q :frontend:properties | grep '^version:' | awk '{print $2}')" = 1.0.0-SNAPSHOT
  - |
    # The literal survives only where the table allows it. Scan what git counts
    # as the repository (tracked + new untracked, minus ignored), so stale local
    # build output such as an old Maven target/ cannot trigger it.
    ! git ls-files -co --exclude-standard -- . ':!planning' ':!*package-lock.json' \
        ':!gradle.properties' ':!*openapi.json' ':!*README.md' | xargs grep -lF "1.0.0-SNAPSHOT" 2>/dev/null
  - |
    grep -q "tags: \['v\*'\]" .github/workflows/ci.yaml
    grep -q "release-tag:" .github/workflows/ci.yaml
    grep -q "merge-base --is-ancestor" .github/workflows/ci.yaml
    grep -q 'GITHUB_REF_NAME#v' .github/workflows/ci.yaml
    grep -q "startsWith(github.ref, 'refs/tags/v')" .github/workflows/ci.yaml
    grep -q "fetch-depth: 0" .github/workflows/ci.yaml
    ! grep -q "pull_request_target" .github/workflows/ci.yaml
    ruby -ryaml -e 'YAML.load_file(".github/workflows/ci.yaml")'
  - |
    # Every overlay renders a tagged image (the base no longer carries one).
    for o in staging production; do
      kubectl kustomize k8s/overlays/$o | grep -E 'image: .*pythia-(backend|frontend)' | grep -q ':\${IMAGE_TAG}' || exit 1
    done
    kubectl kustomize k8s/overlays/minikube | grep -E 'image: .*pythia-(backend|frontend)' | grep -q ':\${MINIKUBE_IMAGE_TAG}'
    grep -q 'MINIKUBE_IMAGE_TAG:=local' scripts/minikube-env.sh
    grep -q 'MINIKUBE_IMAGE_TAG' scripts/minikube-deploy.sh
  - |
    S=scripts/release.sh
    test -x "$S"
    bash -n "$S" && { ! command -v shellcheck >/dev/null || shellcheck "$S"; }
    "$S" --help | grep -q -- '--dry-run'
    grep -q 'push --atomic' "$S"
    ! grep -qE 'push .*(--force|-f\b)' "$S"
  - |
    grep -q "^## Releasing" docs/deployment.md
    grep -q "release.sh" docs/deployment.md
    grep -q "refs/tags/v" docs/deployment.md
    grep -q "v1.0.0" docs/deployment.md
    grep -q "Releasing" CLAUDE.md
    grep -q "release.sh" CLAUDE.md
    grep -q "<internal-group>/<deploy-project>" docs/deployment.md
  - |
    # No release was cut by this task.
    test -z "$(git tag -l 'v*')"
  - |
    ./gradlew build

outputs:
  - modified: gradle.properties                 # version= (single source)
  - modified: build.gradle.kts
  - modified: .github/workflows/ci.yaml         # tag trigger, release-tag job, images job reads the version
  - modified: k8s/base/backend/deployment.yaml
  - modified: k8s/base/frontend/deployment.yaml
  - modified: k8s/overlays/minikube/kustomization.yaml
  - modified: k8s/overlays/production/kustomization.yaml
  - modified: scripts/minikube-env.sh
  - modified: scripts/minikube-deploy.sh        # envsubst allow-list
  - created: scripts/release.sh
  - modified: docs/deployment.md
  - modified: CLAUDE.md
