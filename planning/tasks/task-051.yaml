id: task-051
phase: phase-9
title: Submitted persistence rewired onto the tree model
depends_on: [task-050]
description: |
  After task-050, drafts live as nested trees end-to-end but the
  submitted side is still flat (submitted_estimation_item_groups +
  submitted_estimation_items, and the temporary tree-flattening shim
  inside EstimationVersionService.snapshotDraft). This task moves the
  submitted side to the same tree shape and removes the shim.

  Database (Flyway V7,
  src/backend/implementation/src/main/resources/db/migration/V7__submitted_tree.sql):
    - CREATE TABLE submitted_estimation_nodes:
        id UUID PK,
        logical_id UUID NOT NULL,
        version_id UUID NOT NULL,
        parent_id UUID NULL,
        node_type VARCHAR(31) NOT NULL,   -- GROUP | FIXED | TIME_RELATIVE
        position INT NOT NULL,
        title VARCHAR(255) NULL,
        description VARCHAR(255) NULL,
        code VARCHAR(255) NULL,
        min_effort DOUBLE PRECISION NULL,
        expected_effort DOUBLE PRECISION NULL,
        max_effort DOUBLE PRECISION NULL,
        assumptions TEXT NULL,
        unit VARCHAR(255) NULL,
        phase_abbreviation VARCHAR(255) NULL,
        -- accumulated/calculated values: NOT NULL on every row, group
        -- rows store the sum over their subtree.
        mean DOUBLE PRECISION NOT NULL,
        variance DOUBLE PRECISION NOT NULL,
        risk_surcharge DOUBLE PRECISION NOT NULL,
        driver_surcharge DOUBLE PRECISION NOT NULL,
        offer_pt DOUBLE PRECISION NOT NULL,
        cost DOUBLE PRECISION NOT NULL,
        offer_price DOUBLE PRECISION NOT NULL,
        FK version_id → submitted_estimation_versions(id),
        FK parent_id → submitted_estimation_nodes(id),
        plus the three indexes (version, parent, ... — no phase FK; phase
        is dereferenced into phase_abbreviation as today)

    - Data migration: every submitted_estimation_item_groups row becomes a
      GROUP node (parent_id=NULL, position = row_number() OVER (PARTITION
      BY version_id ORDER BY id) - 1). Every submitted_estimation_items
      row becomes a FIXED or TIME_RELATIVE node under that GROUP, position
      = row_number() OVER (PARTITION BY group_id ORDER BY id) - 1. Both
      old submitted tables (per V3) have NO created_at column — only
      `id` is a stable per-parent ordering. For the GROUP rows the
      accumulated columns (mean/variance/risk_surcharge/driver_surcharge/
      offer_pt/cost/offer_price) are computed by summing the leaf values
      within the same group (SQL: SUM over the items in that group).
      For LEAF rows, copy mean/variance/risk_surcharge/driver_surcharge/
      offer_pt/cost/offer_price straight from the old item row.

    - DROP TABLE submitted_estimation_items;
      DROP TABLE submitted_estimation_item_groups;

  JPA layer:
    - Delete SubmittedEstimationItemGroup.kt, SubmittedEstimationItem.kt,
      SubmittedFixedEstimationItem.kt, SubmittedTimeRelativeEstimationItem.kt.
    - Add SubmittedEstimationNode.kt — single @Entity with SINGLE_TABLE
      @Inheritance and `node_type` discriminator, same shape as
      DraftEstimationNode but with the calculated columns as NOT NULL
      fields. Three @DiscriminatorValue subclasses (GROUP / FIXED /
      TIME_RELATIVE).
    - Update SubmittedEstimationVersion to expose
        roots: List<SubmittedEstimationNode>
      via @OneToMany(mappedBy = "version") with @SQLRestriction("parent_id
      IS NULL") and @OrderColumn(name = "position"). Use @SQLRestriction,
      not @Where (deprecated in Hibernate 6 — DraftEstimationVersion uses
      the same form after task-050). Remove itemGroups.

  Submit / snapshot path
  (EstimationVersionService.submitDraft and .snapshotDraft):
    - Both currently call EstimationVersion.calculate() then materialise a
      SubmittedEstimationVersion. Change the materialisation to walk the
      domain tree recursively: every EstimationGroup becomes a
      SubmittedEstimationNode with node_type=GROUP and its accumulated
      mean/variance/offerPT/cost/offerPrice copied from the domain group
      (which already accumulates per task-049); every leaf becomes a
      FIXED or TIME_RELATIVE node with the per-leaf calculated values.
    - Drop the temporary flattening comment added in task-050. After
      this task, snapshotDraft preserves arbitrary depth.

  DTOs and mapping for the GET endpoints:
    - SubmittedEstimationVersion.toDto() already produced
      EstimationVersionDto.roots: List<EstimationNodeDto> after task-050,
      driven off the (then-flat) itemGroups. Rewrite it to walk
      `version.roots` recursively, emitting EstimationNodeDto with the
      stored accumulated values (no recomputation — submitted values are
      immutable snapshots).
    - Existing fields on EstimationNodeDto (mean/variance/risk/...) are
      already in the right shape from task-050; this task just makes
      sure the submitted side fills them at every level, not only at
      leaves.

  EstimationVersionResource and any other JVM caller of SubmittedEstimation
  types must be updated for the new field shapes — there should be no
  remaining reference to SubmittedEstimationItem(Group) after this task
  except inside V7 migration SQL.

  Three other files currently read SubmittedEstimationVersion.itemGroups
  and/or reference the deleted SubmittedEstimationItem(Group) types. They
  must be compile-fixed in THIS task even though their richer rewrites
  belong to later tasks:
    - src/backend/.../service/VersionComparisonService.kt — imports
      SubmittedEstimationItem, walks `versionA.itemGroups.flatMap { group ->
      group.items.map { … } }`. The tree-aware diff is task-052. Here:
      swap the type to SubmittedEstimationNode, walk `version.roots`
      recursively, flatten leaves the same way the current code does
      (via a local `fun SubmittedEstimationNode.leaves(): List<…>`
      helper that mirrors EstimationNode.leaves on the domain side).
      Produce the same ComparisonItemDto shape. Group-level comparisons
      (addedGroups/removedGroups) keep working off the top-level GROUP
      roots. Add a one-line "task-051 compile shim — task-052 rewrites"
      comment.
    - src/backend/.../service/ExcelExporter.kt — reads
      `version.itemGroups.filter { … }` four times. Task-053 owns the
      outline-level / nested-tree export. Here: walk `version.roots`
      with a `collectGroupsAndLeaves(roots): Pair<List<GroupNode>,
      List<LeafNode>>` helper that returns top-level GROUPs and their
      direct leaves so the existing depth-1 spreadsheet layout keeps
      working. Deeper nesting collapses to a flat per-group leaf list
      for now (matches the current visible behaviour).
    - src/backend/.../service/CsvExporter.kt — same pattern, smaller
      file: `version.itemGroups.forEach { g -> … }` becomes a walk of
      `version.roots` that emits one group header per top-level GROUP
      and its flattened leaves underneath.

  These three compile-fixes are the minimum to keep `mvn package` green
  after the entity rename; the richer behaviour change is each owner
  task's responsibility.

  Tests:
    - Update EstimationVersionResourceIT cases that submit a draft and
      then GET the submitted version to assert the nested `roots`
      structure, including a 3-level case.
    - Add a SubmissionTreeIT that submits a Group(Group(Item, Item), Item)
      draft and asserts:
        - the persisted submitted_estimation_nodes table contains the
          expected parent/child wiring
        - GET /api/estimations/{id}/versions/{n} returns the tree
        - the GROUP rows carry the correct accumulated values
          (sum of subtree)

steps:
  - |
    Write src/backend/implementation/src/main/resources/db/migration/V7__submitted_tree.sql:
    CREATE TABLE submitted_estimation_nodes, indexes, data migration
    from the two old submitted tables. Remember: both old tables lack
    created_at — ORDER BY id only when computing position. For GROUP
    rows compute the accumulated columns via SUM(...) over the same
    group's items; for LEAF rows copy the per-item calculated columns
    straight from the old item row. Finish with DROP TABLE
    submitted_estimation_items then DROP TABLE submitted_estimation_item_groups.

  - |
    Delete the four old submitted entity files and add
    SubmittedEstimationNode.kt with @Inheritance(SINGLE_TABLE) and
    three @DiscriminatorValue subclasses. Update
    SubmittedEstimationVersion to expose `roots` (with @SQLRestriction,
    not @Where) and drop itemGroups.

  - |
    Rewrite the submit / snapshot path in EstimationVersionService so it
    walks the calculated EstimationVersion.roots recursively, creating
    SubmittedEstimationNode entities (parent linkage + position) at every
    depth. Drop the temporary depth-flattening behaviour added in
    task-050 (the `// task-050 temporary: …` comment block).

  - |
    Update SubmittedEstimationVersion.toDto / EstimationVersionMapper so
    it walks `version.roots` recursively and emits the nested
    EstimationNodeDto with the stored values. The existing
    SubmittedEstimationItemGroup.toRootDto and SubmittedEstimationItem
    .toLeafDto extensions (added in task-050) are replaced by a single
    recursive SubmittedEstimationNode.toDto.

  - |
    Compile-fix the three submitted-side consumers so `mvn package`
    stays green. The richer rewrites belong to later tasks (task-052
    for comparison, task-053 for export):
      a) VersionComparisonService.kt — replace SubmittedEstimationItem
         with SubmittedEstimationNode, walk `version.roots` recursively
         via a local `leaves()` helper, produce the same ComparisonItemDto
         output. Top-level GROUP roots feed the addedGroups/removedGroups
         logic.
      b) ExcelExporter.kt — replace the four `version.itemGroups.filter`
         calls with a single walk that collects top-level GROUPs and
         their direct (flattened) leaves; keep the depth-1 spreadsheet
         layout unchanged.
      c) CsvExporter.kt — same: walk `version.roots`, emit one group
         header per top-level GROUP and its flattened leaves.

  - |
    Update / add backend tests:
      - EstimationVersionResourceIT: convert any submitted-version cases
        that still read itemGroups; add a 3-level submit + read case
        that confirms depth ≥ 2 survives a submit and round-trips via
        GET /api/estimations/{id}/versions/{n}.
      - SubmissionTreeIT (new): inject EntityManager and run a native
        query `SELECT id, parent_id, node_type, position FROM
        submitted_estimation_nodes WHERE version_id = ?` after
        submitting a Group(Group(Item, Item), Item) draft. Assert:
        the row count (1 root group + 1 nested group + 2 leaves + 1
        leaf), the parent/child wiring (positions, parent_ids), and
        that the GROUP rows' offer_pt equals the SUM of their
        subtree's leaf offer_pt values.

  - |
    Update CLAUDE.md: the "**Submitted** side: still flat … as of the
    current state — task-051 moves it to the same tree shape" sentence
    in the "Persistence shape" section is no longer accurate. Rewrite
    it to say submitted_estimation_nodes mirrors the draft side; the
    immutable-snapshot property and the SINGLE_TABLE + @SQLRestriction
    pattern still apply.

  - |
    Run the backend tests:
      mvn -pl src/backend/implementation -am test

  - |
    Run the full Maven build:
      mvn -DskipTests package

validation:
  - |
    The V7 migration exists and drops both old submitted tables:
      test -f src/backend/implementation/src/main/resources/db/migration/V7__submitted_tree.sql
      grep -q "DROP TABLE submitted_estimation_items"        src/backend/implementation/src/main/resources/db/migration/V7__submitted_tree.sql
      grep -q "DROP TABLE submitted_estimation_item_groups"  src/backend/implementation/src/main/resources/db/migration/V7__submitted_tree.sql
  - |
    No reference to the old submitted entities remains in backend
    source (portable: explicit class names via -E alternation, follow-on
    char must not be a letter):
      ! grep -rE "SubmittedEstimationItemGroup|SubmittedEstimationItem([^A-Za-z]|$)" \
              src/backend/implementation/src/main/kotlin
  - |
    SubmittedEstimationVersion exposes roots, not itemGroups:
      grep -q "var roots: MutableList<SubmittedEstimationNode>" \
            src/backend/implementation/src/main/kotlin/io/pythia/domain/submitted/SubmittedEstimationVersion.kt
      ! grep -q "itemGroups" \
            src/backend/implementation/src/main/kotlin/io/pythia/domain/submitted/SubmittedEstimationVersion.kt
  - |
    No Kotlin file under src/backend reads `.itemGroups` anywhere — both
    sides are now tree-shaped. (Replaces task-050's per-file scoping.):
      ! grep -rn "\.itemGroups" src/backend/implementation/src/main/kotlin
  - |
    CLAUDE.md no longer claims the submitted side is flat:
      ! grep -q "still flat" CLAUDE.md
  - |
    Backend tests pass:
      mvn -pl src/backend/implementation -am test
  - |
    Full build succeeds:
      mvn -DskipTests package

