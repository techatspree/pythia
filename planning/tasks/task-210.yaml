id: task-210
phase: phase-18
title: "\"Open-Source-Lizenzen\" dialog, generated from the SBOM"
depends_on: [task-208]
description: |
  Pythia ships about 286 third-party components (measured 2026-10-15 in
  `build/sbom/pythia.cdx.json`: the backend's jars plus the npm and
  Kotlin/JS libraries in the SPA). Nearly all of their licenses (MIT, BSD,
  Apache-2.0 …) require the copyright notice to accompany the software.
  task-208 meets that for the IMAGES with a generated
  `THIRD-PARTY-LICENSES.txt`. But a person USING Pythia never sees an image;
  they see the web application, which today says nothing about the software
  it is built from. This task adds an in-app, human-readable list of every
  shipped open-source component with its license(s) and its copyright
  holders, generated from the SBOM at build time so it cannot drift from
  what ships.

  ## Name

  The dialog is called **"Open-Source-Lizenzen"** (en: "Open-source
  licenses"), not "regulatory information". The content is license
  attribution, and this is the name users recognise from other software.
  "Regulatory information" usually means legal notices such as an imprint,
  privacy policy or certification marks, which this dialog is not.

  ## The SBOM must carry the copyright holders first

  The user's requirement is "collected from the SBOM". Today the SBOM cannot
  answer "who holds the copyright". Of 286 library components, 286 have
  `licenses`, but only 10 have `author`, 19 `publisher`, and none
  `copyright`. The holders are written in the components' own
  `LICENSE`/`NOTICE`/`COPYRIGHT` files, which task-208 already reads to
  build `THIRD-PARTY-LICENSES.txt`. So the pipeline is two steps, each with
  one job:

    1. **Enrich the SBOM.** `scripts/sbom-finalize.mjs` fills CycloneDX
       1.6's `component.copyright` (a string) for every library component
       from its package files. It joins the copyright lines with `\n`. A
       copyright line is a line of the component's NOTICE*, LICENSE*,
       LICENCE* or COPYRIGHT* file that starts (after trimming) with
       `Copyright`, `(c)` or `©`, case-insensitive. Lines are trimmed,
       deduplicated, kept in file order (NOTICE before LICENSE), and capped
       at 20 per component. A line that is only the license template
       placeholder (`Copyright [yyyy] [name of copyright owner]`,
       `Copyright {yyyy} {name of copyright owner}`) is dropped. Package files
       are found exactly as task-208's generator finds them: npm under
       `src/frontend/node_modules/<group/name>/`, backend jars in
       `build/quarkus-app/lib/**` (`META-INF/`). That lookup is moved into a
       shared module, `scripts/lib/package-license-files.mjs`, which both
       scripts import, so there is one implementation. The Kotlin/JS klibs
       have no package files in reach. They and any component without a
       match simply get no `copyright`. The release's SBOM thereby gains the
       holders too, which is a bonus.
    2. **Project it for the UI.** A new `scripts/generate-oss-notices.mjs`
       reads ONLY the finalized SBOM and writes `third-party-notices.json`.
       It does not read package files: the dialog shows what the SBOM says,
       nothing more.

  ## `third-party-notices.json`, the interface between build and UI

      {
        "parts": [
          { "part": "frontend",
            "components": [
              { "name": "@azure/msal-browser",
                "licenses": ["MIT"],
                "copyright": ["Copyright (c) Microsoft Corporation."],
                "authors": ["Microsoft"],
                "homepage": "https://github.com/AzureAD/microsoft-authentication-library-for-js#readme" } ] },
          { "part": "backend", "components": [ … ] } ]
      }

  - `parts` always has exactly these two entries, frontend first. They are
    the SBOM's `pythia-frontend` and `pythia-backend` children, walked to any
    depth.
  - `name`: npm `@group/name` (or `name` without a group), Maven
    `group:name`, i.e. what a person would search for.
  - `licenses`: each entry's `license.id`, else `license.name`, else the
    `expression`. Deduplicated, never empty (a component without one fails
    the generator; task-207's check makes that impossible anyway).
  - `copyright`: `component.copyright` split on `\n`, or `[]`.
  - `authors`: SBOM `author`, `authors[].name`, `publisher`,
    `supplier.name`, deduplicated, or `[]`.
  - `homepage`: the `externalReferences` entry of type `website`, else
    `vcs` (with a `git+` prefix stripped), only if it is `https://…`, else
    `null`.
  - Components sorted by `name` (then by licenses, for stable output). A
    name that occurs twice with different versions is listed ONCE, with the
    union of licenses/copyright/authors.
  - **No versions, purls or hashes.** The file is served publicly by nginx
    (it must work before any API call), and the project deliberately does
    not publish the deployed dependency versions over HTTP (see
    `docs/development.md` → "The SBOM", "Never in the image"). Leaving out
    the server's versions in particular avoids handing out a fingerprint of
    the backend. Attribution needs the name, the license and the holders,
    not the version. The release's SBOM and the images' license files keep
    the exact versions.
  - **First-party components are excluded** (`pkg:maven/io.pythia/`, the
    `firstParty` prefix of `compliance/oss-policy.json`, plus the three
    application components). Pythia's own license is stated in the
    dialog's intro.
  - Deterministic: no timestamp, sorted keys order as above, a trailing
    newline. Same SBOM, same bytes.

  It is generated after `npmBuild`, at the same point in the build as
  task-208's `THIRD-PARTY-LICENSES.txt`, and written to TWO places:
    - `build/oss-notices/third-party-notices.json` (the ROOT build
      directory), the persistent copy. task-208's
      `THIRD-PARTY-LICENSES.txt` is copied next to it, to
      `build/oss-notices/THIRD-PARTY-LICENSES.txt`. Every frontend build
      empties `src/frontend/build/` (adapter-static), so a copy that has to
      outlive later builds cannot live there.
    - `src/frontend/build/third-party-notices.json`, so `:frontend:imageBuild`
      packages it and nginx serves it at `/third-party-notices.json`.
  It is generated, not committed.

  ## Dev mode: the copy from the last full build is shown

  Vite's dev server serves `static/`, not `build/`, and generating the file
  needs the full SBOM, which needs the backend packaged, far too much for
  `npm run dev`. But a developer has usually run `./gradlew build` before.
  So a small **dev-only Vite plugin** (`apply: 'serve'`, in
  `vite.config.ts`) serves `GET /third-party-notices.json` and
  `GET /THIRD-PARTY-LICENSES.txt` from `build/oss-notices/` at the
  repository root when the file is there. When it is not, the plugin
  answers `404` itself rather than handing on to SvelteKit's fallback, so
  the dialog sees a clean 404. It reads the file per request, so a build
  that runs while `dev.sh` is up is picked up without a restart. At server
  start it logs one line through Vite's own logger
  (`server.config.logger.info`), naming the file and its modification time,
  or saying none exists yet.

  The dialog therefore behaves identically in dev and in production: it
  fetches `/third-party-notices.json`, and the dev copy may be older than the
  working tree's dependencies. That is acceptable for a developer, and
  `docs/oss-compliance.md` says so. Only when no full build has ever run
  (or after `./gradlew clean`) does it get a 404, which it treats as an
  expected, explained state ("not available yet"), not as an error.

  The Playwright suite runs against the dev stack, where the file may or may
  not exist, so every e2e test stubs it with `page.route`. A stub takes
  precedence over the dev plugin.

  ## The dialog

  - **Entry point:** a link-style button "Lizenzen" in the `UserMenu`,
    between the language select and "Abmelden". It is visible to every
    signed-in user regardless of role. (Anyone not signed in can still read
    task-208's public `/THIRD-PARTY-LICENSES.txt`.)
  - **Content:** an intro stating Pythia's own license and copyright, a
    filter field, then two sections (web interface, server), each a
    vertically scrolling list of the components, and a link to the full
    license texts (`/THIRD-PARTY-LICENSES.txt`, task-208, opened in a new
    tab).
  - **Filter:** client-side, case-insensitive substring over name, licenses,
    copyright lines and authors. The section headings show the filtered
    count. When nothing matches, one "no match" line replaces both lists.
  - **Fetching:** `apiFetch('/third-party-notices.json')` (raw `fetch` is
    banned). The Authorization header it adds is harmless on a static file.
    It is fetched once per page load and cached in the component's module
    scope, so reopening the dialog does not refetch. 404 → the
    "unavailable" state, with no banner and no full-text link. Any other
    non-OK status, a network error or invalid JSON → `ErrorBanner` with
    `ossNotices.loadFailed` + `log.error`.
  - Mirrors `ChangeOwnerDialog.svelte`'s modal structure (`role="dialog"`,
    `aria-modal`, Escape closes, `$bindable open`), but is wider
    (`max-w-3xl`) and caps its height (`max-h-[85vh]`) with the list
    scrolling inside. Buttons come from `$lib/ui/Button.svelte`, the filter
    from `$lib/ui/Field.svelte`, and license chips from `$lib/ui/Badge.svelte`.
    Only `ink-*`/`surface-*`/`hairline` tokens, no raw palette classes.
  - Copyright lines are legal text and are shown verbatim and untranslated.
    The product name comes only from `$_('brand.name')` (root CLAUDE.md: never
    hardcode "Pythia"). The intro is about the SOFTWARE's license, so it uses
    `brand.name`, not the installation's `system.displayName`.

  ## Wireframes

  ### App header: signed in (any role)

      +--------------------------------------------------------------------------------------+
      | (o) Pythia   Projekte  Sitzungen  …        Anna Admin [ADMIN]  [ Deutsch v ]  Lizenzen  Abmelden |
      +--------------------------------------------------------------------------------------+

    - New: "Lizenzen" (`menu.user.ossNotices`), `data-testid="user-menu.oss-notices"`,
      a `<button type="button">` styled exactly like the existing logout
      button (link look, `text-brand-green`). Visible to VIEWER, ESTIMATOR and
      ADMIN alike. Opens the dialog below.
    - The existing `language-select` and `logout-button` are unchanged.

