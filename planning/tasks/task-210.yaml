      | | @azure/msal-browser                                       [MIT] | |
      | |   Copyright (c) Microsoft Corporation.                          | |
      | |   Projektseite ↗                                                | |
      | | svelte                                                    [MIT] | |
      | |   Copyright (c) 2016-2025 Svelte Contributors                   | |
      | |   Projektseite ↗                                                | |
