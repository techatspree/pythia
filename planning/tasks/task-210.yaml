  ## Deviations found during implementation

  - **The copyright-line rule.** The rule above ("a line that starts with
    `Copyright`, `(c)` or `©`, case-insensitive") put three lines of
    Apache-2.0's own licence text into 113 components' `copyright`
    ("copyright license to reproduce, prepare Derivative Works of,",
    "copyright notice that is included in or attached to the work",
    "(c) You must retain, in the Source form of any Derivative Works"), plus
    the GPL template's `Copyright (C) <year> <name of author>`. Implemented
    instead: a copyright line starts with a CAPITALISED `Copyright` or
    `COPYRIGHT` not followed by licence-prose words (notice, license/licence,
    holder(s), owner(s), and, statement(s), law(s), protection), or with
    `(c)`/`©` followed by a year. Placeholders are any line containing
    `[yyyy]`, `{yyyy}` or `<year>`. Measured afterwards: 59 of 278 third-party
    components have a holder line (42 of 257 backend, 17 of 21 frontend), not
    the ~137 estimated from task-208's files, which counted the prose lines.
    The SBOM validation's threshold is therefore `-ge 50` (was `-gt 100`), and
    a check that no prose line got in was added. The four jars task-208 lists
    without a holder still have none.
  - **The dev plugin's middleware lives in `src/frontend/scripts/oss-notices-dev.mjs`**,
    imported by the `pythia-oss-notices-dev` plugin entry in `vite.config.ts`.
    `vite.config.ts` is type-checked by svelte-check, and the frontend has no
    Node typings (`@types/node`), so `node:fs` and the request's `url`/`method`
    fail there. A plain JS module (`checkJs` is off; ESLint gives
    `scripts/**/*.mjs` Node globals) avoids adding a dependency for one
    middleware. The plugin's `name`, `apply: 'serve'` and the
    `build/oss-notices/` URL stay in `vite.config.ts`.
  - **The zip writer of task-208's test** moved to `scripts/lib/test-zip.mjs`,
    because `sbom-finalize.test.mjs` needs the same jar/klib fixtures; both
    tests import it.
  - **`combineThirdPartyLicenses` is its own `NodeTask`** that
    `generateOssNotices` depends on (the step allowed a sibling task), with
    `testOssNotices` and `testCombineThirdPartyLicenses` both in `check`.
    `:frontend:build` depends on it through `assemble`.
  - **The load-failed banner** shows `ossNotices.loadFailed` alone: `assertOk`
    returns the caller's fallback unchanged for a 500 without a JSON body, so
    the wireframe's "(HTTP 500)" suffix does not appear.
  - **The e2e filter cases.** "filtering by `microsoft` matches by copyright
    line" did not test that: `@azure/msal-browser`'s AUTHOR is also
    "Microsoft", so the spec stayed green with copyright removed from the
    filter (mutation run). The spec filters `CONTRIBUTORS` instead (only in
    svelte's copyright line; upper case also proves case-insensitivity) and
    `hibernate.org` (only in an author). Removing copyright from the filter, or
    making it case-sensitive, now fails the spec.
  - **An extra testid** `oss-notices-dialog.section.<part>` wraps each section,
    so the page object counts a part's rows without relying on DOM order.

  ## Change after implementation: the entry point moved to a footer

  The first implementation put a "Lizenzen" link into the `UserMenu`, next
  to "Abmelden". Reviewed in the running app, that was too prominent for
  legal information. It moved to a new app footer (`AppFooter.svelte`), the
  place where further legal information (imprint, privacy notice) will go.
  The key `menu.user.ossNotices` ("Lizenzen") became `footer.ossNotices`
  ("Open-Source-Lizenzen" / "Open-source licenses"), the testid
  `user-menu.oss-notices` became `app-footer.oss-notices`, and the page
  object method moved from `UserMenu` to a new `AppFooter` page object. The
  description, wireframe, steps, validation and outputs above already show
  the footer version; `UserMenu.svelte` and `e2e/pages/UserMenu.ts` are back
  to their state before this task.

