      | |   Autoren: JetBrains                                            | |
      | | …                                                               | |
      | +-----------------------------------------------------------------+ |
      | Server – 257 Komponenten                                            |
      | +-----------------------------------------------------------------+ |
      | | com.fasterxml.jackson.core:jackson-databind        [Apache-2.0] | |
      | |   Urheber: siehe Lizenztext                                     | |
