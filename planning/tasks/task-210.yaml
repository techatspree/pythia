  | `ossNotices.copyrightUnknown` | Urheber: siehe Lizenztext | Copyright holders: see the license text |
  | `ossNotices.homepage` | Projektseite | Project page |
  | `ossNotices.fullText` | Vollständige Lizenztexte | Full license texts |
