validation:
  - |
    test -f scripts/lib/package-license-files.mjs
    grep -q "package-license-files" scripts/generate-third-party-licenses.mjs
    grep -q "package-license-files" scripts/sbom-finalize.mjs
    # the klibs and node_modules reach the enrichment
    grep -q -- "--klib-list" src/frontend/build.gradle.kts
    grep -q -- "--node-modules" scripts/sbom-finalize.mjs
    awk '/val finalizeSbom/,/^}/' src/frontend/build.gradle.kts | grep -q "writeJsRuntimeJarList"
    # the generateOssNotices wiring names the task-208 tasks that exist
    # (through the sibling task combineThirdPartyLicenses, see the deviations)
    awk '/val generateOssNotices/,/^}/' src/frontend/build.gradle.kts | grep -q "combineThirdPartyLicenses"
    awk '/val combineThirdPartyLicenses/,/^}/' src/frontend/build.gradle.kts | grep -q "generateThirdPartyLicenses, \"generateBackendThirdPartyLicenses\""
    ! grep -q "backend:implementation:generateThirdPartyLicenses" src/frontend/build.gradle.kts
  - |
    node --test scripts/sbom-finalize.test.mjs
    node --test scripts/generate-oss-notices.test.mjs
    node --test scripts/generate-third-party-licenses.test.mjs
  - |
    ./gradlew sbom
    # the SBOM now carries copyright holders (59 measured at implementation)
    test "$(jq '[.. | objects | select(.type? == "library" and .copyright?)] | length' build/sbom/pythia.cdx.json)" -ge 50
    # ... and no line of licence prose (the first rule's defect)
    ! jq -r '.. | objects | .copyright? // empty' build/sbom/pythia.cdx.json | grep -qiE '^(copyright (license|notice)|\(c\) You must)'
  - |
    ./gradlew :frontend:build -x test
    F=src/frontend/build/third-party-notices.json
    test -s "$F"
    jq -e '.parts | length == 2 and .[0].part == "frontend" and .[1].part == "backend"' "$F"
    jq -e '[.parts[].components[] | select(.licenses | length == 0)] | length == 0' "$F"
    jq -e '[.parts[].components[].name] | index("@azure/msal-browser") != null' "$F"
    ! grep -q '"version"' "$F"
    ! grep -q 'pkg:' "$F"
    ! grep -q 'io.pythia' "$F"
  - |
    # deterministic, and the persistent root copy matches the SPA copy
    s1=$(shasum < src/frontend/build/third-party-notices.json)
    ./gradlew :frontend:generateOssNotices --rerun -q
    test "$s1" = "$(shasum < src/frontend/build/third-party-notices.json)"
    test "$s1" = "$(shasum < build/oss-notices/third-party-notices.json)"
    test -s build/oss-notices/THIRD-PARTY-LICENSES.txt
  - |
    # the web copy covers BOTH parts, each verbatim from task-208's generated file
    W=build/oss-notices/THIRD-PARTY-LICENSES.txt
    cmp "$W" src/frontend/build/THIRD-PARTY-LICENSES.txt
    grep -q '^Web interface (pythia-frontend)$' "$W"
    grep -q '^Server (pythia-backend)$' "$W"
    grep -q 'svelte' "$W" && grep -q 'jackson-databind' "$W"
    # each part's WHOLE file is contained byte for byte (grep -F with a
    # multi-line pattern would accept any single matching line)
    node -e '
      const fs = require("fs");
      const w = fs.readFileSync(process.argv[1], "utf8");
      for (const p of ["pythia-frontend", "pythia-backend"]) {
        const t = fs.readFileSync(`build/third-party-licenses/${p}/THIRD-PARTY-LICENSES.txt`, "utf8");
        if (!w.includes(t)) { console.error(`${p} not verbatim`); process.exit(1); }
      }' "$W"
    node --test scripts/combine-third-party-licenses.test.mjs
  - |
    # the persistent copy survives a later frontend-only build
    ./gradlew :frontend:npmBuild --rerun -q
    test -s build/oss-notices/third-party-notices.json
  - |
    # dev-only plugin serving the persistent copy
    grep -q "pythia-oss-notices-dev" src/frontend/vite.config.ts
    grep -q "apply: 'serve'" src/frontend/vite.config.ts
    grep -q "build/oss-notices" src/frontend/vite.config.ts
    grep -q "Cache-Control" src/frontend/scripts/oss-notices-dev.mjs
  - |
    C=src/frontend/src/lib/components/OssNoticesDialog.svelte
    test -f "$C"
    grep -q 'data-testid="oss-notices-dialog"' "$C"
    grep -q 'data-testid="oss-notices-dialog.filter"' "$C"
    grep -q 'oss-notices-dialog.unavailable' "$C"
    grep -q 'oss-notices-dialog.no-match' "$C"
    grep -q 'ErrorBanner' "$C"
    grep -q "log\." "$C" src/frontend/src/lib/ossNotices.ts
    ! grep -q "console\." "$C" src/frontend/src/lib/ossNotices.ts
    grep -q "apiFetch('/third-party-notices.json')" src/frontend/src/lib/ossNotices.ts
    ! grep -qE "(^|[^A-Za-z])fetch\(" src/frontend/src/lib/ossNotices.ts
    grep -q 'data-testid="app-footer.oss-notices"' src/frontend/src/lib/components/AppFooter.svelte
    grep -q '<AppFooter' src/frontend/src/routes/+layout.svelte
    # not in the header any more
    ! grep -q 'oss-notices\|OssNotices' src/frontend/src/lib/components/UserMenu.svelte src/frontend/src/lib/components/AppHeader.svelte
  - |
    for k in footer.ossNotices ossNotices.title ossNotices.intro ossNotices.filterLabel ossNotices.filterPlaceholder ossNotices.part.frontend ossNotices.part.backend ossNotices.authors ossNotices.copyrightUnknown ossNotices.homepage ossNotices.fullText ossNotices.noMatch ossNotices.unavailable ossNotices.loadFailed ossNotices.close; do
      for f in src/frontend/src/lib/i18n/de.json src/frontend/src/lib/i18n/en.json; do
        jq -e --arg k "$k" 'getpath($k | split(".")) | type == "string"' "$f" > /dev/null || { echo "missing $k in $f"; exit 1; }
      done
    done
  - |
    # every catalog key for key (catches a key added to one catalog only)
    python3 - <<'PY'
    import json, pathlib, sys
    cats = {p.stem: json.loads(p.read_text())
            for p in pathlib.Path('src/frontend/src/lib/i18n').glob('*.json')}
    def flat(o, p=''):
        s = set()
        for k, v in o.items():
            n = f'{p}.{k}' if p else k
            s |= flat(v, n) if isinstance(v, dict) else {n}
        return s
    keys = {l: flat(d) for l, d in cats.items()}
    ref = set().union(*keys.values())
    bad = {l: sorted(ref - k) for l, k in keys.items() if ref - k}
    print('missing keys:', bad or 'none')
    sys.exit(1 if bad else 0)
    PY
  - |
    test -f src/frontend/e2e/pages/OssNoticesDialog.ts
    grep -q "OssNoticesDialog" src/frontend/e2e/pages/index.ts
    grep -q "openOssNotices" src/frontend/e2e/pages/AppFooter.ts
    grep -q "AppFooter" src/frontend/e2e/pages/index.ts
    grep -q "from './pages'" src/frontend/e2e/oss-notices.test.ts
  - |
    grep -q "^## In the application" docs/oss-compliance.md
    grep -q "third-party-notices.json" CLAUDE.md
  - |
    ./gradlew :frontend:check
  - |
    ./gradlew build

