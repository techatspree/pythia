  | `ossNotices.close` | Schließen | Close |

  No backend, domain or REST change.

steps:
  - |
    Move the package-file lookup that task-208 wrote in
    `scripts/generate-third-party-licenses.mjs` (find a component's
    LICENSE*/LICENCE*/NOTICE*/COPYRIGHT* files: npm under
    `node_modules/<group/name>/`, Maven inside its jar's `META-INF/`) into
    `scripts/lib/package-license-files.mjs`, exporting it. Make
    `generate-third-party-licenses.mjs` import it, with unchanged behaviour:
    `node --test scripts/generate-third-party-licenses.test.mjs` stays green
    and its output is byte-identical before and after (compare a
    `shasum` of `src/frontend/build/THIRD-PARTY-LICENSES.txt`).
  - |
    In `scripts/sbom-finalize.mjs`, after the trimmed tree is assembled,
    set `copyright` on every `library` component from its package files per
    the description's rule (prefixes, placeholder drop, dedupe, file order
    NOTICE→LICENSE→LICENCE→COPYRIGHT, cap 20, joined with `\n`). Omit the
    key when nothing is found; never write an empty string. It needs to know
    where `node_modules` and `build/quarkus-app/lib` are. Pass them as
    arguments from `:frontend:finalizeSbom` in `src/frontend/build.gradle.kts`
    and declare them as task inputs. Extend
    `scripts/sbom-finalize.test.mjs` and `scripts/fixtures/sbom/` with: an
    npm package whose LICENSE has a copyright line, a jar whose
    `META-INF/NOTICE` has two (plus a duplicate), a LICENSE with only the
    Apache template placeholder (→ no `copyright`), and a component with no
    files (→ no `copyright`). Print the coverage
    ("copyright found for N of M library components") in `scripts/check-sbom.sh`
    as information, not as a gate.
  - |
    Write `scripts/generate-oss-notices.mjs` (Node, no dependencies, the
    style of `sbom-finalize.mjs`):
      node scripts/generate-oss-notices.mjs --sbom <pythia.cdx.json> --out <file>
    producing `third-party-notices.json` exactly as the description
    specifies (two parts, name forms, licenses, copyright, authors, homepage,
    merge of same-name components, first-party exclusion, no
    versions/purls/hashes, sorted, deterministic). Exit 1 with a clear
    message on a component without a license or a missing part. Log what it
    wrote ("N frontend + M backend components") to stdout.
  - |
    Unit-test it in `scripts/generate-oss-notices.test.mjs` (`node --test`)
    on a fixture SBOM in `scripts/fixtures/oss-notices/`: nested components,
    an npm component with group, a Maven one, a first-party `io.pythia` one
    (excluded), a component listed twice with two versions (merged), a
    `vcs` homepage with `git+` (stripped), an `http://` homepage (→ null),
    license by `id`, by `name` and by `expression`, a component without a
    license (→ exit 1), and determinism (two runs, same bytes). Assert that
    the output contains no `"version"` and no `pkg:` string.
  - |
    In `src/frontend/build.gradle.kts`: a `NodeTask` `generateOssNotices`
    after `finalizeSbom` and after task-208's THIRD-PARTY-LICENSES generator,
    writing `build/oss-notices/third-party-notices.json` (ROOT build dir,
    declared as the task's output). It then copies that file to
    `src/frontend/build/third-party-notices.json` and task-208's
    `src/frontend/build/THIRD-PARTY-LICENSES.txt` to
    `build/oss-notices/THIRD-PARTY-LICENSES.txt` (a `doLast` copy, or a
    separate `Copy`/`Sync` task it finalizes). Wire it with
    `:frontend:imageBuild` and `:frontend:build` depending on it; and a
    `testOssNotices` `NodeTask` running the test file, added to `check`'s
    `dependsOn` next to `testSbomFinalize`. In `imageBuild`'s `doLast`, add
    a `check` that `build/third-party-notices.json` exists (an image without
    it would show "unavailable" in production).
  - |
    Dev-mode serving in `src/frontend/vite.config.ts`: add a plugin object
    `{ name: 'pythia-oss-notices-dev', apply: 'serve', configureServer(server) { … } }`
    to `plugins`, with a comment pointing at task-210. Its middleware
    handles only `GET`/`HEAD` of exactly `/third-party-notices.json` and
    `/THIRD-PARTY-LICENSES.txt`. It resolves the file under
    `<repo root>/build/oss-notices/` (from the config file's location via
    `fileURLToPath(new URL('../../build/oss-notices/', import.meta.url))`,
    never from `process.cwd()`), reads it on each request, and answers `200`
    with `application/json; charset=utf-8` or `text/plain; charset=utf-8`
    and `Cache-Control: no-store`, or `404` with an empty body when the
    file is missing. Every other path goes to `next()`. On startup, log
    once through `server.config.logger.info` whether a copy exists and its
    mtime. Do not touch the production `sbom` plugin entry or the `/api` and
    `/ws` proxies. Verify by hand: with `build/oss-notices/` present,
    `curl -s localhost:5173/third-party-notices.json | jq '.parts|length'`
    prints `2`. After moving it aside, `curl -o /dev/null -w '%{http_code}'`
    gives `404`.
  - |
    Frontend types and filtering in `src/frontend/src/lib/ossNotices.ts`:
    `OssNoticeComponent`, `OssNotices` (matching the JSON),
    `filterComponents(components, query): OssNoticeComponent[]` per the
    description, and `loadOssNotices(): Promise<OssNotices | 'unavailable'>`
    using `apiFetch('/third-party-notices.json')`: 404 → `'unavailable'`,
    other non-OK → `assertOk(res, $_('ossNotices.loadFailed'))` (pass the
    message in from the component), and a module-level cache of the success.
    `log.info` with both counts on success, `log.info` on unavailable.
  - |
    Create `src/frontend/src/lib/components/OssNoticesDialog.svelte` as
    wireframed (all four states), `open = $bindable(false)`, mirroring
    `ChangeOwnerDialog.svelte`'s structure. Load on open; on failure
    `log.error('OssNoticesDialog: loading failed', e)` and the ErrorBanner.
    No bare `console.*`, no inline strings, no `.toFixed`/`toLocale*`.
    Counts go through `$lib/format.ts`.
  - |
    In `src/frontend/src/lib/components/UserMenu.svelte`, add the
    "Lizenzen" button (`data-testid="user-menu.oss-notices"`) between the
    language select and the logout button, as wireframed, and render
    `<OssNoticesDialog bind:open={ossNoticesOpen} />`.
  - |
    Add every i18n key from the table to `src/frontend/src/lib/i18n/de.json`
    and `en.json`, key for key, with the exact texts.
  - |
    Page Object `src/frontend/e2e/pages/OssNoticesDialog.ts` (exported
    from `e2e/pages/index.ts`): `open()` (clicks `user-menu.oss-notices`),
    `expectVisible()`, `expectHidden()`, `filter(text)`,
    `expectComponent(name)` / `expectNoComponent(name)` (by `data-name`),
    `expectPartCount('frontend'|'backend', n)` (asserting the heading text
    via `catalogPattern('ossNotices.part.frontend', …)` or equivalent),
    `expectNoMatch()`, `expectUnavailable()`, `expectLoadFailed()`, `close()`,
    `closeWithEscape()`. Also `stubNotices(page, json)` and
    `stubNoticesStatus(page, status)` helpers using
    `page.route('**/third-party-notices.json', …)`.
  - |
    Spec `src/frontend/e2e/oss-notices.test.ts` (Page Objects only, no
    translated literals). With a stubbed fixture of 3 frontend + 2 backend
    components (e.g. `@azure/msal-browser` MIT, `svelte` MIT,
    `kotlin-stdlib-js` Apache-2.0 with authors only,
    `com.fasterxml.jackson.core:jackson-databind` with nothing,
    `org.postgresql:postgresql` BSD-2-Clause):
      - a VIEWER opens it from the user menu; both part counts are right;
        a component with copyright shows it, one with authors only shows
        the authors line, one with neither shows the "see the license text"
        line;
      - filtering by `postgres` leaves exactly one backend component and
        hides the frontend section; filtering by `bsd-2` matches by license;
        filtering by `microsoft` matches by copyright line; filtering by
        `zzz` shows no-match;
      - Escape and the close button both close it;
      - stubbed 404 → unavailable state, no banner, no full-text link;
      - stubbed 500 → load-failed banner.
    Run it in both languages: `E2E_LANG=en` and `E2E_LANG=de`.
  - |
    Docs: `docs/oss-compliance.md` (task-207/208) gains a section
    "## In the application" covering what the dialog shows, the SBOM
    `copyright` enrichment and its rule, `third-party-notices.json` and why it
    has no versions, the persistent copy in `build/oss-notices/` and the
    dev-mode plugin that serves it (possibly older than the working tree;
    run `./gradlew build` to refresh it), and the "unavailable" state when
    no full build exists.
    `docs/development.md` → "The SBOM": one paragraph on the new `copyright`
    field. Root `CLAUDE.md`: one sentence next to task-208's
    THIRD-PARTY-LICENSES sentence saying that the frontend image also serves
    a generated `third-party-notices.json` (no versions, by design) shown by
    the "Open-Source-Lizenzen" dialog.
  - |
    Run, in order: `./gradlew sbom`, `./gradlew :frontend:check`, the
    Playwright spec against `./scripts/dev.sh` (both languages), then
      ./gradlew build

validation:
  - |
    test -f scripts/lib/package-license-files.mjs
    grep -q "package-license-files" scripts/generate-third-party-licenses.mjs
    grep -q "package-license-files" scripts/sbom-finalize.mjs
  - |
    node --test scripts/sbom-finalize.test.mjs
    node --test scripts/generate-oss-notices.test.mjs
    node --test scripts/generate-third-party-licenses.test.mjs
  - |
    ./gradlew sbom
    # the SBOM now carries copyright holders for a substantial part
    test "$(jq '[.. | objects | select(.type? == "library" and .copyright?)] | length' build/sbom/pythia.cdx.json)" -gt 100
  - |
    ./gradlew :frontend:build -x test
    F=src/frontend/build/third-party-notices.json
    test -s "$F"
    jq -e '.parts | length == 2 and .[0].part == "frontend" and .[1].part == "backend"' "$F"
    jq -e '[.parts[].components[] | select(.licenses | length == 0)] | length == 0' "$F"
    jq -e '[.parts[].components[].name] | index("@azure/msal-browser") != null' "$F"
    ! grep -q '"version"' "$F"
    ! grep -q 'pkg:' "$F"
    ! grep -q 'io.pythia' "$F"
  - |
    # deterministic, and the persistent root copy matches the SPA copy
    s1=$(shasum < src/frontend/build/third-party-notices.json)
    ./gradlew :frontend:generateOssNotices --rerun -q
    test "$s1" = "$(shasum < src/frontend/build/third-party-notices.json)"
    test "$s1" = "$(shasum < build/oss-notices/third-party-notices.json)"
    test -s build/oss-notices/THIRD-PARTY-LICENSES.txt
  - |
    # the persistent copy survives a later frontend-only build
    ./gradlew :frontend:npmBuild --rerun -q
    test -s build/oss-notices/third-party-notices.json
  - |
    # dev-only plugin serving the persistent copy
    grep -q "pythia-oss-notices-dev" src/frontend/vite.config.ts
    grep -q "apply: 'serve'" src/frontend/vite.config.ts
    grep -q "build/oss-notices" src/frontend/vite.config.ts
  - |
    C=src/frontend/src/lib/components/OssNoticesDialog.svelte
    test -f "$C"
    grep -q 'data-testid="oss-notices-dialog"' "$C"
    grep -q 'data-testid="oss-notices-dialog.filter"' "$C"
    grep -q 'oss-notices-dialog.unavailable' "$C"
    grep -q 'oss-notices-dialog.no-match' "$C"
    grep -q 'ErrorBanner' "$C"
    grep -q "log\." "$C" src/frontend/src/lib/ossNotices.ts
    ! grep -q "console\." "$C" src/frontend/src/lib/ossNotices.ts
    grep -q "apiFetch('/third-party-notices.json')" src/frontend/src/lib/ossNotices.ts
    ! grep -qE "(^|[^A-Za-z])fetch\(" src/frontend/src/lib/ossNotices.ts
    grep -q 'data-testid="user-menu.oss-notices"' src/frontend/src/lib/components/UserMenu.svelte
  - |
    for k in menu.user.ossNotices ossNotices.title ossNotices.intro ossNotices.filterLabel ossNotices.filterPlaceholder ossNotices.part.frontend ossNotices.part.backend ossNotices.authors ossNotices.copyrightUnknown ossNotices.homepage ossNotices.fullText ossNotices.noMatch ossNotices.unavailable ossNotices.loadFailed ossNotices.close; do
      for f in src/frontend/src/lib/i18n/de.json src/frontend/src/lib/i18n/en.json; do
        jq -e --arg k "$k" 'getpath($k | split(".")) | type == "string"' "$f" > /dev/null || { echo "missing $k in $f"; exit 1; }
      done
    done
  - |
    test -f src/frontend/e2e/pages/OssNoticesDialog.ts
    grep -q "OssNoticesDialog" src/frontend/e2e/pages/index.ts
    grep -q "from './pages'" src/frontend/e2e/oss-notices.test.ts
  - |
    grep -q "^## In the application" docs/oss-compliance.md
    grep -q "third-party-notices.json" CLAUDE.md
  - |
    ./gradlew :frontend:check
  - |
    ./gradlew build

