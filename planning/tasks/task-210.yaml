    `scripts/lib/package-license-files.mjs`, exporting it. Make
    `generate-third-party-licenses.mjs` import it, with unchanged behaviour:
    `node --test scripts/generate-third-party-licenses.test.mjs` stays green
    and its output is byte-identical before and after. BEFORE touching the
    script, regenerate the baseline (the files on disk may be stale, e.g.
    from an older `@sveltejs/kit`):
    `./gradlew :frontend:generateThirdPartyLicenses :frontend:generateBackendThirdPartyLicenses`,
