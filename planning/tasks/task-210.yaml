    - `ossNotices.noMatch` with `{filter}`,
      `data-testid="oss-notices-dialog.no-match"`. Both section headings are
      hidden.

  ### Open-Source-Lizenzen dialog: unavailable (dev mode, no full build yet → 404)

      +---------------------------------------------------------------------+
      | Open-Source-Lizenzen                                                |
      | Pythia ist Open-Source-Software … (intro unchanged)                 |
      |                                                                     |
      | Die Komponentenliste wird beim Bauen der Anwendung erzeugt und ist  |
      | in dieser Umgebung noch nicht vorhanden.                            |
      |                                                                     |
      |                                                    [ Schließen ]    |
      +---------------------------------------------------------------------+

    - `ossNotices.unavailable`, `data-testid="oss-notices-dialog.unavailable"`,
      `text-ink-muted`. No filter, no sections, no full-text link (that file
      is generated in the same build and is equally absent). Logged
      `log.info`, not an error.
    - In dev mode with a previous full build, the dialog shows the
      **loaded** state above, with the content of
      `build/oss-notices/third-party-notices.json`. It looks no different, so
      there is no extra wireframe.
    - Production never reaches this state: `:frontend:imageBuild` refuses an
      SPA without the file.

  ### Open-Source-Lizenzen dialog: load failed

      +---------------------------------------------------------------------+
      | Open-Source-Lizenzen                                                |
      | +-----------------------------------------------------------------+ |
      | | ! Die Komponentenliste konnte nicht geladen werden. (HTTP 500) [x]| |
      | +-----------------------------------------------------------------+ |
      | Pythia ist Open-Source-Software … (intro unchanged)                 |
      |                                                    [ Schließen ]    |
      +---------------------------------------------------------------------+

    - The existing `ErrorBanner` with `ossNotices.loadFailed` (via
      `assertOk`, which appends the status). For a JSON parse error, the
      parse message instead. No filter, no sections, no full-text link.

  ### i18n keys (both catalogs, key for key)

  | key | de | en |
  |---|---|---|
  | `menu.user.ossNotices` | Lizenzen | Licenses |
  | `ossNotices.title` | Open-Source-Lizenzen | Open-source licenses |
  | `ossNotices.intro` | {name} ist Open-Source-Software unter der Apache-Lizenz 2.0 – Copyright 2026 {name} Contributors. Es enthält die folgenden Open-Source-Komponenten. | {name} is open-source software under the Apache License 2.0 – Copyright 2026 {name} Contributors. It includes the following open-source components. |
  | `ossNotices.filterLabel` | Filtern | Filter |
  | `ossNotices.filterPlaceholder` | Name, Lizenz oder Urheber | Name, license or copyright holder |
  | `ossNotices.part.frontend` | Weboberfläche (läuft in Ihrem Browser) – {count} Komponenten | Web interface (runs in your browser) – {count} components |
  | `ossNotices.part.backend` | Server – {count} Komponenten | Server – {count} components |
