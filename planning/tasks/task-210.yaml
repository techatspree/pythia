      | Vollständige Lizenztexte ↗                         [ Schließen ]    |
      +---------------------------------------------------------------------+

    - Dialog `data-testid="oss-notices-dialog"`, `aria-label` = title
      `ossNotices.title`.
    - Intro `ossNotices.intro` with `{name}` = `$_('brand.name')`,
      `data-testid="oss-notices-dialog.intro"`.
    - Filter: `Field` label `ossNotices.filterLabel`, input placeholder
      `ossNotices.filterPlaceholder`, `data-testid="oss-notices-dialog.filter"`.
    - Section headings `ossNotices.part.frontend` / `ossNotices.part.backend`
      with `{count}` = the filtered count, `data-testid="oss-notices-dialog.part.frontend"`
      / `….part.backend`. A section whose filtered list is empty is hidden.
    - Each component row `data-testid="oss-notices-dialog.component"` with
      `data-name="<name>"` (test data, for the page object). Name in
      `text-ink-strong`, one `Badge` per license, then the copyright lines
      verbatim. If there are none: `ossNotices.authors` ("Autoren: {names}")
      when `authors` is non-empty, else `ossNotices.copyrightUnknown`. Then
      `ossNotices.homepage` as `<a target="_blank" rel="noopener noreferrer">`
      when `homepage` is set.
    - Footer: `ossNotices.fullText` → `<a href="/THIRD-PARTY-LICENSES.txt"
      target="_blank" rel="noopener noreferrer">`,
      `data-testid="oss-notices-dialog.full-text"` (a public static file, so
      a plain link is correct, unlike an `/api` download). The close button
      `ossNotices.close`, `data-testid="oss-notices-dialog.close"`,
      `Button variant="secondary"`. Escape also closes.
    - All numbers via `$lib/format.ts` (the counts are integers; use its
      integer formatter, never `toLocaleString`).

  ### Open-Source-Lizenzen dialog: filter matches nothing

      +---------------------------------------------------------------------+
      | Open-Source-Lizenzen                                                |
      | Pythia ist Open-Source-Software … (intro unchanged)                 |
      |                                                                     |
      | Filtern                                                             |
