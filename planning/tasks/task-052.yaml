id: task-052
phase: phase-9
title: Tree-aware version comparison
depends_on: [task-051]
description: |
  VersionComparisonService currently compares two SubmittedEstimationVersion
  instances by flattening itemGroups → items and diffing on logicalId. It
  also lists added/removed groups by logicalId. After task-051 the
  submitted side is a tree, so the comparison needs to walk it.

  Design:
    - Diff is still keyed by logicalId (every node — group or leaf —
      has a stable logicalId across versions).
    - For each side, build a Map<UUID, NodePath> where NodePath holds
      the node itself plus its ancestor chain (list of group titles from
      root down to the parent). NodePath is the comparison-side analogue
      of "group title" from the current flat code.
    - Added / removed / modified nodes are computed exactly as today
      (keys-only set operations) but on the union of group+leaf
      logicalIds.
    - Modified-fields detection: for leaves, the existing field list
      (description, code, minEffort, expectedEffort, maxEffort,
      assumptions). For groups, the only user-editable field is `title`,
      so a renamed group surfaces as modified with changedFields=["title"].
      Moves (a node whose parent changed) show as changedFields=["parent"]
      with before.path and after.path differing.

  DTO updates (src/backend/implementation/src/main/kotlin/io/github/
  theestimator/rest/dto/VersionComparisonDtos.kt):
    - Replace ComparisonItemDto and ComparisonGroupDto with a single
      ComparisonNodeDto that carries:
        logicalId, type ("GROUP" | "FIXED" | "TIME_RELATIVE"),
        description (for leaves) / title (for groups),
        path: List<String> (ancestor group titles, empty for roots),
        minEffort, expectedEffort, maxEffort, offerPT — all nullable
        for groups
    - ItemModificationDto is renamed to NodeModificationDto with this
      shape (drop the redundant top-level `description` — it duplicates
      `after.description`/`after.title`):
        logicalId: UUID
        type: String
        before: ComparisonNodeDto
        after: ComparisonNodeDto
        changedFields: List<String>
    - VersionComparisonDto: addedItems/removedItems/modifiedItems
      become addedNodes/removedNodes/modifiedNodes; addedGroups/
      removedGroups are removed (they fold into the nodes lists).
    - parameterChanges keeps its current shape.

  Behaviour note for "group with N descendants deleted": the diff
  produces 1 + N entries in removedNodes — one for the group itself and
  one per descendant leaf (because every node has its own logicalId).
  A moved leaf — same logicalId, different parent — produces a SINGLE
  modifiedNodes entry with changedFields=["parent"]; it must NOT also
  appear in addedNodes/removedNodes. The test plan covers both cases.

  Frontend implications (compare page +page.svelte under
  src/frontend/src/routes/estimations/[id]/compare/): the rendered table
  currently shows separate "Added items / Removed items / Modified items"
  and "Added groups / Removed groups" sections. After this task it
  becomes "Added nodes / Removed nodes / Modified nodes", and each row
  shows the node's path (e.g., "Backend > Auth > Token endpoint") so
  the user can locate it in the tree. The frontend change here is
  small — task-054 will rewrite the editor view, but the compare table
  is independently small enough to handle in this task.

  TypeScript types (src/frontend/src/lib/api/types.ts) must be updated
  IN THIS TASK too: replace ApiComparisonItem, ApiComparisonGroup,
  ApiItemModification with ApiComparisonNode and ApiNodeModification;
  rewrite the field list on ApiVersionComparison
  (addedItems/removedItems/modifiedItems/addedGroups/removedGroups →
  addedNodes/removedNodes/modifiedNodes). Without this, npm run check
  still passes against the old type definitions but the runtime data
  doesn't match — silent breakage.

  Ambient regression to fix in the same Svelte page: lines 26-30
  currently read `versionA.itemGroups.reduce(...)` for the item-count
  chip. After task-050/051 the API returns `roots`, not `itemGroups` —
  this read is already silently returning 0 in production. Replace
  with a recursive leaf-count over `versionA.roots` / `versionB.roots`
  so the chip works again. (The wider itemGroups → roots cleanup on
  ApiVersionResponse is still task-054's job; only this one chip's
  read changes here.)

  Tests:
    - VersionComparisonServiceTest (new unit test): construct two
      SubmittedEstimationVersion fixtures programmatically (no DB) and
      verify added/removed/modified categorisation across multiple
      depths, including a move (same logicalId, different parent).
    - Existing IT cases that POST a draft, submit, and diff against
      another version must be updated to assert against the new DTO
      field names.

steps:
  - |
    Update VersionComparisonDtos.kt: introduce ComparisonNodeDto and
    NodeModificationDto; rename fields on VersionComparisonDto. Remove
    ComparisonItemDto, ComparisonGroupDto, ItemModificationDto.

  - |
    Rewrite VersionComparisonService.compare:
      - flattenWithPath(version): walks version.roots recursively,
        carrying a List<String> of ancestor titles, yielding (node, path)
        for every visited node (both groups and leaves).
      - mapA / mapB: Map<UUID, Pair<SubmittedEstimationNode, List<String>>>
        keyed by logicalId.
      - added / removed: subtract on keys.
      - modified: intersect on keys; produce NodeModificationDto when
        any of (parent path changed, type-specific field changed) is true.
    Delete the SubmittedEstimationItem.toComparisonDto helper; replace
    with SubmittedEstimationNode.toComparisonDto(path: List<String>).

  - |
    Update src/frontend/src/lib/api/types.ts:
      - Delete ApiComparisonItem, ApiComparisonGroup, ApiItemModification.
      - Add ApiComparisonNode { logicalId, type, title, description,
        path: string[], minEffort, expectedEffort, maxEffort, offerPT }
        (everything except logicalId, type, and path is nullable).
      - Add ApiNodeModification { logicalId, type, before, after,
        changedFields }.
      - On ApiVersionComparison: replace addedItems/removedItems/
        modifiedItems/addedGroups/removedGroups with addedNodes/
        removedNodes/modifiedNodes (typed ApiComparisonNode[] /
        ApiNodeModification[]). Keep parameterChanges.

  - |
    Update the frontend compare page so it consumes the new DTO field
    names and shows the path column. Use the path joined with " > " as
    the value. Group-level rows render with their title; leaf rows with
    description. ALSO fix the ambient item-count regression (lines
    26-30): replace the `versionA.itemGroups.reduce(...)` reads with a
    recursive leaf-count over `versionA.roots` (helper that walks
    children when type === "GROUP"). Verify TypeScript via
    `cd src/frontend && npm run check`.

  - |
    Write VersionComparisonServiceTest covering:
      a) Leaf added under an existing group → in addedNodes with
         correct path.
      b) Group renamed → in modifiedNodes with changedFields=["title"].
      c) Leaf moved from one group to another → exactly ONE
         modifiedNodes entry with changedFields=["parent"] and differing
         before.path / after.path; assert it is NOT also in addedNodes
         or removedNodes.
      d) Top-level GROUP with two descendants deleted → 3 entries in
         removedNodes (the group itself plus both leaves).
      e) Three-level tree where a middle group disappears → the
         middle group is in removedNodes; its descendants reparent and
         appear in modifiedNodes with changedFields=["parent"] and a
         shorter after.path. Confirms the model handles structural
         collapses sensibly.

  - |
    Update relevant IT cases (search EstimationVersionResourceIT and any
    other test that touches `/compare`) for the new field names.
    Rename addedItems→addedNodes, removedItems→removedNodes,
    modifiedItems→modifiedNodes throughout. Reuse the existing
    `modifiedItems[0].before.minEffort` style — only the top-level
    field name changes.

  - |
    Run the backend tests and the frontend check:
      mvn -pl src/backend/implementation -am test
      cd src/frontend && npm run check

validation:
  - |
    The new comparison DTOs exist and the old ones are gone:
      grep -q "ComparisonNodeDto" \
            src/backend/implementation/src/main/kotlin/io/github/theestimator/rest/dto/VersionComparisonDtos.kt
      grep -q "NodeModificationDto" \
            src/backend/implementation/src/main/kotlin/io/github/theestimator/rest/dto/VersionComparisonDtos.kt
      ! grep -qE "ComparisonItemDto|ComparisonGroupDto|ItemModificationDto" \
            src/backend/implementation/src/main/kotlin/io/github/theestimator/rest/dto/VersionComparisonDtos.kt
  - |
    The frontend TS types are renamed too — no stale field names left in
    types.ts or the compare page (this is the silent-runtime-break guard):
      grep -q "ApiComparisonNode"   src/frontend/src/lib/api/types.ts
      grep -q "ApiNodeModification" src/frontend/src/lib/api/types.ts
      ! grep -qE "ApiComparisonItem|ApiComparisonGroup|ApiItemModification" \
            src/frontend/src/lib/api/types.ts
      ! grep -qE "addedItems|removedItems|modifiedItems|addedGroups|removedGroups" \
            "src/frontend/src/routes/estimations/[id]/compare/+page.svelte"
  - |
    VersionComparisonService no longer flattens itemGroups:
      ! grep -q "itemGroups" \
            src/backend/implementation/src/main/kotlin/io/github/theestimator/service/VersionComparisonService.kt
  - |
    Backend tests pass:
      mvn -pl src/backend/implementation -am test
  - |
    Frontend type-check passes:
      cd src/frontend && npm run check
  - |
    Manual visual smoke (npm run check cannot see the rendered table):
    create two versions where v2 (a) renames a top-level group, (b)
    moves a leaf into a different group, and (c) deletes a nested
    group containing two leaves. Open /estimations/{id}/compare?a=1&b=2
    and confirm: the path column shows ancestor titles for each row;
    the renamed group appears once with changedFields=["title"]; the
    moved leaf appears once (not twice) with changedFields=["parent"];
    the deleted nested group plus its two children produce three
    removed-node rows; the item-count chip shows the correct leaf
    counts for both sides.

outputs:
  - modified: src/backend/implementation/src/main/kotlin/io/github/theestimator/rest/dto/VersionComparisonDtos.kt
  - modified: src/backend/implementation/src/main/kotlin/io/github/theestimator/service/VersionComparisonService.kt
  - modified: src/frontend/src/lib/api/types.ts
  - modified: src/frontend/src/routes/estimations/[id]/compare/+page.svelte
  - created: src/backend/implementation/src/test/kotlin/io/github/theestimator/service/VersionComparisonServiceTest.kt
  - modified: src/backend/implementation/src/test/kotlin/io/github/theestimator/rest/EstimationVersionResourceIT.kt
