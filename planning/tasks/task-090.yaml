id: task-090
phase: phase-10
title: Remove dead API client + ESLint-guard raw /api fetch
depends_on: []
description: |
  Follow-up hardening after the auth-header bug. The frontend used to
  route API calls through raw `fetch('/api/...')`, which never attached
  the `Authorization` header — so every request hit the backend
  anonymously and just-in-time user provisioning never fired. That was
  fixed by adding `apiFetch` (`src/frontend/src/lib/api/fetch.ts`, which
  attaches the active auth provider's header) and routing all `/api`
  calls through it.

  Two loose ends remain:

  1. **Dead code.** `src/frontend/src/lib/api/client.ts` exports
     `createApiClient()` (an openapi-fetch client carrying the same
     `Authorization` middleware) and the `ApiClient` type. It is NEVER
     called or imported anywhere — grep confirms both symbols are
     referenced only inside `client.ts` itself. It is exactly the
     misleading dead code that hid the original bug (it *looked* like the
     app's authenticated API path but wasn't). Remove it.

  2. **No guard against regression.** Nothing stops a future contributor
     from writing `fetch('/api/...')` again and silently reintroducing
     unauthenticated calls. Add an ESLint rule that bans raw `fetch(...)`
     calls and directs authors to `apiFetch`.

  Target state:
    - `client.ts` deleted; nothing references `createApiClient` /
      `ApiClient` / `$lib/api/client` (verified by grep; the app already
      uses `apiFetch`).
    - `eslint.config.js` has a `no-restricted-syntax` rule that flags
      `fetch(...)` calls in `**/*.ts` and `**/*.svelte`, with a message
      pointing to `apiFetch` from `$lib/api/fetch`, and a following
      override that turns the rule OFF for the single legitimate raw-fetch
      site, `src/lib/api/fetch.ts` (where `apiFetch` wraps the real
      `fetch`). The existing code base must stay lint-clean because all
      `/api` calls were already migrated to `apiFetch`.

  Notes:
    - Do NOT delete `src/lib/api/schema.d.ts` (generated OpenAPI types,
      already in the ESLint `ignores`); only `client.ts` is dead.
    - `no-restricted-syntax` with an AST selector is used (not
      `no-restricted-globals`) because `.ts` files do not declare browser
      globals in this config, so a global-based rule would not fire there;
      the AST selector matches the `fetch(` call node regardless.
    - This is a config + dead-code-removal task — no new service, domain
      operation, or frontend flow — so the CLAUDE.md logging conventions
      do not apply.

steps:
  - |
    Start:
      ./scripts/task.sh start task-090

  - |
    Delete `src/frontend/src/lib/api/client.ts`. First confirm it is
    dead: `grep -rn "createApiClient\|ApiClient\|\$lib/api/client" src/frontend/src`
    should return only lines inside `client.ts` itself. Do not touch
    `src/lib/api/schema.d.ts` or `src/lib/api/fetch.ts`.

  - |
    Add the guard to `src/frontend/eslint.config.js`. Append a config
    object (after the existing svelte-specific block, before the html
    block is fine) that applies to `['**/*.ts', '**/*.svelte']` with:
      rules: {
        'no-restricted-syntax': ['error', {
          selector: "CallExpression[callee.name='fetch']",
          message: "Use apiFetch from '$lib/api/fetch' (it attaches the Authorization header) instead of raw fetch."
        }]
      }
    Then append a SECOND config object AFTER it that applies only to
    `['src/lib/api/fetch.ts']` and sets `'no-restricted-syntax': 'off'`
    (that file legitimately wraps the real `fetch`). Order matters: the
    override must come after the ban so it wins for that file.

  - |
    Confirm the rule is active AND the current code is clean (all `/api`
    calls already go through `apiFetch`, so there should be zero
    violations):
      cd src/frontend && npm run lint

  - |
    Update CLAUDE.md — it references the now-deleted `client.ts` in two
    places that describe it as the app's live authenticated API path;
    both are already misleading (the real path is `apiFetch`) and become
    dangling once `client.ts` is gone:
      - The architecture bullet (`- **`src/frontend`** — SvelteKit 5 …`):
        replace "Talks to the backend via `$lib/api/client.ts`
        (openapi-fetch with types regenerated from the backend OpenAPI)."
        with wording that describes `apiFetch` (`$lib/api/fetch.ts`, a
        plain `fetch` wrapper that attaches the active auth provider's
        `Authorization` header), with request/response types generated via
        openapi-typescript into `$lib/api/schema.d.ts`. Note that
        "openapi-fetch" was only the dead `client.ts`, so drop that term.
      - The auth section sentence "The API client
        (`src/frontend/src/lib/api/client.ts`) installs an openapi-fetch
        `onRequest` middleware that consults
        `getAuthProvider().getAuthorizationHeader()` and attaches the
        result as the `Authorization` header.": rewrite it to describe
        `apiFetch` (`$lib/api/fetch.ts`) consulting
        `getAuthProvider().getAuthorizationHeader()` and attaching it as
        the `Authorization` header on every `/api` call.
      - Optionally note near the frontend conventions that raw `fetch(...)`
        is banned by ESLint (`no-restricted-syntax`) in favour of
        `apiFetch`.

  - |
    Build check — svelte-check must stay green after removing the dead
    client (nothing imports it), plus the frontend gate for parity with
    the implement-task check:
      cd src/frontend && npm run check
      ./gradlew :frontend:check

validation:
  - |
    The dead client is gone and unreferenced:
      ! test -f src/frontend/src/lib/api/client.ts
      ! grep -rq "createApiClient" src/frontend/src
      ! grep -rq "\$lib/api/client" src/frontend/src
  - |
    The ESLint guard exists and exempts the wrapper:
      grep -q "no-restricted-syntax" src/frontend/eslint.config.js
      grep -q "callee.name='fetch'" src/frontend/eslint.config.js
      grep -q "src/lib/api/fetch.ts" src/frontend/eslint.config.js
  - |
    CLAUDE.md no longer references the deleted client and points at apiFetch:
      ! grep -q "api/client" CLAUDE.md
      grep -q "apiFetch" CLAUDE.md
  - |
    Lint passes (rule active, code clean) and types check:
      cd src/frontend && npm run lint
      cd src/frontend && npm run check

outputs:
  - deleted: src/frontend/src/lib/api/client.ts
  - modified: src/frontend/eslint.config.js
  - modified: CLAUDE.md
