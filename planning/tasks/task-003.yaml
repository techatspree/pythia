id: task-003
phase: phase-1
title: Bootstrap Svelte frontend project
depends_on: [task-001]
description: |
  Initialize a SvelteKit + TypeScript SPA under src/frontend using Vite, with the
  baseline dependencies for MSAL auth and Tailwind. Configured as a static SPA
  (no SSR) since all routes require client-side MSAL authentication.
steps:
  - cd src/frontend
  - npx sv create . (select Skeleton project, TypeScript, ESLint, Prettier)
  - npm install
  - install dependencies:
      - "@azure/msal-browser"
  - install dev dependencies:
      - tailwindcss @tailwindcss/vite
      - "@sveltejs/adapter-static"
      - openapi-fetch openapi-typescript
  - configure adapter-static in svelte.config.js with fallback "index.html"
  - add "export const ssr = false" to src/routes/+layout.ts
  - configure Tailwind via the Vite plugin in vite.config.ts
  - add Tailwind import to src/app.css
  - verify "npm run dev" serves the app on port 5173
validation:
  - http://localhost:5173 loads the SvelteKit default page
  - Tailwind class "text-red-500" renders correctly in src/routes/+page.svelte
  - "npm run build" produces a static build in build/ directory
outputs:
  - src/frontend/package.json
  - src/frontend/vite.config.ts
  - src/frontend/svelte.config.js
  - src/frontend/src/app.css
  - src/frontend/src/routes/+layout.ts
