id: task-061
phase: phase-9
title: Verify and guard TreeTable column alignment at depth
depends_on: [task-059, task-069]
description: |
  RE-SCOPED. Originally this task was to FIX a column/header
  misalignment in the estimation grid (headers drifting right of the
  values the deeper a node sits). Since then task-069 ("Responsive
  TreeTable", done) reworked the table layout, so the symptom may no
  longer be visible. This task now VERIFIES alignment against the
  post-069 layout with a durable regression test, and only applies the
  original fix if the test actually shows drift.

  Why re-scoped rather than dropped:
    - The original root cause is still latent in the code (see below),
      so "looks fine now" is not the same as "fixed" — task-069 added
      horizontal scroll + a max-content wrapper, which can MASK the
      drift at typical widths without eliminating it. A regression test
      is worth having regardless, because the new max-content layout
      could itself regress alignment at some viewport widths/depths.
    - task-070 depends on this task AND relies on the Description /
      Assumptions inputs carrying `min-w-0` (its inline-row-actions
      clipping guard assumes the name input can shrink). So this task
      ALWAYS applies that cheap input change, keeping task-070's
      dependency valid whether or not the heavier grid-level fix is
      needed.

  Current state (verified in code):
    - task-069 wrapped the table in `<div class="overflow-x-auto">` +
      an inner `<div style="min-width: max-content">` (TreeTable.svelte
      ~lines 281-282) and added a per-column `collapsible` affordance.
    - The ORIGINAL fix is NOT present: `gridTemplateColumns`
      (~line 168) still joins each `col.width` as-is (flexible columns
      Description and Assumptions are bare `1fr`, i.e. `minmax(auto,
      1fr)`), and the grid cells have no `min-w-0`.
    - Each body row is still its OWN CSS grid and the header is another,
      all sharing only the template STRING. So a deeply-indented row's
      Description (`1fr`) track can still resolve wider than the header's
      (its `auto` minimum grows to fit indent + chevron + the
      intrinsic-width text input), shifting every following column.
      `min-width: max-content` bounds the table width and adds a
      scrollbar but does NOT force the per-row `1fr` tracks to resolve
      identically.
    - No alignment regression test exists. e2e present today:
      tree-table.test.ts, treetable-responsive.test.ts, smoke.test.ts.

  Target state:
    - A Playwright regression test asserts that, on the demo, the
      RESOLVED column tracks of a deeply-nested row equal the header's
      (and stay equal after expanding a collapsed subtree). This test is
      the durable guard and the source of truth for whether a fix is
      needed.
    - The Description and Assumptions inputs in EstimationGrid ALWAYS
      get `w-full min-w-0` (cheap, safe, helps task-070 and is half of
      the alignment fix).
    - IF (and only if) the regression test shows drift, the original
      low-risk grid fix is applied to TreeTable so the test goes green;
      if the test is already green, that fix is unnecessary and is NOT
      applied. Either way the end state is: the alignment test passes.

  The original fix (apply ONLY if the test shows drift):
    - Fix #1 — in `gridTemplateColumns`, wrap each FLEXIBLE track
      (width contains `fr`) as `minmax(0, <width>)`; non-fr widths
      (the `2rem` handle, `rem` columns, the `4rem` actions track, and
      the `0.5rem` collapsed sliver from task-069) pass through
      unchanged. This must compose with task-069's existing
      `isCollapsed(c.key) ? '0.5rem' : c.width` logic — wrap the chosen
      width, do not discard the collapsed handling.
    - Fix #2 — add `min-w-0` to every grid cell `<div>` in BOTH the
      header grid and the row grid (drag-handle cell, each column cell,
      the rowActions cell, and the matching header cells), and
      `overflow-hidden` on the tree-column cell so deep indent + long
      text clips to its track instead of spilling into the next column.
    - Do NOT re-architect into a single shared grid via
      `display: contents` / `subgrid` — svelte-dnd-action needs each
      children-zone to be a real box; that would break DnD + cycle
      protection.

  Out of scope:
    - Any change to drag-and-drop, cycle protection, collapse/expand,
      keyboard nav, or the TreeTableProps type.
    - KMP domain / backend / REST.
    - Editing tree-table.test.ts, treetable-responsive.test.ts, or
      smoke.test.ts (they must keep passing; new assertions go in a NEW
      test file).

steps:
  - |
    Read the current code end-to-end before editing:
      src/frontend/src/lib/components/treetable/TreeTable.svelte
        (note the task-069 wrapper: overflow-x-auto + min-width:
        max-content, and the isCollapsed width logic in
        gridTemplateColumns)
      src/frontend/src/lib/components/treetable/types.ts
      src/frontend/src/lib/components/EstimationGrid.svelte
        (descriptionCell / assumptionsCell snippets, the columns array)
      src/frontend/src/routes/dev/tree-table-demo/+page.svelte
        (the demo tree nests at depth ≥ 2 — the alignment test exercises
        it)

  - |
    Ensure the demo exercises the full EstimationGrid-like template so
    the test is representative: the demo is `editable={true}` (has the
    `2rem` handle). If it does NOT already pass a `rowActions` snippet,
    add a minimal one (e.g. a single ✕ button) so the demo renders the
    trailing `4rem` actions track too. If task-069 already added one,
    leave it. The existing demo e2e cases select by data-testid /
    zones (not column index) and must keep passing.

  - |
    Add the regression test
    src/frontend/e2e/tree-table-alignment.test.ts driving
    /dev/tree-table-demo (no backend needed):
      - goto('/dev/tree-table-demo')
      - In page.evaluate(), read the header grid element and a deep
        row's inner `.grid` element (e.g. inside
        `[data-testid="tt-row-g1a"]` and a leaf below it). Return
        getComputedStyle(el).gridTemplateColumns for each.
      - Assert the header's resolved tracks equal the nested row's
        (parse the px track list and assert each pair within 0.5px to
        avoid sub-pixel flakiness).
      - Expand an initially-collapsed group via its chevron and
        re-assert, covering "alignment holds when a subtree opens".

  - |
    Always apply the cheap input change: in EstimationGrid.svelte add
    `w-full min-w-0` to the text inputs in `descriptionCell` (both the
    GROUP title input and the LEAF description input) and in
    `assumptionsCell`, so the name/assumption inputs shrink within their
    track. (This also satisfies task-070's clipping-guard assumption.)
    Do not change their bindings or handlers.

  - |
    Run the alignment test (the Vite dev server must be up — start it
    via ./scripts/dev-local.sh; the demo route /dev/tree-table-demo
    needs it):
      cd src/frontend && npx playwright test tree-table-alignment
    - If it PASSES: the post-069 layout is already aligned; the
      grid-level fix is unnecessary — do NOT touch TreeTable's
      gridTemplateColumns / cells. Record in the task notes that the
      grid fix was not required.
    - If it FAILS (drift detected): apply the original fix to
      TreeTable.svelte — wrap flexible tracks as `minmax(0, …)` in
      `gridTemplateColumns` (composing with the existing isCollapsed
      logic) and add `min-w-0` to every header + body grid cell, plus
      `overflow-hidden` on the tree-column cell. Re-run until green.

  - |
    Frontend type-check:
      cd src/frontend && npm run check
    Expected: 0 errors.

  - |
    Run the full Playwright suite — the new alignment case, the existing
    tree-table + responsive + smoke cases must all pass (start
    backend + frontend via ./scripts/dev-local.sh if the smoke cases
    need the API; the alignment + tree-table cases only need the dev
    server):
      cd src/frontend && npx playwright test

  - |
    Record the layout gotcha as a `project` memory (one fact, linked
    from MEMORY.md): "Each TreeTable row is an independent CSS grid
    sharing only the grid-template STRING; task-069's
    overflow-x-auto + min-width:max-content adds scroll but does NOT
    equalise per-row `fr` tracks. If columns drift at depth, the fix is
    `minmax(0, …)` on flexible tracks + `min-w-0` on every cell. The
    e2e tree-table-alignment.test.ts guards this." Skip if an
    equivalent memory already exists.

validation:
  - |
    The regression test exists and measures resolved tracks on the demo:
      test -f src/frontend/e2e/tree-table-alignment.test.ts
      grep -q "tree-table-demo" src/frontend/e2e/tree-table-alignment.test.ts
      grep -q "gridTemplateColumns" src/frontend/e2e/tree-table-alignment.test.ts
  - |
    The Description / Assumptions inputs always carry min-w-0 (the
    task-070-enabling change, applied regardless of the test outcome):
      grep -q "min-w-0" src/frontend/src/lib/components/EstimationGrid.svelte
  - |
    Frontend type-check passes:
      cd src/frontend && npm run check
  - |
    The full Playwright suite passes, INCLUDING the new alignment case
    (this is the real guarantee that header and rows align at depth,
    whether or not the grid-level fix was needed):
      cd src/frontend && npx playwright test

outputs:
  # Always changed:
  - created: src/frontend/e2e/tree-table-alignment.test.ts
  - modified: src/frontend/src/lib/components/EstimationGrid.svelte
  # Conditional — drop from the final outputs if left untouched:
  - modified: src/frontend/src/routes/dev/tree-table-demo/+page.svelte   # only if the demo lacked a rowActions snippet (step 2)
  - modified: src/frontend/src/lib/components/treetable/TreeTable.svelte  # only if the alignment test showed drift (step 5)
