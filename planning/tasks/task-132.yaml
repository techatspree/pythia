    projection helpers:
      grep -q "hierarchy" src/frontend/src/lib/methods/bucketSampled/EditorModule.svelte
      grep -q "estimator.bucketView" src/frontend/src/lib/methods/bucketSampled/EditorModule.svelte
      grep -q "bucket-view-toggle-bucket" src/frontend/src/lib/methods/bucketSampled/EditorModule.svelte
      grep -q "bucket-view-toggle-hierarchy" src/frontend/src/lib/methods/bucketSampled/EditorModule.svelte
      grep -q "flatLeaves" src/frontend/src/lib/methods/bucketSampled/EditorModule.svelte
      grep -q "__bucketRow" src/frontend/src/lib/methods/bucketSampled/EditorModule.svelte
  - |
    The hierarchy view really nests (getChildren resolves GROUP children
    instead of hard-returning null) and the bucket view maps drops back
