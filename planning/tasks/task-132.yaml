      grep -q "unassigned" src/frontend/src/lib/i18n/en.json
      cd src/frontend && node -e "const d=require('./src/lib/i18n/de.json'),e=require('./src/lib/i18n/en.json');const f=(o,p='')=>Object.entries(o).flatMap(([k,v])=>typeof v==='object'&&v?f(v,p+k+'.'):[p+k]);const a=f(d).sort(),b=f(e).sort();if(JSON.stringify(a)!==JSON.stringify(b))throw new Error('key sets differ');console.log('ok',a.length)"
  - |
    The backend proves a GROUP of BUCKETED leaves round-trips. Assert the
    NEW test method by name — `GROUP`/`BUCKETED` already appear in this
    class, so grepping for those alone would pass without any change:
      grep -q "bucketedLeavesSurviveInsideAGroup" src/backend/implementation/src/test/kotlin/io/pythia/rest/EstimationVersionResourceIT.kt
      ./gradlew :backend:implementation:test --tests "io.pythia.rest.EstimationVersionResourceIT"
  - |
    The e2e covers both views and the cross-bucket drag:
      test -f src/frontend/e2e/bucket-views.test.ts
      grep -q "bucket-view-toggle-hierarchy" src/frontend/e2e/bucket-views.test.ts
      grep -q "bucketId" src/frontend/e2e/bucket-views.test.ts
  - |
    Docs updated. `bucketSampled` already appears in CLAUDE.md, so assert
    the phrases this task introduces:
      grep -qi "hierarchy view\|hierarchical view" CLAUDE.md
      grep -qi "two projections\|two views" CLAUDE.md
  - |
    Type-check, lint, full build, and the e2e suite pass:
