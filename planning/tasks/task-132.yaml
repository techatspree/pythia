      ! grep -q "console\." src/frontend/src/lib/methods/bucketSampled/EditorModule.svelte
  - |
    New i18n keys are present in both catalogs and the key sets stay equal:
      grep -q "viewBucket" src/frontend/src/lib/i18n/de.json
      grep -q "viewBucket" src/frontend/src/lib/i18n/en.json
