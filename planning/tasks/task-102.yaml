id: task-102
phase: phase-15
title: Domain — implement bucket + sampled estimation method
depends_on: [task-098, task-113]
description: |
  Implement the second estimation method — **bucket + sampled
  three-point** — behind the SPI introduced in task-097. This is
  the domain-side (KMP) piece: the leaf item type, the reducer,
  the method module, and the module's export writer. Backend
  persistence lands in task-103; frontend editor lands in
  task-104.

  ## Frozen decisions (from task-096)

  - **Package.** All bucket+sampled code lives in
    `io.pythia.method.bucketsampled`. NO cross-
    reference from this package into
    `io.pythia.method.threepoint` — the two methods
    interact only via the SPI in
    `io.pythia.method`.
  - **Leaf item shape.** New subclass
    `BucketedEstimationItem : EstimationItem` living in
    `io.pythia.method.bucketsampled` — this is now legal
    because task-113 opened `EstimationItem` from `sealed` to
    `abstract`, so leaf types may live in their own method package (a
    hard dependency: task-102 CANNOT compile without task-113).
    Follow the SAME underscore-forwarding constructor + `@JsExport
    @DomainEntity` pattern as `FixedEstimationItem` (which now lives in
    `io.pythia.method.threepoint`): private `_`-prefixed
    constructor params forwarded to `EstimationItem(...)`, PLUS the
    bucket-specific fields. `EstimationItem` has `description` (no
    `title` — that is `EstimationGroup`), so do NOT add a `title` field.
    Bucket fields:
      * `bucketId: String` (non-null on a fully-edited item; the domain
        assumes it — DTO-layer validation is task-100)
      * `isSample: Boolean`
      * Optional `optimistic: Double? = null`, `likely: Double? = null`,
        `pessimistic: Double? = null` — required when `isSample = true`.
    It MUST implement the abstract
    `override fun withCalculationParameters(params): EstimationItem`
    (like the other leaves). Do not introduce a second inheritance
    level. Kotlin/JS: inline any parent formula, never `super.<computed
    prop>`; annotate `@JsExport` and give secondary constructors
    `@JsName("…")` — see `TimeRelativeEstimationItem.kt`.
  - **Reducer semantics.** For each bucket, average the
    per-sample PERT-derived `mean` across the bucket's sample
    items; assign the bucket's mean to every non-sample item
    in the bucket. Variance and offerPT follow the same
    per-bucket average; cost and offerPrice flow through the
    existing `EstimationVersion.calculate()` accumulation from
    the assigned mean.
  - **Where the reducer lives.** A dedicated top-level function
    `computeBucketAverages(items): Map<bucketId, BucketAverages>`
    in the same package. `BucketMethodModule.calculateAll(items, params)`
    (the batch SPI hook — see SPI ADJUSTMENT) receives the whole flat
    leaf list, consumes `computeBucketAverages`, and returns the per-leaf
    calculated values.
  - **SPI ADJUSTMENT.** task-097's SPI was per-leaf
    (`calculate(item, params)`). The bucket method needs
    per-BUCKET context — extend the SPI here with a batch hook
    `calculateAll(items: List<EstimationItem>, params):
    List<EstimationItem>` and give it a default in the SPI that
    calls `calculate` per leaf (so PERT keeps working without
    change). Bucket module overrides `calculateAll`. Document
    the extension in the SPI file with a one-line comment; NO
    change to the PERT module needed.
  - **Wiring into `EstimationVersion.calculate()` (REQUIRED — else the
    reducer is dead code).** `EstimationVersion.calculate()` today applies
    values per-leaf: `roots.map { it.withCalculationParameters(params) }`.
    That cannot work for bucketed leaves (a single item has no view of its
    bucket's siblings), so the reducer must be invoked from `calculate()`.
    Approach: a version has exactly one method (task-099), and all its
    leaves are that method's leaf type. Detect the method from the leaf
    types — if any flattened leaf `is BucketedEstimationItem` use
    `BUCKET_SAMPLED_PERT`, else `THREE_POINT_PERT` — then run the batch
    hook once over the flat leaves:
    `EstimationMethodRegistry.require(method).calculateAll(leaves, params)`,
    and substitute the returned calculated leaves back into the tree
    before the group accumulation. PERT stays byte-identical because the
    SPI's DEFAULT `calculateAll` just maps `withCalculationParameters`
    per leaf. This adds a `model → method` reference from
    `EstimationVersion` to `EstimationMethodRegistry`; that is acceptable
    and consistent with task-113 (`DomainFactory` already references the
    method packages) — it is NOT a method-to-method reference. Add
    `EstimationVersion.kt` to the changes and prove it with a test that a
    bucketed tree computes end-to-end via `calculate()` (not just the
    module in isolation).
  - **Registry.** The bucket module registers itself via
    `EstimationMethodRegistry.installStandardMethods()` — extend
    the same bootstrap point task-098 added.
  - **Export writer.** Like `ThreePointMethodModule` (task-098),
    `exportColumnHeaders()` returns ONLY the method-specific columns:
    `["Bucket", "Is Sample", "Optimistic", "Likely", "Pessimistic"]`.
    `.exportRow(item)` returns matching cells; non-sample rows have empty
    Optimistic/Likely/Pessimistic cells. `exportColumnHeaders().size ==
    exportRow(item).size`.
  - **Kotlin/JS pitfall.** `BucketedEstimationItem` will have
    computed getters for the shared neutral values. INLINE the
    parent formulas — do NOT reference `super.mean` /
    `super.variance` / `super.offerPT`. See the reference
    comment in `TimeRelativeEstimationItem.kt`.
  - **KMP export.** Type is `@JsExport`-annotated; secondary
    constructors get `@JsName("…")` — again see
    `TimeRelativeEstimationItem.kt`.
  - **Single source of truth.** All bucket calculation lives in
    `:domain`. The frontend `adapter.ts` (updated in task-104)
    just calls into the KMP-compiled JS — no reimplementation.
  - **Buckets themselves.** The domain does NOT own bucket
    persistence (labels, ordering); buckets are stored on
    `Estimation` in the backend (task-103). The domain model
    only sees `bucketId: String`. The reducer works purely from
    that id — it does not need labels or order.

  ## What does NOT belong in this task

  - Any backend JPA / Flyway change — task-103.
  - Any frontend editor UI — task-104.
  - Session-support reducer for multi-estimator input — task-106.

steps:
  - |
    Extend the SPI in
    `src/domain/src/main/kotlin/io/pythia/method/EstimationMethodModule.kt`
    with a `calculateAll(items, params): List<EstimationItem>`
    default that calls `calculate(item, params)` per leaf. Add a
    one-line inline comment explaining why the extension exists
    ("bucket methods need per-bucket batch context").
  - |
    Create package
      src/domain/src/main/kotlin/io/pythia/method/bucketsampled/
    Add `BucketedEstimationItem.kt` following the EXACT underscore-
    forwarding pattern of `FixedEstimationItem` (there is NO `title`, no
    `override val id`, and no no-arg `EstimationItem()` constructor —
    `EstimationItem`'s params are `description, code, minEffort,
    expectedEffort, maxEffort, assumptions, phase, logicalId,
    calculationParameters, id, createdAt, updatedAt`). Shape:
      @JsExport @DomainEntity
      data class BucketedEstimationItem(
          val bucketId: String,
          val isSample: Boolean = false,
          val optimistic: Double? = null,
          val likely: Double? = null,
          val pessimistic: Double? = null,
          private val _description: String = "",
          private val _logicalId: String = newId(),
          private val _phase: ProjectPhase? = null,
          private val _calculationParameters: CalculationParameters = CalculationParameters(),
          // bucket-derived values stored by withCalculatedFromBucket for
          // non-sample rows (a single item can't derive its bucket average):
          private val _bucketMean: Double? = null,
          private val _bucketVariance: Double? = null,
          private val _bucketOfferPT: Double? = null
      ) : EstimationItem(_description, _code = "", _minEffort = 0.0, /* … forward the rest … */
                         _phase = _phase, _logicalId = _logicalId,
                         _calculationParameters = _calculationParameters) { … }
    (forward every `EstimationItem` param via `_`-prefixed constructor
    params exactly as `FixedEstimationItem` does; the sketch above is
    abbreviated). Then:
      * Computed neutral getters (`mean`, `variance`, `offerPT`, `cost`,
        `offerPrice`) that INLINE the PERT formula for sample rows
        (`optimistic`/`likely`/`pessimistic`) and RETURN the stored
        `_bucket*` values for non-sample rows. Never `super.mean` /
        `super.variance` / `super.offerPT` (Kotlin/JS pitfall — see
        `TimeRelativeEstimationItem.kt`).
      * `override fun withCalculationParameters(params): BucketedEstimationItem
        = copy(_calculationParameters = params)` (mandatory abstract).
      * `fun withCalculatedFromBucket(mean, variance, offerPT):
        BucketedEstimationItem = copy(_bucketMean = mean, _bucketVariance =
        variance, _bucketOfferPT = offerPT)` — the module calls this from
        `calculateAll` after computing per-bucket averages.
  - |
    Add `computeBucketAverages.kt` with:
      internal data class BucketAverages(
        val mean: Double, val variance: Double, val offerPT: Double
      )
      internal fun computeBucketAverages(
        items: List<BucketedEstimationItem>,
        params: CalculationParameters
      ): Map<String, BucketAverages>
    The function filters `items.filter { it.isSample }`, groups
    by `bucketId`, computes each sample's PERT-derived
    mean/variance/offerPT via the shared formula, averages
    within a bucket, and returns the per-bucket map.
  - |
    Add `BucketMethodModule.kt` implementing
    `EstimationMethodModule`:
      * `method = EstimationMethod.BUCKET_SAMPLED_PERT`
      * Override `calculateAll(items, params)`: compute bucket
        averages once, then map each leaf — sample rows keep
        their sample-derived values; non-sample rows get their
        bucket's average via `withCalculatedFromBucket`.
      * `exportColumnHeaders` / `exportRow` as described above.
      * `logger.info { "…" }` on module registration.
  - |
    Extend
    `EstimationMethodRegistry.installStandardMethods()` (added by
    task-098) to also register `BucketMethodModule`.
  - |
    Wire the reducer into
    `src/domain/src/main/kotlin/io/pythia/model/EstimationVersion.kt`:
    in `calculate()`, replace the per-leaf
    `roots.map { it.withCalculationParameters(params) }` with a batch
    dispatch — detect the method from the flattened leaf types (any
    `BucketedEstimationItem` → `BUCKET_SAMPLED_PERT`, else
    `THREE_POINT_PERT`), call
    `EstimationMethodRegistry.require(method).calculateAll(leaves, params)`.
    `calculateAll` returns a FLAT `List<EstimationItem>`, so rebuild the
    tree preserving group structure: index the calculated leaves by
    `logicalId`, then map `roots` recursively — a group maps its children,
    a leaf is replaced by its calculated version from the index. PERT
    output must stay byte-identical (the default `calculateAll` is per-leaf
    `withCalculationParameters`, so the PERT path is unchanged).
  - |
    Add JUnit 5 unit tests (JVM `src/test` source set,
    `org.junit.jupiter.api` — the `:domain` module has NO `commonTest`)
    in `src/domain/src/test/kotlin/io/pythia/method/bucketsampled/`,
    resetting the registry with `EstimationMethodRegistry.clear()` in
    `@BeforeEach`/`@AfterEach` where the registry is used:
      * `BucketedEstimationItemTest.kt` — construction; sample
        row PERT math; `withCalculatedFromBucket` copy semantics.
      * `ComputeBucketAveragesTest.kt` — three sample items in
        one bucket average correctly; two buckets in one call;
        a bucket with zero samples produces no entry.
      * `BucketMethodModuleTest.kt` — `calculateAll` on a mixed
        list (2 buckets, 2 samples each, 3 non-samples) yields
        expected mean on every leaf; `exportColumnHeaders().size
        == exportRow(item).size`; module is registered after
        `installStandardMethods()`.
      * Add an end-to-end assertion (here or in an existing
        `EstimationVersion` test) that a bucketed tree computes correct
        totals via `EstimationVersion.calculate()`.
  - |
    Update CLAUDE.md "Pluggable estimation methods (SPI)" subsection:
    add bucket+sampled as method #2 (`BucketMethodModule` /
    `BucketedEstimationItem` in `io.pythia.method.bucketsampled`),
    and note the SPI now has a `calculateAll(items, params)` batch hook
    (default = per-leaf `calculate`) that `EstimationVersion.calculate()`
    dispatches through so batch methods get per-bucket context.
  - |
    Build the domain module and rebuild the frontend so the
    updated `domain.d.mts` is fresh:
      ./gradlew :domain:clean :domain:build
      ./gradlew :frontend:clean :frontend:check

validation:
  - |
    Bucket method files exist:
      test -f src/domain/src/main/kotlin/io/pythia/method/bucketsampled/BucketedEstimationItem.kt
      test -f src/domain/src/main/kotlin/io/pythia/method/bucketsampled/computeBucketAverages.kt
      test -f src/domain/src/main/kotlin/io/pythia/method/bucketsampled/BucketMethodModule.kt
  - |
    No cross-references from the bucket package into the
    threepoint package (the two methods must not know each other):
      ! grep -rE "io\\.github\\.theestimator\\.method\\.threepoint" \
          src/domain/src/main/kotlin/io/pythia/method/bucketsampled/
  - |
    Kotlin/JS super-property pitfall: no `super.<computed prop>`
    references:
      ! grep -rE "super\\.mean|super\\.variance|super\\.offerPT" \
          src/domain/src/main/kotlin/io/pythia/method/bucketsampled/
  - |
    Bucket module logs on registration:
      grep -q "logger.info" src/domain/src/main/kotlin/io/pythia/method/bucketsampled/BucketMethodModule.kt
  - |
    Bucket unit tests exist in the JVM src/test source set (not commonTest):
      test -f src/domain/src/test/kotlin/io/pythia/method/bucketsampled/ComputeBucketAveragesTest.kt
      test -f src/domain/src/test/kotlin/io/pythia/method/bucketsampled/BucketMethodModuleTest.kt
      grep -q "org.junit.jupiter.api" src/domain/src/test/kotlin/io/pythia/method/bucketsampled/BucketMethodModuleTest.kt
  - |
    calculate() dispatches through the SPI batch hook:
      grep -q "calculateAll" src/domain/src/main/kotlin/io/pythia/model/EstimationVersion.kt
  - |
    CLAUDE.md documents method #2:
      grep -q "bucketsampled" CLAUDE.md
  - |
    Full-stack build is green (domain calculate() is consumed by the backend):
      ./gradlew build

