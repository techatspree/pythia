id: task-074
phase: phase-12
title: Backend service — record, undo, redo, conflict detection
depends_on: [task-072, task-073, task-088, task-089]
description: |
  Wire the DraftMutation model (task-072) and the mutation log
  (task-073) into the existing draft-edit flow.

  Recording rule:
    Every draft-changing `updateDraft` inserts exactly one
    `DraftMutationLogEntry`. The update flow lives in
    `EstimationVersionResource.updateDraft`, which (since task-088)
    delegates the clear-and-rebuild to `draftUpdateApplier.apply(draft,
    update)` — that call is the natural boundary: capture the pre-state,
    apply the update as today, capture
    the post-state, compute the `DraftMutation` via the domain extension
    `EstimationVersion.diff(other)`. If `diff` returns `null` (the PUT
    changed nothing) skip everything — no log entry, no revision bump.
    Otherwise persist the log entry, increment the draft's `revision`
    counter and stamp `lastModifiedBy` / `lastModifiedAt`. The actor is a
    persisted `User` resolved at the request edge via
    `currentUserService.ensureUser(currentUserProvider.get())` (task-089)
    and passed into the service — the service methods take the `User`, so
    they stay pure (and unit-testable without a request context).

  The same rule applies to `createDraft` (no pre-state — skip
  logging) but NOT to `submitDraft` (a snapshot, not a mutation; the
  log is cleared on submit because the draft is gone — handled below).

  Undo:
    `undoLastForUser(estimationId, user: User)` (the actor is passed in,
    resolved at the request edge via task-089):
      1. Resolve the draft for `estimationId`. If none, 404.
      2. Find latest ACTIVE entry on this draft via
         `findLatestActiveForUserOnDraft(draft.id, user.id)`.
         If null → 404 "Nothing to undo".
      3. Conflict check: also fetch `findLatestActiveForDraft(draft.id)`.
         If that entry's id != the user's-latest entry id, throw
         `UndoConflictException(blockingEntry: DraftMutationLogEntry)`.
         Meaning: another user (or this user later) made a change on
         top of the one we're trying to undo, so undoing it would
         corrupt their work.
      4. Otherwise: deserialise `inverse_payload` to a `StoredMutation`
         and restore its `after` snapshot into the draft entity via
         `draftUpdateApplier.apply(draft, stored.after)` (task-088); mark
         the log entry UNDONE with `undone_at = now()`, increment
         `revision`, stamp `lastModifiedBy/At`. Return
         `draftVersionMapper.toDomain(draft)`.

  Redo:
    `redoLastForUser(estimationId, user: User)`:
      1. Find the latest UNDONE entry for this draft via
         `findLatestUndoneForDraft`. If null → 404.
      2. Conflict check: if the latest ACTIVE entry's
         `sequence_number > undone_entry.sequence_number`, throw
         `UndoConflictException` — a newer ACTIVE change has
         supplanted the redo target.
      3. Otherwise: deserialise `payload` to a `StoredMutation` and
         restore its `after` snapshot via
         `draftUpdateApplier.apply(draft, stored.after)`; mark the entry
         ACTIVE again, clear `undone_at`, bump revision, stamp.

  Submit:
    On `submitDraft`, after the draft is removed/transformed into a
    submitted version, delete all `draft_mutation_log` entries for that
    draft (cascade on delete already covers this — verify and rely
    on it).

  History:
    `historyFor(estimationId): List<DraftMutationLogEntry>` for the
    REST endpoint (task-075). Resolve the draft for `estimationId`; if
    none, 404 (consistent with undo/redo). Otherwise return the entries
    from `findAllByDraftIdOrderBySequence(draft.id)` — both ACTIVE and
    UNDONE, ordered by `sequence_number ASC` (may be empty).

  Implementation notes:
    - New service `UndoService` under `service/`. Inject
      `DraftEstimationVersionRepository`, `DraftMutationLogRepository`,
      `DraftVersionMapper`, the `ObjectMapper` (via `DraftMutationJackson`),
      and `AuditLogService`. It does NOT resolve the current user itself —
      every method takes the resolved `User` (see task-089).
    - Serialisation uses the Jackson-clean **wire DTOs**, NOT the raw
      domain types (those lose data through Jackson — see task-088). Each
      log entry stores a `StoredMutation(kind, before, after)` where
      `before`/`after` are `DraftUpdateDto` snapshots: `payload` =
      `StoredMutation(kind, beforeDto, afterDto)`, `inverse_payload` =
      `StoredMutation(kind, afterDto, beforeDto)`. Define `StoredMutation`
      and the JSON helpers in `DraftMutationJackson.kt` using the injected
      Quarkus `ObjectMapper` (plain data classes; no polymorphism or
      unknown-property config needed). Snapshots are captured with
      `draft.toUpdateDto()` and restored with `draftUpdateApplier.apply(...)`
      (both from task-088). The domain `EstimationVersion.diff` is used
      purely to decide whether anything changed (the no-op gate) and to
      source the `kind` string.
    - `UndoConflictException` is a regular Kotlin exception (carries
      the blocking entry) — task-075 maps it to a `409 Conflict` with
      a `ConflictDetailsDto`.
    - All three methods are `@Transactional`. Log at INFO on success
      (estimation id, kind, user) and ERROR on caught failures, per
      the task-071 conventions.
    - `undoLastForUser` and `redoLastForUser` each write an audit entry
      via `AuditLogService.log(user.id, "DraftEstimationVersion",
      draft.id, "UNDO" / "REDO", "revision=<after>")` — consistent with
      how create / submit / delete already audit. (This is what the
      injected `AuditLogService` is for; `recordMutation` does not audit —
      the log entry itself is the record.)

  Out of scope:
    - REST endpoints (task-075).
    - Finer-grained mutation kinds beyond `ReplaceWholeDraft`.
    - Cross-draft Undo (Undo only operates on the current draft).

steps:
  - |
    Add `UndoConflictException.kt` and `DraftMutationJackson.kt` under
    src/backend/implementation/src/main/kotlin/io/github/theestimator/service/.
    `DraftMutationJackson.kt` defines `StoredMutation(kind: String,
    before: DraftUpdateDto, after: DraftUpdateDto)` and small `toJson` /
    `fromJson` helpers over the injected Quarkus `ObjectMapper` (plain
    DTOs — no polymorphism or unknown-property config needed).

  - |
    Add a `findAllByDraftIdOrderBySequence(draftId: UUID): List<DraftMutationLogEntry>`
    finder (both ACTIVE and UNDONE, ordered by `sequenceNumber` ASC) to
    `DraftMutationLogRepository` (task-073) — `UndoService.historyFor`
    depends on it (the existing finders are active-only / latest-only).

  - |
    Add `UndoService.kt` under the same package with the three public
    methods described:
      fun recordMutation(draft: DraftEstimationVersion, before: EstimationVersion, after: EstimationVersion, beforeDto: DraftUpdateDto, afterDto: DraftUpdateDto, user: User)
      fun undoLastForUser(estimationId: UUID, user: User): EstimationVersion
      fun redoLastForUser(estimationId: UUID, user: User): EstimationVersion
      fun historyFor(estimationId: UUID): List<DraftMutationLogEntry>

    Modify `EstimationVersionResource.updateDraft` (which, after task-088,
    delegates the apply to `draftUpdateApplier.apply(draft, update)`) so
    that:
      - PRESERVE the existing `@RolesAllowed("ESTIMATOR")` on
        `updateDraft` (added by task-091) — do not drop it when editing
        the method; removing it reopens the security hole task-091 closed.
      - `UndoService`, `DraftVersionMapper`, `CurrentUserService`, and
        `CurrentUserProvider` are added to the resource's constructor
        injection (it currently injects none of them). Resolve the actor
        once: `val user = currentUserService.ensureUser(currentUserProvider.get())`.
        Because `updateDraft` is `@RolesAllowed`, the request is always
        authenticated, so `currentUserProvider.get()` is never null here
        (no null-handling needed); and task-091's `UserProvisioningFilter`
        has already provisioned the `User`, so this `ensureUser` call just
        finds the existing row (it's the clean way to obtain the `User`
        entity to pass to `recordMutation`).
      - BEFORE the apply call it captures `beforeDto = draft.toUpdateDto()`
        (task-088) and `before = draftVersionMapper.toDomain(draft)`.
      - AFTER the apply call it captures `afterDto = draft.toUpdateDto()`
        and `after = draftVersionMapper.toDomain(draft)`, then calls
        `undoService.recordMutation(draft, before, after, beforeDto, afterDto, user)`
        — which no-ops when `before.diff(after)` is `null`, otherwise
        inserts the log entry (a `StoredMutation` of the DTO snapshots),
        bumps `draft.revision`, and stamps `lastModifiedBy`/`lastModifiedAt`.
        Keep all existing behaviour (`calculateDraft`, `toDto`, audit
        logging) untouched.

  - |
    Verify `submitDraft` cleans up: because `draft_mutation_log` has
    `ON DELETE CASCADE` on `draft_version_id` (task-073), the entries
    disappear when the draft is removed during the submit flow. Add an
    explicit IT (`UndoServiceSubmitClearsLogIT`) asserting the rows
    are gone after submit.

  - |
    Unit + integration tests under
    src/backend/implementation/src/test/kotlin/io/github/theestimator/service/:
      - UndoServiceIT: persist a `User`, then drive recording by calling
        `undoService.recordMutation(...)` directly with that user and
        captured before/after snapshots (no REST/request context needed);
        `undoLastForUser(eid, user)` → draft state equals pre-update;
        `redoLastForUser(eid, user)` → equals post-update; a further undo
        with nothing left → 404.
      - UndoConflictIT: persist two `User` rows (userA, userB). Record
        userA's mutation passing userA, then userB's mutation passing
        userB, then `undoLastForUser(eid, userA)` → expect
        `UndoConflictException` carrying userB's entry as the blocker.
        Pure service-level — the methods take the `User`, so no request
        context or auth header is needed.
      - UndoServiceSubmitClearsLogIT (above).

  - |
    Update the "Undo log" note in CLAUDE.md's "Persistence shape"
    section: task-073 said "The service that records/applies mutations
    lands in task-074" — replace that with a one-line description of
    `UndoService` (record on update, undo/redo per user, `history`, and
    `UndoConflictException` on cross-user conflict).

  - |
    Build:
      ./gradlew :backend:implementation:test

validation:
  - |
    Service and exception files exist:
      test -f src/backend/implementation/src/main/kotlin/io/github/theestimator/service/UndoService.kt
      test -f src/backend/implementation/src/main/kotlin/io/github/theestimator/service/UndoConflictException.kt
      test -f src/backend/implementation/src/main/kotlin/io/github/theestimator/service/DraftMutationJackson.kt
      grep -q "fun undoLastForUser" src/backend/implementation/src/main/kotlin/io/github/theestimator/service/UndoService.kt
      grep -q "fun redoLastForUser" src/backend/implementation/src/main/kotlin/io/github/theestimator/service/UndoService.kt
      grep -q "fun recordMutation" src/backend/implementation/src/main/kotlin/io/github/theestimator/service/UndoService.kt
  - |
    Recording is wired into the update flow (in the REST resource), and
    the task-091 authorization annotation is preserved:
      grep -q "recordMutation" src/backend/implementation/src/main/kotlin/io/github/theestimator/rest/EstimationVersionResource.kt
      grep -q "@RolesAllowed(\"ESTIMATOR\")" src/backend/implementation/src/main/kotlin/io/github/theestimator/rest/EstimationVersionResource.kt
  - |
    UndoService logs via the Quarkus Log API, and the history finder exists:
      grep -q "Log\." src/backend/implementation/src/main/kotlin/io/github/theestimator/service/UndoService.kt
      grep -q "findAllByDraftIdOrderBySequence" src/backend/implementation/src/main/kotlin/io/github/theestimator/repository/DraftMutationLogRepository.kt
      grep -q "UndoService" CLAUDE.md
  - |
    Tests pass:
      ./gradlew :backend:implementation:test

