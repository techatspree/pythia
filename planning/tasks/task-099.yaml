id: task-099
phase: phase-15
title: Backend — add method column on Estimation (Flyway V9, immutable)
depends_on: [task-098]
description: |
  Bind every `Estimation` to exactly one `EstimationMethod` at
  creation time, and enforce that the method cannot change
  afterwards. This lands the storage + REST plumbing behind
  task-097's SPI so both the current PERT flow and the incoming
  bucket+sampled flow have somewhere to persist their choice.

  ## Frozen decisions (from task-096)

  - **Column location.** `estimation.method VARCHAR(255) NOT NULL` —
    new column on the `estimations` table (NOT on
    `draft_estimation_versions` / `submitted_estimation_versions`).
    Every version of one estimation shares the method. Use
    `VARCHAR(255)` to match the codebase's existing enum columns
    (project/version `status`, additional-cost `type` are all
    `VARCHAR(255)`) and the entity's default `@Enumerated(STRING)`
    mapping — this keeps Hibernate `validate` (dev-minikube/prod) happy.
  - **Migration.** Flyway `V9__estimation_method.sql`:
      `ALTER TABLE estimations ADD COLUMN method VARCHAR(255) NOT NULL
       DEFAULT 'THREE_POINT_PERT';`
    Backfilling is implicit thanks to the default; no `UPDATE`
    needed. Do NOT drop the default afterwards — the REST layer
    still relies on the column being nullable-free even if the
    frontend forgets to send it explicitly (belt + braces).
    NOTE: `%test` runs with `hibernate schema-management=drop-and-create`
    and `flyway.enabled=false`, so the test suite generates its schema
    from the JPA entities and NEVER executes this migration. A green
    `./gradlew build` therefore does NOT validate V9 — the migration is
    only exercised (under Hibernate `validate`) in dev-minikube/prod.
    Keep the column type identical to the entity mapping so `validate`
    cannot fail there.
  - **Immutability (by construction).** The method is fixed at
    estimation-creation time. `ProjectResource.createEstimation`
    (`POST /api/projects/{id}/estimations`) accepts the method
    (defaulting to `THREE_POINT_PERT` for backward compatibility with
    callers that ship no method). Immutability then holds
    AUTOMATICALLY: there is NO estimation-update endpoint (estimations
    are only created and read — the only estimation GETs are
    `EstimationResource.getEstimation` and the project-detail listing),
    so nothing can change the method after create. Do NOT add a PUT /
    409 rejection path — there is no endpoint to attach it to. If a
    future task introduces an estimation-edit endpoint, THAT task adds
    the immutability guard.
  - **DTO.** The real DTOs live in
    `rest/dto/ProjectDtos.kt`: extend `EstimationCreateDto` (request),
    and `EstimationSummaryDto` + `EstimationDetailDto` (responses — the
    method must appear on both, since `EstimationSummaryDto` is the
    create response and the project-detail list item, and
    `EstimationDetailDto` is the `getEstimation` response) with a
    `method: EstimationMethod` field. Use the domain's
    `EstimationMethod` enum directly (Quarkus/Jackson serialises enums
    as their name). This keeps the OpenAPI schema fully typed. Map the
    field in `rest/dto/ProjectMapper.kt`
    (`Estimation.toSummaryDto()` / `toEstimationDetailDto()`), and make
    `EstimationCreateDto.method` default to `THREE_POINT_PERT`.
  - **Logging.** `ProjectResource.createEstimation` logs INFO with the
    created estimation id and method, via `io.quarkus.logging.Log`
    (no per-class logger field, per the CLAUDE.md convention). (No
    WARN-on-rejection — there is no rejection path.)
  - **CLAUDE.md.** Update the "Persistence shape" and "REST API
    surface" sections: `estimations` table gains a `method` column
    (set at creation, immutable); the POST create body carries
    `method` and the estimation read DTOs return it; the method is
    immutable because there is no estimation-update endpoint.

  ## What does NOT belong in this task

  - No changes to leaf item shape or the discriminator — that is
    task-100.
  - No BUCKETED persistence tables — that is task-103.
  - No frontend routing changes based on method — that is task-101.
  - No shared-export dispatch refactor — that is task-107.

steps:
  - |
    Read the current entities, DTOs, service, and resource:
      src/backend/implementation/src/main/kotlin/io/github/theestimator/domain/Estimation.kt (JPA entity — package `domain`, NOT `model`)
      src/backend/implementation/src/main/kotlin/io/github/theestimator/rest/ProjectResource.kt (has createEstimation)
      src/backend/implementation/src/main/kotlin/io/github/theestimator/rest/EstimationResource.kt (has getEstimation only)
      src/backend/implementation/src/main/kotlin/io/github/theestimator/rest/dto/ProjectDtos.kt (EstimationCreateDto / EstimationSummaryDto / EstimationDetailDto)
      src/backend/implementation/src/main/kotlin/io/github/theestimator/rest/dto/ProjectMapper.kt (Estimation.toSummaryDto / toEstimationDetailDto)
      src/backend/implementation/src/main/kotlin/io/github/theestimator/service/EstimationService.kt (create(offer, project, description))
    Locate the Flyway migrations directory (latest is V8, so V9 is next):
      src/backend/implementation/src/main/resources/db/migration/
  - |
    Create
    `src/backend/implementation/src/main/resources/db/migration/V9__estimation_method.sql`
    with:
      ALTER TABLE estimations
        ADD COLUMN method VARCHAR(255) NOT NULL
        DEFAULT 'THREE_POINT_PERT';
    Leave the default in place (belt + braces). Use `VARCHAR(255)` to
    match the existing enum columns and the entity's enum mapping.
  - |
    Add the JPA field on the `Estimation` entity
    (`io.github.theestimator.domain.Estimation`). Match the entity's
    style — a defaulted non-null `var`, NOT `lateinit` (lateinit on a
    JPA enum read before assignment throws; a default also mirrors the
    SQL `DEFAULT` and satisfies the NOT NULL column):
      @Enumerated(EnumType.STRING)
      @Column(name = "method", nullable = false)
      var method: EstimationMethod = EstimationMethod.THREE_POINT_PERT
    Import the domain enum
    `io.github.theestimator.method.EstimationMethod`.
  - |
    Extend the estimation DTOs in `rest/dto/ProjectDtos.kt` with
    `method: EstimationMethod`:
      * `EstimationCreateDto` — add `val method: EstimationMethod =
        EstimationMethod.THREE_POINT_PERT` (defaulted, so older callers
        that omit it still work).
      * `EstimationSummaryDto` and `EstimationDetailDto` — add the
        `method` field to both (Summary is the create response + the
        project-detail list item; Detail is the getEstimation response).
    Map it in `rest/dto/ProjectMapper.kt`
    (`Estimation.toSummaryDto()` / `toEstimationDetailDto()`). Optionally
    add `@Schema(required = true)` to keep the field required in the
    generated OpenAPI. Regenerating the OpenAPI document is not this
    task's concern — the build's smallrye-openapi step runs it
    automatically; the frontend schema regen (task-100) picks it up.
  - |
    `ProjectResource.createEstimation` (POST /api/projects/{id}/estimations):
      * Pass `dto.method` through to `EstimationService.create(...)` —
        add a `method: EstimationMethod = EstimationMethod.THREE_POINT_PERT`
        parameter to `EstimationService.create` and set
        `estimation.method = method` there.
      * Log INFO with the created estimation id AND the chosen method,
        e.g. `Log.info("Created estimation \$id with method \$method")`.
    Do NOT add any PUT / 409 path — there is no estimation-update
    endpoint, so the method is immutable by construction (see the
    Immutability decision above).
  - |
    Tests (put each where the endpoint under test lives):
      * `.../rest/ProjectResourceIT.kt` — POST create with
        `method = BUCKET_SAMPLED_PERT` returns that method; POST with
        the method omitted defaults to `THREE_POINT_PERT`.
      * `.../rest/EstimationResourceIT.kt` — `GET /api/estimations/{id}`
        returns the persisted method.
  - |
    Update `CLAUDE.md`:
      * "Persistence shape" — the `estimations` table gains a `method`
        column, set at creation and immutable.
      * "REST API surface" — the POST create body carries `method`, and
        the estimation read DTOs return it; the method is immutable
        because there is no estimation-update endpoint.
  - |
    Build:
      ./gradlew :backend:implementation:test
      ./gradlew build

validation:
  - |
    Flyway V9 exists and adds the column with the expected default:
      test -f src/backend/implementation/src/main/resources/db/migration/V9__estimation_method.sql
      grep -q "ADD COLUMN method" src/backend/implementation/src/main/resources/db/migration/V9__estimation_method.sql
      grep -q "DEFAULT 'THREE_POINT_PERT'" src/backend/implementation/src/main/resources/db/migration/V9__estimation_method.sql
  - |
    JPA entity (package `domain`) has the method field, and the DTOs
    carry it:
      grep -q "var method: EstimationMethod" src/backend/implementation/src/main/kotlin/io/github/theestimator/domain/Estimation.kt
      grep -q "method: EstimationMethod" src/backend/implementation/src/main/kotlin/io/github/theestimator/rest/dto/ProjectDtos.kt
  - |
    Create path threads the method through the service and logs INFO:
      grep -q "method: EstimationMethod" src/backend/implementation/src/main/kotlin/io/github/theestimator/service/EstimationService.kt
      grep -q "Log.info" src/backend/implementation/src/main/kotlin/io/github/theestimator/rest/ProjectResource.kt
  - |
    CLAUDE.md documents the new column (use a distinctive phrase like
    "method column" so this is checkable):
      grep -q "method column" CLAUDE.md
  - |
    Full-stack build is green:
      ./gradlew build

