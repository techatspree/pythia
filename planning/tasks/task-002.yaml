id: task-002
phase: phase-1
title: Bootstrap Quarkus backend project
depends_on: [task-001]
description: |
  Generate a new Quarkus project under /backend with the extensions needed
  for REST, persistence, OIDC authentication, migrations, and OpenAPI docs.
steps:
  - cd backend
  - run Quarkus CLI to create a subproject named implementation with groupId io.github.theestimator, artifactId backend
  - add extensions:
      - resteasy-reactive-jackson
      - hibernate-orm-panache
      - jdbc-postgresql
      - oidc
      - smallrye-openapi
      - flyway
      - container-image-jib
      - smallrye-health
      - micrometer-registry-prometheus
  - configure application.properties for dev profile (local Postgres on port 5432)
  - verify "./mvnw quarkus:dev" starts and serves /q/health
  - create a testsuite for end-to-end tests as separate Maven subproject
  - create an end-to-end test in this testsuite that starts the backend server in the develeper stage using minikube and cheks for the /q/health endpoint
validation:
  - GET http://localhost:8080/q/health returns 200
  - GET http://localhost:8080/q/swagger-ui loads
  - execute test suite with only passing tests
outputs:
  - backend/pom.xml
  - backend/implementation/pom.xml
  - backend/implementation/src/main/resources/application.properties
  - backend/end2end/pom.xml
