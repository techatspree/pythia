id: task-203
phase: phase-14
title: "Relative server URL in the OpenAPI document"
depends_on: [task-201]
description: |
  Redocly reports `no-server-example.com` for the committed
  `src/frontend/src/lib/api/openapi.json`. Its `servers` block is
  auto-generated by Quarkus from the augmentation-time HTTP port:

      "servers": [
        { "url": "http://localhost:8080", "description": "Auto generated value" },
        { "url": "http://0.0.0.0:8080",   "description": "Auto generated value" }
      ]

  Neither URL is where the API lives for anyone reading the document. In
  every real setup the SPA and the API share an origin (nginx proxies `/api`
  in the cluster, Vite proxies it in dev). `0.0.0.0` is not even a reachable
  address. The block also carries a hidden coupling, which the root
  `CLAUDE.md` documents as a constraint: the dev port is profile-scoped
  (`%dev.quarkus.http.port=8090`) partly so that prod augmentation keeps
  emitting 8080, because a different port would churn the committed document
  and trip the drift gate.

  ## Decision

  Declare ONE relative server, `/`, and stop the auto-generation:
    quarkus.smallrye-openapi.servers=/
  (plus `quarkus.smallrye-openapi.auto-add-server=false` if the explicit list
  alone does not suppress the generated entries; verify). A relative URL
  resolves against the origin the document was fetched from, so Swagger UI
  at `/q/swagger-ui` and any client hit the right host in every stage. The
  document no longer depends on the build-time port.

  Paths already carry the `/api` prefix, so the server must be `/`, not
  `/api`. Redocly's `recommended` ruleset (task-204) also has
  `no-empty-servers` and `no-server-trailing-slash`. Removing the block
  entirely would trip the first; confirm `/` passes the second, which
  exempts the root. If it does not, record the finding and pick the form
  Redocly accepts that still resolves to the same origin.

  No endpoint, GUI or logging change. The Playwright suite is therefore NOT
  required: no DTO, auth or frontend behaviour changes, only the document's
  `servers` block.

  The old justification is written down twice — the root `CLAUDE.md` port
  paragraph and `docs/development.md` (~line 414, "emitting 8080 so the
  committed … openapi.json does not churn"). Both copies must go.

steps:
  - |
    Read the OpenAPI block of
    `src/backend/implementation/src/main/resources/application.properties` and
    the port paragraph of the root `CLAUDE.md` (the "dev backend listens on
    :8090" paragraph) and its counterpart in `docs/development.md` (~line 414).
  - |
    Set the server as decided, with a comment giving the reason (same origin
    everywhere; no dependency on the augmentation port). Rebuild with
    `./gradlew :backend:implementation:quarkusAppPartsBuild --rerun` and check
    that the snapshot's `servers` is exactly `[{"url": "/"}]`, with no
    `localhost`/`0.0.0.0` entry left. Confirm the key is honoured rather than
    silently ignored (the task-198 lesson): the document must change.
  - |
    Check the dev profile serves the same block. Before starting the stack,
    check that :8090, :5173 and :5432 are free (otherwise stop: another stack
    is running and the check would hit it). Start `./scripts/dev.sh`, then:
      curl -s 'http://localhost:8090/q/openapi?format=json' | jq -c .servers
    must print `[{"url":"/"}]`. A relative `/` resolves against the origin the
    document was fetched from, so Swagger UI's "Try it out" on `GET /api/ping`
    goes to `http://localhost:8090/api/ping`; clicking through
    `http://localhost:8090/q/swagger-ui` is an optional manual confirmation.
    Afterwards stop only the `dev.sh` this task started (its parent process is
    this session).
  - |
    Lint with Redocly and confirm `no-server-example.com`, `no-empty-servers`
    and `no-server-trailing-slash` are all absent:
      REDOCLY_TELEMETRY=off npx -y @redocly/cli@2.64.1 lint --extends=recommended --format=summary src/frontend/src/lib/api/openapi.json
    Pinned like task-201/202, so a newer ruleset cannot change the result.
    Other `recommended` findings are task-204's scope and may remain.
  - |
    Update the root `CLAUDE.md` port paragraph AND `docs/development.md`: the
    OpenAPI `servers` block no longer comes from the augmentation port, so drop
    that justification in both. KEEP the rest: 8090 stays profile-scoped and
    8080 stays free for the cluster port-forward. Re-read both passages so they
    still explain why the setting is profile-scoped.
  - |
    ./gradlew build regenerates `openapi.json` (and `schema.d.ts`, which is
    expected to stay unchanged — openapi-typescript emits nothing from
    `servers`). Leave the files in the working tree; do NOT commit (the user
    commits). Say in the report that the CI drift gate
    (`verifyOpenApiSchemaCommitted`) requires `openapi.json` to be committed
    together with the property.

validation:
  - |
    J=src/frontend/src/lib/api/openapi.json
    test "$(jq -c '.servers' $J)" = '[{"url":"/"}]'
    ! grep -q '0.0.0.0:8080\|localhost:8080' $J
  - |
    grep -q "smallrye-openapi.servers" src/backend/implementation/src/main/resources/application.properties
  - |
    ! grep -q "prod augmentation must keep emitting 8080" CLAUDE.md
    ! grep -q "emitting 8080" docs/development.md
    grep -q "port-forward svc/frontend 8080:80" CLAUDE.md
  - |
    ! REDOCLY_TELEMETRY=off npx -y @redocly/cli@2.64.1 lint --extends=recommended --format=summary src/frontend/src/lib/api/openapi.json 2>&1 | grep -E "no-server-example.com|no-empty-servers|no-server-trailing-slash"
  - |
    ./gradlew build

outputs:
  - modified: src/backend/implementation/src/main/resources/application.properties
  - modified: src/frontend/src/lib/api/openapi.json
  - "modified only if regenerated differently (expected unchanged): src/frontend/src/lib/api/schema.d.ts"
  - modified: CLAUDE.md
  - modified: docs/development.md
