id: task-134
phase: phase-15
title: Bucket view — collapsed rows that stay drop targets
depends_on: [task-132, task-133]
description: |
  Re-bucketing by drag is impractical on a real estimation. A Merlin import
  (task-131) puts every leaf into a single "Imported" bucket, so the bucket
  view (task-132) renders one bucket row followed by all its leaves — on the
  user's document that is 117 rows — and the next bucket row sits below all
  of them. Dragging an item into another bucket therefore means dragging
  while scrolling, which is exactly the case the feature exists for.

  Target state: in the **bucket view** every bucket row starts **collapsed**,
  so all buckets are visible together and a cross-bucket drag is a short
  movement. The user expands the bucket they want to work in.

  ── The constraint, and the ONE mechanism that satisfies it ──
  `TreeTable` currently renders a row's children dndzone only when the row is
  expanded (`{#if isGroup && ctx.expanded}`), so a collapsed row has no drop
  zone and could not receive a drop.

  A first attempt at fixing that by "spring-loading" (expanding a collapsed
  row when a drag hovers it) was implemented, measured and **reverted** —
  do NOT re-attempt it. `svelte-dnd-action`'s `watchDraggedElement()` reads
  the `typeToDropZones` registry ONCE at drag start, attaches its
  `draggedEntered`/`draggedOver` listeners to exactly those zones, and passes
  that captured set to `observe(...)`. A zone created **during** a drag is
  registered but never observed, so it can never become the target. Measured
  A/B on the real UI: target expanded BEFORE the drag → drop lands; identical
  drag with the target sprung open mid-drag → the zone opens under the cursor
  and the drop does NOT land.

  The mechanism must therefore make the zone **exist at drag start**. This
  task does that by rendering a group's zone and its child rows ALWAYS, and
  merely collapsing the children VISUALLY when the row is collapsed:
    - the zone is always in the DOM, so it is registered and observed like
      any other zone;
    - its `items` array and its DOM children stay in one-to-one
      correspondence, so `applyChildren` keeps its current REPLACE semantics
      and the cycle/anomaly protection is untouched. (The alternative —
      rendering a collapsed zone with `items: []` — would need TreeTable to
      append instead of replace, or a collapsed group's real children would
      be destroyed. Rejected as too risky for the generic component.)

  ── Key design decisions (do not deviate) ──
  - **Visual collapse = zero height + `visibility: hidden`** on the child row
    wrapper (Tailwind `h-0 overflow-hidden invisible`). NOT `display: none`:
    a `display:none` element has no layout box, which breaks the library's
    geometry. `visibility: hidden` keeps the box (so measurement works) AND
    removes the subtree from the tab order, which matters — otherwise every
    hidden row's inputs would stay keyboard-reachable while invisible.
  - **Hiding is inherited.** `renderRow` takes a `hidden` flag; a collapsed
    row passes `true` to its children, and a child passes
    `hidden || !ctx.expanded` down, so a collapsed subtree stays hidden at
    every depth.
  - **A collapsed zone only claims space while a drag is in flight.** Give it
    `min-h-8` when `!ctx.expanded && dragActive`, where
    `dragActive = $derived(draggedSubtreeIds.size > 0)` reuses the EXISTING
    drag-state set — do not add a second drag flag. Idle, a collapsed row
    stays visually tight; during a drag each collapsed row exposes a hittable
    strip. Keep the existing unconditional `min-h-8` for genuinely EMPTY
    zones (the task-133 follow-up fix) — that is a separate case.
  - **Only the bucket view seeds `initialCollapsed`.** The hierarchy view
    keeps today's fully expanded tree — there the nesting *is* the
    information. `TreeTable.initialCollapsed` already exists as a prop with
    no caller; this is its first consumer.
  - **Collapse state is transient.** `collapsed` is seeded once from
    `initialCollapsed` (the deliberate local-`$state` exception recorded in
    CLAUDE.md) and is NOT persisted — unlike the view choice, which lives in
    `localStorage` under `estimator.bucketView`.
  - **Two consequences of "seeded once" that are EXPECTED, not bugs.**
    (a) The bucket-view `TreeTable` lives in the view toggle's `{:else}`
    branch, so switching to the hierarchy view and back remounts it and the
    rows collapse again, discarding the user's expansions. (b) The seed is
    only non-empty because the route assigns `currentBuckets` (in
    `loadVersion`) BEFORE it resolves `EditorComponent`. Do not reorder those
    two assignments, and do not add a `buckets.length > 0` render gate.
  - **Accepted trade-offs:** every row stays in the DOM even when collapsed
    (this buys visual distance, not rendering volume), and the bucket view
    opens showing no leaf rows, which is worse for simply reading numbers —
    the hierarchy view (unchanged, fully expanded) remains the reading view.
    An expand/collapse-all control would soften the latter and is a separate
    task; do NOT add one here.
  - **Keyboard stays usable.** The chevron is already keyboard-reachable
    (Space/Enter) so a keyboard user expands a bucket before dragging, and
    the per-row bucket `<select>` remains the primary keyboard path for
    re-bucketing. `visibility: hidden` keeps collapsed rows out of the tab
    order, which is the correct behaviour.
  - Frontend-only: no domain, backend, DTO, OpenAPI or migration change.

steps:
  - |
    In `src/frontend/src/lib/components/treetable/TreeTable.svelte`:
      - add `const dragActive = $derived(draggedSubtreeIds.size > 0);` next to
        the existing drag state (no new flag, no timers).
      - change the children-zone gate from `{#if isGroup && ctx.expanded}` to
        `{#if isGroup}` so the zone is always in the DOM and is therefore
        registered before any drag starts.
      - on that zone div, keep the existing
        `class:min-h-8={wrappedChildren.length === 0}` and add
        `class:min-h-8={!ctx.expanded && dragActive}` (combine into one
        expression if cleaner) so a collapsed row exposes a hittable strip
        only while a drag is in flight.
      - give the `renderRow` snippet a fourth parameter `hidden: boolean`.
        Apply `class:h-0={hidden} class:overflow-hidden={hidden}
        class:invisible={hidden}` to the row's outer
        `<div data-testid="tt-row-…">`. Pass `false` from the root zone's
        `{@render renderRow(w.node, [idx], 0, false)}` and
        `hidden || !ctx.expanded` from the children zone's render call.
    Add a short comment recording WHY the zone is always rendered (the
    library captures its drop zones at drag start).

  - |
    In `src/frontend/src/lib/methods/bucketSampled/EditorModule.svelte`, seed
    the bucket view's TreeTable with every bucket row collapsed: a plain
    `const` (NOT `$derived` — it is a mount-time seed) holding a
    `Set<string>` of the synthetic row ids (`bucket:<id>` for each bucket plus
    `bucket:unassigned`), passed as `initialCollapsed` on the bucket-view
    `<TreeTable>` only. Leave the hierarchy-view instance untouched.

  - |
    Extend `src/frontend/e2e/bucket-views.test.ts` with two tests whose
    titles contain the exact phrases **"collapsed by default"** and
    **"collapsed bucket"** (the validation greps assert them):
      - **collapsed by default**: open the draft in bucket view and assert
        the bucket rows are present while their leaf rows are not VISIBLE —
        the rows still exist in the DOM by design, so assert visibility
        (`toBeHidden()` / a zero bounding box), NOT `toHaveCount(0)` — and
        that clicking the row's Expand control reveals them.
      - **collapsed bucket**: drag a leaf from an expanded source bucket into
        a still-COLLAPSED target bucket's zone and assert the drop lands (the
        leaf's bucket `<select>` shows the target). This is the case the
        reverted spring-load approach could not do.
    **Both tests must register a `page.on('pageerror', …)` collector and
    assert it stayed empty.** Every DnD defect here so far surfaced as a
    thrown exception that aborted the render mid-update, leaving the UI
    silently inconsistent rather than visibly failing.
    Keep the existing tests green — they now start from a collapsed view, so
    they may need to expand the source bucket first; adjust them rather than
    weakening them.

  - |
    Update `CLAUDE.md`: in the `treetable/TreeTable.svelte` paragraph record
    that a group's children zone is now rendered even when collapsed —
    because `svelte-dnd-action` captures its drop zones **at drag start**, so
    a zone that appears later can never receive the drop — with the children
    visually collapsed via `h-0 overflow-hidden invisible` (keeping items and
    DOM in sync, so the replace semantics and cycle protection are unchanged)
    and a `min-h-8` strip while a drag is in flight. In the
    `methods/bucketSampled/` prose record — using the exact phrase **"bucket
    rows collapsed"** — that the bucket view starts with all bucket rows
    collapsed via `initialCollapsed` (transient, re-seeded when the view
    toggle remounts the table) while the hierarchy view stays expanded.

  - |
    Validate — type-check, strict lint, full build, and the e2e suite
    (`npm run lint` is required because `:frontend:check` runs ESLint only in
    the informational `lint:report` mode):
      ./gradlew :frontend:check
      cd src/frontend && npm run lint
      ./gradlew build
      cd src/frontend && npm run test:e2e

validation:
  - |
    The zone is no longer gated on expansion, and the drag-state reuse plus
    the empty-zone fix are both in place:
      ! grep -q "isGroup && ctx.expanded" src/frontend/src/lib/components/treetable/TreeTable.svelte
      grep -q "dragActive" src/frontend/src/lib/components/treetable/TreeTable.svelte
      grep -q "draggedSubtreeIds" src/frontend/src/lib/components/treetable/TreeTable.svelte
      grep -q "min-h-8" src/frontend/src/lib/components/treetable/TreeTable.svelte
      grep -q "invisible" src/frontend/src/lib/components/treetable/TreeTable.svelte
  - |
    The bucket view seeds initialCollapsed (it had no caller before this
    task) and the hierarchy view does not:
      grep -q "initialCollapsed" src/frontend/src/lib/methods/bucketSampled/EditorModule.svelte
      grep -q "bucket:unassigned" src/frontend/src/lib/methods/bucketSampled/EditorModule.svelte
      test "$(grep -c 'initialCollapsed' src/frontend/src/lib/methods/bucketSampled/EditorModule.svelte)" -le 2
  - |
    Frontend console convention still holds on the touched files:
      ! grep -q "console\." src/frontend/src/lib/components/treetable/TreeTable.svelte
      ! grep -q "console\." src/frontend/src/lib/methods/bucketSampled/EditorModule.svelte
  - |
    The e2e covers the collapsed default AND the drop into a collapsed
    bucket, and guards the silent-crash failure mode. Assert the NEW test
    titles by their exact phrases — a bare "collaps" already matches an
    existing comment in this file and would pass without any change:
      grep -q "collapsed by default" src/frontend/e2e/bucket-views.test.ts
      grep -q "collapsed bucket" src/frontend/e2e/bucket-views.test.ts
      test "$(grep -c "pageerror" src/frontend/e2e/bucket-views.test.ts)" -ge 3
  - |
    Docs record both halves. Assert phrases this task INTRODUCES — bare
    `initialCollapsed` already appears in the `$bindable` prose and would
    pass unchanged:
      grep -qi "at drag start" CLAUDE.md
      grep -qi "bucket rows collapsed" CLAUDE.md
  - |
    Type-check, strict lint, full build and the e2e suite pass:
      ./gradlew :frontend:check
      cd src/frontend && npm run lint
      ./gradlew build
      cd src/frontend && npm run test:e2e

