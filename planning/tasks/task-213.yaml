id: task-213
phase: phase-20
title: "Accompanying work in hours: convert to PT, per-tenant setting"
depends_on: [task-187, task-215]
description: |
  Accompanying work (`TimeRelativeEstimationItem`, a `TIME_RELATIVE` leaf) is
  entered in **hours per week**: the unit is "h/Woche" in the item's default,
  in both editors' type selects and in Excel. Its effort was computed as
  (task-042):

      mean     = PERT(min, likely, max) × phase.durationWeeks
      variance = PERT-variance(min, max) × durationWeeks²

  and that mean was summed with every other leaf as **person-days (PT)**,
  feeding risk surcharge, driver surcharge, offer-PT, cost and price. Nothing
  converted hours to days, so every estimate with accompanying work counted
  hours as days: the seeded Webshop draft's "Projektbegleitung" (2 / 4 / 8
  h/Woche, phase KO of 4 weeks) contributed 17.33 PT instead of 2.17 PT, a
  factor of 8.

  ## Decision (2026-10-15)

  The inputs ARE hours. Hours become person-days by DIVIDING by the hours of a
  working day. That number is a **per-installation (tenant) setting**,
  editable by an administrator in the system settings (task-146), default 8.
  The editors make the unit visible: values in hours are shown in *italics*,
  values in person-days in the normal font.

  ## The formula

      mean     = PERT(min, likely, max) × durationWeeks / hoursPerDay
      variance = PERT-variance(min, max) × durationWeeks² / hoursPerDay²

  Variance scales with the SQUARE of the factor, like the weeks. Everything
  downstream (risk factor, driver surcharge, offer-PT, cost, price, totals,
  the summary panel, Excel/CSV/Merlin exports) follows automatically, because
  it all reads the leaf's `mean`/`variance`. Accompanying work stays out of
  the schedule (task-177), so schedules and phase windows do not change.

  ## Where hoursPerDay lives (domain, single source of truth)

  - `EstimationDefaults.HOURS_PER_DAY = 8.0` (the existing `@JsExport` object,
    beside `DAILY_RATE` etc.).
  - `CalculationParameters` gains `val hoursPerDay: Double = EstimationDefaults.HOURS_PER_DAY`.
    `TimeRelativeEstimationItem.mean`/`variance` divide by
    `calculationParameters.hoursPerDay`.
  - `EstimationVersion` gains `val hoursPerDay: Double = EstimationDefaults.HOURS_PER_DAY`,
    a calculation INPUT like `dailyRate`, supplied by the caller from the
    tenant setting. It is not stored per version (see "Out of scope").
  - **The trap in `calculate()`:** it sums the leaves' `mean` and `variance`
    into the risk factor BEFORE it stamps `CalculationParameters` on them, and
    `:domain:core` cannot see `TimeRelativeEstimationItem` (task-143). So the
    leaves must already carry the version's `hoursPerDay` when they are
    summed: first map each leaf through
    `withCalculationParameters(CalculationParameters(hoursPerDay = hoursPerDay))`,
    compute totals and risk factor from those, then build the full
    `CalculationParameters(riskFactor, totalDriverFactor, dailyRate, salesSurcharge, hoursPerDay)`
    as now. A test with `hoursPerDay = 6.0` must prove that the risk factor
    and the totals use 6 throughout, not the default.
  - Kotlin/JS: `CalculationParameters` and `EstimationDefaults` are exported,
    so `domain.d.mts` gains the field and the constant. `DomainFactory.createVersion`
    takes a trailing, defaulted `hoursPerDay` AFTER `roots`: `adapter.ts` calls
    it positionally, and inserting it earlier shifts every later argument
    (the task-186 lesson). In `TimeRelativeEstimationItem`, do NOT use
    `super.mean` / `super.variance`: inline the formula (Kotlin/JS recursion,
    root CLAUDE.md, and the existing comment in that file).

  ## The tenant setting (backend)

  - `V21__hours_per_day.sql`: `ALTER TABLE system_settings ADD COLUMN
    hours_per_day DOUBLE PRECISION NOT NULL DEFAULT 8` with
    `CHECK (hours_per_day > 0 AND hours_per_day <= 24)`. Mirror column AND
    check on the `SystemSettings` entity (it already uses
    `@Table(check = [...])`), per the V15/V18 parity rule: `%dev`/`%test`
    build the schema from Hibernate.
  - `SystemSettingsDto` gains `hoursPerDay: Double`; `GET /api/system` stays
    `@PermitAll` (public branding endpoint; the number is not sensitive).
  - **New endpoint** `PUT /api/system/hours-per-day`, body
    `{ "hoursPerDay": 7.5 }` → `204`; `@RolesAllowed("ADMIN")`; `400` when not
    in (0, 24]. It is a sub-resource like `/effort-drivers`, deliberately NOT a
    field of the existing `PUT /api/system`: there a null `displayName` means
    "clear the name", so a hours-only PUT would wipe the name. `Log.info` with
    the admin's subject id and the new value.
  - `DraftVersionMapper.toDomain` (the single place the backend builds a
    domain `EstimationVersion`) sets `hoursPerDay` from the setting, so the
    draft read, its calculation and `submitDraft`'s snapshot all use it.
  - **Startup order (the trap):** `TestDataSeeder` observes `StartupEvent` at
    `@Priority(1)` and submits drafts, which now READS the setting via
    `SystemSettingsRepository.get()`. `SystemSettingsBootstrap` (which creates
    the singleton row in `%dev`/`%test`, where Flyway is off) observes the
    same event WITHOUT `@Priority`, so it runs AFTER the seeder, and `get()`
    fails with "system_settings row 1 is missing". Give its observer
    `@Priority(Interceptor.Priority.PLATFORM_BEFORE)`, with a comment pointing
    at the seeder, as `MethodRegistryBootstrap` documents for the same trap.

  ## The frontend

  - `$lib/stores/system.svelte.ts`: `hoursPerDay` getter, falling back to
    `EstimationDefaults.HOURS_PER_DAY` until loaded.
  - `adapter.ts` `computeEstimation` passes it to `createVersion`; every caller
    hands in `system.hoursPerDay` reactively, so a change on the admin page
    recalculates open drafts on their next render.
  - Admin page `routes/admin/system/+page.svelte`: a "Arbeitszeit" section
    with the number field and its own save button, as wireframed.
  - Italics: in the PERT grid (`EstimationGrid.svelte`) and the bucket editor
    (`methods/bucketSampled/EditorModule.svelte`), a TIME_RELATIVE row's
    Optimistic / Likely / Pessimistic inputs, and in the PERT grid also its
    "PERT" cell (computed from the raw inputs, so also hours per week), get
    `italic` plus `data-unit="hours"` and a `title` tooltip that explains the
    unit. Everything in person-days (Mittelwert, Angebots-PT, Kosten, …) stays
    normal. A FIXED or BUCKETED row is unchanged.

  ## Existing data

  - **Drafts** are recalculated on every read, so every draft with
    accompanying work shows the corrected (smaller) effort and price from the
    moment this ships. That is the point of the fix; it is called out in the
    docs.
  - **Submitted versions** store their calculated values and are never
    recomputed on read, so they keep the numbers they were submitted with.
    Changing hours-per-day later likewise affects drafts only.
  - The seed keeps its values; they were always meant as hours.

  ## Recording hours-per-day on submitted versions (decided 2026-10-15)

  A submitted version records the hours-per-day it was calculated with, so a
  later change of the setting can be explained rather than looking like a
  re-estimate:

  - `V21` also adds `submitted_estimation_versions.hours_per_day DOUBLE
    PRECISION` **NULL**, with `CHECK (hours_per_day IS NULL OR (hours_per_day > 0
    AND hours_per_day <= 24))` (mirrored on `SubmittedEstimationVersion` per
    the parity rule). **Existing rows stay NULL**: they were calculated BEFORE
    this task, with hours counted as person-days, so stamping 8 on them would
    be false. NULL means "calculated before the conversion".
  - `EstimationVersionService.snapshotDraft` copies the value the snapshot was
    calculated with (the tenant setting at submit time).
  - `EstimationVersionDto` gains `hoursPerDay: Double?`: for a draft the
    current tenant setting, for a submitted version the stored value (NULL for
    legacy versions).
  - **Comparison**: `VersionComparisonService.compareParameters` adds
    `hoursPerDay` to its fixed list, so a difference appears as an ordinary
    row in the compare page's existing parameter table, labelled
    `panel.parameters.hoursPerDay` (the page maps `pc.name` onto that key and
    already renders a null side as "—"). When one side is the live draft, the
    transient version the service compares must carry the current setting.
  - **Summary panel**: one line stating the basis, for drafts and submitted
    versions alike, shown only when the version contains accompanying work
    (as wireframed).
  - **Excel export**: the "Parameter" sheet gains a row
    `ExcelGermanLabels.Parameters.HOURS_PER_DAY = "Stunden pro Arbeitstag"`
    with the version's value, left out for a legacy NULL. The importer needs
    NO change: `ExcelImporter.importParameters` already ignores unknown
    parameter rows (`else -> Log.debug(…)`), and an imported draft is a draft,
    so it follows the tenant setting like every other draft. A test pins that.
  - Continuing an estimate (`cloneFromSubmitted` → a new draft) recalculates
    with the CURRENT setting. If that differs from the submitted version's,
    the new draft's accompanying effort differs from the version it was
    cloned from; the summary line and the comparison now make that visible.

  ## Out of scope

  A per-estimation override, and recalculating submitted versions.

  ## Wireframes

  ### Systemeinstellungen (ADMIN): new section "Arbeitszeit"

      … (Name der Organisation, unchanged) …
      +--------------------------------------------------------------------+
      | Arbeitszeit                                                        |
      | Wird verwendet, um begleitende Leistungen (h/Woche) in             |
      | Personentage umzurechnen: Stunden ÷ Stunden pro Arbeitstag.        |
      | Stunden pro Arbeitstag                                             |
      | [ 8        ]                                                       |
      | [ Arbeitszeit speichern ]                                          |
      +--------------------------------------------------------------------+
      … (Standard-Aufwandstreiber, Eigenes Stylesheet, unchanged) …

    - Section placed directly after "Name der Organisation", same markup
      pattern (`<section class="mb-8 border rounded-lg p-4 bg-white">`,
      heading, hint, label, input, `Button`).
    - Heading `admin.system.hoursSection` ("Arbeitszeit" / "Working time"),
      hint `admin.system.hoursHint`, label `admin.system.hoursLabel`, button
      `admin.system.hoursSave`.
    - Input: `type="number"`, `step="0.25"`, `min="0.25"`, `max="24"`,
      `id="system-hours-per-day"`, `data-testid="system.hours-per-day"`.
      Button `data-testid="system.save-hours-per-day"`.
    - On success: the existing `system-notice` shows `admin.system.hoursSaved`,
      and `system.apply(...)` refreshes the store so open editors recalculate.
      Out of range: the save is not sent, the existing `ErrorBanner` shows
      `admin.system.hoursInvalid`. A backend `400` lands in the same banner
      via `assertOk`.
    - Only ADMIN reaches this page (`RequiredRole role="ADMIN"`, unchanged).

  ### PERT editor: accompanying-work row (hours in italics)

      | Beschreibung          | Typ         | Phase  | Optim. | Erwartet | Pessim. | PERT   | … | Angebots-PT |
      |-----------------------+-------------+--------+--------+----------+---------+--------+---+-------------|
      |   Projektbegleitung   | [h/Woche v] | [KO v] |  /2/   |   /4/    |   /8/   | /4,33/ | … |        2,94 |
      |   Systemarchitektur   | [ Fix    v] | [KO v] |   2    |    3     |    5    |  3,17  | … |        4,30 |

    - `/x/` marks italics. The TIME_RELATIVE row's three inputs and its PERT
      cell carry `class="… italic"`, `data-unit="hours"` and
      `title={$_('grid.hoursPerWeekTitle', { values: { hours: system.hoursPerDay } })}`.
      The FIXED row is unchanged.
    - Angebots-PT 2,94 = 4,33 h × 4 weeks ÷ 8 = 2,17 PT, plus the version's
      risk surcharge. Illustrative; the domain computes it.
    - Read-only (submitted) versions: the same italics on the read-only spans.

  ### Bucket editor: accompanying-work row (hours in italics)

      |   Projektbegleitung   | [h/Woche v] |  —  |  —  | [UM v] | /0,5/ | /1,0/ | /2,0/ | 1,63 | … |

    - Same treatment as the PERT grid for the three effort cells (`italic`,
      `data-unit="hours"`, the same `title`). Mittelwert 1,63 = 1,08 h × 12
      weeks ÷ 8 is in PT and stays normal.

  ### Summary panel: conversion basis (version with accompanying work)

      +-------------------------------------------------------------------------------+
      | GESAMTÜBERSICHT                                                     7 Positionen |
      | … (rows unchanged) …                                                           |
      | Begleitende Leistungen: Stunden ÷ 8 Std. pro Arbeitstag                        |
      +-------------------------------------------------------------------------------+

    - New line at the bottom of `EstimationSummaryPanel`, `text-xs text-ink-muted`,
      `data-testid="version-summary.hours-per-day"`, text
      `summary.hoursPerDay` with `{hours}` formatted via `$lib/format.ts`.
    - Draft: the current tenant setting (`system.hoursPerDay`). Submitted: the
      version's stored `hoursPerDay`.
    - Hidden when the version has no TIME_RELATIVE leaf; the route passes a
      `hasAccompanyingWork` flag derived from its roots (no math, a type check).

  ### Summary panel: submitted before the conversion (legacy, NULL)

      | Begleitende Leistungen: vor der Umrechnung berechnet – Stunden zählen hier als Personentage |

    - Same element and testid, text `summary.hoursPerDayLegacy`, shown for a
      submitted version whose `hoursPerDay` is null and which has
      accompanying work.

  ### Version comparison: hours-per-day differs

      | Parameter                | Version 1 | Entwurf |
      |--------------------------+-----------+---------|
      | Stunden pro Arbeitstag   | 8         | 7.5     |

    - No new component: a row of the EXISTING parameter-changes table
      (`compare/+page.svelte`), labelled by the new key
      `panel.parameters.hoursPerDay`. A legacy NULL side shows "—", as the
      table already does for null values.

  ### i18n keys (both catalogs, key for key)

  | key | de | en |
  |---|---|---|
  | `admin.system.hoursSection` | Arbeitszeit | Working time |
  | `admin.system.hoursHint` | Wird verwendet, um begleitende Leistungen (h/Woche) in Personentage umzurechnen: Stunden ÷ Stunden pro Arbeitstag. | Used to convert accompanying work (h/week) into person-days: hours ÷ hours per working day. |
  | `admin.system.hoursLabel` | Stunden pro Arbeitstag | Hours per working day |
  | `admin.system.hoursSave` | Arbeitszeit speichern | Save working time |
  | `admin.system.hoursSaved` | Arbeitszeit gespeichert. | Working time saved. |
  | `admin.system.hoursInvalid` | Bitte eine Zahl größer als 0 und höchstens 24 eingeben. | Please enter a number greater than 0 and at most 24. |
  | `grid.hoursPerWeekTitle` | Stunden pro Woche – umgerechnet in Personentage mit {hours} Std. pro Arbeitstag | Hours per week – converted to person-days at {hours} h per working day |
  | `summary.hoursPerDay` | Begleitende Leistungen: Stunden ÷ {hours} Std. pro Arbeitstag | Accompanying work: hours ÷ {hours} h per working day |
  | `summary.hoursPerDayLegacy` | Begleitende Leistungen: vor der Umrechnung berechnet – Stunden zählen hier als Personentage | Accompanying work: calculated before the conversion – hours count as person-days here |
  | `panel.parameters.hoursPerDay` | Stunden pro Arbeitstag | Hours per working day |

