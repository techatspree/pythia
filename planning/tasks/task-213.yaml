    import json, pathlib, sys
    cats = {p.stem: json.loads(p.read_text())
            for p in pathlib.Path('src/frontend/src/lib/i18n').glob('*.json')}
    def flat(o, p=''):
        s = set()
        for k, v in o.items():
            n = f'{p}.{k}' if p else k
            s |= flat(v, n) if isinstance(v, dict) else {n}
        return s
    keys = {l: flat(d) for l, d in cats.items()}
    ref = set().union(*keys.values())
    bad = {l: sorted(ref - k) for l, k in keys.items() if ref - k}
    need = {'admin.system.hoursSection', 'admin.system.hoursHint', 'admin.system.hoursLabel',
            'admin.system.hoursSave', 'admin.system.hoursSaved', 'admin.system.hoursInvalid',
            'grid.hoursPerWeekTitle', 'summary.hoursPerDay', 'summary.hoursPerDayLegacy',
            'panel.parameters.hoursPerDay'}
    missing = {l: sorted(need - k) for l, k in keys.items() if need - k}
    def get(cat, key):
        for part in key.split('.'):
            if not isinstance(cat, dict) or part not in cat:
                return None
            cat = cat[part]
        return cat
    same = sorted(k for k in need if get(cats['de'], k) is not None and get(cats['de'], k) == get(cats['en'], k))
    print('parity:', bad or 'ok', '| new:', missing or 'ok', '| untranslated:', same or 'none')
    sys.exit(1 if (bad or missing or same) else 0)
