id: task-206
phase: phase-18
title: "One CycloneDX SBOM for Pythia, built and released"
depends_on: [task-199, task-205]
description: |
  Pythia ships two container images built from hundreds of third-party
  components, and nothing records which. There is no Software Bill of
  Materials (SBOM). That leaves three gaps: a consumer cannot see what a
  release contains, a vulnerability advisory cannot be matched against a
  release after the fact, and no license-compliance check is possible
  (task-207 builds on exactly this). This task makes the build produce ONE
  CycloneDX SBOM for the whole application and publishes it as its own
  release artifact.

  ## One SBOM, two components

  CycloneDX lets a component contain components. The SBOM describes the
  application `pythia` with its two parts, each holding the libraries it
  ships:

      metadata.component   pythia (application, X.Y.Z, Apache-2.0)
      components:
        pythia-backend     (application, X.Y.Z, Apache-2.0)
          components:      the 261 jars Quarkus packages
        pythia-frontend    (application, X.Y.Z, Apache-2.0)
          components:      the 16 npm packages in the SPA bundle
                           + the 5 Kotlin/JS libraries and our own Kotlin/JS
                             modules compiled into domain.mjs
      dependencies:        pythia → [pythia-backend, pythia-frontend],
                           each part → its libraries' graph

  The build writes it to `build/sbom/pythia.cdx.json`. A release publishes it
  as `pythia-vX.Y.Z.cdx.json` + `pythia-vX.Y.Z.cdx.json.sha256`, as its own
  GitHub Release asset next to the deploy bundle. The bundle (task-199) is
  NOT changed.

  **Scope: the application, not the images' operating systems.** The base
  images' OS packages (Red Hat UBI 9, Alpine) are not part of the
  application. The CI Trivy scan already covers their vulnerabilities, and
  task-208 reviews their licenses once. They are deliberately not in this
  SBOM; adding them later as `container` components would be a separate
  decision.

  ## Where each part comes from (measured 2026-10-13)

  | part | ships | raw source | notes |
  |---|---|---|---|
  | `pythia-backend` | the 261 jars in `build/quarkus-app/lib/{boot,main}` | CycloneDX Gradle plugin `org.cyclonedx.bom` 3.5.1 on `:backend:implementation`, `includeConfigs = ["quarkusProdRuntimeClasspathConfiguration"]`, then TRIMMED to the jars | the plugin resolves POM licenses: of 270 raw components only our own 4 `io.pythia` modules lack one |
  | `pythia-frontend` | 16 npm packages in the bundle, plus what is compiled into `src/lib/domain/domain.mjs` (460 KB): the Kotlin/JS libraries `kotlin-stdlib-js`, `kotlin-dom-api-compat`, `kotlinx-datetime-js`, `kotlinx-serialization-core-js` (via `kotlinx-datetime`) and `kotlin-logging-js`, and our own modules `io.pythia:core`, `method-threepoint`, `method-bucketsampled` | `rollup-plugin-sbom` 3.2.3 (MIT; peers `vite ^5‖^6‖^7‖^8`; NOT 4.x, see decision 6) for the npm part; the CycloneDX Gradle plugin on `:domain`, `includeConfigs = ["jsRuntimeClasspath"]`, for the Kotlin/JS part | the npm part has licenses for all 16; the Kotlin/JS part is invisible to every npm tool, yet it ships to every browser. Measured on `:domain`: the plugin lists each Kotlin library twice, as a `-js` klib (`?type=klib`, the shipped one) and as a `type=pom` umbrella without the suffix; all five carry Apache-2.0; our own modules carry no license |

  ### Why not the alternatives (so nobody re-tries them)

  - **Plugin defaults** (all configurations): 643 backend components, incl.
    test and build tooling (LGPL-3.0 `lit-element-state` from the Quarkus
    dev UI, LGPL-2.1 `trove4j` from the Kotlin compiler).
  - **`quarkusProdRuntimeClasspathConfiguration` alone**: 270 vs 263. The
    surplus is BOM and Kotlin-Multiplatform umbrella entries
    (`?type=pom`: `jackson-bom`, `quarkus-bom`, `hibernate-platform`,
    `kotlinx-coroutines-bom`, `kotlinx-coroutines-core`, `kotlinx-datetime`,
    `kotlin-logging`; their `-jvm` jars are listed separately) plus two
    artifacts Quarkus strips from the package (`quarkus-ide-launcher`,
    `org.eclipse.parsson:jakarta.json:1.1.7`). And our own modules are
    packaged as `io.pythia.core-jvm-…jar` while the SBOM says `core`. No
    configuration gives the exact set, hence the trimming step.
  - **Quarkus' own `quarkus-cyclonedx` extension** (3.40.1): its
    non-`excluded` components match the 261 jars exactly, but in a Gradle
    build it emits NO license data (0 of 263 in that probe, even with
    `quarkus.cyclonedx.include-license-text=true`), and it adds two jars to
    the shipped app, one an SBOM HTTP endpoint. Rejected.
  - **`npm ls` / `cyclonedx-npm`**: SvelteKit puts `svelte` and
    `@sveltejs/kit` in devDependencies yet compiles them into the bundle
    (task-192), and "all dependencies" includes ESLint, Playwright and
    Tailwind's build tooling.

  ## Decisions

  1. **CycloneDX 1.6, JSON, deterministic.** No `serialNumber` and no
     `metadata.timestamp` (`rollup-plugin-sbom`: `saveTimestamp: false,
     generateSerial: false`, verified to emit neither; the Gradle plugin:
     `includeBomSerialNumber = false`; the finalize step drops any remaining
     timestamp). The same commit gives the same SBOM, so releases diff
     cleanly.
  2. **One finalize step assembles the SBOM**: `scripts/sbom-finalize.mjs`,
     a zero-dependency Node ESM script run on the project's pinned Node
     through a Gradle `NodeTask` in `:frontend` (the `checkDesignTokens`
     pattern; task-207's checker will follow it too). It:
       * **trims** the backend part to the jar files in
         `build/quarkus-app/lib/{boot,main}`: drop `type=pom` components,
         drop components with no jar (Quarkus-removed), map a project module
         `io.pythia/<x>` to `io.pythia.<x>-jvm-<version>.jar`, prune every
         dependency reference to a dropped component, and print what it
         dropped. A jar with NO matching component is an ERROR: it would ship
         undescribed;
       * **merges** the `:domain` Kotlin/JS components into the frontend part
         (by purl, no duplicates), after the same cleanup as the backend part:
         drop the `type=pom` umbrella entries (keeping the `-js` klibs), and
         give our own `io.pythia` modules found there `Apache-2.0`. They are
         the frontend's Kotlin/JS code and belong in the frontend part, even
         though the same purls also appear in the backend part as JVM jars;
       * **nests** both parts under `pythia` as described above, with the
         Gradle application version and `Apache-2.0` on `pythia`,
         `pythia-backend`, `pythia-frontend` and every
         `pkg:maven/io.pythia/*` library (task-145). Today the root is named
         `implementation` / `frontend@0.0.1` and our modules have no license;
       * **keeps `bom-ref`s unique** across the file. The same library can
         ship in both parts, notably our own `io.pythia` modules (JVM jar and
         Kotlin/JS), so every library `bom-ref` is prefixed with its part
         (`pythia-backend:` / `pythia-frontend:`), and the `dependencies`
         section is rewritten to match. The `purl` stays untouched, because it
         identifies the library;
       * writes `build/sbom/pythia.cdx.json` (ROOT build dir).
     Unit-tested with `node --test` on small fixtures.
  3. **Never inside the frontend image.** Measured: `rollup-plugin-sbom`
     writes into the build output, and SvelteKit copies the client copy to
     `src/frontend/build/cyclonedx/bom.json`. That is the directory the image
     is made from, so nginx would serve every dependency version publicly at
     `/cyclonedx/bom.json`. The source is the CLIENT copy
     `src/frontend/.svelte-kit/output/client/cyclonedx/bom.json` (the
     `…/output/server/…` copy belongs to SvelteKit's server build, which this
     static app, `ssr = false`, does not ship). `src/frontend/build/cyclonedx/`
     is deleted right after `npmBuild`, before anything reads `build/`. A
     check proves it is absent from the image. The plugin is `apply: 'build'`,
     so `vite dev` is unaffected.
  4. **Every build produces it**: `./gradlew sbom` (root task) writes
     `build/sbom/pythia.cdx.json`, and `build` depends on it, because
     task-207's compliance check runs in `build` and reads it.
  5. **Release artifact**: in `publish`, after the images are pushed and
     their digests verified, copy the SBOM from the same Gradle build to
     `dist/pythia-$V.cdx.json` and write `dist/pythia-$V.cdx.json.sha256`
     (`sha256sum` format). The existing `gh release create … dist/*`
     uploads both. The release notes name it. The deploy bundle and its
     checksum are unchanged, and `release-bundle.sh` is not touched.
  6. **The new npm devDependency** `rollup-plugin-sbom` is exact-pinned and
     installed with a plain `npm install`, which works since task-205. It is
     **3.2.3, not 4.0.1**, a finding of the implementation: 4.x depends on
     `normalize-package-data` 9 and `hosted-git-info` 10, which require Node
     `^22.22.2`. The project pins Node 22.14.0 (`nodeVersion`), and the
     frontend's `engine-strict=true` refuses the install under Gradle. The
     system-Node probe did not show it. 3.2.3 has the same options and peers
     (incl. Vite 8) and runs on 22.14. Bumping Node is a separate task.

  Measured sizes (2026-10-13), so a drift shows: backend part 261
  components; frontend part 16 npm + 5 Kotlin/JS libraries + our own
  Kotlin/JS modules.

  No application code, no GUI, no logging change.

steps:
  - |
    Read the root `build.gradle.kts`, `src/backend/implementation/build.gradle.kts`,
    `src/domain/build.gradle.kts`, `src/frontend/build.gradle.kts`,
    `src/frontend/vite.config.ts`, the `publish` job in
    `.github/workflows/ci.yaml`, and `docs/deployment.md` → "What a release
    publishes". Skim the CycloneDX 1.6 JSON spec for nested `components` and
    `dependencies`.
  - |
    Gradle plugin: declare `id("org.cyclonedx.bom") version "3.5.1" apply false`
    in the root plugins block. Apply it to `:backend:implementation` with
    `includeConfigs = listOf("quarkusProdRuntimeClasspathConfiguration")` and
    to `:domain` with `includeConfigs = listOf("jsRuntimeClasspath")`; JSON
    only, schema 1.6, `includeBomSerialNumber = false`. Use the
    `cyclonedxDirectBom` task (verified to exist in 3.5.1).
  - |
    Frontend plugin: `npm install -D -E rollup-plugin-sbom@3.2.3` in
    `src/frontend`. In `vite.config.ts` add it with `apply: 'build'`,
    `specVersion: '1.6'`, `outFormats: ['json']`, `saveTimestamp: false`,
    `generateSerial: false`. Delete `src/frontend/build/cyclonedx/` in `npmBuild`'s own
    `doLast` (decision 3; a separate task would modify `npmBuild`'s output after
    the fact), and make `:frontend:imageBuild` refuse an SPA that still
    contains it.
  - |
    Write `scripts/sbom-finalize.mjs` (decision 2). Inputs: the backend plugin
    output, the `quarkus-app/lib` directory, the client
    `.svelte-kit/output/client/cyclonedx/bom.json`, the `:domain` plugin
    output, and the application version. Output: `build/sbom/pythia.cdx.json`.
    Unit tests `scripts/sbom-finalize.test.mjs` with fixtures under
    `scripts/fixtures/sbom/`: a `type=pom` entry is dropped; a component
    without a jar is dropped and reported; `-jvm` project-module mapping; a
    jar with no component fails; dependency references are pruned; the
    Kotlin/JS merge drops `type=pom` umbrellas, keeps the `-js` klibs and has
    no duplicates; `io.pythia` Kotlin/JS modules land in the frontend part
    with Apache-2.0; the same purl in both parts gets two
    distinct, prefixed `bom-ref`s and the dependency graph still resolves;
    the root and part names, versions and licenses; `io.pythia` gets
    Apache-2.0; no timestamp or serial.
  - |
    Gradle wiring: a `NodeTask` `:frontend:finalizeSbom` running the script
    (depends on `:backend:implementation:cyclonedxDirectBom`,
    `:backend:implementation:quarkusBuild` for `quarkus-app/lib`,
    `:domain:cyclonedxDirectBom`, `:frontend:npmBuild`); a `NodeTask`
    `:frontend:testSbomFinalize` (`node --test`); a root task `sbom` depending
    on `finalizeSbom` and running `scripts/check-sbom.sh`. The root project has no
    `build` task (no `base` plugin, whose `clean` would also wipe the Kotlin/JS
    tooling under the root `build/`), so hang `sbom` on `:frontend:build`,
    which every `./gradlew build` runs. Wire `testSbomFinalize` into
    `:frontend:check`.
  - |
    `scripts/check-sbom.sh` (refuse-to-be-sourced guard,
    `set -euo pipefail`, shellcheck-clean):
      * CycloneDX 1.6 JSON; `metadata.component.name == "pythia"` with the
        Gradle version; exactly the two top-level components `pythia-backend`
        and `pythia-frontend`; no `serialNumber`, no `metadata.timestamp`;
      * every `bom-ref` is unique, and every ref in `dependencies`
        (`ref` and `dependsOn`) resolves to one;
      * backend part: every jar in `quarkus-app/lib/{boot,main}` has exactly
        one component and vice versa (same mapping as decision 2);
      * frontend part: contains `svelte`, `@sveltejs/kit`,
        `@azure/msal-browser`, `svelte-i18n`, `svelte-dnd-action`, `loglevel`,
        `devalue`, `kotlin-stdlib-js`, `kotlin-dom-api-compat`,
        `kotlinx-datetime-js`, `kotlinx-serialization-core-js`,
        `kotlin-logging-js`, and no `type=pom` entry; does
        NOT contain `eslint`, `@playwright/test`, `typescript`, `lightningcss`,
        `vite`;
      * `pythia`, both parts and every `pkg:maven/io.pythia/*` component are
        Apache-2.0.
  - |
    `publish` job (decision 5): after "Read and check both index digests",
    copy `build/sbom/pythia.cdx.json` to `dist/pythia-$V.cdx.json`, write
    `dist/pythia-$V.cdx.json.sha256` from inside `dist`, and name the asset in
    the release notes. Nothing else in the job changes.
  - |
    Docs: `docs/deployment.md` → "What a release publishes": the SBOM asset,
    its structure (the tree above), and its checksum; state that it describes
    the application, not the base images' OS packages (see the description).
    `docs/development.md`: `./gradlew sbom`, where the file lands, why the
    frontend part comes from the bundle plus `:domain`, and why nothing may
    land in `src/frontend/build/`. Root `CLAUDE.md` "Build & run": add the
    `sbom` entry point.
  - |
    ./gradlew sbom, then ./gradlew :frontend:check, then ./gradlew build.

validation:
  - |
    ./gradlew sbom
    S=build/sbom/pythia.cdx.json
    jq -e '.bomFormat == "CycloneDX" and .specVersion == "1.6" and (.serialNumber == null) and (.metadata.timestamp == null)' $S
    jq -e '.metadata.component.name == "pythia" and ([.components[].name] | sort == ["pythia-backend","pythia-frontend"])' $S
  - |
    scripts/check-sbom.sh
  - |
    node --test scripts/sbom-finalize.test.mjs
  - |
    # Unique bom-refs, resolvable dependency graph.
    S=build/sbom/pythia.cdx.json
    jq -e '[.. | objects | select(has("bom-ref")) | ."bom-ref"] | (length == (unique | length))' $S
    jq -e '([.. | objects | select(has("bom-ref")) | ."bom-ref"] + [.metadata.component."bom-ref"]) as $r | [.dependencies[] | .ref, (.dependsOn // [])[]] | all(. as $x | $r | index($x) != null)' $S
  - |
    # Backend part: exactly the shipped jars; no build tooling; own modules Apache-2.0.
    S=build/sbom/pythia.cdx.json
    B='.components[] | select(.name == "pythia-backend")'
    test "$(jq "[$B | .components[]] | length" $S)" -eq "$(find src/backend/implementation/build/quarkus-app/lib -name '*.jar' | wc -l | tr -d ' ')"
    ! jq -r "$B | .components[].purl" $S | grep -qE 'type=pom|trove4j|lit-element-state|junit|detekt|quarkus-ide-launcher'
    jq -e '[.. | objects | select(.purl? // "" | startswith("pkg:maven/io.pythia/")) | ([.licenses[]?.license.id] | index("Apache-2.0"))] | all(. != null)' $S
  - |
    # Frontend part: bundle + Kotlin/JS, not the dev toolchain.
    S=build/sbom/pythia.cdx.json
    names=$(jq -r '.components[] | select(.name == "pythia-frontend") | .components[] | if .group then "\(.group)/\(.name)" else .name end' $S)
    for p in svelte @sveltejs/kit @azure/msal-browser svelte-i18n svelte-dnd-action loglevel devalue kotlin-stdlib-js kotlin-dom-api-compat kotlinx-datetime-js kotlinx-serialization-core-js kotlin-logging-js; do
      echo "$names" | grep -qE "(^|/)${p##*/}$" || { echo "missing $p"; exit 1; }
    done
    for p in eslint @playwright/test typescript lightningcss vite; do
      ! echo "$names" | grep -qxE "$p|.*/${p##*/}" || { echo "dev tool $p in frontend part"; exit 1; }
    done
  - |
    # Never in the SPA output, never in the frontend image.
    ./gradlew :frontend:npmBuild :frontend:imageBuild -q
    test ! -e src/frontend/build/cyclonedx
    c=$(docker create "pythia/pythia-frontend:$(grep '^version=' gradle.properties | cut -d= -f2)")
    ! docker cp "$c:/usr/share/nginx/html/cyclonedx" /tmp/should-not-exist 2>/dev/null
    docker rm "$c" > /dev/null
  - |
    # Deterministic: a second build gives the same bytes.
    ./gradlew sbom -q
    a=$(shasum build/sbom/pythia.cdx.json)
    ./gradlew :frontend:finalizeSbom --rerun -q
    test "$a" = "$(shasum build/sbom/pythia.cdx.json)"
  - |
    # The deploy bundle is unchanged by this task.
    git diff --quiet HEAD -- scripts/release-bundle.sh
  - |
    jq -e '.devDependencies["rollup-plugin-sbom"] | test("^[0-9]")' src/frontend/package.json
    grep -q "apply: 'build'" src/frontend/vite.config.ts
    grep -q 'org.cyclonedx.bom' build.gradle.kts
    grep -q 'quarkusProdRuntimeClasspathConfiguration' src/backend/implementation/build.gradle.kts
    grep -q 'jsRuntimeClasspath' src/domain/build.gradle.kts
  - |
    W=.github/workflows/ci.yaml
    grep -q 'pythia-$V.cdx.json' $W
    grep -q 'cdx.json.sha256' $W
  - |
    grep -q 'cdx.json' docs/deployment.md
    grep -q 'gradlew sbom' docs/development.md
    grep -q 'gradlew sbom' CLAUDE.md
  - |
    shellcheck scripts/check-sbom.sh
  - |
    ./gradlew :frontend:check
  - |
    ./gradlew build

outputs:
  - modified: build.gradle.kts
  - modified: src/backend/implementation/build.gradle.kts
  - modified: src/domain/build.gradle.kts
  - modified: src/frontend/build.gradle.kts
  - modified: src/frontend/vite.config.ts
  - modified: src/frontend/package.json
  - modified: src/frontend/package-lock.json
  - created: scripts/sbom-finalize.mjs
  - created: scripts/sbom-finalize.test.mjs
  - created: scripts/fixtures/sbom/
  - created: scripts/check-sbom.sh
  - modified: .github/workflows/ci.yaml
  - modified: docs/deployment.md
  - modified: docs/development.md
  - modified: CLAUDE.md
