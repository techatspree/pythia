id: task-205
phase: phase-14
title: "Fix the npm audit: source-map-js, postcss-selector-parser"
depends_on: [task-192]
description: |
  The CI `security` job (task-192: `npm audit --audit-level=high` over
  `src/frontend`, dev dependencies included) has failed on `main` and on the
  `v1.0.1` tag since 2026-10-12. It reports but does not gate, so nothing was
  blocked, but the log no longer shows only the accepted findings, which is
  the reason it exists. It reports 8 vulnerabilities (4 low, 3 moderate,
  1 high), which are two NEW advisories plus the two already ACCEPTED in
  `docs/development.md` → "Dependency vulnerabilities" (each accepted one
  appears several times along its dependency chain):

  | advisory | package (path) | severity | status |
  |---|---|---|---|
  | GHSA-68fv-2mgg-jv7q | `source-map-js` 1.2.1 (via `css-tree`, `@tailwindcss/node`, `postcss`) | high | NEW, fixed in 1.2.2, inside every dependent's `^1.2.1` range |
  | GHSA-rj75-hqrm-r3gf | `postcss-selector-parser` 7.1.4 (via `svelte-eslint-parser`) | moderate | NEW, fixed in 7.1.6, inside `^7.0.0` |
  | GHSA-pxg6-pf52-xh8x | `cookie <0.7.0` (via `@sveltejs/kit`, hence the two adapters) | low | ACCEPTED, unchanged |
  | GHSA-67mh-4wv8-2f99 | `esbuild <=0.24.2` (via `svelte-i18n`) | moderate | ACCEPTED, unchanged |

  Both new ones are in build/lint tooling (Tailwind's Vite plugin, ESLint's
  parsers), not in the bundle users download. They are still FIXED rather
  than accepted, because the fix is a patch release inside the declared
  ranges and costs nothing.

  ## Why `npm audit fix` does not simply work

  It fails before changing anything, and so does a targeted
  `npm update source-map-js postcss-selector-parser`:

      npm error ERESOLVE … While resolving: @eslint/js@10.0.1
      Found: eslint@9.39.4 … peerOptional eslint@"^10.0.0" from @eslint/js

  `package.json` declares `eslint@^9.39.4` next to `@eslint/js@^10.0.1`.
  `@eslint/js` is ESLint's own recommended-config package and is versioned
  in lock-step with it, so the pair belongs to the same major. The mismatch
  has been latent since `@eslint/js` moved to 10. `npm ci` (CI) installs the
  lockfile without re-resolving peers and never notices. Every command that
  re-resolves the tree fails. That includes `npm audit fix`, `npm update`,
  and adding a dependency (task-204's `@redocly/cli` would hit it too). In
  practice the project could no longer take a security fix the normal way.

  ## Decisions

  1. **Align `@eslint/js` to ESLint 9** (`^9.39.5`, the latest 9.x, the line
     matching the installed `eslint@9.39.4`), rather than moving ESLint to 10.
     It is the smallest change that makes the tree resolvable again. ESLint
     10 is a major upgrade with its own breaking changes and belongs in its
     own task; every plugin here already accepts `^10`
     (`eslint-plugin-svelte`, `typescript-eslint`, `@html-eslint/eslint-plugin`),
     so that task is not blocked. NEVER resolve this with
     `--legacy-peer-deps` or `--force`: both write a lockfile with a peer
     violation that the next person trips over.
  2. **Then `npm audit fix` WITHOUT `--force`.** It may only move transitive
     packages within their declared ranges. Expected: `source-map-js` →
     1.2.2, `postcss-selector-parser` → 7.1.6, and nothing else of
     substance. `--force` would apply the major "fixes" npm proposes for
     the accepted findings (Kit 3, the adapters' new majors, and a
     DOWNGRADE of `svelte-i18n`), which is exactly what the accepted list
     rules out.
  3. **The lint result must not change for the worse.** `@eslint/js` 9's
     `recommended` set differs slightly from 10's. The `e2e/` lint gate
     (`lintE2e`, zero baseline, task-191) must stay green. The
     informational frontend ESLint report may change; compare its finding
     count before and after, and explain any difference.
  4. **Afterwards the audit shows only the accepted findings.**
     `npm audit --audit-level=high` exits 0, and every advisory id in
     `npm audit --json` is one of the two accepted ones. That is the
     state the `security` job is meant to have, so a new finding stands out
     again.
  5. **Document the trap** in `docs/development.md` → "Dependency
     vulnerabilities": how to apply a fix (`npm audit fix`, never
     `--force`), and that an `ERESOLVE` means a peer mismatch in
     `package.json` to fix, not to override. `@eslint/js` must stay on the
     same major as `eslint`.

  No source code changes, no GUI, no logging. Out of scope: the ESLint 10
  upgrade, Kit 3, and gating the `security` job.

steps:
  - |
    Read `src/frontend/package.json` (the ESLint-related devDependencies),
    `src/frontend/eslint.config.js` (how `@eslint/js` is used), and
    `docs/development.md` → "Dependency vulnerabilities".
  - |
    Record the baseline, so step 6 can compare:
      cd src/frontend
      npm audit --json > <scratch>/audit-before.json || true
      ./node_modules/.bin/eslint . -f json -o <scratch>/eslint-before.json || true
      jq '[.[] | .errorCount + .warningCount] | add' <scratch>/eslint-before.json
  - |
    In `src/frontend/package.json`, set `"@eslint/js": "^9.39.5"` (decision 1)
    and run `npm install` in `src/frontend`. It must complete WITHOUT
    `--legacy-peer-deps`/`--force` and without an ERESOLVE. Confirm with
    `npm ls @eslint/js eslint` that both are on 9.x and that `npm ls` reports
    no invalid or missing peer.
  - |
    Run `npm audit fix` (no `--force`, decision 2) in `src/frontend`. Then
    check: `npm ls source-map-js` shows only 1.2.2, `npm ls
    postcss-selector-parser` shows only ≥ 7.1.6, and `git diff --stat
    src/frontend/package.json` shows no change beyond the `@eslint/js` line.
    If `audit fix` wants to change anything else, stop and report rather than
    accept it.
  - |
    `npm audit --audit-level=high` must exit 0, and the advisory ids left
    must be exactly the accepted two (decision 4; see validation).
  - |
    Lint comparison (decision 3): rerun the ESLint JSON report into
    `<scratch>/eslint-after.json` and compare the total finding count with the
    baseline. `./gradlew :frontend:lintE2e` must pass. Explain any change in
    the report.
  - |
    Docs (decision 5): in `docs/development.md` → "Dependency
    vulnerabilities", add a short "Applying a fix" paragraph: run
    `npm audit fix` in `src/frontend`, never `--force` (it applies the
    major "fixes" the accepted table rejects); an `ERESOLVE` means a peer
    mismatch in `package.json` to fix, not to override with
    `--legacy-peer-deps`; `@eslint/js` must stay on `eslint`'s major
    (task-205). Leave the accepted-findings table as it is: both entries
    still apply.
  - |
    ./gradlew :frontend:check, then ./gradlew build, then the Playwright
    suite against `./scripts/dev.sh` (`E2E_LANG=en`, then `de`), because the
    lockfile changed packages in the Vite/Tailwind build chain.

validation:
  - |
    cd src/frontend
    jq -e '.devDependencies["@eslint/js"] | test("^\\^9\\.")' package.json
    jq -e '.devDependencies.eslint | test("^\\^9\\.")' package.json
    npm ls @eslint/js eslint > /dev/null
  - |
    cd src/frontend
    test "$(npm ls source-map-js --json | jq -r '[.. | objects | select(has("version")) | select(.version|test("^1\\.2\\.[01]$"))] | length')" -eq 0
    test "$(npm ls postcss-selector-parser --json | jq -r '[.. | objects | select(has("version")) | select(.version|test("^7\\.1\\.[0-5]$"))] | length')" -eq 0
  - |
    cd src/frontend
    npm audit --audit-level=high
  - |
    # Only the two accepted advisories remain (docs/development.md).
    cd src/frontend
    left=$(npm audit --json | jq -r '[.vulnerabilities[].via[] | objects | .url | sub(".*/"; "")] | unique | .[]')
    echo "remaining: $left"
    for id in $left; do
      case "$id" in GHSA-pxg6-pf52-xh8x|GHSA-67mh-4wv8-2f99) ;; *) echo "unexpected advisory $id"; exit 1 ;; esac
    done
  - |
    # No force-applied majors: the accepted findings' packages are unchanged.
    cd src/frontend
    jq -e '.devDependencies["@sveltejs/kit"] | test("^\\^2\\.")' package.json
    test "$(jq -r '.version' node_modules/svelte-i18n/package.json | cut -d. -f1)" -ge 4
  - |
    grep -q "task-205" docs/development.md
    grep -q -- "--legacy-peer-deps" docs/development.md
  - |
    ./gradlew :frontend:lintE2e
  - |
    ./gradlew :frontend:check
  - |
    ./gradlew build
  - |
    cd src/frontend
    E2E_LANG=en npx playwright test
    E2E_LANG=de npx playwright test

outputs:
  - modified: src/frontend/package.json
  - modified: src/frontend/package-lock.json
  - modified: docs/development.md
