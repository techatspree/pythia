    T=src/backend/implementation/src/main/kotlin/io/pythia/testdata
    test -f $T/SeededUsers.kt
    for n in "Anna Becker" "Jonas Weber" "Leonie Schulz"; do grep -q "$n" $T/SeededUsers.kt || exit 1; done
    grep -q 'Intranet-Relaunch 2024' $T/SeededProjects.kt
    grep -q 'INTRANET_RELAUNCH' $T/SeededProjects.kt
    grep -q 'archive' $T/TestDataSeeder.kt
