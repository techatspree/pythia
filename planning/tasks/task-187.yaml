    import json, pathlib, sys
    cats = {p.stem: json.loads(p.read_text())
            for p in pathlib.Path('src/frontend/src/lib/i18n').glob('*.json')}
    def flat(o, p=''):
        s = set()
        for k, v in o.items():
            n = f'{p}.{k}' if p else k
            s |= flat(v, n) if isinstance(v, dict) else {n}
        return s
    keys = {l: flat(d) for l, d in cats.items()}
    ref = set().union(*keys.values())
    bad = {l: sorted(ref - k) for l, k in keys.items() if ref - k}
    need = {'bucket.colType', 'bucket.typeBucketed', 'bucket.typeTimeRelative', 'bucket.accompanying'}
    missing = {l: sorted(need - k) for l, k in keys.items() if need - k}
    de = cats['de']['bucket']; en = cats['en']['bucket']
    same = de['accompanying'] == en['accompanying'] or de['typeTimeRelative'] == en['typeTimeRelative']
    print('parity:', bad or 'ok', '| new keys:', missing or 'ok', '| translated:', not same)
    sys.exit(1 if (bad or missing or same) else 0)
    PY
