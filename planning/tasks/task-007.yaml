      grep -q "APP_AUTH_PROVIDER=entra" scripts/minikube-deploy.sh
      grep -q "VITE_AUTH_PROVIDER=entra" scripts/minikube-deploy.sh
      grep -q "ENTRA_TENANT_ID" scripts/minikube-deploy.sh
  - |
    Backend builds:
      mvn -pl src/backend/implementation -am test
  - |
    Frontend type-check passes:
      cd src/frontend && npm run check
  - |
    Playwright suite (still under the dev module) passes:
      cd src/frontend && npx playwright test

