      grep -q "stringValue = \"entra\"" src/backend/implementation/src/main/kotlin/io/pythia/auth/entra/EntraAuthFilter.kt
      ! grep -q "@PreMatching" src/backend/implementation/src/main/kotlin/io/pythia/auth/entra/EntraAuthFilter.kt
  - |
    The augmentor does NOT inject CurrentUserProvider (task-006
    lesson — that's a request-scope hazard from the Vert.x event
