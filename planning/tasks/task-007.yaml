id: task-007
phase: phase-2
title: Entra ID auth module — production identity provider
depends_on: [task-005, task-006]
manual_steps_required: true
description: |
  Implement the `entra` auth module declared by task-005. This module
  plugs Microsoft Entra ID (formerly Azure AD) into the modular SPI
  established earlier so the application can run in production with
  organisational identities, while the dev module from task-006
  remains the default for local development and e2e testing.

  Why a dedicated task: Entra integration spans manual tenant-side
  setup (two app registrations + roles + admin consent), backend
  token validation via quarkus-oidc, and frontend authentication via
  MSAL. Bundling them into one task keeps the Entra-specific
  knowledge in one place; activation is purely a config-flag flip
  (`app.auth.provider=entra` + `VITE_AUTH_PROVIDER=entra`).

  Current state (verified, assumes task-005 + task-006 are done):
    - The `AuthModule`, `CurrentUserProvider`, `Role` enum, and
      `app.auth.provider` config switch all exist and have a
      working `dev` implementation. `getAuthProvider()` on the
      frontend returns the dev provider when
      `VITE_AUTH_PROVIDER=dev` and still throws for
      `VITE_AUTH_PROVIDER=entra`.
    - `quarkus-oidc` IS already a backend dependency (verified —
      task-006's SecurityIdentityAugmentor imports rely on it).
      Do NOT add a duplicate `<dependency>` block.
    - `application.properties` already contains some `%prod` OIDC
      placeholder values pointing at Keycloak
      (`%prod.quarkus.oidc.auth-server-url=http://localhost:8180/realms/estimation`
      + `%prod.quarkus.oidc.client-id=backend`) — these MUST be
      replaced with Entra-shaped values in this task.
    - `application.properties` already contains
      `%dev-minikube.quarkus.oidc.enabled=false`. This task flips
      it to `true` and wires the Entra URL there so minikube
      deployments use Entra.
    - `application.properties` already contains
      `%dev-local.quarkus.oidc.enabled=false`,
      `%dev.quarkus.oidc.enabled=false`, and
      `%test.quarkus.oidc.enabled=false`. Those stay as-is.
    - The "Modular authentication and authorization" paragraph in
      CLAUDE.md (added by task-005, amended by task-006 with a
      `docs/auth-dev.md` cross-link) already mentions Entra. This
      task only APPENDS a `docs/entra-setup.md` cross-link to the
      same paragraph — no new section.
    - `task-006` ended with `DevSecurityIdentityAugmentor` as a
      no-op stub because `SecurityIdentityAugmentor` runs on the
      Vert.x event loop OUTSIDE request scope and cannot write to
      the request-scoped `CurrentUserProvider`. THIS TASK MUST
      OBEY THE SAME RULE: the augmentor enriches the
      `SecurityIdentity` (role-string mapping — read-only on
      claims, returns enriched identity, no request-scope access)
      while a separate post-matching `ContainerRequestFilter`
      populates `CurrentUserProvider` with the per-request user.
    - No MSAL package on the frontend. No `docs/entra-setup.md`.

  Target state:
    - External (manual, performed by the tenant admin):
        * Two Entra ID app registrations:
          1. `estimation-api` — exposes a custom scope `access`
             (`api://<api-client-id>/access`) and three app roles:
             `VIEWER`, `ESTIMATOR`, `ADMIN` (exact role values
             matching the backend Role enum).
          2. `estimation-spa` — Single-page-application platform,
             redirect URIs covering both `http://localhost:5173`
             (developer Entra mode) and the production hostname
             `https://estimation.<domain>`. Has API permission to
             `estimation-api`'s `access` scope. Admin consent
             granted.
        * Record tenant_id, api_client_id, spa_client_id — NEVER
          commit. Documented in docs/entra-setup.md (procedure
          only).
        * Assign at least one test user to each of the three app
          roles so task-008 can verify role enforcement against
          real Entra tokens.
    - Backend (`entra` provider):
        * quarkus-oidc dependency: VERIFY presence only (it's
          already in pom.xml — task-006 pulled it in transitively).
          Do NOT add a duplicate.
        * application.properties — REPLACE the existing Keycloak
          placeholder under `%prod` and FLIP `%dev-minikube` from
          oidc.enabled=false to wired-for-Entra. Final state of
          these two blocks (preserve other %prod lines like
          datasource):
            %prod.quarkus.oidc.auth-server-url=https://login.microsoftonline.com/${ENTRA_TENANT_ID}/v2.0
            %prod.quarkus.oidc.client-id=${ENTRA_API_CLIENT_ID}
            %prod.quarkus.oidc.application-type=service
            %prod.quarkus.oidc.token.audience=api://${ENTRA_API_CLIENT_ID}
            %prod.quarkus.oidc.roles.role-claim-path=roles

            %dev-minikube.quarkus.oidc.enabled=true
            %dev-minikube.quarkus.oidc.auth-server-url=https://login.microsoftonline.com/${ENTRA_TENANT_ID}/v2.0
            %dev-minikube.quarkus.oidc.client-id=${ENTRA_API_CLIENT_ID}
            %dev-minikube.quarkus.oidc.application-type=service
            %dev-minikube.quarkus.oidc.token.audience=api://${ENTRA_API_CLIENT_ID}
            %dev-minikube.quarkus.oidc.roles.role-claim-path=roles
          The `%dev-local`, `%dev`, and `%test` profiles keep their
          existing `quarkus.oidc.enabled=false` lines untouched — the
          dev module covers all three.
        * NO `%dev.entra` composite profile (Quarkus doesn't
          support composite tags). Running Entra locally is done by
          stopping dev-local.sh and exporting:
            export APP_AUTH_PROVIDER=entra
            export VITE_AUTH_PROVIDER=entra
            export ENTRA_TENANT_ID=…
            export ENTRA_API_CLIENT_ID=…
            export ENTRA_SPA_CLIENT_ID=…
            export VITE_ENTRA_TENANT_ID=…  …etc.
            mvn quarkus:dev -Pdev-local
          plus the equivalent frontend env. Document this in
          docs/entra-setup.md.
        * Three new Kotlin files under
          src/backend/implementation/src/main/kotlin/io/pythia/auth/entra/:
            EntraAuthModule.kt — `@ApplicationScoped` implementing
            `AuthModule` with `name() = "entra"`, gated by
            `@IfBuildProperty(name="app.auth.provider",
            stringValue="entra")`.

            EntraAuthFilter.kt — `@Provider @Priority(Priorities.
            AUTHENTICATION + 100)` `ContainerRequestFilter` (POST-
            matching; NO `@PreMatching`) that injects the request-
            scoped Quarkus-provided `SecurityIdentity`, reads OIDC
            claims (`sub`, `email`/`preferred_username`, `name`,
            `roles`), maps them via `entraRolesToDomain(...)` into
            `Set<Role>`, and writes the resulting `CurrentUser`
            into `currentUserProvider.current`. providerName =
            "entra". Same `@IfBuildProperty` gate as the module.
            This MIRRORS `DevAuthFilter` from task-006 and is the
            reason the augmentor stays request-scope-free.

            EntraSecurityIdentityAugmentor.kt — same gate.
            Implements Quarkus `SecurityIdentityAugmentor`; reads
            claims from the input `SecurityIdentity` (NOT from
            CurrentUserProvider) and returns a
            `QuarkusSecurityIdentity` enriched with the matching
            Quarkus role strings (`"VIEWER"` / `"ESTIMATOR"` /
            `"ADMIN"`). The augmentor does NOT touch
            CurrentUserProvider — that's the filter's job. Pure
            claim → role-string mapping, no request-scope access,
            no ContextNotActiveException risk.

            `entraRolesToDomain(...)` is a single private helper,
            either at file scope inside
            `EntraSecurityIdentityAugmentor.kt` or extracted into
            an `EntraRoleMapper.kt` shared with the filter (the
            implementer picks; either is fine).
        * Wire the filter so that, under the Entra profile, the
          existing `/api/auth/me` endpoint from task-005 returns
          the same provider-agnostic `CurrentUser` DTO — only the
          `providerName` field differs.
    - Frontend (`entra` profile):
        * Add `@azure/msal-browser` (NOT the React-flavoured
          variant — this project uses Svelte 5). Pin a recent
          stable version (verify it works against Svelte 5).
        * `src/frontend/src/lib/auth/EntraAuthProvider.ts`
          implementing AuthProvider via MSAL:
            - `init()`: instantiate `PublicClientApplication` with
              clientId, authority
              `https://login.microsoftonline.com/<tenant>`,
              redirectUri (from env). Call
              `await msal.initialize()`.
            - `login()`: `msal.loginRedirect()` (or popup; pick
              one — redirect is more robust against popup
              blockers, document the choice). On return, MSAL
              handles the response and the active account becomes
              available.
            - `logout()`: `msal.logoutRedirect()`.
            - `getAccount()`: returns the mapped AuthAccount from
              `msal.getAllAccounts()[0]` claims (subjectId from
              `oid`/`sub`, email from `email`, roles from `roles`
              claim).
            - `getAuthorizationHeader()`: acquires a token silently
              via
              `msal.acquireTokenSilent({scopes: ['api://<api-client-id>/access']})`,
              falls back to `acquireTokenRedirect` on
              `InteractionRequiredAuthError`. Returns
              `"Bearer " + accessToken`.
        * Wire `src/frontend/src/lib/auth/index.ts` so
          `VITE_AUTH_PROVIDER === 'entra'` returns a singleton
          `EntraAuthProvider`. Remove the
          `Provider 'entra' not yet wired up` throw.
        * Add the Entra env vars to `.env.example`:
            VITE_ENTRA_TENANT_ID=
            VITE_ENTRA_SPA_CLIENT_ID=
            VITE_ENTRA_API_CLIENT_ID=
            VITE_ENTRA_REDIRECT_URI=http://localhost:5173
    - Documentation:
        * `docs/entra-setup.md` — without secrets — walking through
          both app registrations, role definitions, admin consent,
          and the env-var mapping. Includes a section on running
          Entra locally via env-var override (see backend section
          above) and a section on how the env vars flow into the
          minikube backend Deployment.
        * AMEND CLAUDE.md: in the existing "Modular authentication
          and authorization" paragraph (added by task-005, amended
          by task-006 with the `docs/auth-dev.md` cross-link),
          APPEND a parallel `docs/entra-setup.md` cross-link. Do
          NOT add a new section. Do NOT duplicate the SPI
          description.
    - Deployment:
        * Update scripts/minikube-deploy.sh to `export
          APP_AUTH_PROVIDER=entra` and `export
          VITE_AUTH_PROVIDER=entra` before invoking
          `mvn package -Pdev-minikube` / `kubectl apply -k`. Add a
          one-liner check that `ENTRA_TENANT_ID`,
          `ENTRA_API_CLIENT_ID`, and `ENTRA_SPA_CLIENT_ID` are
          present in the environment; bail out with a clear
          message otherwise (so the deploy doesn't silently ship
          unresolved ${VAR} placeholders).
        * K8s ConfigMap / Secret edits are OUT OF SCOPE for this
          task. The minikube backend Pod reads the three env vars
          directly from the shell environment via Quarkus's
          property-substitution mechanism (`${ENTRA_TENANT_ID}`
          etc. in application.properties resolve at runtime from
          process env). Document this approach in
          `docs/entra-setup.md`; do not edit
          `k8s/overlays/minikube/*.yaml` here.

  Key design decisions (leave no ambiguity):
    - Use `@azure/msal-browser` (not msal-react / msal-node). The
      Svelte 5 integration is a thin wrapper, not a framework
      binding.
    - Redirect-based interactive flow (not popup) for robustness.
    - Token audience: `api://<api-client-id>`. App role claim path:
      `roles`. These match the manual Entra setup steps verbatim.
    - The augmentor reads claims from the OIDC-validated
      `SecurityIdentity`; do NOT re-decode the JWT yourself.

  Out of scope (explicit):
    - Keycloak (task-060).
    - Per-resource `@RolesAllowed` rollout to individual REST
      endpoints (lands with each feature).
    - Persisting `User` records to PostgreSQL — that's deferred
      until something actually needs to query by user.
    - SSO across tabs beyond what MSAL gives out of the box.

steps:
  - |
    Tenant admin: register both Entra ID apps as described,
    define the three app roles on `estimation-api`, assign test
    users, grant admin consent. Record tenant_id and the two
    client_ids in a secure place — they are needed below as env
    vars but MUST NOT be committed.

  - |
    Verify (do NOT add) the quarkus-oidc dependency:
      grep -q "<artifactId>quarkus-oidc</artifactId>" src/backend/implementation/pom.xml
    The dependency is already on the classpath (task-006 uses
    Quarkus security identity types from it).

  - |
    Edit
    src/backend/implementation/src/main/resources/application.properties:
      - REPLACE the existing
            %prod.quarkus.oidc.auth-server-url=http://localhost:8180/realms/estimation
            %prod.quarkus.oidc.client-id=backend
        lines with the Entra-shaped %prod block from the
        description (auth-server-url, client-id, application-type,
        token.audience, roles.role-claim-path — all five lines).
      - REPLACE
            %dev-minikube.quarkus.oidc.enabled=false
        with the Entra-shaped %dev-minikube block from the
        description (six lines: enabled=true + the same five OIDC
        keys as %prod).
      - LEAVE the `%dev-local`, `%dev`, and `%test`
        `quarkus.oidc.enabled=false` lines untouched.
    All `${ENV_VAR}` placeholders are resolved by Quarkus at
    runtime from process env — no Maven-side substitution.

  - |
    Create backend Entra module files under
    src/backend/implementation/src/main/kotlin/io/pythia/auth/entra/:
      - EntraAuthModule.kt — `@ApplicationScoped`, gated by
        `@IfBuildProperty(name="app.auth.provider",
        stringValue="entra")`. Tiny stub that delegates `isActive`
        to `AuthConfig` (same shape as `DevAuthModule`).
      - EntraAuthFilter.kt — `@Provider` (NO `@PreMatching`)
        `@Priority(Priorities.AUTHENTICATION + 100)`
        `ContainerRequestFilter` gated by the same
        `@IfBuildProperty`. Inject the request-scoped Quarkus
        `SecurityIdentity` (`@Inject Instance<SecurityIdentity>`
        or constructor-injected `SecurityIdentity` — Quarkus
        proxies the request-scoped instance). When the identity
        is non-anonymous, pull claims via
        `identity.principal.name` / `identity.attributes` /
        `identity.getAttribute("OidcIdToken")` (or via
        `JsonWebToken` if injected), call
        `entraRolesToDomain(claims)` to produce `Set<Role>`, and
        write `currentUserProvider.current = CurrentUser(...)`
        with providerName="entra". If anonymous, leave
        `currentUserProvider.current` null — the resource will
        404/401 as appropriate (no automatic abort here; OIDC has
        already rejected invalid tokens at the auth-mechanism
        layer).
      - EntraSecurityIdentityAugmentor.kt — same gate.
        `SecurityIdentityAugmentor` implementation that takes the
        OIDC-validated identity, reads the `roles` claim, maps
        Entra app-role values to Quarkus role strings (`VIEWER`,
        `ESTIMATOR`, `ADMIN`) via the SAME mapper, and returns a
        `QuarkusSecurityIdentity.builder()` enriched identity. NO
        injection of `CurrentUserProvider`; NO writes to request-
        scoped state. Pure read-on-claims + return-new-identity.
      - The role mapper `entraRolesToDomain(claims): Set<Role>`
        lives either as a private top-level function in
        EntraSecurityIdentityAugmentor.kt OR in a small shared
        EntraRoleMapper.kt — implementer picks; the filter and
        augmentor both call it.

  - |
    Add @azure/msal-browser:
      cd src/frontend
      npm install --legacy-peer-deps @azure/msal-browser
    Save as a normal dependency.

  - |
    Create src/frontend/src/lib/auth/EntraAuthProvider.ts
    implementing AuthProvider as described. Use MSAL's
    `PublicClientApplication`, `loginRedirect` / `logoutRedirect`,
    `acquireTokenSilent` with fallback. Map claims to AuthAccount.

  - |
    Wire src/frontend/src/lib/auth/index.ts: for
    `VITE_AUTH_PROVIDER === 'entra'`, return a singleton
    EntraAuthProvider. Delete the throw stub from task-005.

  - |
    Extend src/frontend/.env.example with the Entra env vars listed
    in the description. Document each line briefly.

  - |
    docs/entra-setup.md: write a procedural walkthrough — no
    secrets — of the two app registrations, role definitions,
    admin consent, and how the env vars flow into the backend
    (Quarkus) and frontend (Vite). Cross-link to
    docs/auth-dev.md (the dev module) so a reader can pick
    between the two.

  - |
    Update CLAUDE.md (project root): AMEND the existing "Modular
    authentication and authorization" paragraph by APPENDING a
    parallel `docs/entra-setup.md` cross-link after the existing
    `docs/auth-dev.md` cross-link (the paragraph already names
    Entra in its task-007 reference; do NOT add a new paragraph,
    do NOT duplicate the SPI description). Example final
    sentence:
        "Concrete providers land in task-006 (dev / hard-wired
         users — see `docs/auth-dev.md`), task-007 (Entra ID via
         MSAL + quarkus-oidc — see `docs/entra-setup.md`), and
         task-060 (Keycloak); …"

  - |
    Update scripts/minikube-deploy.sh: at the TOP of the script
    (before the existing `mvn package -Pdev-minikube` invocation)
    add:
      export APP_AUTH_PROVIDER=entra
      export VITE_AUTH_PROVIDER=entra
      for v in ENTRA_TENANT_ID ENTRA_API_CLIENT_ID ENTRA_SPA_CLIENT_ID; do
          if [ -z "${!v}" ]; then
              echo "Error: $v must be set" >&2; exit 1
          fi
      done
    This makes a misconfigured deploy fail loudly rather than
    silently ship unresolved ${VAR} placeholders into the running
    Pod. NO K8s YAML edits — the env vars travel into the backend
    Pod via the same shell environment and Quarkus's
    property-substitution layer.

  - |
    Backend build:
      mvn -pl src/backend/implementation -am test
    (Build must compile; the OIDC config under `%prod` will not
    actually contact Entra at test time because `%test` disables
    quarkus-oidc.)

  - |
    Frontend type-check:
      cd src/frontend && npm run check

  - |
    Run the full Playwright suite. dev-local still uses the dev
    provider, so all 18 cases must continue passing unchanged:
      cd src/frontend && npx playwright test

validation:
