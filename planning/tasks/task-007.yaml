      test -f src/backend/implementation/src/main/kotlin/io/pythia/auth/entra/EntraAuthFilter.kt
      test -f src/backend/implementation/src/main/kotlin/io/pythia/auth/entra/EntraSecurityIdentityAugmentor.kt
  - |
    The Entra filter is @IfBuildProperty-gated to the entra
