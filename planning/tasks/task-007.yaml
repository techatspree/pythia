  - modified: src/backend/implementation/pom.xml
  - modified: src/backend/implementation/src/main/resources/application.properties
  - created: src/frontend/src/lib/auth/EntraAuthProvider.ts
  - modified: src/frontend/src/lib/auth/index.ts
  - modified: src/frontend/.env.example
  - modified: src/frontend/package.json
  - modified: src/frontend/package-lock.json
  - created: docs/entra-setup.md
  - modified: CLAUDE.md
  - modified: scripts/minikube-deploy.sh
