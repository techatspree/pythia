      ! grep -q "CurrentUserProvider" src/backend/implementation/src/main/kotlin/io/pythia/auth/entra/EntraSecurityIdentityAugmentor.kt
  - |
    quarkus-oidc is on the classpath (verified, not added):
      grep -q "<artifactId>quarkus-oidc</artifactId>" src/backend/implementation/pom.xml
  - |
    OIDC is now wired for Entra specifically under %prod and
    %dev-minikube; %dev-local/%dev/%test still disable it:
      grep -q "%prod.quarkus.oidc.auth-server-url=https://login.microsoftonline.com" src/backend/implementation/src/main/resources/application.properties
      grep -q "ENTRA_TENANT_ID\\|ENTRA_API_CLIENT_ID" src/backend/implementation/src/main/resources/application.properties
      grep -q "%dev-minikube.quarkus.oidc.enabled=true" src/backend/implementation/src/main/resources/application.properties
      grep -q "%dev-minikube.quarkus.oidc.auth-server-url=https://login.microsoftonline.com" src/backend/implementation/src/main/resources/application.properties
      grep -q "%dev-local.quarkus.oidc.enabled=false" src/backend/implementation/src/main/resources/application.properties
      grep -q "%dev.quarkus.oidc.enabled=false" src/backend/implementation/src/main/resources/application.properties
      grep -q "%test.quarkus.oidc.enabled=false" src/backend/implementation/src/main/resources/application.properties
      ! grep -q "http://localhost:8180/realms/estimation" src/backend/implementation/src/main/resources/application.properties
  - |
    Frontend Entra provider exists and is wired into the factory:
      test -f src/frontend/src/lib/auth/EntraAuthProvider.ts
      grep -q "EntraAuthProvider" src/frontend/src/lib/auth/index.ts
      ! grep -q "Provider 'entra' not yet wired up" src/frontend/src/lib/auth/index.ts
  - |
    @azure/msal-browser is a dependency:
      grep -q "@azure/msal-browser" src/frontend/package.json
  - |
    .env.example documents the Entra vars:
      grep -q "VITE_ENTRA_TENANT_ID" src/frontend/.env.example
      grep -q "VITE_ENTRA_SPA_CLIENT_ID" src/frontend/.env.example
      grep -q "VITE_ENTRA_API_CLIENT_ID" src/frontend/.env.example
  - |
    Documentation exists and CLAUDE.md cross-links the new file:
      test -f docs/entra-setup.md
      grep -q "docs/entra-setup.md" CLAUDE.md
  - |
    Minikube deploy script switches to the entra provider and
