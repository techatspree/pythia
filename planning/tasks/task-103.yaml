      grep -q "CREATE TABLE estimation_buckets" src/backend/implementation/src/main/resources/db/migration/V10__bucket_sampled_method.sql
      grep -q "bucket_id" src/backend/implementation/src/main/resources/db/migration/V10__bucket_sampled_method.sql
      grep -q "is_sample" src/backend/implementation/src/main/resources/db/migration/V10__bucket_sampled_method.sql
  - |
    JPA subclasses for BUCKETED on both draft and submitted sides
    exist:
      grep -q "DiscriminatorValue(\"BUCKETED\")" src/backend/implementation/src/main/kotlin/io/github/theestimator/model/DraftEstimationNode.kt \
        || test -f src/backend/implementation/src/main/kotlin/io/github/theestimator/model/DraftBucketedItemNode.kt
      grep -q "DiscriminatorValue(\"BUCKETED\")" src/backend/implementation/src/main/kotlin/io/github/theestimator/model/SubmittedEstimationNode.kt \
        || test -f src/backend/implementation/src/main/kotlin/io/github/theestimator/model/SubmittedBucketedItemNode.kt
  - |
    EstimationBucket entity + repository exist:
      test -f src/backend/implementation/src/main/kotlin/io/github/theestimator/model/EstimationBucket.kt
      test -f src/backend/implementation/src/main/kotlin/io/github/theestimator/repository/EstimationBucketRepository.kt
  - |
    Applier logs and rejects method mismatches:
      grep -q "Log.warn\|Log.info" src/backend/implementation/src/main/kotlin/io/github/theestimator/service/DraftUpdateApplier.kt
      grep -q "BUCKET_SAMPLED_PERT" src/backend/implementation/src/main/kotlin/io/github/theestimator/service/DraftUpdateApplier.kt
  - |
    CLAUDE.md documents the new persistence:
      grep -q "estimation_buckets" CLAUDE.md
  - |
    Full-stack build is green:
      ./gradlew build

