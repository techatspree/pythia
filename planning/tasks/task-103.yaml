    Read the current entities and mappers:
      src/backend/implementation/src/main/kotlin/io/github/theestimator/domain/draft/DraftEstimationNode.kt
      src/backend/implementation/src/main/kotlin/io/github/theestimator/domain/submitted/SubmittedEstimationNode.kt
