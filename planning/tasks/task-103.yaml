id: task-103
phase: phase-15
title: Backend — persist buckets + bucketed leaves (Flyway V10)
depends_on: [task-102, task-100]
description: |
  Persist buckets and bucketed leaf items on BOTH the draft and
  the submitted side so a `BUCKET_SAMPLED_PERT` estimation can be
  edited, submitted, undone, and re-read end-to-end.

  ## Frozen decisions (from task-096)

  - **Submitted side is method-specific.** The submitted-side
    tables carry the raw method-specific columns
    (`bucket_id`, `is_sample`, sample-only PT values) so an
    export or a detail view of a submitted version can reproduce
    the input. The neutral effort columns
    (`mean`/`variance`/`offerPT`/`cost`/`offerPrice`) stay
    populated by calculate — those are what aggregate reads
    (comparison, list, dashboard) use.
  - **Buckets are per-estimation.** New `estimation_buckets`
    table shared across draft and submitted rows: columns `id`,
    `estimation_id`, `position`, `label`. Ordered by `position`
    like node children.
  - **Flyway migration.** `V10__bucket_sampled_method.sql`:
      * `CREATE TABLE estimation_buckets(...)` with a
        `UNIQUE (estimation_id, position)` constraint and an
        FK to `estimations(id)` (`ON DELETE CASCADE`).
      * On BOTH `draft_estimation_nodes` and
        `submitted_estimation_nodes`:
          - add `bucket_id uuid REFERENCES estimation_buckets(id)
            ON DELETE RESTRICT` (nullable — non-`BUCKETED` rows
            leave it NULL);
          - add `is_sample boolean` (nullable — non-`BUCKETED`
            rows leave it NULL);
          - allow the existing PT columns
            (`optimistic`/`likely`/`pessimistic`) to remain
            nullable (they already are for non-`FIXED`/`TIME_RELATIVE`
            rows).
      * Extend the node-type CHECK constraint (if the migration
        history has one) to include `BUCKETED`.
  - **JPA.** New `EstimationBucket` entity mapped to
    `estimation_buckets`, with a `@ManyToOne` on `Estimation`.
    Add `@DiscriminatorValue("BUCKETED")` subclasses on both
    `DraftEstimationNode` and `SubmittedEstimationNode`, holding
    the bucket reference, `isSample`, and the (nullable) PT
    columns. Preserve the ordered-children shape (`@OrderColumn`
    on `position`).
  - **Draft mapper & applier.** `DraftUpdateApplier`, previously
    rejecting `BucketedNodeUpdateDto` (task-100), now accepts it
    ONLY when the owning estimation's `method` is
    `BUCKET_SAMPLED_PERT` — a mismatch still yields `400`.
    `DraftVersionMapper` and `EstimationVersionMapper` handle the
    new leaf type. `DraftSnapshotMapper.toUpdateDto()` produces
    a `BucketedNodeUpdateDto` for bucketed rows.
  - **Undo log.** `DraftMutationJackson` already registers
    `BucketedNodeUpdateDto` (task-100). Verify a round-trip
    integration test with a real bucketed change persisted and
    then undone.
  - **Submitted snapshot.** When submitting a
    `BUCKET_SAMPLED_PERT` draft, mirror the bucketed leaves into
    the submitted table with the method-specific columns
    populated AND the neutral columns populated by
    `EstimationVersion.calculate()`. The `SubmittedVersionMapper`
    already writes the neutral columns; extend it to also copy
    the method-specific ones for `BUCKETED` rows.
  - **Reading submitted versions.** `EstimationVersionMapper`
    reconstructs a domain `BucketedEstimationItem` from the
    submitted row (using the persisted PT columns for sample
    rows). The neutral columns are then trusted as-is (the
    backend does NOT recompute on read — per CLAUDE.md).
  - **Logging.** `Log.info` on submit with method + item counts;
    `Log.debug` on per-node persistence in the mapper if useful;
    `Log.warn` on the applier's rejected mismatched-method case.
  - **CLAUDE.md.** Update "Persistence shape" to describe
    `estimation_buckets`, the `BUCKETED` discriminator on both
    node tables, and the method-specific submitted columns.

  ## What does NOT belong in this task

  - Frontend editor UI — task-104.
  - Session-support integration — task-106.
  - Export dispatch refactor — task-107.

steps:
  - |
    Read current entities:
      src/backend/implementation/src/main/kotlin/io/github/theestimator/model/DraftEstimationNode.kt
      src/backend/implementation/src/main/kotlin/io/github/theestimator/model/SubmittedEstimationNode.kt
      src/backend/implementation/src/main/kotlin/io/github/theestimator/model/Estimation.kt
      src/backend/implementation/src/main/kotlin/io/github/theestimator/service/DraftVersionMapper.kt
      src/backend/implementation/src/main/kotlin/io/github/theestimator/service/SubmittedVersionMapper.kt
      src/backend/implementation/src/main/kotlin/io/github/theestimator/service/DraftUpdateApplier.kt
      src/backend/implementation/src/main/kotlin/io/github/theestimator/rest/dto/EstimationVersionMapper.kt
      src/backend/implementation/src/main/kotlin/io/github/theestimator/service/DraftSnapshotMapper.kt
    Read migrations V6/V7/V8/V9 for the pattern to follow.
  - |
    Create Flyway
    `src/backend/implementation/src/main/resources/db/migration/V10__bucket_sampled_method.sql`
    with all DDL described above (buckets table + columns on
    both node tables + CHECK adjustment if applicable).
  - |
    Add JPA entities/subclasses:
      src/backend/implementation/src/main/kotlin/io/github/theestimator/model/EstimationBucket.kt
      DraftBucketedItemNode (@DiscriminatorValue("BUCKETED") on DraftEstimationNode)
      SubmittedBucketedItemNode (@DiscriminatorValue("BUCKETED") on SubmittedEstimationNode)
    Add a Panache repository for buckets:
      src/backend/implementation/src/main/kotlin/io/github/theestimator/repository/EstimationBucketRepository.kt
  - |
    Extend Estimation entity with `buckets: List<EstimationBucket>`
    ordered by `position`. Serialise the bucket collection on
    the `Estimation` DTO (extend `EstimationDto` with
    `buckets: List<EstimationBucketDto>?` — nullable so PERT
    estimations serialise as null/empty).
  - |
    Update `DraftUpdateApplier`:
      * Remove the blanket rejection of `BucketedNodeUpdateDto`
        (task-100). Accept it ONLY when
        `draft.estimation.method == BUCKET_SAMPLED_PERT`; else
        respond `400` with a message naming the mismatch.
      * Support bucket collection changes (add/remove/rename/
        reorder buckets) via a new `BucketsUpdateDto` (nested in
        `DraftUpdateDto`) — use the same clear-and-rebuild shape
        as the other collections in this file.
      * `Log.warn` on the rejected mismatched-method case.
  - |
    Update `DraftVersionMapper`, `SubmittedVersionMapper`,
    `EstimationVersionMapper`, and `DraftSnapshotMapper` to
    handle the new leaf type. On the submitted side, populate
    BOTH the method-specific columns and the neutral columns
    (already computed by `EstimationVersion.calculate()`).
    `Log.info` on submit with method + item counts.
  - |
    Confirm `DraftMutationJackson` already handles
    `BucketedNodeUpdateDto` (task-100). Add a
    `@QuarkusTest` that goes through the full apply → undo →
    redo cycle on a bucketed draft.
  - |
    Add `@QuarkusTest`s in
    `.../rest/EstimationVersionResourceIT.kt`:
      * Create an estimation with `method =
        BUCKET_SAMPLED_PERT`, PUT a draft with 2 buckets and 4
        leaves (2 samples, 2 non-samples). GET returns
        calculated values with per-bucket average on non-sample
        rows.
      * Submit the draft. GET the submitted version — non-sample
        rows carry the bucket-derived neutral values AND the raw
        `bucket_id` + `is_sample` on the wire (verify via the
        response DTO shape).
      * Compare draft → submitted and submitted → submitted for a
        bucket estimation returns a coherent diff (spot-check;
        deep comparison-suite coverage is out of scope).
  - |
    Update `CLAUDE.md` "Persistence shape" section.
  - |
    Build:
      ./gradlew :backend:implementation:test
      ./gradlew build

