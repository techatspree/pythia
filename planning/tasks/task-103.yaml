id: task-103
phase: phase-15
title: Backend — persist buckets + bucketed leaves (Flyway V10)
depends_on: [task-102, task-100]
description: |
  Persist buckets and bucketed leaf items on BOTH the draft and
  the submitted side so a `BUCKET_SAMPLED_PERT` estimation can be
  edited, submitted, undone, and re-read end-to-end.

  ## Actual code layout (verified 2026-07-15)

  - Persistence entities live under `io.github.theestimator.domain`
    (NOT `.model`): `domain/Estimation.kt`,
    `domain/draft/DraftEstimationNode.kt` (abstract + `DraftGroupNode`
    / `DraftFixedItemNode` / `DraftTimeRelativeItemNode`),
    `domain/submitted/SubmittedEstimationNode.kt` (mirror).
    Panache repos live under `io.github.theestimator.repository`.
  - There is NO `SubmittedVersionMapper`. The domain→submitted-entity
    snapshot is built by `service/EstimationVersionService.kt`
    (`buildSubmittedNode`, a `when(domainNode)` with an
    `else -> error(...)`); the submitted-clone-to-draft is
    `cloneSubmittedNode` in the same file. Entity→DTO (both draft and
    submitted) is `rest/dto/EstimationVersionMapper.kt`.
  - The leaf DTOs are **flat** (task-100), NOT polymorphic. There is
    NO `BucketedNodeUpdateDto`. `EstimationNodeUpdateDto` and
    `EstimationNodeDto` (in `rest/dto/EstimationVersionDtos.kt`)
    already carry `type: String` (`enumeration` includes `BUCKETED`),
    plus `bucketId: String? = null` and `isSample: Boolean = false`.
    A bucketed **sample** reuses the existing
    `minEffort`/`expectedEffort`/`maxEffort` fields/columns for its
    optimistic/likely/pessimistic three-point values (the DTO already
    documents this). `DraftMutationJackson` serialises the flat
    `DraftUpdateDto` with the Kotlin-aware ObjectMapper, so bucketed
    rows already round-trip through the undo log with no change there.
  - The estimation read DTO is `EstimationDetailDto` (+
    `EstimationSummaryDto`) in `rest/dto/ProjectDtos.kt`, mapped by
    `rest/dto/ProjectMapper.kt`. There is NO `EstimationDto`.

  ## Frozen decisions (from task-096)

  - **Submitted side is method-specific.** The submitted node rows
    carry the raw method-specific columns (`bucket_id`, `is_sample`,
    and the sample three-point values in
    `min_effort`/`expected_effort`/`max_effort`) so an export or a
    detail view of a submitted version can reproduce the input. The
    neutral effort columns (`mean`/`variance`/`offer_pt`/`cost`/
    `offer_price`) stay populated by `EstimationVersion.calculate()`
    — those are what aggregate reads (comparison, list) use. The
    backend never recomputes on read.
  - **Buckets are per-estimation.** New `estimation_buckets` table
    shared across draft and submitted rows: columns `id`,
    `estimation_id`, `position`, `label`, `created_at`, `updated_at`.
    Ordered by `position` like node children.
  - **Flyway migration `V10__bucket_sampled_method.sql`** (V9 is the
    latest; V10 is next):
      * `CREATE TABLE estimation_buckets(...)` with a
        `UNIQUE (estimation_id, position)` constraint and an FK to
        `estimations(id) ON DELETE CASCADE`.
      * On BOTH `draft_estimation_nodes` and
        `submitted_estimation_nodes`:
          - `ADD COLUMN bucket_id UUID NULL REFERENCES
            estimation_buckets(id) ON DELETE RESTRICT` (non-BUCKETED
            rows leave it NULL);
          - `ADD COLUMN is_sample BOOLEAN NULL` (non-BUCKETED rows
            leave it NULL).
      * The node tables use a `VARCHAR` `node_type` discriminator with
        NO CHECK constraint, so nothing to extend there. The PT columns
        (`min_effort`/`expected_effort`/`max_effort`) are already
        nullable — bucketed samples reuse them, non-samples leave them
        NULL.
  - **JPA.** New `EstimationBucket` entity (`domain/EstimationBucket.kt`,
    extends `BaseEntity`) mapped to `estimation_buckets`, with a
    `@ManyToOne` on `Estimation`. Add `@DiscriminatorValue("BUCKETED")`
    subclasses `DraftBucketedItemNode` (in
    `domain/draft/DraftEstimationNode.kt`) and `SubmittedBucketedItemNode`
    (in `domain/submitted/SubmittedEstimationNode.kt`), each holding a
    `@ManyToOne bucket` (`@JoinColumn("bucket_id")`) and an
    `isSample: Boolean?`. They inherit the `min/expected/max` columns
    (reused for the sample triple) and the ordered-children shape.
  - **Estimation.buckets.** Add
    `@OneToMany(mappedBy = "estimation", cascade = ALL,
    orphanRemoval = true) @OrderBy("position")
    buckets: MutableList<EstimationBucket>`.
  - **Draft applier & DTO.** `DraftUpdateApplier.buildDraftNode`,
    previously rejecting `type == "BUCKETED"` with `400`, now accepts
    it ONLY when `draft.estimation.method == BUCKET_SAMPLED_PERT`
    (`Log.warn` + `400` on a mismatch), resolving the
    `EstimationBucket` by `dto.bucketId` from `draft.estimation.buckets`
    (a `400` if unknown) and setting `isSample` + the reused
    min/expected/max. Add a `BucketUpdateDto(id, position, label)` and
    a nullable `buckets: List<BucketUpdateDto>?` on `DraftUpdateDto`;
    `applyBuckets` upserts `estimation.buckets` by id (create missing,
    update label/position, remove-absent — mirrors the phases
    upsert-not-clear pattern, since node rows FK-reference buckets).
    `applyBuckets` MUST run before `applyRoots` so bucketed leaves can
    resolve their bucket. (Removing a bucket still referenced by a
    submitted version is a client error and will surface as a DB
    RESTRICT violation; that is acceptable pre-task-104.)
  - **Mappers.** `DraftVersionMapper.toDomain` maps
    `DraftBucketedItemNode` → domain `BucketedEstimationItem`
    (`bucketId = bucket.id.toString()`, `isSample`,
    `optimistic = minEffort`, `likely = expectedEffort`,
    `pessimistic = maxEffort`). `EstimationVersionService.buildSubmittedNode`
    gains an `is BucketedEstimationItem ->` branch that creates a
    `SubmittedBucketedItemNode` (resolving the bucket via
    `submitted.estimation.buckets`), sets `isSample`, and persists the
    sample triple into `min/expected/max` plus the neutral columns.
    `cloneSubmittedNode` gains the mirror branch (submitted→draft
    clone on new-draft). `EstimationVersionMapper` gains BUCKETED
    branches for both `DraftEstimationNode.toDtoWithCalc` and
    `SubmittedEstimationNode.toDto` (emit `type = "BUCKETED"`,
    `bucketId`, `isSample`). `DraftSnapshotMapper.toUpdateDto` emits
    `type = "BUCKETED"` + `bucketId`/`isSample` for bucketed rows.
  - **Estimation detail DTO.** Add `EstimationBucketDto(id, position,
    label)` and a `buckets: List<EstimationBucketDto>` field on
    `EstimationDetailDto` (`ProjectDtos.kt`), populated in
    `ProjectMapper.toEstimationDetailDto` from `estimation.buckets`
    (empty for PERT estimations).
  - **Logging.** `Log.info` on submit already exists in
    `EstimationVersionService`; extend its message with the method +
    leaf count. `Log.warn` on the applier's rejected mismatched-method
    case. `Log.debug` on per-bucketed-node persistence if useful.
  - **CLAUDE.md.** Update "Persistence shape" to describe
    `estimation_buckets`, the `BUCKETED` discriminator on both node
    tables, the reused min/expected/max sample columns, and the
    `EstimationBucket` per-estimation ownership.

  ## What does NOT belong in this task

  - Frontend editor UI — task-104.
  - Session-support integration — task-106.
  - Export dispatch refactor — task-107.

