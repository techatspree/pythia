      src/backend/implementation/src/main/kotlin/io/github/theestimator/rest/dto/ProjectDtos.kt
      src/backend/implementation/src/main/kotlin/io/github/theestimator/rest/dto/ProjectMapper.kt
    Read migrations V6/V7/V9 for the pattern to follow.
  - |
    Create Flyway
    `src/backend/implementation/src/main/resources/db/migration/V10__bucket_sampled_method.sql`
    with the `estimation_buckets` table (UNIQUE(estimation_id,
    position), FK to estimations ON DELETE CASCADE) and the
    `bucket_id` (FK ON DELETE RESTRICT) + `is_sample` columns on both
    `draft_estimation_nodes` and `submitted_estimation_nodes`, plus a
    supporting index on each `bucket_id`.
  - |
    Add `domain/EstimationBucket.kt` (extends `BaseEntity`, `@Table
    "estimation_buckets"`, `@ManyToOne estimation`, `position: Int`,
    `label: String`). Add a Panache repository
    `repository/EstimationBucketRepository.kt`
    (`PanacheRepositoryBase<EstimationBucket, UUID>`, finder
    `findByEstimationId`).
  - |
    Add `@DiscriminatorValue("BUCKETED")` subclasses in the two node
    files: `DraftBucketedItemNode` (in
    `domain/draft/DraftEstimationNode.kt`) and
    `SubmittedBucketedItemNode` (in
    `domain/submitted/SubmittedEstimationNode.kt`), each with
    `@ManyToOne bucket` (`@JoinColumn("bucket_id")`) and
    `isSample: Boolean?`.
  - |
    Extend `Estimation` with the ordered `buckets` collection.
  - |
    Update `DraftUpdateApplier`:
      * `buildDraftNode`: replace the blanket BUCKETED rejection with
        method-gated acceptance (`400` + `Log.warn` when
        `draft.estimation.method != BUCKET_SAMPLED_PERT`), resolving
        the bucket by id from `draft.estimation.buckets` (`400` if
        unknown) into a `DraftBucketedItemNode`. The existing
        non-GROUP block already copies min/expected/max + assumptions.
      * Add `BucketUpdateDto` + `buckets` on `DraftUpdateDto`
        (`EstimationVersionDtos.kt`) and an `applyBuckets` that
        upserts `estimation.buckets` by id (create/update/remove-absent),
        invoked BEFORE `applyRoots`.
  - |
    Update `DraftVersionMapper`, `EstimationVersionService`
    (`buildSubmittedNode` + `cloneSubmittedNode`),
    `EstimationVersionMapper`, and `DraftSnapshotMapper` to handle the
    bucketed leaf on every path. Populate BOTH the method-specific
    columns and the neutral columns on the submitted side. Extend the
    submit `Log.info` with the method + leaf count.
  - |
    Add `EstimationBucketDto` + `buckets` on `EstimationDetailDto`
    (`ProjectDtos.kt`) and populate it in
    `ProjectMapper.toEstimationDetailDto`.
  - |
    Add `@QuarkusTest`s in
    `src/backend/implementation/src/test/kotlin/io/github/theestimator/rest/EstimationVersionResourceIT.kt`:
      * Create an estimation with `method = BUCKET_SAMPLED_PERT`, PUT a
        draft with 2 buckets and 4 leaves (2 samples, 2 non-samples).
        GET the draft returns calculated values with the per-bucket
        average on the non-sample rows and `bucketId`/`isSample` on the
        wire.
      * Submit the draft. GET the submitted version — non-sample rows
        carry the bucket-derived neutral values AND the raw `bucketId`
        + `isSample`.
      * Full apply → undo → redo cycle on a bucketed draft restores the
        bucketed state (proves the flat DTO round-trips the undo log).
  - |
    Update `CLAUDE.md` "Persistence shape" section.
  - |
    Build:
      ./gradlew :backend:implementation:test
      ./gradlew build

