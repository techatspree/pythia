id: task-063
phase: phase-11
title: Backend — session persistence schema and entities
depends_on: [task-062]
description: |
  Persistence layer for collaborative estimation sessions. A session
  is started by a moderator against an existing estimation's DRAFT
  version, over a chosen subset of the draft's leaf items, and walks
  each item through a two-phase Delphi flow. This task adds the Flyway
  migration, the Panache entities, and the repositories. No REST or
  WebSocket wiring yet (task-064 / task-065).

  This persists the THREE_POINT_PERT session (recap): full PERT triple
  per estimator, mean aggregation with spread (task-062), authenticated
  users only, finalize writes back onto the draft version's items. The
  vote/finalize columns below are the three-point shape specifically —
  the bucket+sampled method (task-106) votes on bucket assignments and
  will extend the vote storage separately; this schema is not meant to
  be method-generic (task-105 keeps session persistence PERT-shaped and
  only routes the reduction through the method SPI).

  Current state:
    - **PostgreSQL 16 everywhere — there is NO H2** (removed in
      task-083). Both dev and `%test` run PostgreSQL (Testcontainers /
      Dev Services). Write plain PostgreSQL DDL; no portability
      constraints. The latest migration is **V12** (V8 undo_log, V9
      estimation_method, V10 bucket_sampled_method, V11
      anglicise_parameter_keys, V12 user_language), so the new one is
      **V13**. Mirror id/timestamp/FK conventions from a RECENT
      migration (e.g. V10/V12), not V1–V7.
    - Entities live under
      src/backend/implementation/src/main/kotlin/io/pythia/domain/
      (JPA Panache) and extend `BaseEntity` (uuid `id` +
      `created_at`/`updated_at`); repositories under …/repository/
      (PanacheRepository).
    - Draft leaves are rows in `draft_estimation_nodes` keyed by a
      stable `logical_id` (see CLAUDE.md persistence section);
      `node_logical_id` below is a SOFT reference to it (a `varchar`,
      not an FK — like the undo log references nodes).

  Target state — Flyway V13 (
  src/backend/implementation/src/main/resources/db/migration/V13__estimation_sessions.sql)
  creating four tables (match recent-migration conventions for
  id/timestamp columns and FK naming):

    estimation_sessions
      id (pk), estimation_id (fk → estimations), title,
      moderator_subject_id, status (varchar; see enum below),
      current_item_index (int, default 0), current_phase (varchar;
      'PHASE1' | 'PHASE2'), created_at, updated_at, finalized_at (null).

    session_items
      id (pk), session_id (fk → estimation_sessions, cascade delete),
      node_logical_id (varchar; the draft leaf's logical_id),
      position (int), status (varchar; 'PENDING'|'PHASE1'|'PHASE2'|
      'FINALIZED'), discussion_notes (text, null),
      final_min_effort / final_expected_effort / final_max_effort
      (double precision, null until finalized).
      unique(session_id, node_logical_id).

    session_participants
      id (pk), session_id (fk, cascade), subject_id (varchar),
      display_name (varchar), participant_role (varchar;
      'MODERATOR'|'ESTIMATOR'), joined_at, agreed (boolean default
      false — phase-2 agreement on the CURRENT item; reset when the
      item advances).
      unique(session_id, subject_id).

    session_votes
      id (pk), session_id (fk, cascade), session_item_id (fk →
      session_items, cascade), participant_subject_id (varchar),
      phase (varchar; 'PHASE1'|'PHASE2'), min_effort,
      expected_effort, max_effort (double precision), submitted_at.
      unique(session_item_id, participant_subject_id, phase).

  Session status enum (Kotlin `SessionStatus`): CREATED, RUNNING,
  FINALIZED, CANCELLED. (Per-item progress is tracked by
  session_items.status + the session's current_item_index/current_phase;
  the session-level status is the coarse lifecycle.)

  Entities + repositories (Kotlin, Panache; follow the existing
  PanacheRepository pattern with finder extension methods):
    - EstimationSession, SessionItem, SessionParticipant, SessionVote
      under …/domain/session/.
    - EstimationSessionRepository, SessionVoteRepository (+ finders:
      findBySession, findByItemAndPhase, findParticipant) under
      …/repository/.

steps:
  - |
    Write the Flyway migration
    src/backend/implementation/src/main/resources/db/migration/V13__estimation_sessions.sql
    with the four tables above, as plain PostgreSQL DDL (no H2/portability
    constraints — mirror id/timestamp column types from a recent migration
    like V10/V12). Add the listed unique constraints and FK cascade-deletes.

  - |
    Add the JPA Panache entities under
    src/backend/implementation/src/main/kotlin/io/pythia/domain/session/:
    EstimationSession.kt, SessionItem.kt, SessionParticipant.kt,
    SessionVote.kt — each extending `BaseEntity` (use the all-open/no-arg
    Kotlin plugins already configured; map enums as
    `@Enumerated(EnumType.STRING)`, matching the `estimations.method`
    precedent). Add SessionStatus.kt, SessionItemStatus.kt, SessionPhase.kt,
    ParticipantRole.kt enums under the same package.

  - |
    Add repositories under
    src/backend/implementation/src/main/kotlin/io/pythia/repository/:
    EstimationSessionRepository.kt and SessionVoteRepository.kt (implement
    `PanacheRepository<T>`) with the finder extension methods listed in the
    description.

  - |
    Document the new session persistence in `CLAUDE.md`'s "Persistence
    shape" section: the four tables (`estimation_sessions`,
    `session_items`, `session_participants`, `session_votes`, V13), their
    entities under `domain/session/`, the `SessionStatus` lifecycle enum,
    and that the vote/finalize columns are the three-point-PERT shape
    (bucket sessions extend storage in task-106).

  - |
    Build and run the backend test suite (Dev Services / Testcontainers
    spins up PostgreSQL — Docker must be running) so the V13 migration
    applies cleanly and the entities map:
      ./gradlew :backend:implementation:test

validation:
  - |
    Migration and entities exist:
      test -f src/backend/implementation/src/main/resources/db/migration/V13__estimation_sessions.sql
      test -f src/backend/implementation/src/main/kotlin/io/pythia/domain/session/EstimationSession.kt
      test -f src/backend/implementation/src/main/kotlin/io/pythia/domain/session/SessionVote.kt
  - |
    The four tables are declared in V13:
      grep -q "estimation_sessions" src/backend/implementation/src/main/resources/db/migration/V13__estimation_sessions.sql
      grep -q "session_items" src/backend/implementation/src/main/resources/db/migration/V13__estimation_sessions.sql
      grep -q "session_participants" src/backend/implementation/src/main/resources/db/migration/V13__estimation_sessions.sql
      grep -q "session_votes" src/backend/implementation/src/main/resources/db/migration/V13__estimation_sessions.sql
  - |
    Repositories exist:
      test -f src/backend/implementation/src/main/kotlin/io/pythia/repository/EstimationSessionRepository.kt
      test -f src/backend/implementation/src/main/kotlin/io/pythia/repository/SessionVoteRepository.kt
  - |
    Backend builds, V13 migration applies, entities map:
      ./gradlew :backend:implementation:test

