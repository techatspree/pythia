id: task-054
phase: phase-9
title: Frontend EstimationGrid renders the tree
depends_on: [task-053]
description: |
  After task-050 the backend's draft REST API exposes `roots` instead of
  `itemGroups`, with arbitrarily deep nesting. The current
  src/frontend/src/lib/components/EstimationGrid.svelte assumes the
  old two-level shape (group → items) and renders one collapsible
  header per group with a flat item list under it. This task rewrites
  the grid to render an arbitrarily deep tree and wires the page-level
  state on top.

  UI design (deliberately conservative — keep the dense table look that
  matches PhasesPanel/ParametersPanel; do not switch to a drag-and-drop
  tree-view library):
    - One table row per node, both group and leaf.
    - Indentation in column A: an empty span of width `depth * 1.25rem`
      followed by the existing ▼/▶ chevron for groups (leaves get no
      chevron, just the indent).
    - Group row spans the editable columns with the title input + the
      child count badge currently rendered for groups. Calculated
      columns on group rows show the accumulated values from
      calcMap[group.logicalId] (the backend already sends these for
      every node after task-050/051).
    - Leaf row keeps the existing inline inputs (description, type,
      phase, optimistic, likely, pessimistic, PERT, assumptions,
      offerPT, cost, offerPrice, delete).
    - Per-row action buttons (right side, only when editable):
        on a group: "+ child group", "+ item"
        on a leaf: ✕ (delete, as today)
    - Expand/collapse state stays client-side (Set<logicalId>); no
      persistence to the backend.
    - Footer totals row reads the version's totalEffort etc. directly
      (the backend already accumulates).

  State model:
    - Replace `let groups = $state<Group[]>(initGroups(version));` with
      `let roots = $state<Node[]>(initRoots(version));` where
        type Node = {
            logicalId: string;
            type: 'GROUP' | 'FIXED' | 'TIME_RELATIVE';
            title?: string;             // group only
            description?: string;       // leaf only
            // ... existing leaf fields ...
            children: Node[];           // empty for leaves
        }
    - notify() emits roots recursively in the shape expected by
      DraftUpdateDto.roots (matches the Kotlin EstimationNodeUpdateDto
      after task-050).
    - Keyboard navigation between cells stays scoped to leaves only
      (groups have no editable effort cells). The flat-order list used
      by Tab / Arrow keys becomes "all visible leaves in depth-first
      order". Visibility = the leaf is not under any collapsed group
      ancestor.

  Page-level wiring (src/frontend/src/routes/estimations/[id]/versions/
  [versionNumber]/+page.svelte and src/frontend/src/routes/estimations/
  [id]/compare/+page.svelte):
    - `currentGroups` → `currentRoots`.
    - The PUT payload field renames itemGroups → roots.
    - The compare page already changed in task-052; here, only the
      version detail page needs the rename.

  PhasesPanel.svelte also consumes the old `itemGroups` prop (lines 7,
  13, 50 — it iterates groups + items to compute per-phase totals).
  Rename the prop to `roots` and walk the tree (depth-first leaf
  collection) instead of `g.items.forEach`. Without this, autosaved
  edits in PhasesPanel break when the version page passes `currentRoots`
  instead of `currentGroups`.

  Backend REST compat shim cleanup (added on user request when the
  unmodified frontend silently dropped edits). After this task the
  frontend speaks `roots` end-to-end so the shims aren't needed:
    - Remove `DraftUpdateDto.itemGroups` + `LegacyItemGroupUpdateDto` +
      `LegacyItemUpdateDto` from
      src/backend/.../rest/dto/EstimationVersionDtos.kt.
    - Remove `EstimationVersionDto.itemGroups` + `LegacyItemGroupDto` +
      `LegacyItemDto` from the same file.
    - Remove the `effectiveRoots` translation block from
      EstimationVersionResource.updateDraft (back to plain
      `update.roots?.let { … }`).
    - Remove the `legacyItemGroups` / `collectLegacyItems` helpers and
      the `itemGroups = legacyItemGroups(rootDtos)` calls from
      EstimationVersionMapper.kt.
    - The new e2e populateDraft must already use `roots` (see below) so
      this removal is safe.

  e2e/smoke.test.ts populateDraft helper currently posts the legacy
  `itemGroups: [{title, items: [...]}]` shape. Rewrite it to the
  canonical `roots: [{type: "GROUP", title, children: [{type: "FIXED",
  description, ...}]}]` shape. Otherwise removing the backend compat
  shim above breaks every existing e2e (PUT returns 400 because the
  unknown `itemGroups` field is dropped and the items never persist).

  Generated TS types:
    - src/frontend/src/lib/api/schema.d.ts is regenerated by the build
      from the backend OpenAPI; after running `npm run build` (or
      whatever script the project uses to refresh it) the types should
      show the new `roots: ApiEstimationNode[]` field with children.
    - src/frontend/src/lib/api/types.ts (the hand-written companion)
      gets ApiEstimationNode and ApiEstimationNodeUpdate added and the
      old ApiItemGroup/ApiEstimationItem types removed. ApiVersionResponse
      gets `roots: ApiEstimationNode[]`.

  Domain (Kotlin/JS) cleanup that becomes safe in this task:
    - Rewrite src/frontend/src/lib/adapter.ts so it no longer calls
      `version.itemGroups.asJsReadonlyArrayView()`. The frontend
      computes the calc map from the new tree: walk
      `calculated.roots.asJsReadonlyArrayView()` recursively, and for
      every leaf (filterIsInstance against EstimationItem on the JS
      side via the discriminator) push an entry into the map. Group
      entries are pushed too if the EstimationGrid wants per-group
      accumulated values shown.
    - Remove the deprecated `itemGroups` shim (both the @Deprecated
      `val itemGroups` getter AND the @JsName secondary constructor)
      from EstimationVersion.kt (added in task-049, kept alive through
      task-050/051/052/053 solely for adapter.ts).
    - Update DomainFactory:
        - createVersion: parameter `itemGroups: Array<EstimationItemGroup>`
          → `roots: Array<EstimationNode>`. Body passes `roots = roots
          .toList()` straight through (no more legacy conversion).
        - createGroup: signature changes from
          `(title, logicalId, items: Array<EstimationItem>) → EstimationItemGroup`
          to `(title, logicalId, children: Array<EstimationNode>)
          → EstimationGroup`. The `children: Array<EstimationNode>`
          accepts both leaves AND nested groups, so adapter.ts can
          build trees of arbitrary depth.
        - createFixedItem / createTimeRelativeItem unchanged.
    - After the changes, `mvn -pl src/domain -am package` regenerates
      domain.d.ts (currently still contains `itemGroups?:
      Array<EstimationItemGroup>` and `createFromItemGroups(...)`).
      RUN THIS REGEN STEP before `npm run check`, otherwise the
      frontend type-checks against stale declarations.
    - EstimationItemGroup.kt itself is left untouched in this task
      (task-055 deletes it as part of the final cleanup). After this
      task, no JS-exported surface references it; only the dead-code
      class file remains.

  Tests:
    - Playwright smoke test in src/frontend/e2e/smoke.test.ts:
        - Rewrite populateDraft to send `roots` (canonical shape) —
          this is the SAFE companion to removing the backend compat
          shim. Every existing test that calls populateDraft inherits
          the fix.
        - Add a 3-level tree case that creates Backend > Auth >
          {Token, Session} via the UI (click "+ child group" / "+ item"
          buttons), reloads the page, and asserts the structure
          survives. The autosave debounce already covers the timing.
        - Add an autosave-payload assertion: intercept the PUT to
          `/api/.../draft`, parse the body, and assert it contains
          `roots: [...]` and NOT `itemGroups: [...]`. Catches a
          forgotten payload-field rename without depending on UI
          re-renders.

steps:
  - |
    Update src/frontend/src/lib/api/types.ts: introduce
    ApiEstimationNode (recursive) and ApiEstimationNodeUpdate; replace
    ApiVersionResponse.itemGroups with `roots: ApiEstimationNode[]`.

  - |
    Rewrite src/frontend/src/lib/components/EstimationGrid.svelte per
    the design above. Recommended structure for keyboard-nav sanity:
    build a single depth-first row list once via a helper
      function flatten(roots, collapsed): Array<{node, depth, ancestorsCollapsed}>
    then render with `{#each rows as r}`. Keyboard nav (Tab / Arrow /
    Enter) indexes into the visible leaves of this list — visible means
    no ancestor is in the `collapsed` set. This keeps the keyboard
    contract identical to the current grid (which uses
    `visibleItems(): [groupIdx, itemIdx][]`). Keep the existing
    Tailwind classes and the brand-green palette. Don't forget the
    empty-state "+ Add group" button.

  - |
    Update src/frontend/src/lib/components/PhasesPanel.svelte: rename
    the `itemGroups` prop to `roots`, and walk the tree (depth-first
    leaf collection helper) wherever the panel currently iterates
    `g.items`. Without this, autosave breaks when +page.svelte starts
    passing `currentRoots` here.

  - |
    Update src/frontend/src/routes/estimations/[id]/versions/
    [versionNumber]/+page.svelte:
      - rename currentGroups → currentRoots
      - rename the autosave payload field itemGroups → roots
      - pass currentRoots into EstimationGrid AND PhasesPanel (the
        latter via the renamed `roots` prop)

  - |
    Rewrite src/frontend/src/lib/adapter.ts so it walks
    `calculated.roots.asJsReadonlyArrayView()` recursively instead of
    `calculated.itemGroups`. Build the tree of EstimationNode via
    createGroup (now returning EstimationGroup with children:
    Array<EstimationNode>). Drop the EditingGroup type in favour of a
    single EditingNode discriminated union (type: 'GROUP' | 'FIXED' |
    'TIME_RELATIVE').

  - |
    Remove the deprecated `itemGroups` shim from
    src/domain/src/main/kotlin/io/pythia/model/EstimationVersion.kt
    — both the @Deprecated `val itemGroups` getter AND the @JsName
    secondary constructor added in task-049. Update DomainFactory:
      - createVersion: parameter renamed itemGroups → roots, type
        Array<EstimationNode>. Body: roots = roots.toList().
      - createGroup: signature changes from
        (title, logicalId, items: Array<EstimationItem>) → EstimationItemGroup
        to
        (title, logicalId, children: Array<EstimationNode>) → EstimationGroup
        so adapter.ts can build trees of arbitrary depth.
    Confirm no other Kotlin/JS-exported surface still references
    EstimationItemGroup (EstimationItemGroup.kt itself stays, deleted
    in task-055):
      ! grep -rn "EstimationItemGroup" src/domain/src/main/kotlin

  - |
    Regenerate domain.d.ts BEFORE running the frontend type-check —
    otherwise svelte-check reads stale declarations and fails:
      mvn -pl src/domain -am package
    Confirm the regenerated file no longer mentions itemGroups:
      ! grep -q "itemGroups" src/frontend/src/lib/domain/domain.d.ts

  - |
    Remove the REST backend compat shims (now unnecessary — frontend
    speaks roots end-to-end):
      - EstimationVersionDtos.kt: delete LegacyItemGroupUpdateDto,
        LegacyItemUpdateDto, LegacyItemGroupDto, LegacyItemDto, the
        itemGroups field on DraftUpdateDto, and the itemGroups field
        on EstimationVersionDto.
      - EstimationVersionResource.updateDraft: remove the
        `effectiveRoots` translation block; go back to plain
        `update.roots?.let { … }`.
      - EstimationVersionMapper.kt: remove the legacyItemGroups +
        collectLegacyItems helpers and the `itemGroups =
        legacyItemGroups(rootDtos)` calls on both
        SubmittedEstimationVersion.toDto and
        DraftEstimationVersion.toDto.

  - |
    Run the frontend type-check:
      cd src/frontend && npm run check

  - |
    Visual smoke check (npm run check verifies types but not layout or
    autosave behaviour):
      1. cd src/frontend && npm run dev
      2. open a draft, create a Group "Backend", under it "Auth", under
         "Auth" two leaf items
      3. confirm the indentation makes the hierarchy obvious
      4. confirm calculated columns on the group rows show the sum of
         the leaf values below them
      5. reload the page → structure round-trips
      6. add a sibling item to the inner group via the "+ item" link →
         autosave indicator goes through saving → saved

  - |
    Update src/frontend/e2e/smoke.test.ts:
      - Rewrite populateDraft to send `roots` (canonical shape) instead
        of `itemGroups`. This makes every existing e2e test compatible
        with the now-shim-less backend.
      - Add a 3-level tree case that builds Backend > Auth >
        {Token, Session} via the UI and asserts the tree survives a
        page reload.
      - Add an autosave-payload assertion: intercept the PUT to
        `/api/.../draft`, parse the body, assert `roots: [...]` is
        present and `itemGroups` is NOT.

  - |
    Update CLAUDE.md — the "Frontend ↔ domain bridge (adapter.ts)"
    paragraph currently says the frontend uses the deprecated
    `EstimationVersion.itemGroups` view "until task-054 rewrites
    adapter.ts to walk `roots`. … Do not remove the shim before
    task-054." Rewrite to past tense: adapter.ts walks `roots`, the
    Kotlin shim is gone, the legacy DomainFactory.createGroup signature
    is gone. Also update any mention of the REST `itemGroups` legacy
    compat shim if present.

  - |
    Run the e2e suite:
      cd src/frontend && npm run test:e2e

validation:
  - |
    EstimationGrid renders roots, not groups:
      ! grep -q "itemGroups" src/frontend/src/lib/components/EstimationGrid.svelte
      grep -q "roots" src/frontend/src/lib/components/EstimationGrid.svelte
  - |
    PhasesPanel is on the new prop name and walks roots:
      ! grep -q "itemGroups" src/frontend/src/lib/components/PhasesPanel.svelte
      grep -q "roots" src/frontend/src/lib/components/PhasesPanel.svelte
  - |
    The version detail page renames the autosave payload field:
      grep -q "roots: currentRoots" \
            "src/frontend/src/routes/estimations/[id]/versions/[versionNumber]/+page.svelte"
      ! grep -q "itemGroups:" \
            "src/frontend/src/routes/estimations/[id]/versions/[versionNumber]/+page.svelte"
  - |
    ApiVersionResponse exposes roots:
      grep -q "roots: ApiEstimationNode\[\]" src/frontend/src/lib/api/types.ts
      ! grep -q "ApiItemGroup\|ApiEstimationItem" src/frontend/src/lib/api/types.ts
  - |
    adapter.ts no longer reads itemGroups from the Kotlin/JS bridge:
      ! grep -q "itemGroups" src/frontend/src/lib/adapter.ts
  - |
    Regenerated domain.d.ts is on the new shape:
      ! grep -q "itemGroups" src/frontend/src/lib/domain/domain.d.ts
      ! grep -q "EstimationItemGroup" src/frontend/src/lib/domain/domain.d.ts
  - |
    Kotlin/JS shim is gone from the domain:
      ! grep -q "@Deprecated" src/domain/src/main/kotlin/io/pythia/model/EstimationVersion.kt
      ! grep -q "createFromItemGroups" src/domain/src/main/kotlin/io/pythia/model/EstimationVersion.kt
  - |
    Backend REST compat shim is gone:
      ! grep -qE "LegacyItemGroupDto|LegacyItemUpdateDto|LegacyItemDto|LegacyItemGroupUpdateDto" \
            src/backend/implementation/src/main/kotlin/io/pythia/rest/dto/EstimationVersionDtos.kt
      ! grep -q "effectiveRoots" \
            src/backend/implementation/src/main/kotlin/io/pythia/rest/EstimationVersionResource.kt
      ! grep -qE "legacyItemGroups|collectLegacyItems" \
            src/backend/implementation/src/main/kotlin/io/pythia/rest/dto/EstimationVersionMapper.kt
  - |
    e2e populateDraft uses the canonical roots shape:
      ! grep -q "itemGroups:" src/frontend/e2e/smoke.test.ts
      grep -q "roots:" src/frontend/e2e/smoke.test.ts
  - |
    CLAUDE.md no longer says the shim must survive:
      ! grep -q "Do not remove the shim before task-054" CLAUDE.md
  - |
    Frontend type-check, e2e, and the full Maven build all pass:
      mvn -DskipTests package
      cd src/frontend && npm run check
      cd src/frontend && npm run test:e2e

