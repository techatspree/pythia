id: task-201
phase: phase-14
title: "Unique operationId on every OpenAPI operation"
depends_on: [task-200, task-213]
description: |
  The committed OpenAPI document (`src/frontend/src/lib/api/openapi.json`,
  generated by SmallRye during augmentation, task-114) declares **no
  `operationId` on any of its 52 operations** (51 when this task was written;
  task-213 added `PUT /api/system/hours-per-day`). Redocly's `minimal` ruleset
  reports exactly that (`operation-operationId`), and it has two practical
  costs:
    - the generated client has no operation names: `schema.d.ts` ends in
      `export type operations = Record<string, never>;`, so nothing can refer
      to "the getProject call", only to a path + method pair;
    - Swagger UI, API gateways and any external client generator fall back to
      invented names (`apiProjectsIdGet`), which change whenever a path does.

  ## Target state

  Every operation carries a unique, stable, camelCase `operationId` equal to
  its Kotlin resource method name. A duplicate id FAILS the build, so a
  collision can never be committed. A test pins the rule.

  ## Decisions

  1. **Generated, not hand-written.** SmallRye derives ids from the method
     name (`quarkus.smallrye-openapi.operation-id-strategy=METHOD`). There is
     no `@Operation(operationId = …)` anywhere; the method name is the single
     source. An explicit `operationId` would be a second place that names the
     operation, so it can drift from the method name.
  2. **METHOD, not CLASS_METHOD.** `CLASS_METHOD` yields
     `ProjectResource_getProject`: unique by construction, but the class name
     is an implementation detail that leaks into every client, and a class
     split would rename operations. METHOD needs unique method names across
     resources, so decision 4 renames the colliding and generic ones.
  3. **Duplicates fail the build**:
     `mp.openapi.extensions.smallrye.duplicateOperationIdBehavior=FAIL`
     (SmallRye 4.3.5; the default only warns). Two of today's names already
     collide (`get` and `ping`, twice each), so this is not hypothetical.
     **Prove the key is honoured**, as the task-198 lesson demands: Quarkus
     3.40 silently ignores config it does not read, so add a temporary
     duplicate and watch the build fail before relying on it.
  4. **Rename the resource methods whose names are not self-describing**, so
     the generated id reads on its own. Only the Kotlin function name changes:
     paths, verbs, DTOs and behaviour stay identical, and the methods are
     called only over HTTP. The full list:

     | class | today | becomes |
     |---|---|---|
     | `AdminPingResource` | `ping` | `adminPing` |
     | `PingResource` | `ping` | `ping` (kept; the admin one moves) |
     | `MeResource` | `me` | `getCurrentUser` |
     | `MeResource` | `updateLanguage` | `updateCurrentUserLanguage` |
     | `SessionResource` | `wsTicket` | `createSessionWsTicket` |
     | `SessionResource` | `create` | `createSession` |
     | `SessionResource` | `get` | `getSession` |
     | `SessionResource` | `list` | `listSessions` |
     | `SessionResource` | `join` | `joinSession` |
     | `SessionResource` | `start` | `startSession` |
     | `SessionResource` | `notes` | `updateSessionItemNotes` |
     | `SessionResource` | `reveal` | `revealSessionItem` |
     | `SessionResource` | `finalize` | `finalizeSessionItem` |
     | `SessionResource` | `vote` | `voteSessionItem` |
     | `SessionResource` | `voteBucket` | `voteSessionItemBucket` |
     | `SessionResource` | `agree` | `agreeSessionItem` |
     | `SessionResource` | `cancel` | `cancelSession` |
     | `SessionResource` | `suspend` | `suspendSession` |
     | `SessionResource` | `resume` | `resumeSession` |
     | `SessionResource` | `endEarly` | `endSessionEarly` |
     | `SystemSettingsResource` | `get` | `getSystemSettings` |
     | `SystemSettingsResource` | `update` | `updateSystemSettings` |
     | `SystemSettingsResource` | `css` | `getSystemCss` |
     | `SystemSettingsResource` | `uploadCss` | `uploadSystemCss` |
     | `SystemSettingsResource` | `deleteCss` | `deleteSystemCss` |
     | `SystemSettingsResource` | `effortDrivers` | `getSystemEffortDrivers` |
     | `SystemSettingsResource` | `replaceEffortDrivers` | `replaceSystemEffortDrivers` |
     | `SystemSettingsResource` | `updateHoursPerDay` | `updateHoursPerDay` (kept: already unique and verb–noun; added by task-213, so its id must not change right after it shipped) |
     | `TestDataResource` | `reset` | `resetTestData` |

     The names chosen for the session item actions (`reveal`, `finalize`,
     `vote`, `voteBucket`, `agree`) must match what the path actually acts on.
     Read each `@Path` first. Where it operates on the session rather than an
     item, use `…Session…` instead of `…SessionItem…`, and record the
     deviation in the step's report. All other resources (`ProjectResource`,
     `EstimationResource`, `EstimationVersionResource`, `UserResource`)
     already use verb–noun names and stay unchanged.
     `TestDataResource` is `@IfBuildProfile("dev")` and absent from the
     committed document. It is renamed anyway, because the dev augmentation
     runs the same duplicate check.
  5. **The frontend does not change behaviour.** Every consumer of
     `$lib/api/schema` uses `components['schemas']` only. `schema.d.ts` gains
     a populated `operations` map and `paths` entries that point into it, so
     the types stay equivalent. The OpenAPI drift gate (CI) requires the
     regenerated `openapi.json` + `schema.d.ts` to be committed with this
     change.

  ## Out of scope

  Redocly's other warnings: `security-defined` (5, the deliberately
  `@PermitAll` endpoints such as `/api/ping` and `/api/system`, which
  should be documented with `security: []` instead) and
  `no-server-example.com` (the auto-generated `servers` block). Each would
  be its own small task. Also out of scope is migrating components from the
  hand-written `$lib/api/types.ts` onto the generated types.

steps:
  - |
    Read `src/backend/implementation/src/main/resources/application.properties`
    (the OpenAPI block), every resource in
    `src/backend/implementation/src/main/kotlin/io/pythia/rest/` named in the
    rename table, and the OpenAPI section of `src/backend/CLAUDE.md`. Grep the
    backend tests for any DIRECT call of a renamed method
    (`grep -rnE "\.(get|list|me|ping|create|reset)\(" src/backend/implementation/src/test`
    and inspect matches). Expect none, since ITs go over HTTP.
  - |
    Configure the strategy and the duplicate guard in `application.properties`,
    in the OpenAPI block, unprofiled (every augmentation must agree), each with
    a comment carrying the rationale from decisions 1–3:
      quarkus.smallrye-openapi.operation-id-strategy=METHOD
      mp.openapi.extensions.smallrye.duplicateOperationIdBehavior=FAIL
  - |
    PROVE the duplicate guard works before renaming anything: with only the
    two properties above in place, `./gradlew :backend:implementation:quarkusAppPartsBuild --rerun`
    must FAIL, naming a duplicate operationId (`get` or `ping`). If it
    succeeds, the key is not honoured. Find the property Quarkus 3.40 actually
    reads (check the SmallRye/Quarkus config docs; the `quarkus.smallrye-openapi.*`
    namespace may carry an equivalent) and repeat until it fails. Record the
    failing output in the report.
  - |
    Rename the resource methods exactly as in decision 4's table (Kotlin
    function names only — no `@Path`, verb, parameter or DTO change). Verify the
    session-item names against each method's `@Path` as decision 4 requires.
    Then `./gradlew :backend:implementation:quarkusAppPartsBuild --rerun`
    must PASS.
  - |
    Add `src/backend/implementation/src/test/kotlin/io/pythia/rest/OpenApiOperationIdIT.kt`
    (`@QuarkusTest`): fetch `GET /q/openapi?format=json`, walk every
    path × HTTP method, and assert that
      * every operation has an `operationId`;
      * all ids are unique;
      * each matches `^[a-z][A-Za-z0-9]*$` (camelCase, no class prefix, no `_`);
      * a handful of known ids exist: `getProject`, `listProjects`,
        `changeOwner`, `getSession`, `getSystemSettings`, `ping`, `adminPing`.
    Run: `./gradlew :backend:implementation:test --tests '*OpenApiOperationIdIT'`.
  - |
    Regenerate the client: `./gradlew build` refreshes `openapi.json` and
    `schema.d.ts`. Confirm `schema.d.ts` no longer contains
    `operations = Record<string, never>` and that `./gradlew :frontend:check`
    is green (no consumer breaks). Leave both regenerated files in the working
    tree; do NOT commit (the user commits). Say in the report that the CI
    drift gate (`verifyOpenApiSchemaCommitted`) requires `openapi.json` and
    `schema.d.ts` to be committed together with the renames.
  - |
    Re-run Redocly to confirm the warning class is gone:
      npx -y @redocly/cli@2.64.1 lint --extends=minimal --format=summary src/frontend/src/lib/api/openapi.json
    `operation-operationId` must no longer appear. The out-of-scope warnings
    may remain. The version is pinned so a newer ruleset cannot change the
    result between runs.
  - |
    Docs: in `src/backend/CLAUDE.md`'s REST/OpenAPI section, add a short
    paragraph: ids are generated from the method name (METHOD strategy), a
    duplicate fails the build, resource methods are therefore named
    verb–noun and unique ACROSS resources, and an explicit
    `@Operation(operationId=…)` is not used (decision 1).
  - |
    ./gradlew build, then the Playwright suite against `./scripts/dev.sh`
    (REST DTO surface regenerated, so the e2e gate applies), English then
    German. Before starting the stack, check that :8090, :5173 and :5432 are
    free (otherwise stop: another stack is running, and the tests would
    silently run against it); afterwards stop only the `dev.sh` this task
    started (its parent process is this session).

validation:
  - |
    P=src/backend/implementation/src/main/resources/application.properties
    grep -q "operation-id-strategy=METHOD" $P
    grep -q "duplicateOperationIdBehavior=FAIL" $P
  - |
    R=src/backend/implementation/src/main/kotlin/io/pythia/rest
    ! grep -rn "operationId *=" $R
    grep -q "fun adminPing" $R/AdminPingResource.kt
    grep -q "fun getSession" $R/SessionResource.kt
    grep -q "fun getSystemSettings" $R/SystemSettingsResource.kt
    grep -q "fun getCurrentUser" $R/MeResource.kt
    ! grep -qE "fun (get|list|create|me)\(" $R/SessionResource.kt $R/SystemSettingsResource.kt $R/MeResource.kt
  - |
    The committed document: every operation has an id, and all are unique:
      J=src/frontend/src/lib/api/openapi.json
      total=$(jq '[.paths[] | to_entries[] | select(.key|test("^(get|put|post|delete|patch)$"))] | length' $J)
      ids=$(jq '[.paths[] | to_entries[] | select(.key|test("^(get|put|post|delete|patch)$")) | .value.operationId | select(. != null)]' $J)
      test "$total" -gt 0
      test "$(echo "$ids" | jq length)" -eq "$total"
      test "$(echo "$ids" | jq 'unique | length')" -eq "$total"
      ! grep -q "operations = Record<string, never>" src/frontend/src/lib/api/schema.d.ts
  - |
    test -f src/backend/implementation/src/test/kotlin/io/pythia/rest/OpenApiOperationIdIT.kt
    ./gradlew :backend:implementation:test --tests '*OpenApiOperationIdIT'
  - |
    grep -q "operationId" src/backend/CLAUDE.md
  - |
    ./gradlew :frontend:check
  - |
    ./gradlew build
  - |
    cd src/frontend
    E2E_LANG=en npx playwright test
    E2E_LANG=de npx playwright test

outputs:
  - modified: src/backend/implementation/src/main/resources/application.properties
  - modified: src/backend/implementation/src/main/kotlin/io/pythia/rest/AdminPingResource.kt
  - modified: src/backend/implementation/src/main/kotlin/io/pythia/rest/MeResource.kt
  - modified: src/backend/implementation/src/main/kotlin/io/pythia/rest/SessionResource.kt
  - modified: src/backend/implementation/src/main/kotlin/io/pythia/rest/SystemSettingsResource.kt
  - modified: src/backend/implementation/src/main/kotlin/io/pythia/rest/TestDataResource.kt
  - created: src/backend/implementation/src/test/kotlin/io/pythia/rest/OpenApiOperationIdIT.kt
  - modified: src/frontend/src/lib/api/openapi.json
  - modified: src/frontend/src/lib/api/schema.d.ts
  - modified: src/backend/CLAUDE.md
