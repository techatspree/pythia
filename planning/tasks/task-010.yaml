id: task-010
phase: phase-3
title: Create Flyway migration for initial schema
depends_on: [task-009]
description: |
  Author V1__initial_schema.sql with the full schema for projects,
  estimations, versions, items, users, and audit_log. Add the unique
  constraint on (estimation_id, version_number) and indexes on FKs.
steps:
  - create src/main/resources/db/migration/V1__initial_schema.sql
  - tables: projects, estimations, estimation_versions, estimation_items, users, audit_log
  - add UNIQUE (estimation_id, version_number) on estimation_versions
  - add indexes on all foreign key columns
  - configure quarkus.flyway.migrate-at-start=true for dev profile
  - configure quarkus.hibernate-orm.database.generation=validate (NOT update)
validation:
  - app starts cleanly against an empty database
  - schema matches entity mappings (validation succeeds)
outputs:
  - backend/src/main/resources/db/migration/V1__initial_schema.sql
