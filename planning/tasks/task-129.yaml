  - |
    Docs updated:
      grep -qi "moderator_estimates\|moderate-only\|assumptions" docs/estimation-sessions.md
      grep -qi "moderator_estimates\|moderatorEstimates" CLAUDE.md
  - |
    Full build (migration + backend + frontend) and the e2e suite pass:
      ./gradlew build
      cd src/frontend && npm run test:e2e

