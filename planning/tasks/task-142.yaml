id: task-142
phase: phase-15
title: Generalise the session SPI for a second method
depends_on: [task-105]
description: |
  Widen `EstimationMethodSessionSupport` so a method whose votes are NOT a
  three-point triple can implement it. Split out of task-106, which cannot
  start until this lands.

  ## Current state

  task-105 introduced the session SPI in `io.github.theestimator.method` with a
  deliberately PERT-shaped signature, because PERT was the only
  implementation available to generalise against:

  ```kotlin
  interface EstimationMethodSessionSupport {
      val method: EstimationMethod
      fun reduce(votes: List<EstimatorVote>): VoteAggregate
  }
  ```

  `ThreePointSessionSupport` (package `…method.threepoint`) is the sole
  implementor; it delegates to `VoteAggregation.aggregate`. The sole consumer
  is `EstimationSessionService`, which resolves support via the private
  `sessionSupport(session)` helper and calls `reduce` at two sites:
  `finalizeCurrent`, and `itemDto` (which receives the resolved support as a
  parameter from `buildDto`).

  The bucket+sampled method (task-106) votes on **bucket assignments**, not
  triples, and its reduction carries per-item conflict provenance. Neither the
  parameter type nor the return type fits. This task changes the shape; it
  changes no behaviour.

  ## Target state — sealed hierarchy, not generics

  Two domain-internal sealed interfaces in `io.github.theestimator.method`, and a
  non-generic SPI:

  ```kotlin
  sealed interface SessionVoteInput
  sealed interface SessionReduction

  interface EstimationMethodSessionSupport {
      val method: EstimationMethod
      fun reduce(votes: List<SessionVoteInput>): SessionReduction
  }
  ```

  **Why sealed rather than `EstimationMethodSessionSupport<I, R>`:** the
  registry stores every support in one
  `Map<EstimationMethod, EstimationMethodSessionSupport>`. A generic interface
  erases to `*` in that map, so `requireSession(method)` would hand back a
  star-projected type and every call site would need an unchecked cast — the
  compiler could no longer check the pairing at all. With sealed types the map
  stays homogeneous and type-safe, and a `when` over a `SessionReduction`
  subtype is exhaustive. The cost is one cast on the result at the call site,
  which is checked and fails loudly.

  PERT's concrete types live in its own package (`…method.threepoint`), per the
  "one Kotlin package per method" rule:

  ```kotlin
  data class PertVoteInput(val vote: EstimatorVote) : SessionVoteInput
  data class PertReduction(val aggregate: VoteAggregate) : SessionReduction
  ```

  **`EstimatorVote` / `VoteAggregate` are WRAPPED, not modified.** Do NOT make
  them implement the sealed interfaces directly. They live in
  `io.github.theestimator.model`, they are `@JsExport`ed, and they are consumed by
  the frontend (`aggregateVotes` in `DomainFactory.kt` →
  `PhaseTwoPanel.svelte`) and by the wire DTOs. Giving an `@JsExport`ed class a
  non-exported supertype risks a Kotlin/JS exportability warning and changes the
  generated `domain.d.mts` surface for no benefit. The wrappers are
  domain-internal, so nothing crosses the JS boundary and the frontend is
  untouched by this task.

  A `reduce` receiving an input type it does not handle must fail loudly —
  `error("…")`, consistent with the registry's `require` / `requireSession`.
  Do not silently filter or return an empty reduction.

  ## Behaviour must not change

  This is a pure shape change. PERT session numbers, the wire DTOs, and the
  frontend all stay byte-identical. `SessionResourceIT`'s existing happy-path
  test (`full happy path — create, vote, reveal, revise, finalize writes back
  and advances`, asserting the finalized triple 2/4/6 reaches the draft leaf)
  is the parity gate — it must pass **unchanged**.

  ## What does NOT belong in this task

  - The bucket+sampled support module, its reducer, its vote storage, and the
    conflict UI — all task-106.
  - Any change to `EstimatorVote`, `VoteAggregate`, `VoteAggregation`,
    `DomainFactory.kt`, or any file under `src/frontend/`.

steps:
  - |
    Read the three files this task reshapes:
      src/domain/src/main/kotlin/io/github/theestimator/method/EstimationMethodSessionSupport.kt
      src/domain/src/main/kotlin/io/github/theestimator/method/threepoint/ThreePointSessionSupport.kt
      src/backend/implementation/src/main/kotlin/io/github/theestimator/service/EstimationSessionService.kt
    Note the two reduce call sites: `finalizeCurrent` and `itemDto` (the
    latter takes the resolved support as a parameter from `buildDto`).
  - |
    Add
    `src/domain/src/main/kotlin/io/github/theestimator/method/SessionVoteInput.kt`
    declaring BOTH marker types:
      sealed interface SessionVoteInput
      sealed interface SessionReduction
    Domain-internal — no `@JsExport`. KDoc why sealed beats generics here
    (registry erasure), so a later reader does not "simplify" it back.
  - |
    Widen the SPI in
    `src/domain/src/main/kotlin/io/github/theestimator/method/EstimationMethodSessionSupport.kt`
    to `fun reduce(votes: List<SessionVoteInput>): SessionReduction`. Update
    the KDoc: it no longer reuses the PERT types directly; each method
    contributes its own `SessionVoteInput` / `SessionReduction` subtypes from
    its own package.
  - |
    Add
    `src/domain/src/main/kotlin/io/github/theestimator/method/threepoint/PertSessionTypes.kt`
    with `PertVoteInput(vote: EstimatorVote) : SessionVoteInput` and
    `PertReduction(aggregate: VoteAggregate) : SessionReduction`.
  - |
    Update `ThreePointSessionSupport.reduce` to the new signature: map the
    inputs to `EstimatorVote` (each element must be a `PertVoteInput`;
    anything else → `error("…")` naming the offending type), delegate to
    `VoteAggregation.aggregate` exactly as today, and wrap the result in
    `PertReduction`. Keep the existing `logger.debug { … }` lambda-form line.
  - |
    Update `EstimationSessionService` for the new shape:
      * `finalizeCurrent` — wrap the votes in `PertVoteInput`, then unwrap the
        result via `PertReduction` to reach `.aggregate`.
      * `itemDto` — same wrap/unwrap around its `support.reduce(...)` call.
      * Factor the wrap/unwrap into ONE private helper (e.g.
        `private fun reducePert(support, votes): VoteAggregate`) so the cast
        appears once, not twice. The service is still PERT-only on the wire
        until task-106 extends vote storage; the helper is the seam where that
        assumption is stated explicitly, so give it a comment saying so.
      * An unexpected reduction subtype must throw, not default.
  - |
    Update
    `src/domain/src/test/kotlin/io/github/theestimator/method/threepoint/ThreePointSessionSupportTest.kt`
    for the new signature (JVM `src/test`, JUnit 5 — the `:domain` module has
    NO `commonTest` source set). Keep the existing parity assertions against
    `VoteAggregation.aggregate` and add one case proving a foreign
    `SessionVoteInput` makes `reduce` throw. Do NOT call
    `EstimationMethodRegistry.clear()` — it is a process-wide singleton and
    the test class order is non-deterministic (see the note in
    `BucketMethodModuleTest`).
  - |
    In CLAUDE.md's "Pluggable estimation methods (SPI)" subsection, update the
    session-SPI paragraph added by task-105: the signature is now
    `reduce(List<SessionVoteInput>): SessionReduction` over two sealed marker
    interfaces, with each method contributing its own subtypes from its own
    package (PERT: `PertVoteInput` / `PertReduction`), and `EstimatorVote` /
    `VoteAggregate` now WRAPPED rather than referenced directly so the
    `@JsExport` surface is unchanged. Also update the sessions REST paragraph
    where it describes the dispatch.
  - |
    Build:
      ./gradlew :domain:build
      ./gradlew :backend:implementation:test
      ./gradlew build

validation:
  - |
    Sealed marker types and PERT subtypes exist:
      test -f src/domain/src/main/kotlin/io/github/theestimator/method/SessionVoteInput.kt
      test -f src/domain/src/main/kotlin/io/github/theestimator/method/threepoint/PertSessionTypes.kt
      grep -q "sealed interface SessionVoteInput" src/domain/src/main/kotlin/io/github/theestimator/method/SessionVoteInput.kt
      grep -q "sealed interface SessionReduction" src/domain/src/main/kotlin/io/github/theestimator/method/SessionVoteInput.kt
  - |
    The SPI is widened to the sealed types and no longer names the PERT types
    in its signature:
      grep -q "fun reduce(votes: List<SessionVoteInput>): SessionReduction" src/domain/src/main/kotlin/io/github/theestimator/method/EstimationMethodSessionSupport.kt
  - |
    PERT contributes its own subtypes:
      grep -q "PertVoteInput" src/domain/src/main/kotlin/io/github/theestimator/method/threepoint/PertSessionTypes.kt
      grep -q "PertReduction" src/domain/src/main/kotlin/io/github/theestimator/method/threepoint/PertSessionTypes.kt
      grep -q "SessionVoteInput" src/domain/src/main/kotlin/io/github/theestimator/method/threepoint/PertSessionTypes.kt
  - |
    The exported vote types were NOT given a domain-internal supertype (the
    JS surface must be unchanged):
      ! grep -q "SessionVoteInput" src/domain/src/main/kotlin/io/github/theestimator/model/EstimatorVote.kt
      ! grep -q "SessionReduction" src/domain/src/main/kotlin/io/github/theestimator/model/VoteAggregation.kt
  - |
    A foreign input type fails loudly rather than being filtered away:
      grep -q "error(" src/domain/src/main/kotlin/io/github/theestimator/method/threepoint/ThreePointSessionSupport.kt
  - |
    The backend still routes through the registry, and the PERT wrap/unwrap
    is factored into one place (the cast must not be duplicated):
      grep -q "requireSession" src/backend/implementation/src/main/kotlin/io/github/theestimator/service/EstimationSessionService.kt
      test "$(grep -c 'PertReduction' src/backend/implementation/src/main/kotlin/io/github/theestimator/service/EstimationSessionService.kt)" -le 2
  - |
    Frontend and the exported domain bridge are untouched by this task:
      git diff --quiet HEAD -- src/frontend/src/lib/session/ src/domain/src/main/kotlin/io/github/theestimator/model/DomainFactory.kt
  - |
    Domain tests cover the new shape, in the JVM test source set (there is no
    commonTest):
      test -f src/domain/src/test/kotlin/io/github/theestimator/method/threepoint/ThreePointSessionSupportTest.kt
      ! test -d src/domain/src/commonTest
      ./gradlew :domain:jvmTest
  - |
    PARITY GATE — the existing PERT session round-trip passes with its
    write-back assertion intact:
      grep -q "roots\[0\].minEffort" src/backend/implementation/src/test/kotlin/io/github/theestimator/rest/SessionResourceIT.kt
      ./gradlew :backend:implementation:test --tests "io.github.theestimator.rest.SessionResourceIT"
  - |
    Full-stack build is green:
      ./gradlew build

