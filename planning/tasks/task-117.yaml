    existing flat-kebab ones are deliberately left alone, the ESLint ban and
    its two exemptions, the flat-config fetch-ban trap, and the honest
    motivation (rename fragility — NOT "specs break under English", which the
    locale pin already prevents). If the root `CLAUDE.md` gains anything, it
    is at most a one-line pointer.
  - |
    Build and prove it:
      ./gradlew :frontend:check
      ./gradlew build
    Then the full suite against a running `./scripts/dev.sh` stack (the
    backend must be on :8090; `global-setup.ts` resets fixture data first):
      cd src/frontend && npx playwright test

validation:
  - |
    Page Object folder exists with a barrel and the Stage-A classes:
      test -d src/frontend/e2e/pages
      test -f src/frontend/e2e/pages/index.ts
      test -f src/frontend/e2e/pages/CreateEstimationDialog.ts
      test -f src/frontend/e2e/pages/ProjectDetailPage.ts
      test -f src/frontend/e2e/pages/UndoToolbar.ts
      test -f src/frontend/e2e/pages/SessionRoomPage.ts
  - |
    Every component that gained a testid in this task carries one:
      for f in \
        src/frontend/src/lib/components/CreateEstimationDialog.svelte \
        src/frontend/src/lib/components/CreateProjectDialog.svelte \
        src/frontend/src/lib/components/ProjectDetail.svelte \
        src/frontend/src/lib/components/ProjectList.svelte \
        src/frontend/src/lib/components/ErrorBanner.svelte \
        src/frontend/src/lib/components/UndoHistoryPanel.svelte \
        src/frontend/src/lib/components/UndoConflictDialog.svelte \
        src/frontend/src/lib/components/ReplaceDraftDialog.svelte \
        src/frontend/src/lib/components/MerlinStructureDialog.svelte \
        src/frontend/src/lib/components/ConnectionLostDialog.svelte \
        src/frontend/src/lib/components/AppHeader.svelte \
        src/frontend/src/lib/session/PhaseOnePanel.svelte \
        src/frontend/src/lib/session/PhaseTwoPanel.svelte \
        src/frontend/src/routes/sessions/+page.svelte \
      ; do grep -q "data-testid=" "$f" || { echo "missing testid: $f"; exit 1; }; done
  - |
    The invariant: no spec matches on a translated LITERAL. `e2e/pages/**` is
    a subdirectory (not matched by these globs) and `e2e/language.test.ts` is
    the one allowlisted file — it asserts DE vs EN text by design.
      cd src/frontend
      BAN="getByRole\\([^)]*name:[[:space:]]*['\"/]|getByText\\([[:space:]]*['\"/]"
      BAN="$BAN|getBy(Label|Placeholder)\\([[:space:]]*['\"]|locator\\([[:space:]]*['\"]text="
      BAN="$BAN|hasText:[[:space:]]*['\"]"
      fail=0
      for f in $(ls e2e/*.test.ts e2e/*.spec.ts | grep -v '^e2e/language.test.ts$'); do
        if grep -nE "$BAN" "$f"; then echo "translated literal in $f"; fail=1; fi
      done
      exit $fail
  - |
    The two label-indirection helpers are gone (no automated rule catches
    these, so pin them explicitly):
      ! grep -n "label: RegExp" src/frontend/e2e/export.test.ts
      ! grep -n "label: RegExp" src/frontend/e2e/bucket-sampled-flow.test.ts
  - |
    The residuals no AST rule can catch are gone. Each grep names the exact
    German string, because the same syntax legitimately carries brand names,
    formatted numbers and seeded data elsewhere in these files:
      cd src/frontend
      ! grep -rn "nicht mehr verfügbar" e2e/session-connection.test.ts
      ! grep -rn "von 40 ausgewählt" e2e/session-setup.test.ts
      ! grep -rn "'Pausiert'" e2e/session.test.ts
      ! grep -rn "'zugeklappt'" e2e/schedule.test.ts
      ! grep -rn "Dev-Anmeldungsauswahl" e2e/auth-gate.test.ts e2e/user-menu.test.ts
      ! grep -rn "Unterelemente von" e2e/smoke.test.ts
      ! grep -rn "p.text-red-600" e2e/smoke.test.ts
    The ENGLISH aria-labels of the generic TreeTable stay — assert they were
    NOT collaterally removed:
      grep -q 'aria-label="Children"' e2e/tree-table.test.ts

  - |
    Every spec that drives a user-facing control imports a Page Object.
    `auth.test.ts` and `smoke.test.ts` are pure API specs and are excluded by
    name; so are the specs that were already testid-only.
      cd src/frontend
      for f in create-estimation.spec.ts endpoint-authorization.test.ts \
               authorization-error.test.ts auth-gate.test.ts user-menu.test.ts \
               undo.test.ts session.test.ts session-setup.test.ts \
               session-connection.test.ts merlin-import.test.ts \
               merlin-export.test.ts xlsx-import.test.ts bucket-hierarchy.test.ts \
               bucket-views.test.ts bucket-sampled-flow.test.ts \
               connection-lost.test.ts navigation.test.ts schedule.test.ts \
               export.test.ts tree-table.test.ts treetable-responsive.test.ts \
               smoke.test.ts; do
        grep -q "from './pages'" "e2e/$f" \
          || { echo "spec has no POM import: $f"; exit 1; }
      done
  - |
    The ESLint rule fires on a translated literal in a spec. Use a THROWAWAY
    probe file — never append to a tracked spec, which leaves the repo broken
    if the check aborts mid-way:
      cd src/frontend
      {
        echo "import { test } from '@playwright/test';"
        echo "test('probe', async ({ page }) => {"
        echo "  await page.getByText('Rückgängig').click();"
        echo "  await page.getByLabel('Angebot *').fill('x');"
        echo "  await page.getByRole('button', { name: 'Speichern' }).click();"
        echo '});'
      } > e2e/__lint-probe.test.ts
      ! npx eslint e2e/__lint-probe.test.ts
      rm e2e/__lint-probe.test.ts
  - |
    The rule did NOT clobber the raw-fetch ban in e2e (flat config replaces
    rule options rather than merging them):
      cd src/frontend
      printf 'await fetch("/api/x");\n' > e2e/__fetch-probe.test.ts
      ! npx eslint e2e/__fetch-probe.test.ts
      rm e2e/__fetch-probe.test.ts
  - |
    `language.test.ts` is genuinely exempt (it must still lint clean while
    asserting German and English text):
      cd src/frontend && npx eslint e2e/language.test.ts
  - |
    The module CLAUDE.md documents the convention:
      grep -q "Page Object\|e2e/pages" src/frontend/CLAUDE.md
  - |
    Static analysis and the full build are green:
      ./gradlew :frontend:check
      ./gradlew build
  - |
    Full Playwright suite passes against a running `./scripts/dev.sh` stack
    (backend on :8090, Docker up for Dev Services; `global-setup.ts` resets
    the fixture data first):
      cd src/frontend && npx playwright test

