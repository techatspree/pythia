    The translated regex lives at the CALLER, outside any banned call. These
    two must be hand-migrated; no automated gate will find them.

  - **Residuals that NO automated rule can separate from legitimate use** —
    these are pinned by an explicit grep in `validation` instead, because the
    same syntax also carries product names, numbers and seeded test data that
    must stay:
      * German text inside `toContainText` / `toHaveText`:
        `session-connection.test.ts:151,230` (`'nicht mehr verfügbar'`),
