        (`'Dev Admin'`, `'Dev Estimator'` — fixture users).
      * German `aria-label` inside a raw locator:
        `auth-gate.test.ts:20` and `user-menu.test.ts:27`
        (`[aria-label="Dev-Anmeldungsauswahl"]`), `smoke.test.ts:384,451,502`
        (`[aria-label="Unterelemente von …"]`). The ENGLISH aria-labels in
        `tree-table*.test.ts` and `bucket-views.test.ts` (`"Children"`,
        `"Root nodes"`, `"Collapse"`, `"Expand"`) are CORRECT and stay — the
        generic `treetable/TreeTable.svelte` is deliberately
        un-internationalised, and those are tier-2 locators under the frozen
        strategy.
      * A styling-class locator: `smoke.test.ts:134` (`p.text-red-600`) —
        replace with the new `error-banner` testid.

  Things the earlier draft of this task asserted that are NOT true and have
  been removed: there is no `'New Offer'` / `'Neue Kalkulation'` divergence in
  `create-estimation.spec.ts` (all three call sites read `'Neues Angebot'`),
  and `user-menu.test.ts` is not the only consumer of
  `data-testid="logout-button"` — `language.test.ts` uses it three times.

  ## Target state

  1. Every interactive element a spec drives carries a stable `data-testid`.
  2. A **Page Object Model** layer lives under `src/frontend/e2e/pages/`, one
     class per screen or modal, exposing intent-level methods and hiding all
     selectors.
  3. **No spec file matches on a translated literal.** That is the invariant —
     not "no raw locator". A testid-based `page.locator('[data-testid="…"]')`
     or `getByTestId(...)` inline in a spec is acceptable where wrapping it in
     a PO would add nothing (`branding.test.ts`, `treetable-header-fit.test.ts`).
  4. An ESLint rule keeps the invariant true after landing.

  ## Frozen decisions (do not re-open in implementation)

  - **Testid naming — new attributes only.** New testids use
    `<screen>.<element>` in dot-separated lower-kebab, English, e.g.
    `create-estimation.offer-input`, `undo-toolbar.undo`, `session.submit-estimate`.
    **The ~90 existing flat-kebab testids STAY AS THEY ARE**
    (`logout-button`, `tt-header`, `tt-row-*`, `schedule-card`, `language-select`,
    `brand-logo`, `dev-login-*`, `publish-log`, …). A tree-wide rename would
    touch `schedule.test.ts` (65 call sites) and `system-settings.test.ts`
    (21) for zero behavioural gain and is explicitly out of scope. The dotted
    form already has a foothold (`estimation-detail.method`, `grid-total.cost`,
    `version-editor.method`, `project-detail.estimation-method`); this task
    extends it forward, it does not backfill.
  - **`data-testid="logout-button"` is NOT renamed.** The earlier draft froze
    a rename to `user-menu.logout` on the premise of a single consumer. There
    are two (`user-menu.test.ts`, `language.test.ts`), and `language.test.ts`
    uses it as the handle for its DE/EN `toHaveText` assertions. Leave the
    attribute; wrap it in the `UserMenu` PO.
  - **Where POs live.** `src/frontend/e2e/pages/` — one `.ts` file per screen
    or modal, plus an `index.ts` barrel so specs write
    `import { ProjectDetailPage } from './pages';` (relative — no `$lib` alias
    in e2e).
  - **PO shape.** `constructor(private readonly page: Page) {}`, `async`
    intent-level methods, `expect*()` methods for stable assertions. Exposing
    a Locator via a getter is acceptable where a spec must assert
    absence/visibility the PO does not natively cover. **NO shared base
    class** — keep each PO flat and stand-alone.
  - **Locator strategy inside POs.** (1) `getByTestId(...)` first;
    (2) `getByRole(...)` with a role ONLY, or with an English `aria-label`,
    where a testid cannot be attached; (3) `page.locator('[data-x=y]')` last.
    Never grep by translated text inside a PO — if a component's text is the
    only handle, add a testid to the component in this task.
  - **Role-only `getByRole` stays legal everywhere.** `getByRole('dialog')`,
    `getByRole('alert')`, `getByRole('alertdialog')`, `getByRole('spinbutton')`,
    `getByRole('listitem')` carry no translated string and are the correct
    accessibility-level handle. The ban targets the `name:` option, not the
    call.
  - **`getByText(<variable>)` stays legal.** `getByText(uniqueOffer)` and
    `getByText(projectName)` match test-generated DATA, not UI chrome. The
    ESLint rule fires on string/regex LITERALS only.
  - **`e2e/language.test.ts` is allowlisted from the ESLint rule.** It exists
    to prove `'Projekte'` → `'Projects'` and `'Abmelden'` → `'Logout'` across
    a language switch; asserting translated text is its entire purpose. The
    allowlist entry carries a comment saying so. (`treetable-header-fit.test.ts`
    also runs in both locales but is already testid-driven and needs no
    exemption.)
  - **`auth.test.ts` is the only pure-API spec** — 55 lines of `page.request`
    with no DOM at all. It is untouched and imports no PO. `smoke.test.ts` is
    NOT in that category despite opening with API seeding: it is 518 lines and
    its second half drives the real version editor, with
    `locator('button', { hasText: 'Gruppe hinzufügen' })`, German dndzone
    aria-labels (`[aria-label="Unterelemente von G2"]`) and a Tailwind-class
    locator (`p.text-red-600`). It is in Stage B.
  - **NO backend / domain / plumbing changes.** Svelte components (testids)
    and Playwright specs only. No REST, no Kotlin, no `playwright.config.ts`
    change.
  - **File-rename policy.** Do not rename existing spec files; the
    `*.spec.ts` / `*.test.ts` inconsistency is unrelated and a follow-up.
  - **`e2e/helpers.ts` and `e2e/global-setup.ts` stay as they are** — auth and
    fixture-reset utilities, not UI selectors.

  ## ESLint rule — the trap that must not be walked into

  `src/frontend/eslint.config.js` ALREADY declares `no-restricted-syntax` for
  `files: ['**/*.ts', '**/*.svelte']` to ban raw `fetch(...)`. ESLint flat
  config **replaces** a rule's options for matching files rather than merging
  them, so a new config block that sets `no-restricted-syntax` for
  `e2e/**/*.ts` would SILENTLY DISABLE the raw-`fetch` ban throughout the e2e
  tree — and `e2e/global-setup.ts` carries a comment that explicitly relies on
  that ban being active there. The new block MUST re-declare the `fetch` entry
  alongside the selector entries.

  Entries to ban inside `src/frontend/e2e/**` (excluding
  `src/frontend/e2e/pages/**` and `e2e/language.test.ts`):

  - `CallExpression[callee.property.name='getByRole']` whose second argument
    object has a `name` property with a **Literal** value (string or regex) —
    any role, not just `'button'`.
  - `CallExpression[callee.property.name='getByText']` with a Literal first
    argument.
  - `CallExpression[callee.property.name=/^getBy(Label|Placeholder)$/]` with a
    Literal first argument.
  - `CallExpression[callee.property.name='locator']` whose first argument is a
    Literal matching `/^\s*text=/`, or a `BinaryExpression` whose left operand
    is such a Literal (catches `locator('text=' + header)`).
  - A `hasText` property with a Literal value in ANY options object — it
    reaches the same translated strings by another door
    (`locator('button', { hasText: 'Gruppe hinzufügen' })` in `smoke.test.ts`,
    `filter({ hasText: … })` in `session.test.ts`).
  - The existing raw-`fetch` entry, re-declared verbatim.

  Message (single line): "e2e specs must go through Page Objects (see
  src/frontend/e2e/pages/); do not match on a translated label."

