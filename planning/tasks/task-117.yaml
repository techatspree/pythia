id: task-117
phase: phase-14
title: Playwright — Page Object Model + data-testid selectors
depends_on: [task-112]
description: |
  Refactor the Playwright e2e suite so specs describe user intent, not the
  DOM. Selectors move behind Page Object classes; components ship stable
  `data-testid` attributes; no spec file matches on a TRANSLATED label.

  ## Why, now that i18n has already landed

  This task was originally written as insurance against phase-16: the
  prediction was that once the same page could render DE or EN, every spec
  grepping for a German label would break. Phase-16 shipped (task-124 lifted
  the strings into `de.json`, task-125 added `en.json` and the switcher), and
  the suite did NOT break — because `playwright.config.ts` pins
  `locale: 'de-DE'` so Accept-Language seeds fresh dev users German
  (task-123/127). That locale pin is the reason the German assertions still
  pass, and it stays.

  So the original motivation is spent. The remaining justification is
  narrower and still real:

  - **Rename fragility.** A translated label is a moving target that no
    compiler checks. Every catalog edit is a silent e2e break discovered only
    by a full suite run against a live stack.
  - **The locale pin is load-bearing and undocumented at the spec level.**
    `scripts/capture-screenshots.mjs` switches the capture user to English and
    must restore it in a `finally`, because a stack left in English fails 28
    tests with no failure output pointing back at the cause (task-180). Specs
    that select by testid instead of by German text shrink that blast radius.
  - **Readability.** `session.test.ts` drives a four-participant Delphi flow
    through 28 raw `getByRole` calls and positional `getByRole('spinbutton').nth(0..2)`.
    Intent-level methods make it reviewable.

  Do NOT re-justify this task on the "specs break under English" argument —
  that is no longer true, and a validation gate built on it would be theatre.

  ## Current state (verified against the tree, 2026-09-26)

  `src/frontend/e2e/` holds **30 spec files** plus `helpers.ts` and
  `global-setup.ts`. The suite is already PART-migrated: 151 `getByTestId`
  calls across the specs, and 101 `data-testid` attributes across 27
  components. `schedule.test.ts` (65), `session.test.ts` (23) and
  `system-settings.test.ts` (21) are already largely testid-driven.

  What remains, by kind:

  - **Translated button/link/dialog names** — `undo.test.ts`
    (`'Rückgängig'`, `'Wiederholen'`, `'Verlauf anzeigen'`,
    `'Konflikt beim Rückgängigmachen'`, `'Aktuellen Stand neu laden'`),
    `session.test.ts` (`'Schätzung abgeben'`, `'Ich stimme zu'`,
    `'Eintrag abschließen'`, `'Zu Phase 2 (aufdecken)'`, `'Sitzung starten'`),
    `session-setup.test.ts` (`'Alle auswählen'`, `'Auswahl aufheben'`,
    `'Sitzung starten'`), `bucket-hierarchy.test.ts` (`'+ Gruppe'`,
    `'+ Element'`, `'+ Gruppe hinzufügen'`), `merlin-import`/`merlin-export`/
    `xlsx-import` (`'Entwurf ersetzen?'`, `'Struktur weicht ab'`,
    `'Aus Merlin importieren'`, `'Aus Excel importieren'`),
    `create-estimation.spec.ts` (`'Neues Angebot'`, `'Speichern'`),
    `authorization-error.test.ts` (`'Neues Projekt'`, `'Anlegen'`),
    `navigation.test.ts` (`'Zur Schätzung'`), `schedule.test.ts`
    (`'Abhängigkeiten bearbeiten'`, `'Krit. Pfad'`).
  - **Translated `getByLabel` / `getByPlaceholder`** — NOT covered by the
    original version of this task and just as fragile: `'Angebot *'`,
    `'Beschreibung'`, `'Methode'` (`create-estimation.spec.ts`),
    `'Name *'` (`authorization-error`, `endpoint-authorization`),
    `'Bucket-Name'`, `'Bucket löschen'` (`bucket-sampled-flow.test.ts`).
  - **Translated text greps** — `user-menu.test.ts` (`'VIEWER'`/`'ESTIMATOR'`/
    `'ADMIN'` badges), `treetable-responsive.test.ts` (`'Stückpreis'`),
