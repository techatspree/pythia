id: task-117
phase: phase-14
title: "Playwright POM — stage A: infrastructure, testids, create/auth/undo specs"
depends_on: [task-112]
description: |
  Stand up the Playwright **Page Object Model** layer and migrate the first
  family of specs onto it. This is the first of FOUR related tasks: stage B
  (task-188) migrates the remaining specs, stage C (task-189) adds the ESLint
  rule that keeps the invariant true and documents it, and task-190 — a
  sibling deliverable rather than a fourth stage — makes the suite
  locale-independent and proves it with a two-language run.

  The split is by blast radius, not by convenience: stage A creates the folder,
  fixes the conventions and proves them on six specs. If stage B never lands,
  stage A is still a coherent improvement rather than a half-migrated suite.

  ## Why, now that i18n has already landed

  This work was originally justified as insurance against phase-16: the
  prediction was that once the same page could render DE or EN, every spec
  grepping for a German label would break. Phase-16 shipped (task-124 lifted
  the strings into `de.json`, task-125 added `en.json` and the switcher) and
  the suite did NOT break — because `playwright.config.ts` pins
  `locale: 'de-DE'` so Accept-Language seeds fresh dev users German
  (task-123/127). That locale pin is why the German assertions still pass.
  **This task does not touch it** — task-190 does, replacing it with a
  server-side language pin. See the frozen decision below before reaching for
  `playwright.config.ts`.

  The original motivation is therefore **deferred, not spent**: locale
  independence is a real goal of this phase, but it is delivered by
  **task-190**, which pins the dev users' language server-side, drops the
  browser-locale pin and gates on a full `E2E_LANG=en` run. Removing
  translated labels from the specs (stages A–C) is a PREREQUISITE for that
  and not a substitute — a grep for German literals is a proxy; the
  two-language run is the proof.

  What stages A–C buy on their own:

  - **Rename fragility.** A translated label is a moving target no compiler
    checks. Every catalog edit is a silent e2e break found only by a full
    suite run against a live stack.
  - **The locale pin is load-bearing and invisible at the spec level.**
    `scripts/capture-screenshots.mjs` switches the capture user to English and
    must restore it in a `finally`, because a stack left in English fails 28
    tests with no failure output pointing back at the cause (task-180).
    Testid-based specs SHRINK that blast radius; they do not remove it —
    task-190 retires the hazard outright by re-pinning the language in
    `global-setup.ts` on every run.
  - **Readability.** `session.test.ts` drives a four-participant Delphi flow
    through 24 raw `getByRole` calls and positional
    `getByRole('spinbutton').nth(0..2)` (that one is stage B, but it is the
    clearest example of what the POs buy).

  What you must NOT do is claim stage A (or B, or C) makes the suite
  locale-independent. It does not: formatted numbers with a German decimal
  comma survive all three stages by design (`bucket-sampled-flow.test.ts`,
  `session.test.ts`), and nothing here runs the suite in English. Claiming the
  property without task-190's gate is how the original version of this task
  ended up resting on an argument nobody had tested.

  ## Frozen decisions (they govern every stage of this work; do not re-open)

  - **Testid naming — NEW attributes only.** New testids use
    `<screen>.<element>` in dot-separated lower-kebab, English, e.g.
    `create-estimation.offer-input`, `undo-toolbar.undo`. **The ~90 existing
    flat-kebab testids STAY AS THEY ARE** (`logout-button`, `tt-header`,
    `tt-row-*`, `schedule-card`, `language-select`, `brand-logo`,
    `dev-login-*`, `publish-log`, …). A tree-wide rename would touch
    `schedule.test.ts` (65 call sites) and `system-settings.test.ts` (21) for
    zero behavioural gain and is explicitly out of scope. The dotted form
    already has a foothold (`estimation-detail.method`, `grid-total.cost`,
    `version-editor.method`, `project-detail.estimation-method`); this work
    extends it forward, it does not backfill.
  - **`data-testid="logout-button"` is NOT renamed.** An earlier draft froze a
    rename to `user-menu.logout` on the premise of a single consumer. There
    are two — `user-menu.test.ts` AND `language.test.ts`, which uses it as the
    handle for its DE/EN `toHaveText` assertions. Leave the attribute; wrap it
    in the `UserMenu` PO.
  - **Where POs live.** `src/frontend/e2e/pages/` — one `.ts` file per screen
    or modal, plus an `index.ts` barrel so specs write
    `import { ProjectDetailPage } from './pages';` (relative — no `$lib` alias
    in e2e).
  - **PO shape.** `constructor(private readonly page: Page) {}`, `async`
    intent-level methods, `expect*()` methods for stable assertions. Exposing
    a Locator via a getter is acceptable where a spec must assert
    absence/visibility the PO does not natively cover. **NO shared base
    class** — each PO is flat and stand-alone.
  - **Locator strategy inside POs.** (1) `getByTestId(...)` first;
    (2) `getByRole(...)` with a role ONLY, or with an English `aria-label`,
    where a testid cannot be attached; (3) `page.locator('[data-x=y]')` last.
    Never grep by translated text inside a PO — if a component's text is the
    only handle, add a testid to the component.
  - **The invariant is "no TRANSLATED literal in a spec"** — not "no raw
    locator". A testid-based `getByTestId(...)` inline in a spec is fine where
    a PO would add nothing.
  - **Role-only `getByRole` stays legal everywhere.** `getByRole('dialog')`,
    `getByRole('alert')`, `getByRole('alertdialog')`, `getByRole('spinbutton')`,
    `getByRole('listitem')` carry no translated string and are the correct
    accessibility-level handle.
  - **`getByText(<variable>)` stays legal.** `getByText(uniqueOffer)` and
    `getByText(projectName)` match test-generated DATA, not UI chrome.
  - **`e2e/language.test.ts` is never migrated and is allowlisted from the
    stage-C ESLint rule.** It exists to prove `'Projekte'` → `'Projects'` and
    `'Abmelden'` → `'Logout'` across a language switch; asserting translated
    text is its entire purpose.
  - **`auth.test.ts` is the only pure-API spec** — 55 lines of `page.request`,
    no DOM. Untouched, imports no PO. (`smoke.test.ts` LOOKS like one but is
    518 lines and drives the real version editor; it is stage B.)
  - **NO backend / domain / plumbing changes**, and **no change to
    `playwright.config.ts`** in this task — the `locale: 'de-DE'` pin stays
    for now and is removed by **task-190**, which replaces it with a
    server-side language pin in `global-setup.ts`. Do not pre-empt that here:
    dropping the pin before the specs are migrated makes the suite LESS
    deterministic, because Accept-Language only seeds a dev user on first
    sighting (task-123) and an already-provisioned user keeps whatever
    language the last run left.
  - **File-rename policy.** Do not rename spec files; the `*.spec.ts` /
    `*.test.ts` inconsistency is unrelated and a follow-up.
  - **`e2e/helpers.ts` and `e2e/global-setup.ts` stay as they are** — auth and
    fixture-reset utilities, not UI selectors.

  ## Stage-A scope

  ### Components (add `data-testid`)

    * src/frontend/src/lib/components/CreateEstimationDialog.svelte
      (`create-estimation.dialog|offer-input|description-input|method-select|submit|cancel`)
    * src/frontend/src/lib/components/CreateProjectDialog.svelte
      (`create-project.dialog|name-input|submit|cancel`)
    * src/frontend/src/lib/components/ProjectDetail.svelte (`project-detail.new-offer`)
    * src/frontend/src/routes/projects/+page.svelte (`projects.new`) — the
      "Neues Projekt" button is `$_('project.pageNewProject')` on the ROUTE,
      not in `ProjectList.svelte`, which renders only the table. Both
      `authorization-error.test.ts` and `endpoint-authorization.test.ts` click
      it, so stage A cannot be completed without this file.
    * src/frontend/src/lib/components/ProjectList.svelte
      (`project-list.row` per row, keyed by project id — the `<tr>`/`<a>` rows
      only; this file has NO "new project" button)
    * src/frontend/src/lib/components/ErrorBanner.svelte
      (`error-banner` on the outer `role="alert"` element). Note this testid
      has no stage-A consumer — the six specs here use role-only
      `getByRole('alert')`, which stays legal. It is added now because the
      component is a stage-A file and `smoke.test.ts:134` (stage B,
      task-188) replaces `p.text-red-600` with it.
    * src/frontend/src/lib/components/DevLoginDialog.svelte (`dev-login.dialog`
      on the root — replaces the `[aria-label="Dev-Anmeldungsauswahl"]` grep;
      the existing `dev-login-{subjectId}` per-user testids stay)
    * src/frontend/src/lib/components/UndoHistoryPanel.svelte
      (`undo-history.panel|title|entry`)
    * src/frontend/src/lib/components/UndoConflictDialog.svelte
      (`undo-conflict.dialog|reload`)
    * src/frontend/src/lib/components/UserMenu.svelte
      (`user-menu.role.viewer|estimator|admin` on the badges; `logout-button`
      and `language-select` unchanged)
    * src/frontend/src/routes/estimations/[id]/versions/[versionNumber]/+page.svelte
      (`undo-toolbar.undo|redo|show-history`)

  `$lib/ui/Button.svelte` forwards `{...rest}`, so `data-testid` reaches the
  real element — never add a wrapper `<div>` to carry one.

  **Every label the specs match on is an i18n KEY, not source text.** Grepping
  the components for `'Neues Angebot'` finds only `src/lib/i18n/de.json`. Map
  the string to its key there first, then grep for the key: `project.detailNewOffer`
  → `ProjectDetail.svelte`, `project.pageNewProject` → `routes/projects/+page.svelte`,
  `dialog.createProject.create` → `CreateProjectDialog.svelte`,
  `dialog.createEstimation.save` → `CreateEstimationDialog.svelte`,
  `dialog.devLogin.ariaLabel` → `DevLoginDialog.svelte`,
  `editor.undo|redo|historyAria` → the version-editor route,
  `history.conflict.reload|ariaLabel` → `UndoConflictDialog.svelte`,
  `history.title` → `UndoHistoryPanel.svelte`. That indirection is exactly how
  the `projects.new` placement was got wrong in an earlier draft of this task.

  ### New PO files under `src/frontend/e2e/pages/`

  `index.ts` (barrel), `ProjectsListPage.ts`, `ProjectDetailPage.ts`,
  `CreateProjectDialog.ts`, `CreateEstimationDialog.ts`, `DevLoginDialog.ts`,
  `ErrorBanner.ts`, `UserMenu.ts`, `VersionEditorPage.ts`, `UndoToolbar.ts`,
  `UndoConflictDialog.ts`, `UndoHistoryPanel.ts`.

  ### Specs to migrate (6)

    * `src/frontend/e2e/create-estimation.spec.ts` — `'Neues Angebot'`,
      `'Speichern'`, `getByLabel('Angebot *'|'Beschreibung'|'Methode')`
    * `src/frontend/e2e/endpoint-authorization.test.ts` —
      `/Neues Projekt|New Project/`, `/^(Anlegen|Create)$/`, `getByLabel('Name *')`
    * `src/frontend/e2e/authorization-error.test.ts` — `'Neues Projekt'`,
      `'Anlegen'`, `getByLabel('Name *')`
    * `src/frontend/e2e/auth-gate.test.ts` —
      `[role="dialog"][aria-label="Dev-Anmeldungsauswahl"]`
    * `src/frontend/e2e/user-menu.test.ts` — `getByText('VIEWER'|'ESTIMATOR'|'ADMIN')`,
      the same German aria-label locator
    * `src/frontend/e2e/undo.test.ts` — `'Rückgängig'`, `'Wiederholen'`,
      `'Verlauf anzeigen'`, `'Verlauf'`, `'Konflikt beim Rückgängigmachen'`,
      `'Aktuellen Stand neu laden'`

  Keep what is already correct in these files: `getByRole('dialog')` and
  `getByRole('alert')` (role-only), `getByText(uniqueOffer)` /
  `getByText(projectName)` (test data), and
  `toContainText('Dev Admin' | 'Dev Estimator')` (fixture user names, not UI
  chrome).

  ## Non-goals

  - The other 16 specs and their components — **task-188**. In particular do
    NOT touch `e2e/bucket-sampled-flow.test.ts` or `e2e/session.test.ts` here,
    even though both contain German-looking strings: their selectors are
    stage B's and their formatted-number assertions (`'2,00'`,
    `'5,0 / 8,0 / 13,0'`) are task-190's. They are the two files most likely
    to tempt a drive-by fix.
  - Locale independence itself — the server-side language pin, dropping the
    browser-locale pin, the seven formatted-number assertions and the
    two-language gate — **task-190**.
  - The ESLint rule and the FULL `src/frontend/CLAUDE.md` subsection, and the
    tree-wide invariant gate — **task-189**. Stage A's gate is scoped to its
    own six specs on purpose; a tree-wide gate cannot pass until stage B lands.
    Stage A does add a **two-line placeholder note** to
    `src/frontend/CLAUDE.md`, so that if stages B and C slip, the new
    convention is not documented only in a planning YAML. task-189 expands
    that note; it does not replace a missing one.
  - No rename of the ~90 existing flat-kebab testids.
  - No new e2e coverage, no backend/domain/REST changes.

steps:
  - |
    Read what already exists (parallel):
      src/frontend/e2e/                       (all specs + helpers.ts + global-setup.ts)
      src/frontend/playwright.config.ts       (read-only — the de-DE locale pin and storageState)
      src/frontend/CLAUDE.md                  (the e2e conventions already documented there)
      the ten components named in "Stage-A scope"
    Re-audit rather than trusting this file's census (the tree moves):
      grep -rhoE 'data-testid="[^"]+"' src/frontend/src/ | sort -u
      grep -rnE "getByRole\(|getByText\(|getByLabel\(|getByPlaceholder\(|hasText:|locator\(['\"]text=" src/frontend/e2e/*.ts
  - |
    Add the stage-A `data-testid` attributes to the ELEVEN files in the scope
    list — nine components plus `routes/projects/+page.svelte` (the
    `projects.new` button) and the version-editor route (the undo toolbar).
    One testid per interactive element, on the OUTERMOST interactive node
    (`<button>`, `<input>`, `<select>`, `<dialog>`, the `role="alert"` div) —
    never on a presentational wrapper. Do NOT rename `logout-button`. This
    step touches no e2e file.
  - |
    Create `src/frontend/e2e/pages/` with the twelve stage-A POs and the
    `index.ts` barrel. Each PO is stand-alone (no base class), takes a `Page`,
    and exposes `async` intent-level methods. Skeleton:
      ```ts
      import type { Page } from '@playwright/test';
      import { expect } from '@playwright/test';

      export class CreateEstimationDialog {
        constructor(private readonly page: Page) {}
        async fillOffer(offer: string) {
          await this.page.getByTestId('create-estimation.offer-input').fill(offer);
        }
        async selectMethod(method: string) {
          await this.page.getByTestId('create-estimation.method-select').selectOption(method);
        }
        async submit() {
          await this.page.getByTestId('create-estimation.submit').click();
        }
        async expectVisible() {
          await expect(this.page.getByTestId('create-estimation.dialog')).toBeVisible();
        }
      }
      ```
    Keep each PO to roughly 5–10 methods.
  - |
    Migrate the six stage-A specs onto the POs. Delete every translated
    literal in `getByRole({ name })`, `getByText`, `getByLabel`,
    `getByPlaceholder`, `hasText` and `locator('[aria-label="<German>"]')`.
    Keep the data matches and role-only calls listed in the scope section.
  - |
    Add a short placeholder note to `src/frontend/CLAUDE.md` (module file, NOT
    the root — frontend and e2e detail lives next to the existing notes on the
    `globalSetup` fixture reset and the `de-DE` locale pin). Two lines are
    enough at this stage: e2e Page Objects live in `src/frontend/e2e/pages/`,
    and NEW testids use `<screen>.<element>` while the existing flat-kebab
    ones are deliberately never renamed. task-189 expands this into the full
    subsection with the ESLint rule and its exemptions.
  - |
    Build and run the migrated specs against a live stack:
      ./gradlew :frontend:check
      # with ./scripts/dev.sh running (backend on :8090, Docker up):
      cd src/frontend && npx playwright test \
        e2e/create-estimation.spec.ts e2e/endpoint-authorization.test.ts \
        e2e/authorization-error.test.ts e2e/auth-gate.test.ts \
        e2e/user-menu.test.ts e2e/undo.test.ts
  - |
    Run the WHOLE suite once before finishing. Stage A adds testids to shared
    components (`ErrorBanner`, `UserMenu`, `ProjectList`) that stage-B specs
    also render, so a regression there surfaces here, not in task-188:
      ./gradlew build
      cd src/frontend && npx playwright test

validation:
  - |
    Page Object folder exists with a barrel and the stage-A classes:
      test -d src/frontend/e2e/pages
      test -f src/frontend/e2e/pages/index.ts
      test -f src/frontend/e2e/pages/CreateEstimationDialog.ts
      test -f src/frontend/e2e/pages/CreateProjectDialog.ts
      test -f src/frontend/e2e/pages/ProjectDetailPage.ts
      test -f src/frontend/e2e/pages/ProjectsListPage.ts
      test -f src/frontend/e2e/pages/DevLoginDialog.ts
      test -f src/frontend/e2e/pages/ErrorBanner.ts
      test -f src/frontend/e2e/pages/UserMenu.ts
      test -f src/frontend/e2e/pages/VersionEditorPage.ts
      test -f src/frontend/e2e/pages/UndoToolbar.ts
      test -f src/frontend/e2e/pages/UndoConflictDialog.ts
      test -f src/frontend/e2e/pages/UndoHistoryPanel.ts
    …and the barrel EXPORTS every one of them — a file that exists but is not
    re-exported breaks the `from './pages'` import the next item checks:
      for f in ProjectsListPage ProjectDetailPage CreateProjectDialog \
               CreateEstimationDialog DevLoginDialog ErrorBanner UserMenu \
               VersionEditorPage UndoToolbar UndoConflictDialog UndoHistoryPanel; do
        grep -q "$f" src/frontend/e2e/pages/index.ts \
          || { echo "not exported from barrel: $f"; exit 1; }
      done
  - |
    Every stage-A file carries the SPECIFIC new testid, not merely "a"
    testid. A bare `grep -q data-testid=` would pass vacuously for four of
    these — `ProjectDetail.svelte`, `DevLoginDialog.svelte`, `UserMenu.svelte`
    and the version-editor route already carry 1, 1, 2 and 6 attributes
    respectively before this task starts:
      check() { grep -q "data-testid=\"$2\"" "$1" || { echo "missing $2 in $1"; exit 1; }; }
      C=src/frontend/src/lib/components
      check $C/CreateEstimationDialog.svelte create-estimation.dialog
      check $C/CreateEstimationDialog.svelte create-estimation.offer-input
      check $C/CreateEstimationDialog.svelte create-estimation.method-select
      check $C/CreateEstimationDialog.svelte create-estimation.submit
      check $C/CreateProjectDialog.svelte    create-project.dialog
      check $C/CreateProjectDialog.svelte    create-project.name-input
      check $C/CreateProjectDialog.svelte    create-project.submit
      check $C/ProjectDetail.svelte          project-detail.new-offer
      check $C/ErrorBanner.svelte            error-banner
      check $C/DevLoginDialog.svelte         dev-login.dialog
      check $C/UndoHistoryPanel.svelte       undo-history.panel
      check $C/UndoConflictDialog.svelte     undo-conflict.dialog
      check $C/UndoConflictDialog.svelte     undo-conflict.reload
      check src/frontend/src/routes/projects/+page.svelte projects.new
      # Two testids are built per row/role, so the literal never appears in
      # source; assert the template and let the e2e run prove the runtime value
      # (user-menu.test.ts asserts all three role badges by testid).
      grep -q 'data-testid="user-menu.role.{' $C/UserMenu.svelte \
        || { echo "missing user-menu.role.* template in UserMenu"; exit 1; }
      grep -q 'data-testid="project-list.row.{' $C/ProjectList.svelte \
        || { echo "missing project-list.row.* template in ProjectList"; exit 1; }
      R="src/frontend/src/routes/estimations/[id]/versions/[versionNumber]/+page.svelte"
      check "$R" undo-toolbar.undo
      check "$R" undo-toolbar.redo
      check "$R" undo-toolbar.show-history

  - |
    `logout-button` was NOT renamed (language.test.ts depends on it):
      grep -q 'data-testid="logout-button"' src/frontend/src/lib/components/UserMenu.svelte
      grep -q 'logout-button' src/frontend/e2e/language.test.ts
  - |
    No stage-A spec matches on a translated LITERAL. Scoped to stage A on
    purpose — the tree-wide version of this gate is task-189:
      cd src/frontend
      BAN="getByRole\\([^)]*name:[[:space:]]*['\"/]|getByText\\([[:space:]]*['\"/]"
      BAN="$BAN|getBy(Label|Placeholder)\\([[:space:]]*['\"]|locator\\([[:space:]]*['\"]text="
      BAN="$BAN|hasText:[[:space:]]*['\"]"
      fail=0
      for f in e2e/create-estimation.spec.ts e2e/endpoint-authorization.test.ts \
               e2e/authorization-error.test.ts e2e/auth-gate.test.ts \
               e2e/user-menu.test.ts e2e/undo.test.ts; do
        if grep -nE "$BAN" "$f"; then echo "translated literal in $f"; fail=1; fi
      done
      exit $fail
  - |
    The German aria-label locator is gone from both its stage-A sites:
      ! grep -rn "Dev-Anmeldungsauswahl" src/frontend/e2e/auth-gate.test.ts src/frontend/e2e/user-menu.test.ts
  - |
    Each stage-A spec imports a Page Object:
      cd src/frontend
      for f in create-estimation.spec.ts endpoint-authorization.test.ts \
               authorization-error.test.ts auth-gate.test.ts \
               user-menu.test.ts undo.test.ts; do
        grep -q "from './pages'" "e2e/$f" || { echo "no POM import: $f"; exit 1; }
      done
  - |
    `src/frontend/CLAUDE.md` carries the placeholder note (task-189 expands
    it; this proves the convention is not documented only in planning YAML):
      grep -q "e2e/pages" src/frontend/CLAUDE.md
  - |
    Static analysis and the full build are green:
      ./gradlew :frontend:check
      ./gradlew build
  - |
    The FULL Playwright suite still passes against a running `./scripts/dev.sh`
    stack (backend on :8090, Docker up for Dev Services; `global-setup.ts`
    resets fixture data first) — stage A touches shared components, so the
    unmigrated specs must be re-proven too:
      cd src/frontend && npx playwright test

