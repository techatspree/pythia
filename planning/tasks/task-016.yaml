id: task-016
phase: phase-4
title: Generate TypeScript API client from OpenAPI
depends_on: [task-015]
description: |
  Generate a typed TypeScript API client from the backend's OpenAPI spec for the frontend.
  This keeps the REST contract in sync automatically as part of the build.

  Current state:
    - Backend already has quarkus-smallrye-openapi producing a spec at /q/openapi
    - Frontend already has openapi-typescript (^7.13.0) and openapi-fetch (^0.17.0) as devDependencies
    - Frontend has domain model types generated from Kotlin via typescript-generator
    - Frontend builds via frontend-maven-plugin in the Maven reactor

  Approach:
    - Configure Quarkus to write the OpenAPI schema to a file at build time
      (quarkus.smallrye-openapi.store-schema-directory=target/openapi)
    - Use maven-resources-plugin to copy the generated openapi.json into frontend/src/lib/api/
    - Add npm script "gen:api" that runs openapi-typescript to produce typed path definitions
    - Add a Maven execution that runs "gen:api" before the frontend build
    - Create a thin API client wrapper using openapi-fetch with the generated types

  Generated output structure:
    src/frontend/src/lib/api/
      openapi.json      — copied from backend build output (committed for reproducibility)
      schema.d.ts       — generated by openapi-typescript from openapi.json
      client.ts         — hand-written thin wrapper using openapi-fetch + schema types

  Why commit openapi.json:
    - Frontend can build independently without the backend running
    - Changes to the API are visible in diffs/PRs
    - The file is regenerated on every backend build, keeping it fresh

steps:
  - add quarkus.smallrye-openapi.store-schema-directory=target/openapi to application.properties
  - verify the spec is generated at target/openapi/openapi.json after backend compile
  - add npm script "gen:api" to frontend package.json: "openapi-typescript src/lib/api/openapi.json -o src/lib/api/schema.d.ts"
  - add maven-resources-plugin execution (process-resources phase) in frontend pom.xml to copy backend openapi.json into src/lib/api/
  - add frontend-maven-plugin execution to run "gen:api" before "npm run build" (after npm install, before compile)
  - create src/frontend/src/lib/api/client.ts using openapi-fetch with createClient<paths>()
  - verify "npm run gen:api" produces schema.d.ts with typed paths for all endpoints
  - verify full reactor build (mvn clean install) succeeds
  - verify svelte-check passes with the generated types

validation:
  - backend build produces target/openapi/openapi.json with all endpoints documented
  - npm run gen:api generates schema.d.ts with typed paths
  - client.ts exports a typed createApiClient() function
  - import { paths } from schema.d.ts contains /api/estimations, /api/projects, /api/estimations/{estimationId}/versions paths
  - svelte-check passes (no type errors)
  - full reactor build (mvn clean install) succeeds end-to-end
  - openapi.json is committed in the frontend source tree for independent builds

outputs:
  - src/frontend/src/lib/api/openapi.json (generated, committed)
  - src/frontend/src/lib/api/schema.d.ts (generated, committed)
  - src/frontend/src/lib/api/client.ts (hand-written wrapper)
  - modified: src/backend/implementation/src/main/resources/application.properties (store-schema-directory)
  - modified: src/frontend/package.json (gen:api script)
  - modified: src/frontend/pom.xml (copy openapi.json + run gen:api)
