id: task-123
phase: phase-16
title: i18n — user language preference (column, PUT endpoint, SupportedLanguage enum)
depends_on: [task-122]
description: |
  Phase-16 child (see task-111 for the frozen cross-cutting
  decisions). Persists a per-user language preference and exposes
  it over REST, and introduces the shared `SupportedLanguage`
  enum in `:domain`.

  ## Frozen decisions this task honours (from task-111)

  - **User preference is authoritative and persisted.** New
    `users.language char(2) NOT NULL DEFAULT 'de'` column via
    Flyway (default `'de'` so existing users keep today's UI).
    First sighting via `UserProvisioningFilter` seeds the language
    from `Accept-Language` when it is `en`, otherwise `de`.
  - **REST for language.**
      * `GET /api/auth/me` gains a `language` field on the
        response (`CurrentUserDto`).
      * `PUT /api/auth/me/language` — body `{language:"de"|"en"}`,
        returns 204 on success, 400 for an unsupported code. Logs
        INFO with the user id + new language (CLAUDE.md backend
        logging convention).
      * Reject unsupported codes at the wire boundary.
  - **SupportedLanguage lives in `:domain`**, package
    `io.github.theestimator.i18n`, `@JsExport`-annotated following
    the `EstimationVersionStatus.kt` idiom (file-level
    `@file:OptIn(ExperimentalJsExport::class)`). Values `DE`, `EN`.
    The enum is the one canonical name both sides share.

  ## `@JsExport` shape note (verify at build time)

  Both existing `@JsExport` enums here (`EstimationVersionStatus`,
  `EstimationMethod`) are *bare* enums — no constructor property,
  no companion. This task's enum carries a `code` property and a
  `fromCode` helper, which is more than either precedent. Kotlin/JS
  will likely warn that a companion object is not exported (fine —
  `fromCode` is JVM-only, used only by the backend validation). To
  stay safe, prefer a **top-level** `fun fromCode(code: String):
  SupportedLanguage?` in the same file over a companion inside the
  `@JsExport` enum. Confirm the JS target compiles via
  `./gradlew :domain:build` before wiring the backend.

  ## Layering: language is a persisted preference, NOT a token claim

  `language` lives on the DB `User` row, not on the token-derived
  `CurrentUser` principal. Do **NOT** add `language` to
  `CurrentUser` (it is populated by the auth augmentors from the
  token/OIDC claims, which carry no stored preference). `GET
  /api/auth/me` reads the value from the persisted `User` returned
  by `CurrentUserService.ensureUser(...)`. The create-time seed and
  the PUT persistence both go through `CurrentUserService` (that is
  the only code that knows create-vs-existing and owns the
  `@Transactional` write), not the resource or the filter directly.

  ## KMP note

  `SupportedLanguage` is a new `@JsExport` enum → it IS an exported
  symbol. After adding it, rebuild the domain and regenerate the
  TypeScript the frontend consumes: `./gradlew :domain:build` then
  the normal `./gradlew build` (which republishes the domain jar
  and the `typescriptDist` the frontend unpacks). The frontend
  child tasks (task-124+) consume the exported enum name.

  ## Steps rely on existing pieces

  - `User` entity + `CurrentUser` principal + `CurrentUserDto`
    (`MeResource.kt`) already exist.
  - `UserProvisioningFilter` already provisions on first sighting;
    it calls `CurrentUserService.ensureUser(current)`.
  - `CurrentUserService.ensureUser(principal): User` is the
    find-or-create seam that returns the managed `User` (it creates
    the row, so it is where the language seed-on-create belongs).
  - `MeResource` is the JAX-RS home for the new PUT.

steps:
  - |
    Read:
      src/domain/src/main/kotlin/io/github/theestimator/model/EstimationVersionStatus.kt (idiom reference)
      src/backend/implementation/src/main/kotlin/io/github/theestimator/rest/MeResource.kt
      src/backend/implementation/src/main/kotlin/io/github/theestimator/auth/UserProvisioningFilter.kt
      src/backend/implementation/src/main/kotlin/io/github/theestimator/auth/CurrentUser.kt
      src/backend/implementation/src/main/kotlin/io/github/theestimator/service/CurrentUserService.kt
      src/backend/implementation/src/main/kotlin/io/github/theestimator/domain/User.kt (or the User entity)
      src/backend/implementation/src/main/resources/db/migration/ (highest V-number)
  - |
    Create the domain enum
    `src/domain/src/main/kotlin/io/github/theestimator/i18n/SupportedLanguage.kt`:
      @file:OptIn(ExperimentalJsExport::class)
      package io.github.theestimator.i18n
      @JsExport enum class SupportedLanguage(val code: String) { DE("de"), EN("en") }
    plus a TOP-LEVEL `fun fromCode(code: String): SupportedLanguage?`
    in the same file (NOT a companion inside the @JsExport enum —
    see the @JsExport shape note). Rebuild the domain:
    `./gradlew :domain:build` and confirm the JS target compiles.
  - |
    Add the Flyway migration
    `src/backend/implementation/src/main/resources/db/migration/V<next>__user_language.sql`:
      ALTER TABLE users ADD COLUMN language char(2) NOT NULL DEFAULT 'de';
    Extend the `User` entity with the `language` field.
  - |
    Extend `CurrentUserDto` (in `MeResource.kt`) with `language`.
    Do NOT touch the `CurrentUser` principal (language is a DB
    preference, not a token claim). In `GET /api/auth/me`, capture
    the `User` returned by `currentUserService.ensureUser(u)` (the
    call already runs; just use its result) and read
    `user.language` into the DTO.
  - |
    Add a `@Transactional` `updateLanguage(principal, language)`
    method to `CurrentUserService` that find-or-creates the `User`
    and sets its `language`; `Log.info` the user id + new language
    (CLAUDE.md backend logging convention). Then add
    `PUT /api/auth/me/language` to `MeResource`: parse the
    `{language}` body, validate against the top-level `fromCode`
    (400 on unsupported), delegate the persistence to
    `CurrentUserService.updateLanguage`, return 204. Document the
    endpoint's request/response + status codes with MicroProfile
    OpenAPI annotations (matching the existing MeResource style).
  - |
    Seed `language` on first sighting from the `Accept-Language`
    request header (`en` → `EN`, otherwise `DE`), applied ONLY on
    CREATE (do not overwrite an existing user's stored preference).
    Because the create happens inside
    `CurrentUserService.ensureUser`, thread the requested language
    into it: give `ensureUser` a nullable requested-language
    parameter (default null) applied only in the create branch, and
    have `UserProvisioningFilter` read `Accept-Language` from the
    request context and pass it through. Existing `ensureUser`
    call sites keep working via the default.
  - |
    Update `CLAUDE.md`: add `PUT /api/auth/me/language` and the
    `CurrentUserDto.language` field to the REST API surface section,
    and note the persisted `users.language` column + the shared
    `SupportedLanguage` (`io.github.theestimator.i18n`) enum in the
    auth/i18n narrative.
  - |
    Build (cross-module — domain enum consumed by the frontend,
    backend migration + endpoint):
      ./gradlew build
validation:
  - |
    The @JsExport SupportedLanguage enum exists in :domain:
      test -f src/domain/src/main/kotlin/io/github/theestimator/i18n/SupportedLanguage.kt
      grep -q "@JsExport" src/domain/src/main/kotlin/io/github/theestimator/i18n/SupportedLanguage.kt
      grep -qE "DE\(|EN\(" src/domain/src/main/kotlin/io/github/theestimator/i18n/SupportedLanguage.kt
  - |
    Migration adds the column; User entity + DTO carry language:
      ls src/backend/implementation/src/main/resources/db/migration/ | grep -qi "user_language"
      grep -rq "language" src/backend/implementation/src/main/kotlin/io/github/theestimator/rest/MeResource.kt
  - |
    The PUT endpoint exists; persistence goes through CurrentUserService which logs at INFO:
      grep -q "me/language" src/backend/implementation/src/main/kotlin/io/github/theestimator/rest/MeResource.kt
      grep -qE "@PUT" src/backend/implementation/src/main/kotlin/io/github/theestimator/rest/MeResource.kt
      grep -qE "updateLanguage" src/backend/implementation/src/main/kotlin/io/github/theestimator/service/CurrentUserService.kt
      grep -q "Log.info" src/backend/implementation/src/main/kotlin/io/github/theestimator/service/CurrentUserService.kt
  - |
    CurrentUser principal is NOT polluted with a language field (stays a token-only principal):
      ! grep -qi "language" src/backend/implementation/src/main/kotlin/io/github/theestimator/auth/CurrentUser.kt
  - |
    Provisioning seeds language from Accept-Language on create:
      grep -qiE "accept-language|acceptLanguage" src/backend/implementation/src/main/kotlin/io/github/theestimator/auth/UserProvisioningFilter.kt
  - |
    Full build is green (domain export + backend + frontend consume):
      ./gradlew build
