  - modified: src/backend/implementation/src/main/resources/application.properties
  - modified: src/backend/implementation/build.gradle.kts
  - modified: src/frontend/build.gradle.kts
  - modified: .gitignore
  - created: scripts/sbom-part.mjs
  - created: scripts/sbom-part.test.mjs
  - created: scripts/fixtures/sbom-part/
  - created: scripts/check-artifact-licenses.sh
  - modified: scripts/minikube-deploy.sh
  - modified: .github/workflows/ci.yaml
  - modified: docs/oss-compliance.md
  - modified: docs/deployment.md
  - modified: CLAUDE.md
