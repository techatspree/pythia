    Backend joinable listing exists and the endpoint param is optional:
      grep -q "findJoinable" src/backend/implementation/src/main/kotlin/io/pythia/repository/EstimationSessionRepository.kt
      grep -q "listJoinableSessions" src/backend/implementation/src/main/kotlin/io/pythia/service/EstimationSessionService.kt
      grep -q "estimationId: UUID?" src/backend/implementation/src/main/kotlin/io/pythia/rest/SessionResource.kt
      grep -q "Log\." src/backend/implementation/src/main/kotlin/io/pythia/service/EstimationSessionService.kt
  - |
    Seeder produces unestimated leaves (a group of 0.0/0.0/0.0 fixed leaves):
      grep -q "Noch zu schätzen" src/backend/implementation/src/main/kotlin/io/pythia/testdata/TestDataSeeder.kt
  - |
    Frontend: start-from-offer button, joinable wrapper, unestimated
    preselect, and select-all are present:
      grep -q "estimation.startSession" src/frontend/src/routes/estimations/[id]/+page.svelte
      grep -q "listJoinableSessions" src/frontend/src/lib/session/api.ts
      grep -q "listJoinableSessions" src/frontend/src/routes/sessions/+page.svelte
      grep -qiE "isUnestimated|unestimated" src/frontend/src/routes/sessions/+page.svelte
      grep -qiE "selectAll|deselectAll|session.setup.selectAll" src/frontend/src/routes/sessions/+page.svelte
  - |
    Setup page reads the estimationId query param for start-from-offer:
      grep -q "searchParams" src/frontend/src/routes/sessions/+page.svelte
  - |
    No bare console.* in the touched frontend files:
      ! grep -q "console\." src/frontend/src/routes/sessions/+page.svelte
      ! grep -q "console\." src/frontend/src/routes/estimations/[id]/+page.svelte
  - |
    de/en i18n catalogs keep equal key sets:
      cd src/frontend && node -e "const d=require('./src/lib/i18n/de.json'),e=require('./src/lib/i18n/en.json');const f=(o,p='')=>Object.entries(o).flatMap(([k,v])=>typeof v==='object'&&v?f(v,p+k+'.'):[p+k]);const a=f(d).sort(),b=f(e).sort();if(JSON.stringify(a)!==JSON.stringify(b))throw new Error('key sets differ');console.log('ok',a.length)"
  - |
    Docs updated:
      test -f docs/estimation-sessions.md
      grep -qi "join\|open session\|unestimated\|active offer" docs/estimation-sessions.md
  - |
    Backend tests and frontend type-check + lint pass:
      ./gradlew :backend:implementation:test
      ./gradlew :frontend:check

