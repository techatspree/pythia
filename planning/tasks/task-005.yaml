  - created: src/backend/implementation/src/main/kotlin/io/github/theestimator/auth/CurrentUser.kt
  - created: src/backend/implementation/src/main/kotlin/io/github/theestimator/auth/CurrentUserProvider.kt
  - created: src/backend/implementation/src/main/kotlin/io/github/theestimator/auth/AuthConfig.kt
