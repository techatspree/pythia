      grep -q "VITE_AUTH_PROVIDER" src/frontend/.env.example
      grep -q "VITE_AUTH_PROVIDER" src/frontend/src/vite-env.d.ts
  - |
    planning/plan.yaml's User entity field list no longer mentions
    `entra_subject_id`:
      ! grep -q "entra_subject_id" planning/plan.yaml
      grep -q "subject_id" planning/plan.yaml
      grep -q "provider" planning/plan.yaml
  - |
    Phase-2 has been renamed and task-060 is listed:
