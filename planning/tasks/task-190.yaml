id: task-190
phase: phase-14
title: "Make the e2e suite locale-independent"
depends_on: [task-188, task-189]
description: |
  Close the Page Object work by making the property it was always supposed to
  deliver actually TRUE and actually CHECKED: **no Playwright spec depends on
  the UI language.** Stages A–C (task-117 / task-188 / task-189) remove
  translated LABELS from the specs and keep them out with an ESLint rule. That
  is a proxy. This task makes the suite pass in German and in English, and
  adds the run that proves it.

  ## What still ties the suite to German after stage B

  (Line numbers below were re-audited on 2026-09-29 and will drift — step 1
  re-greps rather than trusting them.)

  1. **Formatted numbers — seven assertions.** `$lib/format.ts` formats by the
     USER's language, so a decimal comma is German output:
       * `e2e/bucket-sampled-flow.test.ts:230,231,232,233,263,264`
         — `toHaveText('2,00')` / `'4,00'`
       * `e2e/session.test.ts:145`
         — `toHaveText('5,0 / 8,0 / 13,0')`
     Under English these render `2.00` and `5.0 / 8.0 / 13.0`. task-188
     deliberately preserves them (it lists `'2,00'` as a legitimate
     non-label string), so they arrive here untouched.
  2. **A German number PARSER**: `e2e/summary-panel.test.ts` `parseDe()`
     (~line 165, commented "Playwright pins `locale: 'de-DE'`") strips `.` as
     a thousands separator and turns `,` into the decimal mark. Under English
     `1,234.56` parses as `1.23456`. Neither audit grep matches it — it is a
     function, not a quoted expectation.
  3. **Catalog lookups pinned to German**: `schedule`, `xlsx-import`,
     `session-connection` and `session` each carry an identical local
     `catalogText(key)` that reads `../src/lib/i18n/de.json`. That idiom
     (task-188) is correct — it pins the KEY, not the wording — but the
     catalog it reads must follow the run's language, or every translated
     sentence those specs assert fails under English.
  4. **Hardcoded browser locales in specs**: 17
     `browser.newContext({ locale: 'de-DE', … })` calls across
     `connection-lost`, `merlin-import`, `session-connection`, `session`,
     `system-settings` and `xlsx-import`. They no longer decide the rendered
     language (see "The trap" below), but they are the same "German by
     construction" signal as the config pin and must go with it.
  5. **The currency assertion is NOT a dependency**: `e2e/tree-table.test.ts:41`
     asserts `toContainText(/€[0-9]/)` on `tt-demo.total`, and
     `routes/dev/tree-table-demo/+page.svelte` renders it as a hardcoded
     `Total: €{….toFixed(2)}` — that fixture is deliberately exempt from
     i18n and `$lib/format.ts`, so its output is identical in both languages.
     Confirm and leave it unchanged.
  6. **The ambient locale itself.** Only `language.test.ts` and
     `treetable-header-fit.test.ts` set their user's language explicitly. Every
     other spec inherits whatever the shared dev users happen to carry.

  ## The trap: removing the config pin alone makes things WORSE

  `playwright.config.ts` pins `locale: 'de-DE'`, and it is tempting to think
  deleting that line is the whole task. It is not, and doing only that would
  reduce determinism:

  - Accept-Language seeds a dev user's language **only on first sighting**
    (task-123). The dev provider then re-reads the PERSISTED value from
    `GET /api/auth/me` on startup (task-127).
  - So for an already-provisioned `dev-admin`, the browser locale changes
    nothing — the suite would simply inherit whatever language the last run,
    or `scripts/capture-screenshots.mjs`, left behind. An `en-US` run would
    then render GERMAN and pass while proving nothing at all.

  **The browser locale is the wrong lever.** `$lib/format.ts` takes the locale
  as a parameter and callers pass `$locale ?? DEFAULT_LOCALE`, where `$locale`
  is driven by `setUserLanguage(...)` off the account's persisted language —
  not by the browser. The deterministic lever is the PERSISTED user language.

  ## The design

  **`e2e/global-setup.ts` pins the shared users' language explicitly**, right
  after its existing fixture reset, for each of the three shared dev subjects
  (`dev-admin`, `dev-estimator`, `dev-viewer`):

      PUT /api/auth/me/language  { "language": <E2E_LANG ?? 'de'> }

  with the `Authorization: Dev <subject>` header the reset already uses (the
  PUT also provisions the user, so it doubles as a deterministic reset). It
  logs the language it pinned, like the reset logs its counts.

  This is strictly better than the config pin on four counts:

  - It is deterministic regardless of what a previous run left behind, which
    the Accept-Language route never was.
  - It makes `E2E_LANG=en npx playwright test` a REAL English run, so the
    gate below actually tests something.
  - It **retires the task-180 hazard**: a `capture-screenshots.mjs` run that
    fails to restore the language can no longer fail 28 tests, because the
    next run re-pins it. Keep that script's `finally` anyway — it is good
    hygiene for a human's dev stack — but it stops being load-bearing, and
    `src/frontend/CLAUDE.md` must stop saying that it is.
  - `language.test.ts` and `treetable-header-fit.test.ts` keep setting their
    own language; the global pin only improves their starting point. Do not
    remove their per-spec handling.

  **`dev-estimator` is NOT a dedicated user**, whatever those two specs'
  comments say. Only three dev users exist (`DEV_USERS` in
  `src/backend/implementation/.../auth/dev/DevUser.kt`), and `session.test.ts`
  and `undo.test.ts` also act as `dev-estimator`. Two consequences:

  - Both specs' `afterEach` hooks currently reset `dev-estimator` to a
    hardcoded `'de'`. Under `E2E_LANG=en` that leaves the user German for
    every later spec. They must restore the RUN's language
    (`E2E_LANG ?? 'de'`) instead.
  - While either spec holds `dev-estimator` in its non-run language, a
    `session.test.ts` test running in parallel as the same user sees the
    wrong language. That race exists today and this task does not introduce
    it. Fixing it properly means adding a fourth dev user, which is a
    backend change and out of scope. Record it in `src/frontend/CLAUDE.md`
    and in both specs' comments. If the gate runs flake on it, serialise
    the two language specs against the session spec, and do not add retries.
    `test.describe.configure({ mode: 'serial' })` only orders tests WITHIN a
    file, so it does not help here. Use a separate Playwright `project` with
    `dependencies` instead.

  **One source for the run language.** Export it once from `e2e/helpers.ts`:
  `export const E2E_LANG = …` reads `process.env.E2E_LANG ?? 'de'`, and throws
  unless it is a supported catalog (`de` | `en`), so a typo fails before any
  test runs instead of surfacing as 28 confusing failures. `global-setup.ts`,
  the shared `catalogText()`, the number parser and both `afterEach` hooks
  all import it, so they cannot disagree.

  **`playwright.config.ts`: drop `locale: 'de-DE'`.** With the language pinned
  server-side it no longer decides anything. Removing it is the point — while
  it remains, a reader reasonably concludes the suite is German by
  construction. If a browser locale is wanted for realism, it must be set from
  the same `E2E_LANG` value so the two can never disagree.

  ## Assertion conversions

  Make the seven number assertions locale-agnostic rather than pinning a
  language around them — a spec that switches the SHARED `dev-admin` would
  contaminate every spec running in parallel against the one backend, which is
  exactly why `language.test.ts` uses a dedicated user:

      await expect(meanOf(page, leaf1)).toHaveText(/^2[.,]00$/);
      await expect(est.getByTestId('aggregate-mean'))
        .toHaveText(/^5[.,]0 \/ 8[.,]0 \/ 13[.,]0$/);

  The value is still asserted; only the separator is freed. Where the
  component already carries a testid, exposing the raw number as a
  `data-value` attribute and asserting THAT is stronger and also acceptable —
  but do not add attributes to components purely to avoid a regex.

  **`summary-panel.test.ts`'s `parseDe`** becomes a locale-aware
  `parseNumber(text)` in `e2e/helpers.ts`, which reads the group and decimal
  separators for `E2E_LANG` from `Intl.NumberFormat(...).formatToParts` instead
  of hardcoding them. That is test-side PARSING of rendered output, not a
  second formatter, so it does not violate the `$lib/format.ts` single-source
  rule. It must not import `$lib/format.ts` either, because `$lib` aliases are
  unavailable in the node-side spec context.

  **The four `catalogText()` copies** collapse into one exported
  `catalogText(key)` in `e2e/helpers.ts` that reads
  `../src/lib/i18n/${E2E_LANG}.json` and throws on a missing key, like the
  copies do today. The per-spec copies are deleted, not left beside it.

  **Do not weaken the two specs that legitimately assert locale-specific
  text.** `language.test.ts` must keep asserting `'Abmelden'` vs `'Logout'`
  (that IS its subject) and `treetable-header-fit.test.ts` must keep measuring
  in both locales (the header-overflow defect is translation-dependent,
  task-140). Both set their own language, so neither depends on an ambient
  one — they satisfy the rule rather than breaking it.

  ## The gate

  The suite must pass under BOTH languages. That is the only check that proves
  the property; every grep in stages A–C is a proxy for it.

  ## Non-goals

  - No change to `$lib/format.ts`, the i18n catalogs, or any component's
    rendering. This is a test-suite property, not a product change.
  - No removal of `capture-screenshots.mjs`'s `finally` — it stops being
    load-bearing, it does not become wrong.
  - No new e2e coverage; no backend, domain or REST changes. (The
    `PUT /api/auth/me/language` endpoint already exists — task-123.)
  - The ESLint selector rule is task-189's and is orthogonal to this task in
    substance. The dependency on task-189 exists for one reason: THREE tasks
    write to `src/frontend/CLAUDE.md` (task-117 adds a placeholder, task-189
    expands it into the full subsection, this task corrects the statements
    that become false). Without the edge, task-189 and this task are parallel
    siblings and whichever lands second rewrites a file the other just
    changed. Run them in order.

steps:
  - |
    Read, in parallel:
      src/frontend/e2e/global-setup.ts        (the reset this extends)
      src/frontend/playwright.config.ts       (the locale pin and storageState)
      src/frontend/e2e/language.test.ts       (the per-spec language idiom to copy)
      src/frontend/e2e/treetable-header-fit.test.ts
      src/frontend/src/lib/format.ts          (confirm locale is a parameter, not the browser's)
      src/frontend/e2e/helpers.ts             (where E2E_LANG, catalogText, parseNumber go)
      src/frontend/e2e/summary-panel.test.ts  (parseDe)
      src/frontend/src/routes/dev/tree-table-demo/+page.svelte  (confirm the hardcoded € total)
    Then re-audit the locale dependencies rather than trusting this file's
    line numbers. The greps cover assertions, parsers, catalog reads, browser
    locales and shared-user language writes:
      grep -rnE "to(HaveText|ContainText)\([[:space:]]*['\"][0-9]+[.,][0-9]" src/frontend/e2e/*.ts
      grep -rnE "€|[0-9]\.[0-9]{3}|[0-9]{2}\.[0-9]{2}\.[0-9]{4}" src/frontend/e2e/*.ts
      grep -rnE "parseDe|replace\(','|i18n/de\.json|i18n/en\.json" src/frontend/e2e
      grep -rnE "locale:[[:space:]]*'(de|en)-" src/frontend/e2e src/frontend/playwright.config.ts
      grep -rn "auth/me/language" src/frontend/e2e
      grep -rln "dev-estimator" src/frontend/e2e
  - |
    Extend `e2e/helpers.ts` with the three shared pieces (see the design):
      * `E2E_LANG`: `process.env.E2E_LANG ?? 'de'`, validated against
        `de` | `en`, throwing otherwise;
      * `catalogText(key)`: reads `../src/lib/i18n/${E2E_LANG}.json` and
        throws on a missing key;
      * `parseNumber(text)`: separators derived from
        `Intl.NumberFormat(E2E_LANG).formatToParts(1234.5)`.
    Then delete the four local `catalogText` copies (`schedule`,
    `xlsx-import`, `session-connection`, `session`) and import the shared one.
    Replace `parseDe` in `summary-panel.test.ts` with `parseNumber`, and
    remove its "Playwright pins `locale: 'de-DE'`" comment.
  - |
    Extend `e2e/global-setup.ts`: after the existing `DELETE /api/dev/test-data`
    reset, PUT `/api/auth/me/language` for `dev-admin`, `dev-estimator` and
    `dev-viewer` with `E2E_LANG` (imported from `./helpers`), each with its own
    `Authorization: Dev <subject>` header. Expect 204. Log the pinned language
    the way the reset logs its counts. A failure here fails loudly, because
    every test depends on it. It runs on the 404 (non-dev-profile) path too,
    since the language endpoint is not dev-only, so do the pin before or
    independently of that early `return`.
  - |
    Remove `locale: 'de-DE'` from `playwright.config.ts`, and every hardcoded
    `locale: 'de-DE'` from the `browser.newContext({...})` calls in the specs
    (`connection-lost`, `merlin-import`, `session-connection`, `session`,
    `system-settings`, `xlsx-import`). A context created by `browser.newContext`
    does NOT inherit `use.locale`, so if a browser locale is kept for realism,
    it must be derived from `E2E_LANG` in the config AND in every one of those
    calls. Dropping it everywhere is simpler and preferred. Update the config
    comment: the language is pinned server-side by `global-setup.ts`, because
    Accept-Language only seeds a user on FIRST sighting and therefore cannot
    re-language an existing one.
  - |
    Convert the seven formatted-number assertions
    (`bucket-sampled-flow.test.ts` ×6, `session.test.ts` ×1) to
    separator-agnostic regexes. Confirm that `tree-table.test.ts`'s `/€[0-9]/`
    targets the dev demo's hardcoded, locale-exempt total, and leave that
    file unchanged.
  - |
    Fix the shared-user language handling in `language.test.ts` and
    `treetable-header-fit.test.ts`:
      * both `afterEach` hooks restore `E2E_LANG`, not a hardcoded `'de'`;
      * `language.test.ts`'s `beforeEach` keeps setting `'de'` explicitly,
        because its subject is the DE→EN switch and it must keep asserting
        `'Abmelden'` then `'Logout'`;
      * rewrite both files' comments that call `dev-estimator` "DEDICATED" or
        refer to "the German assertions in the rest of the suite". State that
        it is shared with `session`/`undo`, and name the parallel race.
  - |
    Run the suite BOTH ways against a running `./scripts/dev.sh` stack and fix
    what falls out:
      cd src/frontend
      E2E_LANG=en npx playwright test
      E2E_LANG=de npx playwright test
    Expect the English run to surface leftovers stages A–C could not see —
    assertions on text that is neither a label nor a number.
  - |
    Update `src/frontend/CLAUDE.md`. Four existing statements become WRONG
    and must be corrected, not merely supplemented:
      * that `playwright.config.ts` pins `locale: 'de-DE'` so Accept-Language
        seeds fresh dev users German (the i18n section);
      * that the Playwright suite asserts German UI text, so a stack left in
        English fails 28 tests (the brand-assets section, task-180);
      * the Page Object subsection's "The suite is still German by
        configuration (`playwright.config.ts` pins `locale: 'de-DE'`); task-190
        makes it … Until then, do not describe the suite as
        locale-independent" (added by task-189). Now that task-190 has landed,
        it becomes a statement of the property;
      * the TreeTable header-fit paragraph's claim that its English case runs
        under "a dedicated `dev-estimator` user". It is shared with the
        session and undo specs.
    Replace with: the suite is locale-independent and proven so by the
    `E2E_LANG=en` run; `E2E_LANG` (from `e2e/helpers.ts`) is the single
    source for the run language; `global-setup.ts` pins the shared dev users'
    language to it; spec catalog lookups go through the shared
    `catalogText()`; `capture-screenshots.mjs` keeps its `finally` as hygiene
    but is no longer load-bearing; `language.test.ts` and
    `treetable-header-fit.test.ts` set their own language by design and
    restore `E2E_LANG` afterwards; and the `dev-estimator` parallel race is a
    known limitation until a fourth dev user exists.
  - |
    Build:
      ./gradlew :frontend:check
      ./gradlew build

validation:
  - |
    `global-setup.ts` pins the language for all three shared dev subjects:
      grep -q "auth/me/language" src/frontend/e2e/global-setup.ts
      grep -q "E2E_LANG" src/frontend/e2e/global-setup.ts
      for s in dev-admin dev-estimator dev-viewer; do
        grep -q "$s" src/frontend/e2e/global-setup.ts \
          || { echo "global-setup does not pin $s"; exit 1; }
      done
  - |
    The browser-locale pin is gone, or is derived from E2E_LANG rather than
    hardcoded:
      cd src/frontend
      ! grep -rnE "locale:[[:space:]]*'de-DE'" playwright.config.ts e2e
  - |
    The run language has ONE source, and nothing in the specs reads a fixed
    catalog or parses numbers the German way:
      cd src/frontend
      grep -q "export const E2E_LANG" e2e/helpers.ts
      grep -q "export function catalogText" e2e/helpers.ts
      grep -q "export function parseNumber" e2e/helpers.ts
      ! grep -rnE "i18n/(de|en)\.json" e2e/*.ts
      ! grep -rn "function catalogText" e2e/*.test.ts
      ! grep -rn "parseDe" e2e
      ! grep -rn "process.env.E2E_LANG" e2e --include='*.test.ts'
  - |
    Neither language spec resets the shared `dev-estimator` to a hardcoded
    German on the way out. Their `afterEach` restores `E2E_LANG`:
      cd src/frontend
      for f in e2e/language.test.ts e2e/treetable-header-fit.test.ts; do
        awk '/afterEach/,/^\t}\);/' "$f" | grep -q "E2E_LANG" \
          || { echo "$f afterEach does not restore E2E_LANG"; exit 1; }
      done
      ! grep -n "DEDICATED dev user" e2e/language.test.ts
  - |
    The tree-table currency check stays as it is, because it targets the
    locale-exempt demo:
      grep -q 'Total: €' src/frontend/src/routes/dev/tree-table-demo/+page.svelte
  - |
    No spec asserts a locale-specific NUMBER format any more (a decimal comma
    or dot inside a quoted expectation):
      cd src/frontend
      ! grep -rnE "to(HaveText|ContainText)\([[:space:]]*['\"][0-9]+[.,][0-9]" e2e/*.ts
  - |
    The two specs that legitimately assert locale-specific TEXT still do, and
    still set their own language — this task must not have "fixed" them:
      grep -q "auth/me/language" src/frontend/e2e/language.test.ts
      grep -q "auth/me/language" src/frontend/e2e/treetable-header-fit.test.ts
      grep -q "Abmelden" src/frontend/e2e/language.test.ts
      grep -q "Logout" src/frontend/e2e/language.test.ts
  - |
    `src/frontend/CLAUDE.md` no longer claims the suite is German by
    construction, and records the new property:
      ! grep -n "fails 28 tests" src/frontend/CLAUDE.md
      ! grep -nE "pins \`?locale: 'de-DE'\`?" src/frontend/CLAUDE.md
      ! grep -n "still German by configuration" src/frontend/CLAUDE.md
      ! grep -n "dedicated \`dev-estimator\`" src/frontend/CLAUDE.md
      grep -q "E2E_LANG" src/frontend/CLAUDE.md
  - |
    Static analysis and the full build are green:
      ./gradlew :frontend:check
      ./gradlew build
  - |
    **The gate.** The full suite passes in BOTH languages against a running
    `./scripts/dev.sh` stack (backend on :8090, Docker up). Run them
    sequentially, never in parallel — they share one backend and one set of
    dev users. English FIRST so the stack is left German for the next
    developer (`--list` would not do: it does not execute `globalSetup`, so it
    re-pins nothing):
      cd src/frontend
      E2E_LANG=en npx playwright test
      E2E_LANG=de npx playwright test

outputs:
  - modified: src/frontend/e2e/helpers.ts            # E2E_LANG, catalogText, parseNumber
  - modified: src/frontend/e2e/global-setup.ts
  - modified: src/frontend/playwright.config.ts
  - modified: src/frontend/e2e/bucket-sampled-flow.test.ts
  - modified: src/frontend/e2e/session.test.ts       # number regex, shared catalogText, locale
  - modified: src/frontend/e2e/summary-panel.test.ts # parseDe → parseNumber
  - modified: src/frontend/e2e/schedule.test.ts      # shared catalogText
  - modified: src/frontend/e2e/xlsx-import.test.ts   # shared catalogText, locale
  - modified: src/frontend/e2e/session-connection.test.ts  # shared catalogText, locale
  - modified: src/frontend/e2e/connection-lost.test.ts     # locale
  - modified: src/frontend/e2e/merlin-import.test.ts       # locale
  - modified: src/frontend/e2e/system-settings.test.ts     # locale
  - modified: src/frontend/e2e/language.test.ts            # afterEach restores E2E_LANG, comments
  - modified: src/frontend/e2e/treetable-header-fit.test.ts # afterEach restores E2E_LANG, comments
  - modified: src/frontend/CLAUDE.md
  # NOT modified: src/frontend/e2e/tree-table.test.ts — its €-total assertion
  # targets the locale-exempt dev demo (confirmed in step 1, left unchanged).
  # After landing, suggest an auto-memory note: the e2e run language is
  # E2E_LANG, pinned server-side by global-setup.ts; dev-estimator is shared,
