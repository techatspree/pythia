  - backend: SubmittedEstimationItem.kt (phaseAbbreviation field added)
  - backend: EstimationVersionDtos.kt (EstimationItemGroupDto phaseAbbreviation removed; EstimationItemDto phaseAbbreviation added; EstimationItemUpdateDto phaseAbbreviation added; PhaseUpdateDto new; DraftUpdateDto phases field added; ItemGroupUpdateDto phaseAbbreviation removed)
