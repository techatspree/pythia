id: task-126
phase: phase-16
title: i18n — locale-aware number/currency/date formatting helper
depends_on: [task-125]
description: |
  Phase-16 child (see task-111 for the frozen cross-cutting
  decisions). Centralises number/currency/date formatting behind
  a locale-aware helper and migrates every ad-hoc format call.

  ## Frozen decisions this task honours (from task-111)

  - Introduce `src/frontend/src/lib/format.ts` with
    `formatCurrency(value, locale)`,
    `formatNumber(value, locale, options?)`,
    `formatDate(iso, locale)`, built on `Intl.NumberFormat` /
    `Intl.DateTimeFormat`.
  - **Currency symbol stays `€` regardless of locale** (the tool
    is EUR-only) — only grouping/decimal/date presentation follows
    the locale.
  - Migrate EVERY existing direct `toLocaleString('de-DE')`,
    `Intl.NumberFormat('de-DE', …)`, `Intl.DateTimeFormat('de-DE',
    …)`, and hand-rolled format call site to the helper, passing
    the active locale (from the i18n store / active `$locale`).

  ## Current state (after task-125)

  - Formatting is scattered: hardcoded `de-DE` locales and
    bespoke number/date rendering across components.

  ## Target state

  - One `format.ts` helper module is the single formatting seam.
  - No component hardcodes a `de-DE` locale; each passes the
    active locale so English users see English grouping/date
    order (still `€`).

steps:
  - |
    Find every format call site:
      grep -rnE "toLocaleString\(|Intl\.(NumberFormat|DateTimeFormat)|de-DE" src/frontend/src
  - |
    Create `src/frontend/src/lib/format.ts`:
      * `formatNumber(value: number, locale: string, options?: Intl.NumberFormatOptions): string`
      * `formatCurrency(value: number, locale: string): string` —
        `Intl.NumberFormat(locale, { style:'currency', currency:'EUR' })`
        (always EUR/€).
      * `formatDate(iso: string, locale: string): string` —
        `Intl.DateTimeFormat(locale, …)`.
      Pure functions; no i18n import (locale is a parameter) — the
      caller supplies the active locale so the module stays a leaf
      dependency.
  - |
    Migrate all call sites (from step 1) to the helper, threading
    the active locale from the i18n store (`$locale` /
    `get(locale)`), defaulting to `'de'`.
  - |
    Type-check + lint:
      ./gradlew :frontend:check
validation:
  - |
    The helper exists with all three functions and is EUR-locked:
      test -f src/frontend/src/lib/format.ts
      grep -q "export function formatCurrency" src/frontend/src/lib/format.ts
      grep -q "export function formatNumber" src/frontend/src/lib/format.ts
      grep -q "export function formatDate" src/frontend/src/lib/format.ts
      grep -q "currency: 'EUR'" src/frontend/src/lib/format.ts
  - |
    No hardcoded de-DE locale remains outside the helper:
      ! grep -rn "de-DE" src/frontend/src/lib src/frontend/src/routes | grep -v "lib/format.ts"
  - |
    No bare console in the helper (frontend logging convention):
      ! grep -nE "console\." src/frontend/src/lib/format.ts
  - |
    Frontend type-check + lint pass:
      ./gradlew :frontend:check
outputs:
  - created: src/frontend/src/lib/format.ts
