id: task-060
phase: phase-2
title: Future — Keycloak auth module
depends_on: [task-008]
description: |
  FUTURE / OPTIONAL — not on the critical path. Add Keycloak as a
  third concrete implementation of the modular auth SPI established
  in task-005, alongside the `dev` (task-006) and `entra`
  (task-007) modules. Activated by `app.auth.provider=keycloak` +
  `VITE_AUTH_PROVIDER=keycloak`.

  Why a separate task: Keycloak gives self-hosted, open-source
  identity management — useful for deployments where the customer
  does not use Microsoft Entra ID, for air-gapped installations, or
  for integration testing against a realistic OIDC issuer without
  paying tenant overhead. The module follows the same SPI shape
  task-005 defined, so adding it is purely additive: no changes
  to REST resources, pages, or components.

  This task is intentionally a placeholder. It can be implemented
  whenever a deployment actually requires it. Until then, leaving
  it `pending` documents intent and prevents the auth design from
  being silently rebuilt to be Keycloak-shaped later.

  Current state (assumes task-005 + task-006 + task-007 + task-008
  are done):
    - The AuthModule SPI exists with two working concrete modules.
    - The config switch `app.auth.provider=keycloak` is allowed
      by the type but the frontend `getAuthProvider()` factory
      throws `Provider 'keycloak' not yet wired up — see task-060`
      and there is no backend KeycloakAuthModule on the classpath.
    - No Keycloak server is running anywhere; no Keycloak realm
      configuration exists in the repo.

  Target state:
    - Backend
        * Add `io.quarkus:quarkus-oidc` if not already present
          (task-007 added it for Entra). The same dependency
          handles Keycloak token validation; only the
          `auth-server-url`, `client-id`, and role-claim path
          differ.
        * application.properties Keycloak block under
          `app.auth.provider=keycloak`:
            quarkus.oidc.auth-server-url=${KEYCLOAK_BASE_URL}/realms/${KEYCLOAK_REALM}
            quarkus.oidc.client-id=${KEYCLOAK_API_CLIENT_ID}
            quarkus.oidc.application-type=service
            quarkus.oidc.roles.role-claim-path=realm_access/roles
              (or `resource_access/<client-id>/roles` depending on
               whether realm or client roles are used — document
               BOTH options and pick `realm_access/roles` by
               default for simplicity)
        * `KeycloakAuthModule.kt` under
          `src/backend/implementation/.../auth/keycloak/`
          implementing `AuthModule` with `name() = "keycloak"`.
        * `KeycloakSecurityIdentityAugmentor.kt` that maps
          Keycloak's claim layout into the modular `CurrentUser`.
          Pull `subjectId` from `sub`, `email` from `email`,
          `displayName` from `preferred_username` or `name`. Role
          mapper `keycloakRolesToDomain(claims): Set<Role>`
          translates Keycloak realm-role names (configured to
          match `VIEWER`/`ESTIMATOR`/`ADMIN`) into the Role enum.
        * Both files gated by
          `@IfBuildProperty(name="app.auth.provider",
                            stringValue="keycloak")`, identical
          pattern to the Entra module.
    - Frontend
        * Use `keycloak-js` (the official Keycloak SPA adapter)
          rather than rolling generic OIDC by hand — it handles
          silent refresh, login URL building, and the broken
          tab-storage edge cases. Add to package.json.
        * `src/frontend/src/lib/auth/KeycloakAuthProvider.ts`
          implementing `AuthProvider`:
            - `init()`: instantiate `new Keycloak({url, realm,
              clientId})` from env vars, call
              `keycloak.init({onLoad: 'check-sso'})`.
            - `login()`: `keycloak.login()`.
            - `logout()`: `keycloak.logout()`.
            - `getAccount()`: derive AuthAccount from
              `keycloak.tokenParsed` (sub, email,
              preferred_username, realm_access.roles).
            - `getAuthorizationHeader()`: call
              `keycloak.updateToken(30)` to refresh if expiring,
              then return `"Bearer " + keycloak.token`.
        * Wire src/frontend/src/lib/auth/index.ts so
          `VITE_AUTH_PROVIDER === 'keycloak'` returns a singleton
          KeycloakAuthProvider. Remove the throw stub from
          task-005.
        * Add to `.env.example`:
            VITE_KEYCLOAK_BASE_URL=
            VITE_KEYCLOAK_REALM=estimator
            VITE_KEYCLOAK_SPA_CLIENT_ID=
    - Local integration testing
        * Add `docker-compose.keycloak.yml` at the repo root with
          a minimal Keycloak 24 service preconfigured with a
          realm `estimator`, the three roles, and a sample admin
          user + sample viewer user. Mount a realm-import JSON
          (committed) so the dev experience is one command.
        * Add `./scripts/dev-keycloak.sh` (mirror of
          dev-local.sh) that:
            - Starts Keycloak via docker-compose
            - Exports APP_AUTH_PROVIDER=keycloak and
              VITE_AUTH_PROVIDER=keycloak with the matching URLs
            - Starts backend + frontend
    - Documentation
        * `docs/keycloak-setup.md` — describes the docker-compose
          realm, how to run dev-keycloak, how to configure a
          production-grade Keycloak deployment (HA, JDBC store,
          backups, TLS), and how roles map. Cross-link to
          docs/entra-setup.md and docs/auth-dev.md.
        * Update CLAUDE.md frontend auth paragraph (added by
          task-007) to mention that keycloak is now one of the
          three available modules.
    - Verification
        * Extend `e2e/auth.test.ts` with a smoke check that
          mirrors the dev-admin case but uses a Keycloak-issued
          token (acquired via a token-exchange call to the
          docker-compose Keycloak in a setup hook). Skipped by
          default; opt-in via env var
          `RUN_KEYCLOAK_TESTS=1`, since CI doesn't necessarily
          want to spin up Keycloak.
        * Update docs/auth-verification.md with a Keycloak
          manual-check section parallel to the existing Entra
          checklist.

  Key design decisions (leave no ambiguity):
    - Default to realm-roles (`realm_access/roles`), not
      client-roles. Document the client-role alternative for
      operators who prefer per-client isolation.
    - Use `keycloak-js`'s `check-sso` mode for init (less
      intrusive than `login-required`). The RequireAuth guard
      from task-006 still pushes unauthenticated users to login.
    - The docker-compose Keycloak ships with a realm-import JSON
      so dev-keycloak is single-command. The realm-import file
      is tracked in git but contains NO secrets — just realm,
      client, and role definitions.

  Out of scope (explicit):
    - Production-grade Keycloak HA setup (briefly described in
      docs/keycloak-setup.md; actual operational deployment is
      a separate ops task).
    - User-federation integration with LDAP/AD (Keycloak
      supports it; configuration is out of scope here).
    - Cross-realm trust or Keycloak-as-broker scenarios.
    - Changes to the dev or Entra modules (this task is purely
      additive).

steps:
  - |
    Backend Keycloak module: create files under
    src/backend/implementation/src/main/kotlin/io/pythia/auth/keycloak/:
      - KeycloakAuthModule.kt — `@ApplicationScoped`, gated.
      - KeycloakSecurityIdentityAugmentor.kt — claim mapping +
        role translation as described.

  - |
    Extend application.properties with the Keycloak block,
    activated only when `app.auth.provider=keycloak`.

  - |
    Add keycloak-js to the frontend:
      cd src/frontend
      npm install --legacy-peer-deps keycloak-js
    Save as a normal dependency.

  - |
    Create src/frontend/src/lib/auth/KeycloakAuthProvider.ts
    implementing AuthProvider via keycloak-js as described.

  - |
    Wire src/frontend/src/lib/auth/index.ts:
      - For `VITE_AUTH_PROVIDER === 'keycloak'`, return a
        singleton KeycloakAuthProvider.
      - Remove the throw stub from task-005.

  - |
    Extend src/frontend/.env.example with the three Keycloak
    env vars listed in the description.

  - |
    Add docker-compose.keycloak.yml at the repo root with a
    Keycloak 24 service and a committed realm-import JSON
    `docker/keycloak/realm-estimator.json` defining the
    `estimator` realm, the three roles, and two test users.

  - |
    Add ./scripts/dev-keycloak.sh that starts docker-compose,
    waits for Keycloak readiness, exports the right env vars,
    then launches the backend and frontend (mirroring
    dev-local.sh's structure).

  - |
    Write docs/keycloak-setup.md describing the docker-compose
    realm, production deployment notes, and role mapping.
    Update CLAUDE.md's frontend auth paragraph to mention
    Keycloak.

  - |
    Extend src/frontend/e2e/auth.test.ts with a skipped-by-default
    Keycloak smoke check. Update docs/auth-verification.md with a
    Keycloak manual-check section parallel to the existing Entra
    one.

  - |
    Backend build:
      mvn -pl src/backend/implementation -am test

  - |
    Frontend type-check:
      cd src/frontend && npm run check

  - |
    Run the Playwright suite WITHOUT the Keycloak gate
    (RUN_KEYCLOAK_TESTS unset). All non-Keycloak cases must
    still pass:
      cd src/frontend && npx playwright test

  - |
    Optional: run with the Keycloak gate to verify the new
    case end-to-end against the docker-compose Keycloak:
      ./scripts/dev-keycloak.sh &  # in another shell
      cd src/frontend && RUN_KEYCLOAK_TESTS=1 npx playwright test --grep keycloak

validation:
  - |
    Backend Keycloak module files exist:
      test -f src/backend/implementation/src/main/kotlin/io/pythia/auth/keycloak/KeycloakAuthModule.kt
      test -f src/backend/implementation/src/main/kotlin/io/pythia/auth/keycloak/KeycloakSecurityIdentityAugmentor.kt
  - |
    application.properties has a Keycloak block:
      grep -q "Keycloak" src/backend/implementation/src/main/resources/application.properties
  - |
    Frontend provider exists and is wired into the factory:
      test -f src/frontend/src/lib/auth/KeycloakAuthProvider.ts
      grep -q "KeycloakAuthProvider" src/frontend/src/lib/auth/index.ts
      ! grep -q "Provider 'keycloak' not yet wired up" src/frontend/src/lib/auth/index.ts
  - |
    keycloak-js is a dependency:
      grep -q "keycloak-js" src/frontend/package.json
  - |
    .env.example documents the Keycloak vars:
      grep -q "VITE_KEYCLOAK_BASE_URL" src/frontend/.env.example
      grep -q "VITE_KEYCLOAK_REALM" src/frontend/.env.example
      grep -q "VITE_KEYCLOAK_SPA_CLIENT_ID" src/frontend/.env.example
  - |
    Docker-compose + realm-import + dev script all exist:
      test -f docker-compose.keycloak.yml
      test -f docker/keycloak/realm-estimator.json
      test -x scripts/dev-keycloak.sh
  - |
    Documentation exists:
      test -f docs/keycloak-setup.md
      grep -q "Keycloak" CLAUDE.md
  - |
    Backend builds:
      mvn -pl src/backend/implementation -am test
  - |
    Frontend type-check passes:
      cd src/frontend && npm run check
  - |
    Playwright suite (Keycloak case skipped without
    RUN_KEYCLOAK_TESTS) passes:
      cd src/frontend && npx playwright test

