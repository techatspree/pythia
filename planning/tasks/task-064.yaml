id: task-064
phase: phase-11
title: Backend — session lifecycle service and REST API
depends_on: [task-062, task-063]
description: |
  The HTTP control plane for collaborative estimation sessions: a
  service that drives the two-phase Delphi lifecycle and a JAX-RS
  resource exposing it. Real-time push is a separate concern
  (task-065); here, every mutation persists state and returns the new
  session snapshot. Mutations also publish a domain event that the
  WebSocket layer (task-065) will subscribe to — define a thin
  in-process event hook now (a CDI event or a no-op publisher
  interface) so task-065 can plug in without touching this service.

  Lifecycle (per the user's description):
    1. Moderator creates a session from an estimation's DRAFT version +
       a chosen set of draft leaf logicalIds. Session starts in CREATED.
    2. Participants (authenticated estimators) join. Moderator starts
       the session (RUNNING); the first item enters PHASE1.
    3. PHASE1 (blind): each estimator submits a PERT-triple vote for the
       current item. Others' values are NOT returned during PHASE1 —
       the API only exposes the count of submitted votes. The moderator
       may edit the item's discussion_notes (broadcast as info).
    4. Moderator advances the current item to PHASE2 (reveal). All
       PHASE1 votes become visible; the API returns the per-vote list
       plus the aggregate (mean + spread + diverged flag) computed via
       the task-062 domain `VoteAggregation.aggregate(...)`. Estimators
       may submit a revised PHASE2 vote; participants mark `agreed`.
    5. Moderator finalizes the current item: the PHASE2 aggregate's mean
       triple (fall back to PHASE1 votes if no PHASE2 revisions exist)
       is written back onto the matching draft leaf
       (minEffort/expectedEffort/maxEffort) via the existing draft
       update path, the SessionItem is marked FINALIZED with its
       final_* values, all participants' `agreed` reset, and the session
       advances to the next item's PHASE1. After the last item the
       session becomes FINALIZED.

  Authorization (reuse the modular auth — CLAUDE.md):
    - All endpoints `@RolesAllowed` at least ESTIMATOR (ADMIN implied).
    - Moderator-only actions (start, edit notes, advance phase,
      finalize, cancel) additionally check that
      `CurrentUserProvider`'s subjectId equals the session's
      moderator_subject_id; otherwise 403.
    - Vote submission is allowed only for joined participants and only
      for the session's current item + current phase; reject otherwise
      with 409.

  Single-source-of-truth: aggregation/mean/spread is NEVER computed in
  the service — call `VoteAggregation.aggregate(votes.map { EstimatorVote(...) })`
  from the domain (task-062). The service only persists and maps. This
  direct call is the THREE_POINT_PERT reduction specifically; task-105
  later reroutes this exact call site through the session SPI
  (`EstimationMethodRegistry.requireSession(method).reduce(...)`) — add a
  one-line comment marking it so, consistent with task-062/063.

  REST surface — new SessionResource under
  src/backend/implementation/src/main/kotlin/io/pythia/rest/SessionResource.kt,
  base path `/api/sessions`:
    POST   /api/sessions
             body {estimationId, title, itemLogicalIds: string[]}
             → creates session (moderator = current user), returns
               SessionDto. 400 if any logicalId is not a draft leaf.
    GET    /api/sessions/{id}                 → SessionDto (role-scoped:
             hides other votes during PHASE1 for non-moderators)
    GET    /api/sessions?estimationId=…       → list sessions for an
             estimation
    POST   /api/sessions/{id}/join            → adds current user as
             ESTIMATOR participant (idempotent), returns SessionDto
    POST   /api/sessions/{id}/start           → moderator; CREATED→RUNNING
    PUT    /api/sessions/{id}/items/current/notes
             body {notes}                     → moderator; updates
               discussion_notes of the current item
    POST   /api/sessions/{id}/items/current/phase2   → moderator; reveal
    POST   /api/sessions/{id}/items/current/finalize → moderator; writes
               back + advances
    POST   /api/sessions/{id}/votes
             body {minEffort, expectedEffort, maxEffort}  → estimator;
               upserts the current-item current-phase vote
    POST   /api/sessions/{id}/agree           → estimator; toggles/sets
               agreed=true on current item
    POST   /api/sessions/{id}/cancel          → moderator; →CANCELLED

  DTOs (new file rest/dto/SessionDtos.kt): SessionDto (id, title,
  estimationId, status, moderatorSubjectId, currentItemIndex,
  currentPhase, items: SessionItemDto[], participants:
  ParticipantDto[]), SessionItemDto (nodeLogicalId, description copied
  from the draft leaf for display, position, status, discussionNotes,
  finalTriple?, submittedVoteCount, and — only when status==PHASE2 or
  FINALIZED — votes: VoteDto[] + aggregate: AggregateDto), VoteDto
  (participantSubjectId, displayName, triple, phase), AggregateDto
  (meanMin/meanExpected/meanMax, pertMean, expectedMin, expectedMax,
  range, stdDev, coefficientOfVariation, diverged, voterCount),
  ParticipantDto (subjectId, displayName, role, agreed).

  AggregateDto ← VoteAggregate field mapping (the domain names differ —
  it is NOT a verbatim 1:1): meanMin/meanExpected/meanMax/pertMean/
  expectedMin/expectedMax/diverged/voterCount map by name; `range` ←
  `expectedRange`, `stdDev` ← `expectedStdDev`, `coefficientOfVariation`
  ← `expectedCv`.

steps:
  - |
    Add the DTOs in
    src/backend/implementation/src/main/kotlin/io/pythia/rest/dto/SessionDtos.kt
    as plain Kotlin data classes (Jackson-serializable). AggregateDto
    maps 1:1 from the domain `VoteAggregate`.

  - |
    Add the lifecycle service
    src/backend/implementation/src/main/kotlin/io/pythia/service/EstimationSessionService.kt
    (`@ApplicationScoped`, `@Transactional` methods) implementing the
    lifecycle above on top of the task-063 repositories. The finalize
    method must reuse the existing draft update path (see
    service/EstimationVersionService.kt + DraftVersionMapper.kt) to set
    the draft leaf's three effort fields — do NOT write the
    draft_estimation_nodes table directly with ad-hoc SQL. (Going through
    the draft-update path records an undo-log entry, task-076 — the
    intended behaviour so a finalize is undoable.) Compute aggregates only
    via domain `VoteAggregation`. Log per the CLAUDE.md backend logging
    convention (reference: EstimationVersionService): `Log.info` on each
    lifecycle operation with the session + estimation id (create / start /
    reveal / finalize / cancel), `Log.debug` for finer detail (vote
    upserts), `Log.error` on failure paths.

  - |
    Define a minimal event publisher so task-065 can subscribe without
    editing the service: add
    service/SessionEventPublisher.kt (interface with
    `fun published(sessionId: String)`) and inject it into the service;
    provide a default CDI `@ApplicationScoped` no-op (or fire a CDI
    `Event<SessionChangedEvent>`). Call it at the end of every
    mutating method. Document which approach you chose in the file
    header so task-065 plugs into the same mechanism.

  - |
    Add the resource
    src/backend/implementation/src/main/kotlin/io/pythia/rest/SessionResource.kt
    with the endpoints + `@RolesAllowed` + moderator ownership checks +
    current-item/phase guards described above. Map service results to
    DTOs; role-scope the response (hide other votes during PHASE1 for
    non-moderators). Document every endpoint with MicroProfile OpenAPI
    annotations (`@Tag`, `@Operation`, `@APIResponse` + `@Content`/`@Schema`
    for the response DTO and the real status codes 400/403/409) — the
    repo convention (task-094; see EstimationVersionResource) so the
    generated openapi.json / frontend client (task-066) is complete.

  - |
    Add an integration test
    src/backend/implementation/src/test/kotlin/io/pythia/rest/SessionResourceIT.kt
    that drives a full happy path with the dev auth module: create a
    draft with ≥2 leaves, create a session over them, two participants
    join, start, both submit PHASE1 votes, moderator reveals (assert
    aggregate + diverged), an estimator revises in PHASE2, moderator
    finalizes (assert the draft leaf's effort fields now equal the
    aggregate mean and the session advanced). Add a 403 test for a
    non-moderator calling finalize, and a 409 for a vote in the wrong
    phase. NOTE: this is a MULTI-user flow — do NOT rely on the global
    DevAdminAuth spec; send a per-request `Authorization: Dev <subject>`
    header so distinct users act (e.g. dev-admin as moderator,
    dev-estimator as a second estimator). VIEWER-only users are rejected
    on the ESTIMATOR-gated writes.

  - |
    Update CLAUDE.md "REST API surface" section: add the
    `/api/sessions…` endpoints and a one-line note that aggregation is
    delegated to the domain `VoteAggregation`.

  - |
    Build + run backend tests (Docker required for Dev Services / Testcontainers):
      ./gradlew :backend:implementation:test

validation:
  - |
    Service, resource, DTOs and IT exist:
      test -f src/backend/implementation/src/main/kotlin/io/pythia/service/EstimationSessionService.kt
      test -f src/backend/implementation/src/main/kotlin/io/pythia/rest/SessionResource.kt
      test -f src/backend/implementation/src/main/kotlin/io/pythia/rest/dto/SessionDtos.kt
      test -f src/backend/implementation/src/test/kotlin/io/pythia/rest/SessionResourceIT.kt
  - |
    The resource exposes the session base path, is OpenAPI-annotated, and
    delegates aggregation to the domain (no hand-rolled averaging); the
    service logs at INFO:
      grep -q "/sessions" src/backend/implementation/src/main/kotlin/io/pythia/rest/SessionResource.kt
      grep -qE "@APIResponse|@Operation" src/backend/implementation/src/main/kotlin/io/pythia/rest/SessionResource.kt
      grep -q "VoteAggregation" src/backend/implementation/src/main/kotlin/io/pythia/service/EstimationSessionService.kt
      grep -q "Log.info" src/backend/implementation/src/main/kotlin/io/pythia/service/EstimationSessionService.kt
  - |
    CLAUDE.md documents the new endpoints:
      grep -q "/api/sessions" CLAUDE.md
  - |
    Backend builds and the session IT (happy path + 403 + 409) passes:
      ./gradlew :backend:implementation:test

