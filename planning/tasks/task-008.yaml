    `@Path("/api/...")` convention (verified at runtime — the
    project has NO global REST prefix; ProjectResource/
    EstimationResource hard-code `/api/...`), and is role-gated:
      test -f src/backend/implementation/src/main/kotlin/io/github/theestimator/rest/AdminPingResource.kt
      grep -q "@RolesAllowed" src/backend/implementation/src/main/kotlin/io/github/theestimator/rest/AdminPingResource.kt
      grep -q "ADMIN" src/backend/implementation/src/main/kotlin/io/github/theestimator/rest/AdminPingResource.kt
      grep -q "@Path(\"/api/admin\")" src/backend/implementation/src/main/kotlin/io/github/theestimator/rest/AdminPingResource.kt
  - |
