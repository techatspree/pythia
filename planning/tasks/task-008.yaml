    endpoint must live at `/api/auth/me`, not `/auth/me`:
      grep -q "@Path(\"/api/auth\")" src/backend/implementation/src/main/kotlin/io/github/theestimator/rest/MeResource.kt
  - |
    Dev module wires SecurityIdentity through Quarkus's standard
    HttpAuthenticationMechanism (verified at runtime — augmentors
    cannot access RoutingContext OR request-scoped beans because
    they run on the Vert.x event loop before request context is
    bound; the mechanism receives RoutingContext as a method
    parameter so this hazard disappears):
      test -f src/backend/implementation/src/main/kotlin/io/github/theestimator/auth/dev/DevHttpAuthMechanism.kt
      grep -q "HttpAuthenticationMechanism" src/backend/implementation/src/main/kotlin/io/github/theestimator/auth/dev/DevHttpAuthMechanism.kt
      grep -q "QuarkusSecurityIdentity.builder" src/backend/implementation/src/main/kotlin/io/github/theestimator/auth/dev/DevHttpAuthMechanism.kt
      grep -q "addRoles" src/backend/implementation/src/main/kotlin/io/github/theestimator/auth/dev/DevHttpAuthMechanism.kt
  - |
    Shared header parser exists and is gated to the dev provider:
      test -f src/backend/implementation/src/main/kotlin/io/github/theestimator/auth/dev/DevAuthHeaderParser.kt
      grep -q "resolveDevUser" src/backend/implementation/src/main/kotlin/io/github/theestimator/auth/dev/DevAuthHeaderParser.kt
  - |
    MeResource returns 401 (not throws/500) on null current:
      grep -q "UNAUTHORIZED\\|401" src/backend/implementation/src/main/kotlin/io/github/theestimator/rest/MeResource.kt
  - |
    Frontend role-guard component exists with the documented
    reactive pattern (NOT the captured-once `const acc = …`):
      test -f src/frontend/src/lib/auth/RequiredRole.svelte
      grep -q "\\\$state" src/frontend/src/lib/auth/RequiredRole.svelte
      ! grep -qE "const +acc *=" src/frontend/src/lib/auth/RequiredRole.svelte
  - |
    Auth e2e file exists with the five documented cases:
      test -f src/frontend/e2e/auth.test.ts
      grep -q "default-user fallback" src/frontend/e2e/auth.test.ts
      grep -q "dev-viewer" src/frontend/e2e/auth.test.ts
      grep -q "nope-not-a-user" src/frontend/e2e/auth.test.ts
      grep -q "admin/ping" src/frontend/e2e/auth.test.ts
  - |
    Documentation exists with both automated and manual sections,
    and the manual checklist now lists 401 (not 500) for the
