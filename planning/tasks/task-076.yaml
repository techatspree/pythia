id: task-076
phase: phase-12
title: Frontend store — undo/redo client + keyboard handler
depends_on: [task-075, task-094]
description: |
  Wire the backend Undo endpoints (task-075) into the SvelteKit app and
  expose them via a small, focused store + a global keyboard shortcut.
  This task is the plumbing layer; the visible GUI controls land in
  task-077.

  Where this lives: undo/redo operates on the DRAFT, which is edited in
  the grid on the VERSION EDITOR page —
  `src/frontend/src/routes/estimations/[id]/versions/[versionNumber]/+page.svelte`
  (that page imports `EstimationGrid`, computes `computeCalcMap`, holds
  the `draft`/roots `$state`, and runs the autosave `PUT …/versions/draft`).
  The undo store, the keyboard handler, and the grid tagging all live
  there — NOT on the estimation detail page `/estimations/[id]`.

  Types & HTTP (single-source, no hand-writing):
    - After task-094 the backend OpenAPI (and the frontend's regenerated
      `src/lib/api/schema.d.ts`) contain the `undo`/`redo`/`history` paths
      and the `EstimationVersionDto` / `MutationLogEntryDto` /
      `ConflictDetailsDto` schemas. Consume those GENERATED types
      (`components["schemas"]["…"]` from `$lib/api/schema`) — do NOT
      hand-write the DTO shapes (that would duplicate the wire contract;
      the backend DTO → OpenAPI → generated TS chain is the single source).
    - All HTTP goes through `apiFetch` from `$lib/api/fetch.ts` (the
      auth-aware wrapper — every request must carry the `Authorization`
      header, since the endpoints are `@RolesAllowed` per task-091). Do
      NOT use `src/lib/api/client.ts` — it is unused/dead code (no
      importers; slated for removal by the still-pending task-090), so this
      task has no real dependency on task-090.

  Target state:

  1. Confirm the generated `src/lib/api/schema.d.ts` (regenerated by
     task-094) exposes the undo paths + DTOs; if stale, re-sync the
     backend document and re-run `npm run gen:api`.

  2. New `src/frontend/src/lib/stores/undo.svelte.ts` exporting an
     `UndoStore` (a Svelte 5 runes class) with this shape (DTO types
     aliased from `components["schemas"]`):

       class UndoStore {
         estimationId: string                      // bound at construction
         history = $state<MutationLogEntryDto[]>([])
         loading = $state(false)
         conflict = $state<ConflictDetailsDto | null>(null)
         // Non-409 failure message; the editor page binds this to its
         // existing `bannerMessage` / <ErrorBanner> (see step 4).
         error = $state<string | null>(null)

         canUndo = $derived(this.history.some(e => e.status === "ACTIVE"))
         // redo target is the latest UNDONE entry; a later ACTIVE entry
         // supersedes it — mirror the backend redo-conflict rule.
         canRedo = $derived(…)

         async refresh(): Promise<void>            // GET /history via apiFetch
         async undo(): Promise<EstimationVersionDto | null>
         async redo(): Promise<EstimationVersionDto | null>
         clearConflict(): void
       }

     `undo`/`redo` POST via `apiFetch`; on a 409 they parse the body as
     `ConflictDetailsDto` and set `this.conflict` (no throw); ANY other
     failure surfaces via the shared `ErrorBanner` rule — `log.error(...)`
     (from `$lib/log.ts`) AND an ErrorBanner-bound state — per CLAUDE.md.

  3. Global Ctrl/Cmd+Z (undo) and Ctrl/Cmd+Shift+Z / Ctrl+Y (redo)
     handling in a new `src/frontend/src/lib/stores/undoKeyboard.svelte.ts`
     exporting `installUndoShortcuts(store: UndoStore): () => void`
     (returns a cleanup fn). Wire it from the version editor page's
     `onMount` / `$effect` so the listener is added/removed with the
     component lifecycle. Ignore the shortcut when the keydown target is a
     text `<input>` / `<textarea>` / contentEditable that is NOT a grid
     cell (don't fight native input undo); grid cells are tagged
     `data-undo-aware="true"` in `EstimationGrid.svelte`.

  4. The store does NOT own the draft state — the editor page already
     holds it and rerenders via `$derived(computeCalcMap(...))`. After
     undo/redo, the store returns the updated `EstimationVersionDto` and
     the page replaces its draft/roots `$state` with it (same as today's
     PUT handler). Update the version editor `+page.svelte` to:
       - construct one `UndoStore` for the route's `estimationId`,
       - `store.refresh()` after the initial draft load AND after every
         successful autosave PUT,
       - install/remove the keyboard listener,
       - on a non-null `undo()`/`redo()` result, replace the draft state.

  5. Logging — route all logs through `$lib/log.ts`; never bare
     `console.*`. ErrorBanner remains the user-facing surface for non-409
     failures.

  Out of scope:
    - Toolbar buttons, history panel, conflict dialog — task-077.
    - Optimistic local undo (always round-trips to the server here; a
      local stack can be added later without changing the public API).

steps:
  - |
    Confirm the generated client has the new surface (task-094 produced
    it). If `src/frontend/src/lib/api/schema.d.ts` lacks the undo paths,
    re-sync and regenerate:
      cp src/backend/implementation/target/openapi/openapi.json src/frontend/src/lib/api/openapi.json
      cd src/frontend && npm run gen:api
    Verify `src/lib/api/schema.d.ts` mentions `/versions/draft/undo`,
    `/versions/draft/redo`, `/versions/draft/history`, and the
    `MutationLogEntryDto` / `ConflictDetailsDto` schemas.

  - |
    Create `src/frontend/src/lib/stores/undo.svelte.ts` with the
    `UndoStore` class. Alias the DTO types from
    `import type { components } from '$lib/api/schema'`
    (`components['schemas']['MutationLogEntryDto']`, etc.). Do all HTTP via
    `apiFetch` from `$lib/api/fetch.ts`; log via `$lib/log.ts`; on non-409
    failure set `this.error` (the ErrorBanner-bound message) and
    `log.error(...)` — never a bare `console.*`.

  - |
    Create `src/frontend/src/lib/stores/undoKeyboard.svelte.ts` exporting
    `installUndoShortcuts(store)`. Handle Ctrl+Z / Cmd+Z (undo) and
    Ctrl+Shift+Z / Cmd+Shift+Z / Ctrl+Y (redo). Ignore when the event
    target is a text input/textarea/contentEditable that is not marked
    `data-undo-aware="true"`.

  - |
    Wire the store + shortcut into the VERSION EDITOR page
    `src/frontend/src/routes/estimations/[id]/versions/[versionNumber]/+page.svelte`:
      - instantiate `UndoStore` for the route's `estimationId`,
      - install/remove the shortcut listener in `onMount`/`$effect`,
      - `store.refresh()` after the initial draft load and after each
        successful autosave PUT,
      - on a non-null undo/redo result, replace the page's draft/roots
        state (reuse the existing `normalizeRoots` path used on load),
      - surface `store.error` through the page's existing `bannerMessage`
        / `<ErrorBanner>` (e.g. an `$effect` mirroring `store.error` into
        `bannerMessage`) so non-409 failures are user-visible.

  - |
    Tag the editable cells in `EstimationGrid.svelte` with
    `data-undo-aware="true"` so the keyboard handler treats them as part
    of the undo surface rather than native input undo.

  - |
    Add a Playwright e2e `src/frontend/e2e/undo.test.ts` (the codebase's
    only test mechanism — there is no vitest): open a draft in the editor,
    edit a leaf value, press Ctrl+Z and expect it to revert, press
    Ctrl+Shift+Z and expect it to re-apply. (The 409 conflict store-state
    is covered by the backend `UndoEndpointsIT` and becomes UI-assertable
    once task-077 adds the dialog.)

  - |
    Build + tests:
      ./gradlew :frontend:check          # type-check + ESLint (enforces the
                                         # no-bare-console rule this task relies on)
      # Playwright needs the dev stack running (./scripts/dev.sh + Docker,
      # dev backend on :8080 + Vite on :5173):
      cd src/frontend && npx playwright test undo

validation:
  - |
    Stores and wiring exist, on the editor page:
      test -f src/frontend/src/lib/stores/undo.svelte.ts
      test -f src/frontend/src/lib/stores/undoKeyboard.svelte.ts
      grep -q "UndoStore" src/frontend/src/lib/stores/undo.svelte.ts
      grep -q "installUndoShortcuts" src/frontend/src/lib/stores/undoKeyboard.svelte.ts
      grep -q "UndoStore" "src/frontend/src/routes/estimations/[id]/versions/[versionNumber]/+page.svelte"
      grep -q "apiFetch" src/frontend/src/lib/stores/undo.svelte.ts
  - |
    No dead client and no bare console.* (task-071 logging + task-090):
      ! grep -q "api/client" src/frontend/src/lib/stores/undo.svelte.ts
      ! grep -q "console\\." src/frontend/src/lib/stores/undo.svelte.ts
      ! grep -q "console\\." src/frontend/src/lib/stores/undoKeyboard.svelte.ts
  - |
    The editor page surfaces store errors via ErrorBanner:
      grep -q "store.error\|bannerMessage" "src/frontend/src/routes/estimations/[id]/versions/[versionNumber]/+page.svelte"
  - |
    Generated types include the undo surface, and the frontend gate passes:
      grep -q "/versions/draft/undo" src/frontend/src/lib/api/schema.d.ts
      ./gradlew :frontend:check

outputs:
  - created: src/frontend/src/lib/stores/undo.svelte.ts
  - created: src/frontend/src/lib/stores/undoKeyboard.svelte.ts
  - modified: src/frontend/src/routes/estimations/[id]/versions/[versionNumber]/+page.svelte
  - modified: src/frontend/src/lib/components/EstimationGrid.svelte
  - created: src/frontend/e2e/undo.test.ts
