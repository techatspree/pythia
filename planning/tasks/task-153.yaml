  - created: docs/images/
  - created: src/frontend/scripts/capture-screenshots.mjs
  - modified: src/frontend/package.json
  - created: docs/images/estimation-editor.png
  - created: docs/images/session-room.png
  - created: docs/images/version-compare.png
  - created: docs/images/bucket-editor.png
  - modified: docs/development.md
  - modified: CLAUDE.md
