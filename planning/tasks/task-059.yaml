id: task-059
phase: phase-9
title: Port EstimationGrid to the generic TreeTable component
depends_on: [task-058]
description: |
  task-058 delivered a generic, OmniOutliner-style `TreeTable` Svelte
  component. This task replaces the estimation-specific tree-table
  code (src/frontend/src/lib/components/EstimationGrid.svelte +
  src/frontend/src/lib/components/EstimationNodeRow.svelte) with
  usage of that component. The estimation editor becomes a thin
  caller: it declares the column shape, supplies per-cell snippets
  (which render the right editor on leaf rows and the right
  aggregate on group rows), and wires `onChildrenChange` into the
  existing autosave path.

  Current state (verified):
    - src/frontend/src/lib/components/EstimationGrid.svelte (~400
      lines): owns the roots dndzone, the grid template
      (`1.5rem 1fr 5rem 6rem 6rem 6rem 6rem 6rem 1fr 6rem 7rem 7rem`
      + ` 2rem` when editable), header row, totals row, autosave via
      onchange callback, cycle protection, addRootGroup helper.
      Calls `overrideItemIdKeyNameBeforeInitialisingDndZones('logicalId')`
      at module scope.
    - src/frontend/src/lib/components/EstimationNodeRow.svelte
      (~460 lines): recursive row rendering, per-group children
      dndzone, indent-guide-lines snippet, chevron, all per-leaf
      editors (description input, type select, phase select,
      minEffort/expectedEffort/maxEffort number inputs, derived PERT
      display, assumptions input, derived offerPT/cost/offerPrice),
      per-group title input, per-row "+ group" / "+ item" / delete
      buttons, data-testid="row-{pathKey}" on every row, and the
      keyboard cell-nav code (`data-cell="{pathKey(path)}-{col}"` +
      `onKeyDown` handler that walks Tab/Arrow between editors via
      `document.querySelector('[data-cell="…"]').focus()`).
    - The page passes `version`, `onchange`, and other props into
      EstimationGrid; nothing else in the page knows about row layout.
    - Domain Leaf shape: `{logicalId, type: 'FIXED'|'TIME_RELATIVE',
      description, minEffort, expectedEffort, maxEffort, assumptions,
      phaseAbbreviation, unit}`. Group shape:
      `{logicalId, type: 'GROUP', title, children: Node[]}`.
    - All 13 existing e2e cases in src/frontend/e2e/smoke.test.ts
      pass; 5 cases in src/frontend/e2e/tree-table.test.ts (task-058)
      pass against /dev/tree-table-demo.

  Target state:
    - EstimationGrid.svelte shrinks to ~250 lines: owns the column
      definitions, snippets for each estimation cell, wiring between
      TreeTable's onChildrenChange and the existing notify() path,
      addRootGroup + per-row add/delete handlers (passed via the
      `rowActions` snippet), keyboard cell-nav, and the totals
      footer snippet. It composes `<TreeTable>` instead of hand-
      rolling rows.
    - EstimationNodeRow.svelte is DELETED.
    - Column key/header/width mapping (matches existing English UI,
      do NOT translate to German in this task):
        key='description'  header='Description'  width='1fr'
        key='type'         header='Type'         width='5rem'
        key='phase'        header='Phase'        width='6rem'
        key='optimistic'   header='Optimistic'   width='6rem'  right
        key='likely'       header='Likely'       width='6rem'  right
        key='pessimistic'  header='Pessimistic'  width='6rem'  right
        key='pert'         header='PERT'         width='6rem'  right
        key='assumptions'  header='Assumptions'  width='1fr'
        key='offerPT'      header='offerPT (PT)' width='6rem'  right
        key='cost'         header='Cost (EUR)'   width='7rem'  right
        key='offerPrice'   header='Offer Price (EUR)' width='7rem' right
      Drag handle is auto-prepended by TreeTable when editable.
      Add/delete/+group/+item buttons go into the trailing rowActions
      cell. (Visual change: action buttons were mid-grid in the old
      layout — they move to the far right in the new layout. This is
      intentional UX cleanup.)
    - Cell-snippet semantics (Leaf fields: minEffort, expectedEffort,
      maxEffort, assumptions, phaseAbbreviation, type, description):
        * description: GROUP → editable text input bound to group's
          title (font-semibold); LEAF → editable text input bound to
          leaf's description.
        * type: GROUP → blank; LEAF → select with options
          'FIXED' (label 'Fixed') / 'TIME_RELATIVE' (label 'h/Woche')
          bound to leaf.type. Setting to TIME_RELATIVE also sets
          unit='h/Woche'; setting to FIXED clears unit.
        * phase: GROUP → blank; LEAF → select with options derived
          from `phases` prop, bound to leaf.phaseAbbreviation (the
          key is the phase's `abbreviation` field, not `id`).
        * optimistic: GROUP → blank; LEAF → number input bound to
          leaf.minEffort.
        * likely: GROUP → blank; LEAF → number input bound to
          leaf.expectedEffort.
        * pessimistic: GROUP → blank; LEAF → number input bound to
          leaf.maxEffort.
        * pert: GROUP → blank; LEAF → derived display
          `((minEffort + 4*expectedEffort + maxEffort) / 6).toFixed(2)`.
        * assumptions: GROUP → blank; LEAF → text input bound to
          leaf.assumptions.
        * offerPT/cost/offerPrice: GROUP and LEAF both read from
          calcMap.get(node.logicalId). LEAF additionally renders the
          existing `⚠ needs phase` amber warning when
          `leaf.type === 'TIME_RELATIVE' && !leaf.phaseAbbreviation`
          in the offerPT column.
        Visible display formats stay identical to today:
          offerPT  → toFixed(2)
          cost     → toFixed(0)
          offerPrice → toFixed(0)
          pert     → toFixed(2)
        Missing values render as '—' (not blank), matching today.
    - rowActions snippet (right-most cell):
        * GROUP → "+ group" button (text exactly "+ group"),
                  "+ item" button (text exactly "+ item"),
                  delete button (text "✕").
        * LEAF → delete button only.
      The exact text labels "+ group" and "+ item" matter — the
      existing smoke.test.ts uses `{hasText: '+ group'}` /
      `{hasText: '+ item'}` to locate them; do NOT shorten to "+G".
    - Footer snippet renders the totals row exactly as today:
      total optimistic / likely / pessimistic / PERT (summed across
      leaves), then total offerPT / cost / offerPrice (summed across
      calcMap.values()). It receives `roots: Node[]` from TreeTable;
      it closes over `calcMap` and helper functions from
      EstimationGrid's script.
    - Autosave: TreeTable's `onChildrenChange` callback fires twice
      per drop ('consider' + 'finalize'). EstimationGrid only calls
      `notify()` on 'finalize'. ('consider' updates are reflected
      visually because TreeTable's internal `roots` state is bound
      via `$bindable` — see next bullet.)
    - **TreeTable API change (in-scope for this task)**: today
      `TreeTable.svelte` snapshots `initialRoots` into internal
      `$state` once. That blocks EstimationGrid's add/delete buttons
      from updating the rendered tree (because they mutate
      EstimationGrid's `roots`, which TreeTable never re-reads). To
      fix this, change TreeTable's prop from `initialRoots: T[]` to
      `roots: T[]` and mark it `$bindable`, so the caller can write
      `<TreeTable bind:roots={roots} … />`. TreeTable's internal
      `$state` is replaced by a `bindable` $props binding. Update
      the existing demo at
      src/frontend/src/routes/dev/tree-table-demo/+page.svelte to use
      `bind:roots={roots}` accordingly. The five tree-table.test.ts
      cases must keep passing.
    - **TreeTable API change #2 (in-scope)**: add an optional
      `rowAttrs?: (node: T, ctx: TreeNodeContext<T>) => Record<string, string>`
      prop. If provided, TreeTable spreads the returned attribute
      bag onto the OUTER row wrapper (the same element that already
      carries `data-testid="tt-row-{getId(node)}"`). EstimationGrid
      uses this hook to attach `data-testid="row-{pathKey}"` to
      the outer row wrapper, keeping the existing smoke.test.ts
      selectors (`[data-testid="row-0"] button`) working unchanged.
      The spread comes AFTER the explicit `data-testid="tt-row-…"`
      in Svelte attribute order, so a caller that returns
      `data-testid` overrides the default — that's the intended
      behaviour for EstimationGrid.
    - Cycle protection is now OWNED by TreeTable (it never fires
      `phase: 'finalize'` for a cyclic move). EstimationGrid no
      longer needs preDragSnapshot, dragSourceId, cycleCheckPending,
      hasDuplicateIds, deepClone, applyZoneItems, handleZoneEvent,
      handleRootsConsider, handleRootsFinalize, the
      `overrideItemIdKeyNameBeforeInitialisingDndZones('logicalId')`
      module-scope call, or the `svelte-dnd-action` import — DELETE
      all of them from the file.
    - **Keyboard cell-nav** must continue to work (Tab/Arrow/Enter
      between editor cells). The hosting code currently lives in
      EstimationNodeRow.svelte (deleted). RE-HOST it inside
      EstimationGrid.svelte: keep the existing `data-cell=
      "{pathKey(path)}-{colIndex}"` attribute on each editable
      input/select (path comes from the snippet's `ctx.path`), and
      move the `onKeyDown(e, col)` + `focusCell` + `visibleLeafPathsInDoc`
      functions verbatim into EstimationGrid.svelte's script. The
      editCols index map stays `[0, 1, 2, 3, 5]` matching today
      (description, optimistic, likely, pessimistic, assumptions).
    - The existing 13 Playwright smoke cases plus the 5 tree-table
      cases must all pass without modification.

  Key design decisions (leave no ambiguity):
    - Identity for TreeTable.getId: return `node.logicalId`.
    - getChildren: `node.type === 'GROUP' ? node.children : null`.
    - treeColumnKey: `'description'`.
    - TypeScript discriminator: every snippet narrows on
      `node.type === 'GROUP'` (the data discriminator), NOT on
      `ctx.isGroup` (TypeScript will not narrow the `Node` union
      from a sibling boolean). For non-group branches access leaf
      fields directly.
    - Snippets are defined in EstimationGrid.svelte using Svelte 5
      `{#snippet name(node: Node, ctx: TreeNodeContext<Node>)} …
      {/snippet}` syntax with explicit parameter types (omitting
      them causes svelte-check `implicitly has an 'any' type`
      errors — same lesson as task-058 implementation).
    - `onchange` signature stays the current shape:
      `onchange: (roots: any[]) => void` (one positional arg, the
      serialized tree). Do NOT change to an object payload.
    - Aggregation source: `$derived` map from `version.calculated`
      via the same `calcMap` lookup the current EstimationGrid uses
      (no changes to how calcMap is computed or to its CalcEntry
      shape `{offerPT: number, cost: number, offerPrice: number}`).
      Group rows read `calcMap.get(node.logicalId)` directly in the
      snippet — no recursive summation outside the KMP domain.

  Out of scope (explicit):
    - KMP domain changes.
    - Backend or REST API changes.
    - TreeTable changes BEYOND the two listed above (`roots` becoming
      `$bindable`, and the new `rowAttrs` callback prop). If a third
      gap surfaces, stop and report — do NOT bolt features onto
      TreeTable unilaterally.
    - Modifying `src/frontend/e2e/smoke.test.ts` or
      `src/frontend/e2e/tree-table.test.ts`. Both must continue
      passing as-is.
    - UI translation (do not switch headers to German in this task).

steps:
  - |
    Read the current files end-to-end before editing:
      src/frontend/src/lib/components/EstimationGrid.svelte
      src/frontend/src/lib/components/EstimationNodeRow.svelte
      src/frontend/src/lib/components/treetable/TreeTable.svelte
      src/frontend/src/lib/components/treetable/types.ts
      src/frontend/src/routes/dev/tree-table-demo/+page.svelte
      src/frontend/e2e/smoke.test.ts (especially the DnD and tree-
        building cases, ~lines 290–430, to learn what selectors must
        keep working unchanged)

  - |
    Confirm nothing else imports EstimationNodeRow:
      grep -r "EstimationNodeRow" src/frontend/src --include="*.svelte" --include="*.ts"
    The only hit must be EstimationGrid.svelte (which is being
    rewritten). If anything else imports it, address that as part
    of this task.

  - |
    Extend TreeTable's API (the two in-scope changes from the
    description):

    A. Make `roots` a `$bindable` prop.
       - In src/frontend/src/lib/components/treetable/TreeTable.svelte,
         replace
             let { roots: initialRoots, … } = $props();
             let roots = $state<T[]>(initialRoots);
         with
             let { roots = $bindable(), … } = $props();
         (drop the local `$state` declaration; the bindable prop IS
         the reactive state.) All existing reads of `roots` inside
         the script and template stay unchanged.
       - In handleZoneEvent's cycle-check path, the
         `roots = preDragSnapshot;` restore stays valid because the
         bindable prop accepts writes.

    B. Add an optional `rowAttrs` prop:
       - In src/frontend/src/lib/components/treetable/types.ts,
         extend TreeTableProps<T> with:
           rowAttrs?: (node: T, ctx: TreeNodeContext<T>) => Record<string, string>;
       - In TreeTable.svelte, destructure `rowAttrs` from $props().
       - On the OUTER row wrapper inside the `renderRow` snippet
         (the element that already carries `data-testid=
         "tt-row-{getId(node)}"`), spread the attribute bag:
           {#snippet renderRow(node, path, depth)}
               {@const kids = getChildren(node)}
               {@const isGroup = kids != null}
               {@const ctx = makeCtx(node, depth, path, isGroup)}
               {@const extraAttrs = rowAttrs ? rowAttrs(node, ctx) : {}}
               <div data-testid="tt-row-{getId(node)}" {...extraAttrs}>
                   …rest unchanged…
           {/snippet}
         If `rowAttrs` returns a `data-testid`, the spread overrides
         the explicit one — EstimationGrid relies on that behaviour.

    Update the existing demo
    src/frontend/src/routes/dev/tree-table-demo/+page.svelte to use
    `bind:roots={roots}` instead of `roots={roots}` to match the new
    prop shape. Do NOT touch the demo's tree-table.test.ts cases —
    they must keep passing as written.

  - |
    Rewrite src/frontend/src/lib/components/EstimationGrid.svelte.
    Concrete shape (a complete sketch — adapt verbatim, do not
    invent fields):

      <script lang="ts">
          import TreeTable from './treetable/TreeTable.svelte';
          import type {
              TreeColumn,
              TreeNodeContext,
              ChildrenChangeEvent
          } from './treetable/types';

          export type Leaf = {
              logicalId: string;
              type: 'FIXED' | 'TIME_RELATIVE';
              description: string;
              minEffort: number | null;
              expectedEffort: number | null;
              maxEffort: number | null;
              assumptions: string | null;
              phaseAbbreviation: string | null;
              unit: string | null;
          };
          export type Group = {
              logicalId: string;
              type: 'GROUP';
              title: string;
              children: Node[];
          };
          export type Node = Leaf | Group;
          export type CalcEntry = { offerPT: number; cost: number; offerPrice: number };

          let {
              version,
              editable,
              onchange,
              calcMap = new Map<string, CalcEntry>(),
              phases = []
          }: {
              version: any;
              editable: boolean;
              onchange: (roots: any[]) => void;     // positional, NOT an object
              calcMap?: Map<string, CalcEntry>;
              phases?: any[];
          } = $props();

          // === init / serialize / pathKey / pert / newId / nodeAt ===
          // Copy verbatim from the current EstimationGrid.svelte.

          let roots = $state<Node[]>(initRoots(version));

          function getId(n: Node): string { return n.logicalId; }
          function getChildren(n: Node): Node[] | null {
              return n.type === 'GROUP' ? n.children : null;
          }

          function notify() { onchange(serialize(roots)); }

          function handleChildrenChange(e: ChildrenChangeEvent<Node>) {
              // TreeTable already wrote the new children via $bindable,
              // so `roots` reflects the change. Only finalize triggers
              // autosave; consider is visual-only.
              if (e.phase === 'finalize') notify();
          }

          function addRootGroup() {
              roots = [
                  ...roots,
                  { logicalId: newId(), type: 'GROUP', title: 'New group',
                    children: [ { logicalId: newId(), type: 'FIXED',
                                  description: '', minEffort: null,
                                  expectedEffort: null, maxEffort: null,
                                  assumptions: null,
                                  phaseAbbreviation: null, unit: null } ] }
              ];
              notify();
          }
          function addChildGroupAt(path: number[]) {
              const g = nodeAt(path) as Group;
              g.children = [ ...g.children,
                  { logicalId: newId(), type: 'GROUP', title: 'New group',
                    children: [] } ];
              roots = [...roots];   // force TreeTable's bindable to see the change
              notify();
          }
          function addChildLeafAt(path: number[]) {
              const g = nodeAt(path) as Group;
              g.children = [ ...g.children,
                  { logicalId: newId(), type: 'FIXED', description: '',
                    minEffort: null, expectedEffort: null, maxEffort: null,
                    assumptions: null, phaseAbbreviation: null, unit: null } ];
              roots = [...roots];
              notify();
          }
          function deleteAt(path: number[]) {
              if (path.length === 0) return;
              const parentPath = path.slice(0, -1);
              const idx = path[path.length - 1];
              if (parentPath.length === 0) {
                  roots = roots.filter((_, i) => i !== idx);
              } else {
                  const g = nodeAt(parentPath) as Group;
                  g.children = g.children.filter((_, i) => i !== idx);
                  roots = [...roots];
              }
              notify();
          }

          // === Aggregation totals for the footer ===
          // Copy the existing $derived totals (totalOpt, totalLik,
          // totalPes, totalExp, totalOfferPT, totalCost, totalOfferPrice)
          // verbatim — they already read from `roots` + calcMap.

          // === Keyboard cell-nav (rehosted from the deleted
          //     EstimationNodeRow.svelte) ===
          const editCols = [0, 1, 2, 3, 5];
          function focusCell(p: number[], col: number) {
              (document.querySelector(
                  `[data-cell="${pathKey(p)}-${col}"]`
              ) as HTMLElement)?.focus();
          }
          function visibleLeafPathsInDoc(): number[][] {
              const inputs = Array.from(
                  document.querySelectorAll('[data-cell$="-0"]')
              ) as HTMLElement[];
              return inputs.map((el) => {
                  const key = el.getAttribute('data-cell')!.replace(/-0$/, '');
                  return key.split('-').map((s) => parseInt(s, 10));
              });
          }
          function onKeyDown(e: KeyboardEvent, path: number[], col: number) {
              // Copy the existing handler body verbatim from the
              // current EstimationNodeRow.svelte (Tab / Shift+Tab,
              // Enter, ArrowUp/Down/Left/Right between cells). The
              // body already uses pathKey(path) so passing the path
              // explicitly as a parameter (instead of closing over
              // `path` like the old recursive component did) is the
              // only change.
          }

          // === Columns ===
          const columns: TreeColumn<Node>[] = [
              { key: 'description', header: 'Description', width: '1fr',
                cell: descriptionCell },
              { key: 'type',        header: 'Type',        width: '5rem',
                cell: typeCell },
              { key: 'phase',       header: 'Phase',       width: '6rem',
                cell: phaseCell },
              { key: 'optimistic',  header: 'Optimistic',  width: '6rem',
                align: 'right', cell: optimisticCell },
              { key: 'likely',      header: 'Likely',      width: '6rem',
                align: 'right', cell: likelyCell },
              { key: 'pessimistic', header: 'Pessimistic', width: '6rem',
                align: 'right', cell: pessimisticCell },
              { key: 'pert',        header: 'PERT',        width: '6rem',
                align: 'right', cell: pertCell },
              { key: 'assumptions', header: 'Assumptions', width: '1fr',
                cell: assumptionsCell },
              { key: 'offerPT',     header: 'offerPT (PT)', width: '6rem',
                align: 'right', cell: offerPTCell },
              { key: 'cost',        header: 'Cost (EUR)',   width: '7rem',
                align: 'right', cell: costCell },
              { key: 'offerPrice',  header: 'Offer Price (EUR)', width: '7rem',
                align: 'right', cell: offerPriceCell },
          ];

          // === Legacy testid hook ===
          // EstimationGrid still uses `data-testid="row-{pathKey}"` so
          // the existing smoke.test.ts selectors keep working without
          // any edits.
          function legacyRowAttrs(node: Node, ctx: TreeNodeContext<Node>) {
              return { 'data-testid': `row-${pathKey(ctx.path)}` };
          }
      </script>

      <TreeTable
          bind:roots={roots}
          columns={columns}
          getId={getId}
          getChildren={getChildren}
          treeColumnKey="description"
          editable={editable}
          onChildrenChange={handleChildrenChange}
          rowActions={rowActionsSnippet}
          rowAttrs={legacyRowAttrs}
          footer={totalsFooter}
      />

      {#if editable}
          <div class="p-3 border-t bg-gray-50/40">
              <button onclick={addRootGroup}
                      class="text-sm text-brand-green hover:text-[#007a45]">
                  + Add group
              </button>
          </div>
      {/if}

      {#snippet descriptionCell(node: Node, ctx: TreeNodeContext<Node>)}
          {#if node.type === 'GROUP'}
              <input type="text"
                     class="bg-transparent font-semibold focus:outline-none focus:bg-brand-green/5 focus:ring-1 focus:ring-brand-green/40 rounded px-1 py-0.5"
                     value={node.title}
                     oninput={(e) => { node.title = e.currentTarget.value; notify(); }} />
              <span class="ml-2 text-xs font-normal text-gray-400">
                  {node.children.length} child{node.children.length !== 1 ? 'ren' : ''}
              </span>
          {:else}
              <input type="text"
                     class="bg-transparent focus:outline-none focus:bg-brand-green/5 focus:ring-1 focus:ring-brand-green/40 rounded px-1 py-0.5"
                     value={node.description}
                     data-cell="{pathKey(ctx.path)}-0"
                     onkeydown={(e) => onKeyDown(e, ctx.path, 0)}
                     oninput={(e) => { node.description = e.currentTarget.value; notify(); }} />
          {/if}
      {/snippet}

      {#snippet typeCell(node: Node, _ctx: TreeNodeContext<Node>)}
          {#if node.type !== 'GROUP'}
              <select class="w-full bg-transparent text-xs focus:outline-none focus:ring-1 focus:ring-brand-green/40 rounded px-1 py-0.5"
                      value={node.type}
                      onchange={(e) => {
                          const v = e.currentTarget.value;
                          node.type = v === 'TIME_RELATIVE' ? 'TIME_RELATIVE' : 'FIXED';
                          node.unit = v === 'TIME_RELATIVE' ? 'h/Woche' : null;
                          notify();
                      }}>
                  <option value="FIXED">Fixed</option>
                  <option value="TIME_RELATIVE">h/Woche</option>
              </select>
          {/if}
      {/snippet}

      {#snippet phaseCell(node: Node, _ctx: TreeNodeContext<Node>)}
          {#if node.type !== 'GROUP'}
              <select class="w-full bg-transparent text-sm focus:outline-none focus:ring-1 focus:ring-brand-green/40 rounded px-1 py-0.5"
                      value={node.phaseAbbreviation ?? ''}
                      onchange={(e) => {
                          node.phaseAbbreviation = e.currentTarget.value === '' ? null : e.currentTarget.value;
                          notify();
                      }}>
                  <option value="">— none —</option>
                  {#each phases as p}
                      <option value={p.abbreviation}>{p.abbreviation}</option>
                  {/each}
              </select>
          {/if}
      {/snippet}

      {#snippet optimisticCell(node: Node, ctx: TreeNodeContext<Node>)}
          {#if node.type !== 'GROUP'}
              <input type="number" step="0.1" min="0"
                     class="w-full text-right bg-transparent focus:outline-none focus:bg-brand-green/5 focus:ring-1 focus:ring-brand-green/40 rounded px-1 py-0.5"
                     value={node.minEffort ?? ''}
                     data-cell="{pathKey(ctx.path)}-1"
                     onkeydown={(e) => onKeyDown(e, ctx.path, 1)}
                     oninput={(e) => {
                         const v = e.currentTarget.value;
                         node.minEffort = v === '' ? null : parseFloat(v);
                         notify();
                     }} />
          {/if}
      {/snippet}
      <!-- likelyCell (col 2 → expectedEffort), pessimisticCell (col 3 → maxEffort)
           follow the same pattern with the right data-cell index. -->

      {#snippet pertCell(node: Node, _ctx: TreeNodeContext<Node>)}
          {#if node.type !== 'GROUP'}
              <span class="text-right text-brand-green tabular-nums">
                  {pert(node.minEffort, node.expectedEffort, node.maxEffort).toFixed(2)}
              </span>
          {/if}
      {/snippet}

      {#snippet assumptionsCell(node: Node, ctx: TreeNodeContext<Node>)}
          {#if node.type !== 'GROUP'}
              <input type="text"
                     class="w-full bg-transparent focus:outline-none focus:bg-brand-green/5 focus:ring-1 focus:ring-brand-green/40 rounded px-1 py-0.5"
                     value={node.assumptions ?? ''}
                     placeholder="…"
                     data-cell="{pathKey(ctx.path)}-5"
                     onkeydown={(e) => onKeyDown(e, ctx.path, 5)}
                     oninput={(e) => {
                         node.assumptions = e.currentTarget.value || null;
                         notify();
                     }} />
          {/if}
      {/snippet}

      {#snippet offerPTCell(node: Node, _ctx: TreeNodeContext<Node>)}
          {@const calc = calcMap.get(node.logicalId)}
          {#if node.type !== 'GROUP' && node.type === 'TIME_RELATIVE' && !node.phaseAbbreviation}
              <span class="text-amber-500 text-xs">⚠ needs phase</span>
          {:else}
              <span class="text-right text-gray-600 tabular-nums">
                  {calc != null ? calc.offerPT.toFixed(2) : '—'}
              </span>
          {/if}
      {/snippet}

      {#snippet costCell(node: Node, _ctx: TreeNodeContext<Node>)}
          {@const calc = calcMap.get(node.logicalId)}
          <span class="text-right text-gray-600 tabular-nums">
              {calc != null ? calc.cost.toFixed(0) : '—'}
          </span>
      {/snippet}

      {#snippet offerPriceCell(node: Node, _ctx: TreeNodeContext<Node>)}
          {@const calc = calcMap.get(node.logicalId)}
          <span class="text-right text-gray-600 tabular-nums">
              {calc != null ? calc.offerPrice.toFixed(0) : '—'}
          </span>
      {/snippet}

      {#snippet rowActionsSnippet(node: Node, ctx: TreeNodeContext<Node>)}
          {#if node.type === 'GROUP'}
              <button onclick={() => addChildGroupAt(ctx.path)}
                      class="text-xs text-brand-green hover:text-[#007a45] mr-1"
                      title="Add child group">+ group</button>
              <button onclick={() => addChildLeafAt(ctx.path)}
                      class="text-xs text-brand-green hover:text-[#007a45] mr-1"
                      title="Add child item">+ item</button>
          {/if}
          <button onclick={() => deleteAt(ctx.path)}
                  class="text-gray-300 hover:text-red-500 transition-colors leading-none"
                  title="Delete" aria-label="Delete row">✕</button>
      {/snippet}

      {#snippet totalsFooter(_allRoots: Node[])}
          <!-- Render a grid row mirroring the data columns, with
               cells for totalOpt / totalLik / totalPes / totalExp /
               totalOfferPT / totalCost / totalOfferPrice (all using
               the existing $derived totals from the script block). -->
      {/snippet}

