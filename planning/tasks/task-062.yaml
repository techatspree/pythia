id: task-062
phase: phase-11
title: Domain — estimator-vote aggregation math (KMP)
depends_on: [task-055]
description: |
  First task of the collaborative-estimation-session feature
  (Wideband-Delphi-style group estimation). This task adds the pure
  aggregation math to the KMP domain so that BOTH the backend
  (finalize write-back) and the frontend (live phase-2 display) call
  into one implementation — per the single-source-of-truth rule in
  CLAUDE.md. No persistence, REST, or UI here.

  Domain decisions already made for the whole feature:
    - Each estimator submits a full PERT triple per item
      (minEffort / expectedEffort / maxEffort) — the same shape
      EstimationItem already uses.
    - The final per-item estimate is the arithmetic MEAN of the
      estimators' triples, field by field.
    - Phase 2 must also surface the SPREAD so the moderator can see
      when estimates "differ too strongly".

  Current state:
    - src/domain holds all business math (PERT in
      model/PertCalculation.kt, accumulation on EstimationNode). There
      is nothing about multi-estimator aggregation.

  Target state — add to
  src/domain/src/main/kotlin/io/github/theestimator/model/:
    - A small value type `EstimatorVote(minEffort, expectedEffort,
      maxEffort)` (a `@JsExport @DomainEntity data class` of three
      Doubles).
    - A `VoteAggregate` result type carrying, per field and overall:
        meanMin, meanExpected, meanMax        (the averaged triple)
        the PERT mean of the averaged triple  (reuse PertCalculation.mean)
        spread metrics: for the field that drives convergence (use
          `expectedEffort`), min, max, range (max-min), sample standard
          deviation, and coefficient of variation (stdDev / mean, 0.0
          when mean == 0)
        `diverged: Boolean` — true when the coefficient of variation of
          expectedEffort exceeds a threshold constant
          `DIVERGENCE_CV_THRESHOLD = 0.20` (documented; 20% CV).
        `voterCount: Int`
    - An object `VoteAggregation` with
        `fun aggregate(votes: List<EstimatorVote>): VoteAggregate`
      that computes the above. Empty list → a zeroed aggregate with
      voterCount 0 and diverged false (never divide by zero).
    - Everything `@JsExport`-ed so the frontend can call it via the
      Kotlin/JS bundle (adapter.ts pattern).

  Kotlin/JS constraints to respect (from CLAUDE.md):
    - Do NOT call `super.<computed property>` anywhere — irrelevant here
      (no inheritance) but keep the rule in mind if you reuse getters.
    - `@JsExport` data classes: if you add a secondary constructor it
      needs `@JsName`; prefer a single primary constructor with
      defaults. Avoid two constructors whose params erase to the same
      JVM signature.
    - Use Double arithmetic only; no java.* APIs (must compile to JS).
      Standard deviation: compute with kotlin stdlib
      (`sumOf`, `kotlin.math.sqrt`).

steps:
  - |
    Add src/domain/src/main/kotlin/io/github/theestimator/model/EstimatorVote.kt
    with the `@JsExport @DomainEntity data class EstimatorVote(
    val minEffort: Double, val expectedEffort: Double,
    val maxEffort: Double)`.

  - |
    Add src/domain/src/main/kotlin/io/github/theestimator/model/VoteAggregation.kt
    containing the `VoteAggregate` data class (fields listed in the
    description), the `DIVERGENCE_CV_THRESHOLD` constant, and the
    `VoteAggregation` object with `aggregate(votes)`. Reuse
    `PertCalculation.mean(...)` for the PERT mean of the averaged
    triple. Sample standard deviation uses (n-1) denominator when
    n > 1, else 0.0.

  - |
    Add unit tests
    src/domain/src/test/kotlin/io/github/theestimator/model/VoteAggregationTest.kt
    covering: empty list → zeroed/voterCount 0/diverged false; single
    vote → that vote, CV 0, not diverged; several close votes → not
    diverged; a clear outlier pushing CV above 0.20 → diverged true;
    field-wise mean correctness.

  - |
    Build the domain and verify the TypeScript bundle still type-checks
    against the frontend (the new exports must round-trip to JS):
      mvn -pl src/domain -am test
      cd src/frontend && npm run check

validation:
  - |
    The two source files and the test exist:
      test -f src/domain/src/main/kotlin/io/github/theestimator/model/EstimatorVote.kt
      test -f src/domain/src/main/kotlin/io/github/theestimator/model/VoteAggregation.kt
      test -f src/domain/src/test/kotlin/io/github/theestimator/model/VoteAggregationTest.kt
  - |
    The aggregation and threshold are present and exported:
      grep -q "object VoteAggregation" src/domain/src/main/kotlin/io/github/theestimator/model/VoteAggregation.kt
      grep -q "DIVERGENCE_CV_THRESHOLD" src/domain/src/main/kotlin/io/github/theestimator/model/VoteAggregation.kt
      grep -q "@JsExport" src/domain/src/main/kotlin/io/github/theestimator/model/EstimatorVote.kt
  - |
    Domain tests pass and the frontend still type-checks against the
    regenerated bundle:
      mvn -pl src/domain -am test
      cd src/frontend && npm run check

outputs:
  - created: src/domain/src/main/kotlin/io/github/theestimator/model/EstimatorVote.kt
  - created: src/domain/src/main/kotlin/io/github/theestimator/model/VoteAggregation.kt
  - created: src/domain/src/test/kotlin/io/github/theestimator/model/VoteAggregationTest.kt
