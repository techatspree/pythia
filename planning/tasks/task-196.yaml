        `minikube-deploy.sh`'s `envsubst` from `scripts/minikube-env.sh`, and
        why its default is `localhost:5000` (the node-side proxy of the
        registry addon).
  - |
    Test the node-side pull BEFORE rewriting any script (see the
    description):
      minikube start && minikube addons enable registry
      kubectl -n kube-system rollout status ds/registry-proxy --timeout=120s
      kubectl -n kube-system port-forward svc/registry 5005:80 &  PF=$!
      ./gradlew :frontend:imageBuild -PfrontendImagePush=true -PfrontendImageRegistry=localhost:5005
      minikube ssh -- docker pull localhost:5000/pythia/pythia-frontend:1.0.0-SNAPSHOT
      minikube ssh -- docker image inspect localhost:5000/pythia/pythia-frontend:1.0.0-SNAPSHOT --format '{{.Architecture}}'
      kill $PF
    The pull must succeed and print the node's native architecture. If it
    fails, switch to the `$(minikube ip):5000` fallback from the description
