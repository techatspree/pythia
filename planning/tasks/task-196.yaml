        gains that pushed images are multi-arch (amd64 + arm64) and that the
        local cluster pulls them from its registry addon.
      * `docs/entra-setup.md` minikube section: steps become "enable the
        registry addon, port-forward it to 5005, push both images, the node
        pulls from `localhost:5000`". Drop the `docker save | docker load`
        and `minikube image load` explanation, and mention port 5000 vs
        AirPlay.
      * `src/frontend/CLAUDE.md` "Container image": platforms depend on
        push, and the table row for `frontendImagePush` says so.
      * Root `CLAUDE.md`, "Licence and namespace": the backend base is
        pinned to its multi-arch INDEX digest, not a single-platform
        manifest, and why.
      * Grep for `docker load`, `minikube image load`, `imagePullPolicy:
        Never` and `linux/amd64` outside `planning/` afterwards. Each
        remaining hit must be deliberate (the daemon default) and commented.
  - |
    Verify locally (Docker running; this host is arm64):
      docker run -d --rm --name reg196 -p 5005:5000 registry:2
      ./gradlew :backend:implementation:quarkusAppPartsBuild --rerun \
        :backend:implementation:imageBuild -Dquarkus.container-image.push=true \
        -Dquarkus.container-image.registry=localhost:5005 -Dquarkus.container-image.insecure=true \
        --no-build-cache -x test
      ./gradlew :frontend:imageBuild -PfrontendImagePush=true -PfrontendImageRegistry=localhost:5005
    Both indexes must list linux/amd64 and linux/arm64 (the curl/jq check
    above). Then prove each variant is what it claims, for both platforms:
      for p in linux/arm64 linux/amd64; do
        docker run --rm --platform $p --entrypoint uname localhost:5005/pythia/pythia-backend:1.0.0-SNAPSHOT -m
        docker run --rm --platform $p --entrypoint java  localhost:5005/pythia/pythia-backend:1.0.0-SNAPSHOT -version
        docker run --rm --platform $p --entrypoint uname localhost:5005/pythia/pythia-frontend:1.0.0-SNAPSHOT -m
      done
    The expected results are `aarch64` and `x86_64`, and `java -version`
    succeeds on both. Run the arm64 frontend with
    `-p 18080:80 --platform linux/arm64` and repeat task-195's probe:
    `/` serves index.html, `/config.json` returns 404, and an SPA route
    returns 200. Finally confirm the daemon fallback is unchanged:
    `./gradlew :frontend:imageBuild` loads an `amd64` image. Stop
    `reg196`.
  - |
    Verify the minikube registry path (minikube installed, docker driver):
      minikube start
      minikube addons enable registry
    then run `scripts/minikube-deploy.sh` with the `ENTRA_*` variables set
    (source them from the workspace's `EntraIdVariables.sh`; never print
    them). Afterwards both pods are Running, the script's freshness check
    reports a match, and
      minikube ssh -- docker image inspect localhost:5000/pythia/pythia-frontend:1.0.0-SNAPSHOT --format '{{.Architecture}}'
    prints the node's native architecture (`arm64` on this Mac). Then prove
    the ephemeral-registry case: `./scripts/minikube-reset.sh`,
    `./scripts/minikube-setup.sh`, and `./scripts/minikube-deploy.sh` again
    with NO code change. Both pods must reach Running, not
    `ImagePullBackOff`. If the
    `ENTRA_*` values are unavailable, verify the registry half alone (addon,
    port-forward, push, then the `minikube ssh -- docker pull` and inspect
    above) and report the full deploy as not exercised.
  - |
    ./gradlew build

validation:
  - |
    P=src/backend/implementation/gradle.properties
    grep -q 'quarkus.jib.base-jvm-image=registry.access.redhat.com/ubi9/openjdk-21-runtime@sha256:360822c35c5741f542ab78fe123e6c4d9b68e0113a88d6e0250bb1f377b17f29' "$P"
    grep -qx 'quarkus.jib.platforms=linux/amd64' "$P"
    grep -q 'linux/amd64,linux/arm64' src/backend/implementation/build.gradle.kts
    grep -q 'imagePush' src/backend/implementation/build.gradle.kts
    grep -q 'Platform("arm64", "linux")' src/frontend/build.gradle.kts
  - |
    # Staging/production render the same as before, except that no patch is
    # needed. The rendered pull policy must be IfNotPresent for every
    # container that had one.
    for o in staging production; do
      git show HEAD:k8s/base/backend/deployment.yaml > /dev/null || exit 1
      d=$(mktemp -d); git archive HEAD k8s | tar -x -C "$d"
      diff <(kubectl kustomize "$d/k8s/overlays/$o") <(kubectl kustomize "k8s/overlays/$o") \
        || { echo "$o overlay renders differently after the change"; rm -rf "$d"; exit 1; }
      rm -rf "$d"
    done
  - |
    ! grep -rn "imagePullPolicy: Never" k8s
    for o in staging production; do
      kubectl kustomize k8s/overlays/$o > /dev/null || exit 1
    done
    REG=$(bash -c '. scripts/minikube-env.sh && printf %s "$MINIKUBE_IMAGE_REGISTRY"')
    # Fallback mode leaves the default empty; resolve it as the deploy does
    # (needs a running cluster).
    [ -n "$REG" ] || REG="$(minikube ip):5000"
    test -n "$REG"
    R=$(kubectl kustomize k8s/overlays/minikube | MINIKUBE_IMAGE_REGISTRY="$REG" envsubst '${MINIKUBE_IMAGE_REGISTRY}')
    echo "$R" | grep -q "image: $REG/pythia/pythia-backend"
    echo "$R" | grep -q "image: $REG/pythia/pythia-frontend"
    ! echo "$R" | grep -q 'MINIKUBE_IMAGE_REGISTRY'
    test "$(kubectl kustomize k8s/overlays/minikube | grep -c 'imagePullPolicy: Always')" -eq 2
  - |
    for S in scripts/minikube-setup.sh scripts/minikube-reset.sh scripts/minikube-deploy.sh; do
      bash -n "$S" || exit 1
      ! command -v shellcheck >/dev/null || shellcheck "$S" || exit 1
    done
    grep -q "addons enable registry" scripts/minikube-setup.sh
    grep -q 'port-forward svc/registry ${MINIKUBE_REGISTRY_HOST_PORT}:80' scripts/minikube-reset.sh
    S=scripts/minikube-deploy.sh
    ! grep -q "docker load" "$S"
    grep -q "addons enable registry" "$S"
    grep -q 'port-forward svc/registry "${MINIKUBE_REGISTRY_HOST_PORT}:80"' "$S"
    grep -q "quarkusAppPartsBuild --rerun" "$S"
  - |
    grep -q "registry:2" .github/workflows/ci.yaml
    grep -q "linux/arm64" .github/workflows/ci.yaml
    ruby -ryaml -e 'YAML.load_file(".github/workflows/ci.yaml")'
  - |
    docker rm -f reg196v > /dev/null 2>&1 || true
    docker run -d --rm --name reg196v -p 5006:5000 registry:2 && sleep 2
    ./gradlew :backend:implementation:quarkusAppPartsBuild --rerun \
      :backend:implementation:imageBuild -Dquarkus.container-image.push=true \
      -Dquarkus.container-image.registry=localhost:5006 -Dquarkus.container-image.insecure=true \
      --no-build-cache -x test
    ./gradlew :frontend:imageBuild -PfrontendImagePush=true -PfrontendImageRegistry=localhost:5006
    for img in pythia-backend pythia-frontend; do
      curl -fsS -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
        "http://localhost:5006/v2/pythia/$img/manifests/1.0.0-SNAPSHOT" \
        | jq -e '[.manifests[].platform | "\(.os)/\(.architecture)"] | (index("linux/amd64") != null and index("linux/arm64") != null)' \
        || { docker stop reg196v; exit 1; }
    done
    test "$(docker run --rm --platform linux/arm64 --entrypoint uname localhost:5006/pythia/pythia-backend:1.0.0-SNAPSHOT -m)" = aarch64
    test "$(docker run --rm --platform linux/arm64 --entrypoint uname localhost:5006/pythia/pythia-frontend:1.0.0-SNAPSHOT -m)" = aarch64
    docker stop reg196v
  - |
    ./gradlew :frontend:imageBuild
    test "$(docker image inspect pythia/pythia-frontend:1.0.0-SNAPSHOT --format '{{.Architecture}}')" = amd64
  - |
    E=scripts/minikube-env.sh
    test -f "$E" && test ! -x "$E"
    bash -n "$E" && { ! command -v shellcheck >/dev/null || shellcheck "$E"; }
    ! grep -qE '^\s*export\b' "$E"
    ! grep -qiE 'ENTRA_|password|secret|token' "$E"
    ! bash "$E" > /dev/null 2>&1
    for S in scripts/minikube-setup.sh scripts/minikube-deploy.sh scripts/minikube-reset.sh; do
      grep -q 'minikube-env.sh' "$S" || { echo "$S does not source minikube-env.sh"; exit 1; }
    done
    # Code lines only: comments may name the defaults (see the description).
    for S in scripts/minikube-setup.sh scripts/minikube-deploy.sh scripts/minikube-reset.sh; do
      if grep -vE '^\s*#' "$S" | grep -nE -- '-n estimation|5005|localhost:5000|1\.0\.0-SNAPSHOT|--cpus=4'; then
        echo "$S hard-codes a value that belongs in scripts/minikube-env.sh"; exit 1
      fi
    done
    ( . "$E"
      test "$MINIKUBE_NAMESPACE" = "$(grep -m1 -oE 'namespace: [a-z-]+' k8s/base/kustomization.yaml | awk '{print $2}')" \
        || { echo "MINIKUBE_NAMESPACE disagrees with k8s/base"; exit 1; }
      grep -q "version = \"$MINIKUBE_IMAGE_TAG\"" build.gradle.kts \
        || { echo "MINIKUBE_IMAGE_TAG disagrees with the Gradle version"; exit 1; } )
    test "$(MINIKUBE_CPUS=7 bash -c '. scripts/minikube-env.sh && echo $MINIKUBE_CPUS')" = 7
  - |
    grep -q "minikube-env.sh" docs/development.md
    grep -q "addons enable registry" docs/development.md
    grep -q "5005" docs/development.md
    grep -q "arm64" docs/development.md
    grep -q "arm64" docs/architecture.md
  - |
    ! grep -rnE "docker load|minikube image load" --exclude-dir=node_modules --exclude-dir=build --exclude-dir=planning --exclude-dir=.git --exclude-dir=.gradle .
  - |
    ./gradlew build

