id: task-196
phase: phase-7
title: "Multi-arch images (amd64+arm64) delivered via a registry"
depends_on: [task-195]
description: |
  Both container images are `linux/amd64` only: the backend through
  `quarkus.jib.platforms=linux/amd64`, the frontend through
  `Platform("amd64", "linux")` in `:frontend:imageBuild` (task-195). On an
  arm64 machine (Apple Silicon, Graviton) every container runs under
  emulation, and minikube on a Mac runs amd64 images on an arm64 node.

  ## The model: build multi-arch, deliver through a registry

  A multi-platform image is an INDEX over per-platform images, and only a
  registry can hold one. Every consumer pulls the tag and receives its own
  variant: the Mac's Docker daemon gets arm64, a CI runner amd64, minikube's
  node whichever it is. Jib's DIRECT daemon load (`DockerDaemonImage`, and
  Quarkus' daemon build) is single-platform, because it hands the daemon a
  single-image `docker load` tarball. That is the only single-platform path.

  Cross-building costs nothing: Jib never executes anything inside the image.
  It stacks the application layers onto each platform's base image, so there
  is no QEMU and no buildx.

  ## Target state

  - **Pushing an image always means amd64 + arm64**, for both images, without
    the caller having to ask. A downstream pipeline that already pushes gets
    multi-arch images with no change on its side.
  - **The daemon path stays single-platform `linux/amd64`**, as today. It is a
    fallback for building without a registry, and CI's `images` job uses it on
    an amd64 runner. Deliberately NOT the host architecture: a daemon image
    that depended on the machine that built it would break the "independent of
    *where* it runs" rule in the root CLAUDE.md. The arm64-Mac emulation
    problem is solved by the minikube path below, not by this fallback.
  - **Backend base re-pinned to its multi-arch INDEX.** The current pin
    `registry.access.redhat.com/ubi9/openjdk-21-runtime@sha256:87aadb888d0c…`
    is a single-platform (amd64) manifest, so an arm64 variant is impossible
    with it. Verified 2026-10-11: it is the amd64 member of the index for tag
    `1.21-1.1741781258` (also tagged `1.21`), index
    `sha256:360822c35c5741f542ab78fe123e6c4d9b68e0113a88d6e0250bb1f377b17f29`,
    which covers amd64, arm64, ppc64le and s390x. Re-pin to that index. The
    amd64 variant stays byte-identical to today's base. Upgrading the JRE
    release (the newest is 1.24) is a separate decision.
  - **The frontend base is already an index** (nginx 1.27.5-alpine, verified
    in task-195 to include arm64). Only the platform list changes.

  ## Backend: "push implies multi-arch"

  `gradle.properties` keeps `quarkus.jib.platforms=linux/amd64` for daemon
  builds. `src/backend/implementation/build.gradle.kts` sets
  `quarkus { set("jib.platforms", "linux/amd64,linux/arm64") }` when the
  build pushes. There are TWO ways to push, and both must trigger it:

  - `imageBuild -Dquarkus.container-image.push=true`, the form
    `docs/deployment.md` already documents and this task uses everywhere;
  - the plugin's separate `imagePush` task (`io.quarkus.gradle.tasks.ImagePush`,
    verified in the 3.35.1 plugin), which forces `container-image.build` and
    `container-image.push` itself. Those forced values are not visible as
    system properties, so the condition also checks
    `gradle.startParameter.taskNames` for a task ending in `imagePush`.
    Without this, `./gradlew imagePush` would silently ship amd64 only.

  The Quarkus 3.35.1 Gradle extension has `set(String, String)`. The
  precedence was verified from the plugin's `EffectiveConfig` bytecode
  (2026-10-11) and is non-obvious, so record it in the backend comment:
  forced task properties (600) > task properties (500) > system properties
  (400) > environment (300) > `quarkus { set() }` (290) > `gradle.properties`
  `quarkus.*` (280). So `set()` overrides the `gradle.properties` default, and
  an explicit `-Dquarkus.jib.platforms=…` still wins over both. The validation
  additionally proves the outcome by reading the pushed index's platforms.

  `imageBuild` forces only `container-image.build`, so a `-D` push is
  expected to survive. That has not been run yet. The local-registry
  validation proves it, and fails loudly if nothing arrives.

  A plain-HTTP local registry needs `-Dquarkus.container-image.insecure=true`
  (the key exists in quarkus-container-image 3.35.1). The frontend already
  allows plain HTTP for `localhost`/`127.0.0.1` only (task-195).

  ## Frontend

  `:frontend:imageBuild` uses `amd64` + `arm64` when `frontendImagePush=true`
  and `amd64` otherwise. Nothing else changes.

  ## minikube: pull from its registry addon instead of side-loading

  `scripts/minikube-deploy.sh` today side-loads with
  `docker save | minikube ssh -- docker load`, uses `imagePullPolicy: Never`,
  and carries a freshness check because `minikube image load` can serve a
  stale cached tarball. All of that is replaced by a registry:

  - `minikube addons enable registry` runs the registry in the cluster, plus a
    proxy that serves it on the NODE's `localhost:5000`. Inside the node,
    `localhost` is the node, so pods reference
    `localhost:5000/pythia/pythia-{backend,frontend}:1.0.0-SNAPSHOT`, and the
    node's runtime pulls over HTTP, which Docker allows for `localhost` by
    default.
  - The host reaches it through
    `kubectl -n kube-system port-forward svc/registry 5005:80`. Not 5000: on
    macOS, ControlCenter (AirPlay Receiver) listens on 5000 (verified on the
    development Mac). Both images are pushed to `localhost:5005/...`, which is
    the same registry storage the node reads as `localhost:5000/...`.
  - The minikube overlay rewrites the image names to
    `localhost:5000/pythia/...` (the `images:` pattern staging and production
    already use) and patches `imagePullPolicy: Always`. With the fixed
    `1.0.0-SNAPSHOT` tag, `Always` plus the existing `rollout restart` is what
    picks up a rebuild. A unique tag per deploy was rejected because a dirty
    working tree would reuse the same commit SHA.
  - **Every deploy pushes again, and the backend build is forced.** The
    registry lives INSIDE the cluster: `minikube-reset.sh` deletes it, and a
    stop/start may drop its storage. Side-loading never had this problem,
    because the image survived in the host's Docker. Measured on 2026-10-11:
    the plugin's `imageBuild` task always runs, but the image is built and
    pushed inside `quarkusAppPartsBuild`, as a side effect, not a tracked
    output. That task's up-to-date check DOES include `quarkus.*` system
    properties (changing `-Dquarkus.container-image.registry` re-ran it), so
    a repeat build with the SAME properties is skipped, and the build cache
    can also replay it (`FROM-CACHE`). Either way nothing is pushed. A
    reset → deploy with no code change would therefore push NOTHING to the
    fresh registry, and the pods would sit in `ImagePullBackOff`. **Every
    backend push in this task (script, local checks, validation) runs
    `:backend:implementation:quarkusAppPartsBuild --rerun`**, which forces
    execution past both the up-to-date check and the cache. The frontend's
    `imageBuild` is never up to date (task-195), so it needs nothing. The CI
    push step happens to rerun anyway (different properties than the daemon
    build before it, plus `--no-build-cache`), but takes `--rerun` too, so
    no push depends on what ran before it.
  - **The node-side pull is the least certain link and is tested FIRST.**
    The proxy binds a `hostPort`, and whether the node's own Docker reaches
    it as `localhost:5000` depends on the CNI's port mapping. Before
    rewriting the script, push one image through the port-forward and run
    `minikube ssh -- docker pull localhost:5000/<image>`. If that fails, use
    the fallback consistently: pods reference `$(minikube ip):5000/...`
    (rendered into the overlay by the deploy script), and
    `minikube-setup.sh` starts the cluster with
    `--insecure-registry "$(minikube ip):5000"`-equivalent configuration (an
    insecure-registry CIDR such as `192.168.0.0/16`, because the IP is not
    known before `minikube start`). Record which path was taken in the
    script's comment and in `docs/development.md`.
    **The fallback and the settings file:** the node's IP is unknown until
    the cluster runs, so `scripts/minikube-env.sh` cannot hold it as a
    default. Computing it there would run `minikube` on every `source`,
    including from `minikube-reset.sh`, and break the file's "only assigns"
    rule. In fallback mode the file's default is EMPTY, and
    `minikube-deploy.sh` resolves it at runtime:
    `MINIKUBE_IMAGE_REGISTRY="${MINIKUBE_IMAGE_REGISTRY:-$(minikube ip):5000}"`.
    The overlay validation then resolves it the same way, and a running
    cluster is required for that check.
  - The freshness check compares the pod's `imageID` digest with the digest
    the registry currently serves for the tag (an HTTP HEAD with the OCI index
    `Accept` header through the port-forward). The `docker save` loop, its
    stale-cache NOTE and the old in-node `docker inspect` comparison are
    removed.

  ## One settings file for the local cluster

  This task introduces values that several scripts must agree on (the
  host-side registry port, the node-side registry address), next to ones that
  are already repeated (the namespace `estimation` appears 6 times in
  `minikube-deploy.sh` alone, the image names and tag 3 times). They move into
  ONE file, **`scripts/minikube-env.sh`**, which `minikube-setup.sh`,
  `minikube-deploy.sh` and `minikube-reset.sh` source:

  | variable | default | used by |
  |---|---|---|
  | `MINIKUBE_CPUS` / `MINIKUBE_MEMORY` / `MINIKUBE_DRIVER` | `4` / `8192` / `docker` | setup |
  | `MINIKUBE_NAMESPACE` | `estimation` | deploy, reset |
  | `MINIKUBE_REGISTRY_HOST_PORT` | `5005` (not 5000: AirPlay on macOS) | deploy, reset |
  | `MINIKUBE_IMAGE_REGISTRY` | `localhost:5000` (the node-side proxy); EMPTY in fallback mode, resolved by deploy to `$(minikube ip):5000` | deploy, the minikube overlay |
  | `MINIKUBE_IMAGE_TAG` | `1.0.0-SNAPSHOT` | deploy |

  Rules for the file:

  - **Overridable without editing.** Every value is set as
    `: "${MINIKUBE_CPUS:=4}"`, so `MINIKUBE_MEMORY=12288
    ./scripts/minikube-setup.sh` works for one run.
  - **Plain variables, never `export`ed.** Sourcing the file can then not
    leak anything into Gradle, Docker or the user's shell. The scripts'
    existing refuse-to-be-sourced guards protect the INTERACTIVE shell from
    the scripts and stay as they are. A script sourcing a settings file is a
    different thing. Where a child process needs a value (e.g. `envsubst`),
    the script passes it explicitly.
  - **No secrets and no organisation coordinates.** The `ENTRA_*` ids stay in
    the workspace's `EntraIdVariables.sh`, outside every repo (workspace
    CLAUDE.md). This file is public.
  - **Comments may name the defaults, code may not.** A comment explaining
    "pods pull from `localhost:5000`, the host pushes through 5005 because
    AirPlay holds 5000" is wanted. A literal `5005` in a command is not. The
    validation checks code lines only.
  - **It is a library, not a script:** no shebang-driven execution, no
    `set -e` and no side effects; it only assigns. It carries its own guard
    so that running it directly prints a hint and exits non-zero.

  **The minikube overlay follows the file.** Its `images:` entries use a
  `${MINIKUBE_IMAGE_REGISTRY}` placeholder, the same convention staging and
  production use with `${REGISTRY}`, and `minikube-deploy.sh` adds that name
  to its existing `envsubst` allow-list. The settings file is then the single
  source of the registry address, and the `$(minikube ip):5000` fallback is a
  one-value change.

  **Values the file must NOT try to own**, because another file is their real
  owner and a shell file cannot reach it: the namespace in the base manifests
  (`k8s/base/**`, owned by kustomize), and the image tag, owned by `version`
  in the root `build.gradle.kts`. The settings file names both owners in a
  comment, and the validation checks that the defaults still agree with
  them.

  **Out of scope:** `scripts/deploy.sh`, the server-side deploy, which has
  its own interface (variables provided by the internal pipeline), and the
  dev stack (`dev.sh`, ports 8090/5173), which is not minikube.

  ## The local cluster's lifecycle scripts

  The local cluster has three scripts, and all three change:

  - **`scripts/minikube-setup.sh` (setup and startup)** already enables the
    cluster's addons (`ingress`, `metrics-server`). The `registry` addon is
    added there, because setup is where a cluster's addons are declared.
    `minikube-deploy.sh` ALSO enables it, idempotently, so a cluster created
    before this task keeps working without a reset.
  - **`scripts/minikube-deploy.sh`** builds, pushes and deploys, as described
    above.
  - **`scripts/minikube-reset.sh` (teardown)** deletes the namespace and the
    cluster. The registry addon and every pushed image go with the cluster,
    which is correct and needs no extra step. One leftover remains: the
    deploy's background `kubectl port-forward` on 5005 is killed by its
    `trap … EXIT`, but not if the deploy itself was killed hard. The reset
    therefore also stops a leftover port-forward, matched narrowly on
    `port-forward svc/registry 5005:80` so that no other process is touched,
    and says so.

  `minikube stop` / `minikube start` (outside these scripts) keep the addon
  enabled. Whether pushed images survive a restart depends on the addon's
  storage. It does not matter, because every deploy pushes again.

  ## The base's `imagePullPolicy: Never`

  After this task no overlay wants `Never`: minikube patches `Always`, and
  staging and production already patch `IfNotPresent` with a comment that
  calls `Never` "right for a local minikube where images are side-loaded",
  which stops being true. Change `k8s/base/{backend,frontend}/deployment.yaml`
  to `IfNotPresent`, the right default for any registry-pulled image. Delete
  the now-redundant `imagePullPolicy` patches (and their comments) from the
  staging and production overlays. Keep production's comment about using a
  commit-SHA tag rather than the floating `1.0.0-SNAPSHOT` (it is about
  `IfNotPresent` and stays true). The rendered output for staging and
  production must not change except that the patch is no longer needed.
  Production's patch targets EVERY `kind: Deployment`, not named ones.
  Removing it is still equivalent, because the only other workload
  (`postgres`) is a StatefulSet the patch never matched. Prove the
  equivalence by diffing the rendered overlays before and after (see the
  validation).

  ## Open questions, recorded and not decided here

  - **The production server's architecture is unknown.** It does not matter
    for this task: the pushed index always contains amd64, so production keeps
    working either way.
  - **Nothing EXERCISES the backend's arm64 variant in CI.** A JVM image on
    `ubi9/openjdk-21-runtime` arm64 is expected to work. This task checks
    locally that both variants exist and start a JVM of the right
    architecture (see the steps). It does not add an arm64 runner.

  ## Out of scope

  Changing the internal deployment pipeline (it pushes, so it gets multi-arch
  automatically), upgrading either base image's release, ppc64le/s390x, and an
  arm64 CI runner.

