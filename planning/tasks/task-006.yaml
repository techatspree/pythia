id: task-006
phase: phase-2
title: Dev auth module — hard-wired users for local dev and e2e
depends_on: [task-005]
description: |
  Implement the `dev` auth module declared by task-005. This module
  provides three hard-wired users (`dev-viewer`, `dev-estimator`,
  `dev-admin`) — one per role — selectable at runtime without any
  external identity provider, network call, or token issuance. It is
  the only module needed to run the application locally
  (`./scripts/dev-local.sh`), to execute Playwright e2e tests, and
  for outside contributors who do not have an Entra tenant.

  Why this is a distinct module: dev-local must work for anyone
  cloning the repo, but Entra ID requires per-tenant app registration
  + admin consent that is not feasible for casual development. The
  modular contract from task-005 lets dev and prod swap providers
  without changing any REST resource, page, or component.

  Current state (verified):
    - task-005 has landed the `AuthModule` SPI,
      `CurrentUserProvider`, `Role` enum, and the
      `app.auth.provider` config switch (default `dev`) on the
      backend; on the frontend the `AuthProvider` interface +
      `getAuthProvider()` factory exist but throw for every value
      of `VITE_AUTH_PROVIDER`.
    - The application still has no working login: the API client's
      try/catch (from task-005) swallows the factory error and sends
      no Authorization header. dev-local works only because no REST
      resource is guarded yet.

  Target state:
    - Backend (`dev` profile only — guard the bean registration with
      `@IfBuildProfile("dev")` or check `app.auth.provider == "dev"`
      via `AuthConfig`):
        * `DevAuthModule.kt` implementing `AuthModule` with
          `name() = "dev"`, `isActive()` reading `AuthConfig`.
        * Three hard-wired user records in code:
            DEV_USERS = listOf(
                DevUser("dev-viewer",    "viewer@dev.local",    "Dev Viewer",    setOf(Role.VIEWER)),
                DevUser("dev-estimator", "estimator@dev.local", "Dev Estimator", setOf(Role.VIEWER, Role.ESTIMATOR)),
                DevUser("dev-admin",     "admin@dev.local",     "Dev Admin",     setOf(Role.VIEWER, Role.ESTIMATOR, Role.ADMIN))
            )
        * A JAX-RS `ContainerRequestFilter` named
          `DevAuthFilter.kt` annotated `@Provider @PreMatching
          @Priority(Priorities.AUTHENTICATION)` so it runs before
          the resource invocation. Concrete parsing semantics
          (deliberately strict — no clever fallbacks beyond the
          documented default-user knob):
            - Split the `Authorization` header on the FIRST
              whitespace. The first token MUST be exactly `Dev`
              (case-sensitive — `dev` / `DEV` / `Bearer` all
              reject with 401). The remainder is the subjectId.
            - subjectId MUST match the regex `^[a-z][a-z0-9-]*$`
              AND be a key in `DEV_USERS`. Any mismatch → 401.
            - When the `Authorization` header is missing entirely,
              consult `app.auth.dev.default-user`:
                * empty / unset → respond 401 (strict mode — used
                  by `%test` and any deployment where dev-mode
                  should still gate routes).
                * non-empty → look up that subjectId in
                  `DEV_USERS`; if missing, 401; if present, use
                  it as the request principal. dev-local sets
                  this to `dev-admin` so smoke `curl` calls keep
                  working.
            - On success: populate the request-scoped
              `CurrentUserProvider` with a `CurrentUser` derived
              from the matched `DevUser`. providerName = "dev".
              Resource invocation proceeds; the augmentor (below)
              translates roles for `@RolesAllowed`.
        * The filter is the ONLY way roles get populated for the
          `dev` profile — there is no JWT / no quarkus-oidc.
          Quarkus security still works because resources eventually
          use the `CurrentUser`/`@RolesAllowed` machinery; the
          provider-agnostic bean is what they read.
        * To make `@RolesAllowed` (a Quarkus SecurityIdentity
          mechanism) work uniformly between dev and entra, install
          a `SecurityIdentityAugmentor` in the dev module that
          synthesises a `QuarkusSecurityIdentity` from the
          `CurrentUser` populated by the filter. Roles map 1:1 to
          the Quarkus role strings `"VIEWER"`, `"ESTIMATOR"`,
          `"ADMIN"`. Wiring detail: no auth mechanism is
          configured under the dev profile (no OIDC, no basic
          auth), so Quarkus builds an anonymous `SecurityIdentity`
          per request. The augmentor injects the request-scoped
          `CurrentUserProvider`, reads `current` (already set by
          the filter, which ran at AUTHENTICATION priority before
          the augmentor fires on identity construction), and
          returns a `QuarkusSecurityIdentity.builder()` populated
          with the principal name (subjectId) and role strings.
        * Add a backend config property
          `app.auth.dev.default-user` with per-profile defaults:
            app.auth.dev.default-user=                (empty — strict)
            %dev-local.app.auth.dev.default-user=dev-admin
            %dev.app.auth.dev.default-user=dev-admin
            %test.app.auth.dev.default-user=           (empty — strict)
            %dev-minikube.app.auth.dev.default-user=   (empty — strict)
            %prod.app.auth.dev.default-user=           (empty — strict)
          The fallback is a developer-convenience escape hatch on
          dev-local ONLY; every other profile rejects
          unauthenticated requests with 401 so the gate is real.
          Document the override in `docs/auth-dev.md`.
    - Frontend:
        * `src/frontend/src/lib/auth/DevAuthProvider.ts`
          implementing `AuthProvider`. State stored in
          `sessionStorage` so it survives page reloads but not
          process restarts.
            - `login()`: opens a small picker dialog that lets the
              tester pick one of the three preset users (the names
              come from a `DEV_USERS` constant identical in
              membership to the backend's list). Selection is saved
              under `sessionStorage.devAuthSubject`. The dialog
              is implemented inline (no new UI lib) using a basic
              Svelte component `DevLoginDialog.svelte` mounted
              once at app root.
            - `logout()`: clears `sessionStorage.devAuthSubject`.
            - `getAccount()`: derives the AuthAccount from the
              stored subjectId; returns null if nothing stored.
            - `getAuthorizationHeader()`: returns
              `"Dev " + subjectId` if logged in; null otherwise.
            - `init()`: no-op (sessionStorage read is sync).
        * Update `src/frontend/src/lib/auth/index.ts` so
          `getAuthProvider()` for `VITE_AUTH_PROVIDER === 'dev'`
          returns a singleton `DevAuthProvider`. Throw stays in
          place for `'entra'` and `'keycloak'` branches (those
          land later).
        * Add a protected-route guard:
          `src/frontend/src/lib/auth/RequireAuth.svelte` — a
          Svelte 5 component that checks `getAccount()` and either
          renders its children snippet or routes/redirects to a
          login screen. Mount it inside the root `+layout.svelte`
          so every route is gated.
        * Default mount: at app load, if `getAccount()` is null,
          show `DevLoginDialog`. Picker reuses the standard
          Tailwind button styling.
    - Documentation:
        * `docs/auth-dev.md` — one page describing the three
          users, how the picker works, how to override the
          default user for headless API smoke calls
          (`Authorization: Dev dev-admin`), and what NOT to do
          (no production deployment, no CI deploy).
        * Update `./scripts/dev-local.sh` to export
          `VITE_AUTH_PROVIDER=dev` so dev-local is unambiguous.
    - Playwright e2e:
        * Add a helper `loginAsDev(page, subjectId)` to a new
          file `src/frontend/e2e/helpers.ts` (importable from
          the existing test files) that sets
          `sessionStorage.devAuthSubject` before navigating.
          Also add a counterpart `logoutDev(page)` that clears
          the same key — used by the auth-gate tests below.
        * Existing 18 tests (smoke 13 + tree-table 5) continue
          passing because dev-local keeps the
          `app.auth.dev.default-user=dev-admin` fallback. They
          run under the same Vite/Quarkus dev servers and
          continue to make unauthenticated REST calls that the
          backend silently treats as `dev-admin`. NO existing
          test file is modified.
        * New file `src/frontend/e2e/auth-gate.test.ts` proves
          both surfaces gate unauthenticated access. Four cases:
            (a) "unauthenticated SPA visit shows the dev login
                dialog, not the application UI" — clear
                sessionStorage, visit `/projects`, assert the
                `DevLoginDialog` is visible AND no
                `[data-testid^="row-"]` / project-list row
                renders. Frontend-gate proof.
            (b) "REST call with NO Authorization header against
                the strict (test-profile) backend returns 401" —
                use `request` fixture with
                `baseURL: process.env.STRICT_BACKEND_URL ??
                'http://localhost:8081'` and `GET /api/projects`.
                Skip the case via `test.skip(!process.env.
                STRICT_BACKEND_URL, '...')` when the strict
                backend isn't running.
            (c) "REST call with `Authorization: Dev not-a-real-
                user` returns 401" — uses the SAME strict
                backend; same skip guard.
            (d) "REST call with `Authorization: Bearer <jwt-
                shape>` returns 401 (dev filter rejects the
                wrong scheme)" — same strict backend; same skip.
        * Add a small helper script
          `./scripts/dev-local-strict.sh` that starts a SECOND
          backend instance on port 8081 with
          `APP_AUTH_DEV_DEFAULT_USER=` (empty) so cases (b)–(d)
          can run alongside the default dev-local backend
          without disturbing the convenience fallback. Document
          how to invoke it in `docs/auth-dev.md`. The strict
          backend uses the same `dev-local` profile but with the
          one env-var override and a different
          `quarkus.http.port`.
        * CI invokes both: `./scripts/dev-local.sh` (port 8080,
          fallback enabled) and `./scripts/dev-local-strict.sh`
          (port 8081, fallback disabled) before running
          `npx playwright test`. Document this in
          `docs/auth-dev.md`. Locally, developers can run the
          strict backend on demand; the four strict-mode cases
          self-skip when STRICT_BACKEND_URL is unset.
        * Targeted role-enforcement tests (viewer vs admin on a
          guarded endpoint) come with task-008 — they reuse
          `loginAsDev` and the strict backend.

  Key design decisions (leave no ambiguity):
    - The `Authorization: Dev <subjectId>` header format is
      deliberately distinct from `Bearer <jwt>` so the filter can
      cheaply reject mistakes. NEVER ship a real-token-shaped
      header from the dev provider.
    - The dev module is selected by config, NOT by build profile
      ONLY — `app.auth.provider=dev` works under any Quarkus
      profile. But the per-profile defaults from task-005 mean
      `%prod` defaults to `entra`, making a prod misconfiguration
      explicit.
    - The dev picker is a runtime aid, not a polished login UI.
      Three buttons stacked vertically with the user's name +
      role list is enough.

  Out of scope (explicit):
    - Entra ID integration (task-007).
    - Persistence of the `User` entity (deferred — the dev
      module synthesises everything from the hard-wired list).
    - Per-resource `@RolesAllowed` annotations (these come with
      each feature; this task only proves the augmentor populates
      roles correctly).
    - Multi-tab dev session sync (sessionStorage is per-tab; the
      picker shows on each new tab).

steps:
  - |
    Create the dev backend module under
    src/backend/implementation/src/main/kotlin/io/github/theestimator/auth/dev/:
      - DevUser.kt — `data class DevUser(...)` + `val DEV_USERS = ...`.
      - DevAuthModule.kt — `@ApplicationScoped` implementing
        AuthModule, gated by `AuthConfig.activeProvider == "dev"`.
      - DevAuthFilter.kt — `@Provider @PreMatching` JAX-RS
        ContainerRequestFilter that parses the `Authorization`
        header and populates `CurrentUserProvider`. Conditional
        registration via `@IfBuildProperty(name="app.auth.provider",
        stringValue="dev")` so it disappears in prod builds.
      - DevSecurityIdentityAugmentor.kt — `@ApplicationScoped`
        Quarkus `SecurityIdentityAugmentor` that translates the
        request-scoped CurrentUser into a `QuarkusSecurityIdentity`
        with role strings. Same `@IfBuildProperty` gate.

  - |
    Add config — per-profile `app.auth.dev.default-user` defaults.
    In src/backend/implementation/src/main/resources/application.properties
    add the following block (leave the task-005
    `app.auth.provider` switch untouched):
        # --- Dev module default-user fallback ---
        # Empty/unset = strict mode (unauthenticated → 401).
        # dev-local sets this to dev-admin as a developer
        # convenience so curl smoke calls keep working; every
        # other profile leaves it empty so the dev gate is real.
        app.auth.dev.default-user=
        %dev-local.app.auth.dev.default-user=dev-admin
        %dev.app.auth.dev.default-user=dev-admin
        %test.app.auth.dev.default-user=
        %dev-minikube.app.auth.dev.default-user=
        %prod.app.auth.dev.default-user=

  - |
    Add docs/auth-dev.md describing the three users, the picker,
    the default-user override, and the production-deployment ban.

  - |
    Create the frontend dev provider:
      - src/frontend/src/lib/auth/DevAuthProvider.ts implementing
        AuthProvider as described.
      - src/frontend/src/lib/components/DevLoginDialog.svelte — a
        modal picker showing the three preset users; clicking one
        calls back into DevAuthProvider's selection. Visible only
        when `getAccount()` is null.
      - src/frontend/src/lib/auth/RequireAuth.svelte — a small
        wrapper component using `getAccount()`.
      - Wire src/frontend/src/lib/auth/index.ts so
        `VITE_AUTH_PROVIDER='dev'` returns the singleton; remove
        the `Provider 'dev' not yet wired up` throw from task-005.
      - Mount DevLoginDialog + RequireAuth inside
        src/frontend/src/routes/+layout.svelte so every route is
        gated (the dialog covers the layout when unauthenticated).

  - |
    Update ./scripts/dev-local.sh to `export VITE_AUTH_PROVIDER=dev`
    before launching Vite. Also set `APP_AUTH_PROVIDER=dev` for
    Quarkus (the Quarkus convention: ALL_CAPS env var maps to the
    property).

  - |
    Add Playwright helpers in src/frontend/e2e/helpers.ts:
        import type { Page } from '@playwright/test';
        export async function loginAsDev(page: Page, subjectId: string) {
            await page.addInitScript(([k, v]) => {
                sessionStorage.setItem(k, v);
            }, ['devAuthSubject', subjectId]);
        }
        export async function logoutDev(page: Page) {
            await page.addInitScript((k) => {
                sessionStorage.removeItem(k);
            }, 'devAuthSubject');
        }
    Existing tests don't need to call either helper (the dev-local
    default-user fallback covers them). Tests that want to act as
    a specific role or assert the unauthenticated path can opt in.

  - |
    Add the strict-backend helper script
    `./scripts/dev-local-strict.sh` that mirrors `dev-local.sh`
    but:
      - exports `APP_AUTH_DEV_DEFAULT_USER=` (empty) so the dev
        filter rejects unauthenticated requests with 401
      - exports `QUARKUS_HTTP_PORT=8081` so it coexists with the
        primary dev-local backend on :8080
      - does NOT start a frontend dev server (the strict backend
        is exercised via Playwright `request` fixture only)
    Mark the file executable (`chmod +x`).

  - |
    Add the auth-gate Playwright file
    `src/frontend/e2e/auth-gate.test.ts` with the four cases
    documented in the description. Use `logoutDev(page)` from
    `helpers.ts` before the frontend-gate case; use the
    `request` fixture with `process.env.STRICT_BACKEND_URL`
    for the three strict-backend REST cases, each guarded by
    `test.skip(!process.env.STRICT_BACKEND_URL, 'set
    STRICT_BACKEND_URL to run the strict-backend auth tests
    (e.g. http://localhost:8081)')`.

  - |
    Backend build:
      mvn -pl src/backend/implementation -am test

  - |
    Frontend type-check:
      cd src/frontend && npm run check

  - |
    Run the full Playwright suite. With the strict backend NOT
    running, expected counts are 18 existing cases (unchanged) +
    1 new frontend-gate case from `auth-gate.test.ts` = 19; the
    three strict-backend cases self-skip. With the strict
    backend running (`./scripts/dev-local-strict.sh` in another
    shell + `export STRICT_BACKEND_URL=http://localhost:8081`),
    all 22 cases (18 + 4) must pass:
      cd src/frontend && npx playwright test
      # then, optionally, with strict backend up:
      ./scripts/dev-local-strict.sh &
      cd src/frontend && STRICT_BACKEND_URL=http://localhost:8081 \
          npx playwright test e2e/auth-gate.test.ts

  - |
    Update CLAUDE.md (project root): in the existing
    "Modular authentication and authorization" paragraph (added
    by task-005) append a one-liner cross-link:
        "Concrete dev module → docs/auth-dev.md."
    No other CLAUDE.md changes; the SPI description from
    task-005 still holds.

validation:
  - |
    Backend dev-module files exist:
      test -f src/backend/implementation/src/main/kotlin/io/github/theestimator/auth/dev/DevUser.kt
      test -f src/backend/implementation/src/main/kotlin/io/github/theestimator/auth/dev/DevAuthModule.kt
      test -f src/backend/implementation/src/main/kotlin/io/github/theestimator/auth/dev/DevAuthFilter.kt
      test -f src/backend/implementation/src/main/kotlin/io/github/theestimator/auth/dev/DevSecurityIdentityAugmentor.kt
  - |
    The three hard-wired users are present with the documented
    role assignments:
      grep -q "dev-viewer" src/backend/implementation/src/main/kotlin/io/github/theestimator/auth/dev/DevUser.kt
      grep -q "dev-estimator" src/backend/implementation/src/main/kotlin/io/github/theestimator/auth/dev/DevUser.kt
      grep -q "dev-admin" src/backend/implementation/src/main/kotlin/io/github/theestimator/auth/dev/DevUser.kt
  - |
    The dev filter only registers when the dev provider is active:
      grep -q "@IfBuildProperty" src/backend/implementation/src/main/kotlin/io/github/theestimator/auth/dev/DevAuthFilter.kt
      grep -q "app.auth.provider" src/backend/implementation/src/main/kotlin/io/github/theestimator/auth/dev/DevAuthFilter.kt
  - |
    Frontend dev provider + UI exist:
      test -f src/frontend/src/lib/auth/DevAuthProvider.ts
      test -f src/frontend/src/lib/components/DevLoginDialog.svelte
      test -f src/frontend/src/lib/auth/RequireAuth.svelte
      grep -q "DevAuthProvider" src/frontend/src/lib/auth/index.ts
      ! grep -q "Provider 'dev' not yet wired up" src/frontend/src/lib/auth/index.ts
  - |
    Dev-local script sets both auth-provider env vars:
      grep -q "VITE_AUTH_PROVIDER=dev" scripts/dev-local.sh
      grep -q "APP_AUTH_PROVIDER=dev" scripts/dev-local.sh
  - |
    Strict-mode dev backend script exists, is executable, and
    sets the strict env vars:
      test -x scripts/dev-local-strict.sh
      grep -q "APP_AUTH_DEV_DEFAULT_USER=" scripts/dev-local-strict.sh
      grep -q "QUARKUS_HTTP_PORT=8081" scripts/dev-local-strict.sh
  - |
    Per-profile default-user fallback is configured strictly
    everywhere EXCEPT dev-local/%dev (developer convenience):
      grep -q "^app.auth.dev.default-user=$" src/backend/implementation/src/main/resources/application.properties
      grep -q "%dev-local.app.auth.dev.default-user=dev-admin" src/backend/implementation/src/main/resources/application.properties
      grep -q "%test.app.auth.dev.default-user=$" src/backend/implementation/src/main/resources/application.properties
      grep -q "%prod.app.auth.dev.default-user=$" src/backend/implementation/src/main/resources/application.properties
  - |
    Documentation page exists and mentions the strict mode:
      test -f docs/auth-dev.md
      grep -q "dev-local-strict\|STRICT_BACKEND_URL\|strict" docs/auth-dev.md
  - |
    CLAUDE.md cross-links the dev-module doc:
      grep -q "docs/auth-dev.md" CLAUDE.md
  - |
    Playwright helpers exist and are reusable from other tests:
      test -f src/frontend/e2e/helpers.ts
      grep -q "loginAsDev" src/frontend/e2e/helpers.ts
      grep -q "logoutDev" src/frontend/e2e/helpers.ts
  - |
    Auth-gate e2e file exists with the four documented cases:
      test -f src/frontend/e2e/auth-gate.test.ts
      grep -q "unauthenticated SPA visit\|login dialog" src/frontend/e2e/auth-gate.test.ts
      grep -q "STRICT_BACKEND_URL" src/frontend/e2e/auth-gate.test.ts
      grep -q "not-a-real-user" src/frontend/e2e/auth-gate.test.ts
      grep -q "Bearer" src/frontend/e2e/auth-gate.test.ts
  - |
    Backend builds:
      mvn -pl src/backend/implementation -am test
  - |
    Frontend type-check passes:
      cd src/frontend && npm run check
  - |
    Playwright suite (strict backend not required) passes — the
    three strict-backend cases self-skip when
    STRICT_BACKEND_URL is unset, leaving 18 existing + 1 new
    frontend-gate case = 19 cases that must pass:
      cd src/frontend && npx playwright test

