id: task-098
phase: phase-15
title: PERT-as-method-1 — repackage existing PERT behind the SPI
depends_on: [task-097]
description: |
  Wrap the existing three-point PERT flow behind the SPI introduced
  in task-097 without changing any observable behaviour. This is
  the "make method #1 conform to the abstraction" task — every
  existing domain, backend, and frontend test must still pass.

  ## Frozen decisions (from task-096)

  - **Package (revised — sealed-class constraint).** The PERT method
    module `ThreePointMethodModule` lives in
    `io.pythia.method.threepoint`. The existing leaf types
    `FixedEstimationItem` and `TimeRelativeEstimationItem` **STAY in
    `io.pythia.model`** — they are subclasses of the
    `sealed class EstimationItem`, and Kotlin requires all subclasses of
    a sealed class to be in the SAME package and module as the sealed
    root. Moving them to `method.threepoint` would not compile. So the
    "one package per method" rule applies to the METHOD MODULE class, not
    to the sealed leaf types (which are pinned to `model` by the sealed
    hierarchy). `ThreePointMethodModule` simply imports the existing
    `io.pythia.model.FixedEstimationItem` /
    `TimeRelativeEstimationItem`. No leaf-type move, and therefore NO
    import-site churn across `:domain` / `:backend` / `:frontend`.
    (This supersedes the task-096 "move the leaf types" note; the same
    constraint applies to task-102's `BucketedEstimationItem`, which must
    also live in `model`.)
  - **Behaviour parity.** The PERT calculation stays byte-identical
    to today's `EstimationVersion.calculate()`; the module is a
    thin wrapper that delegates to the existing per-leaf mapping.
    The submitted-side neutral columns
    (`mean`/`variance`/`offerPT`/`cost`/`offerPrice`) are still
    what get persisted for PERT-method estimations.
  - **Registration.** Expose an `installStandardMethods()` function on
    `EstimationMethodRegistry` that registers the PERT module (and, in
    task-102, the bucket module), and invoke it from an `init {}` block on
    the `EstimationMethodRegistry` object so the registry self-populates
    the first time it is touched. Caveat (from task-097): a Kotlin
    `object`'s `init {}` runs lazily on first access, so anything that
    reads the registry (the export writers' `require(...)`, or a test)
    triggers it — that is sufficient here since nothing needs the module
    before the registry is first accessed. Tests must still call
    `installStandardMethods()` (or touch the registry) explicitly and
    reset with `clear()` between cases. Note this couples the
    otherwise method-agnostic registry to the concrete
    `ThreePointMethodModule`; that is an accepted, documented trade-off
    for eager self-registration (leave a one-line comment saying so).
  - **Export writer.** The backend export writers are
    `ExcelExporter.kt` and `CsvExporter.kt` in
    `io.pythia.service`. Move only the PERT COLUMN DATA — the
    method-specific header names and the per-leaf string cells — into
    `ThreePointMethodModule.exportColumnHeaders` / `.exportRow` (both
    return `List<String>`, KMP-safe). The actual file writing (Apache
    POI for xlsx, CSV formatting) is JVM-only and STAYS in the backend
    writers; they just source the method-specific columns from the
    module. Because only one method exists in this task, the writers call
    `EstimationMethodRegistry.require(EstimationMethod.THREE_POINT_PERT)`
    directly (hardcoded) — do NOT reference `estimation.method`, which
    does not exist until task-099. The registry-driven dispatch by
    `estimation.method` lands in task-107. The unit tests must exercise
    the module's row + header output.
  - **Kotlin/JS pitfall.** The existing PERT sealed hierarchy
    already inlines its parent formulas (see the note in
    `TimeRelativeEstimationItem.kt`). Preserve that; DO NOT
    reintroduce `super.<computed prop>` when moving files.
  - **CLAUDE.md.** No new architectural invariant beyond
    task-097's SPI note. Add a one-line pointer in the "Domain
    model" section that the PERT method lives in the
    `io.pythia.method.threepoint` package now.

  ## What ships in this task

  - `io/pythia/method/threepoint/ThreePointMethodModule.kt`
    implementing `EstimationMethodModule` with `method =
    EstimationMethod.THREE_POINT_PERT`; delegates to the existing
    per-leaf calculation (`EstimationItem.withCalculationParameters`).
    It imports the existing `io.pythia.model.FixedEstimationItem`
    / `TimeRelativeEstimationItem` — the leaf types are NOT moved (they
    are sealed subclasses pinned to `model`).
  - `installStandardMethods()` added to `EstimationMethodRegistry`, called
    from the registry's `init {}` (see decision above).
  - PERT column data moved into the module's `exportColumnHeaders` /
    `exportRow`; `ExcelExporter.kt` / `CsvExporter.kt` updated to source
    those columns via `EstimationMethodRegistry.require(
    EstimationMethod.THREE_POINT_PERT)`. POI/CSV formatting stays in the
    backend writers.
  - JUnit 5 unit test at
    `src/domain/src/test/kotlin/io/pythia/method/threepoint/ThreePointMethodModuleTest.kt`
    (JVM `src/test` source set — there is no `commonTest`) for the
    module's calculate + export methods (round-trip on a fixed /
    time-relative sample, and `exportColumnHeaders().size ==
    exportRow(item).size`, plus the module is present after
    `installStandardMethods()`).
  - Do NOT delete the existing PERT backend export path — task-107 owns
    the dispatch refactor. This task only makes the module the single
    source of the PERT column shape. (No other code is superseded; the
    dead-code sweep from the original plan is dropped — there is no
    behaviour change here.)
  - `CLAUDE.md` update as noted.

steps:
  - |
    Read the current PERT hierarchy (nothing here moves — the leaf
    types are sealed subclasses pinned to `model`):
      src/domain/src/main/kotlin/io/pythia/model/
        EstimationItem.kt (sealed root — stays)
        FixedEstimationItem.kt (stays)
        TimeRelativeEstimationItem.kt (stays)
        EstimationGroup.kt (stays)
        EstimationVersion.kt (stays)
    Read the current backend export writers
    `src/backend/implementation/src/main/kotlin/io/pythia/service/ExcelExporter.kt`
    and `.../service/CsvExporter.kt` (and their tree tests
    `ExcelExporterTreeTest.kt` / `CsvExporterTreeTest.kt`) to identify
    the PERT-specific columns (header names + per-leaf string cells)
    whose data-shaping will move into the module.
  - |
    Create the package
      src/domain/src/main/kotlin/io/pythia/method/threepoint/
    Add `ThreePointMethodModule.kt` implementing the SPI:
      class ThreePointMethodModule : EstimationMethodModule {
        override val method = EstimationMethod.THREE_POINT_PERT
        override fun calculate(item, params) = /* delegate */
        override fun exportRow(item) = /* PERT-specific cells */
        override fun exportColumnHeaders() = /* PERT headers */
      }
    Emit an INFO-level KotlinLogging line on module registration
    (lambda form) so backend logs show which methods are loaded
    at startup.
  - |
    Wire registration. Extend
    `EstimationMethodRegistry` with a `installStandardMethods()`
    function that registers the PERT module (and, later,
    task-102's bucket module). Call it once from a domain
    initialization site — the safest is an `init {}` block on
    `EstimationMethodRegistry` itself; document the decision in a
    one-line comment.
  - |
    Move the PERT column DATA-shaping into the module's export hooks.
    Copy the PERT-specific header names into
    `ThreePointMethodModule.exportColumnHeaders()` and the per-leaf
    string cells into `.exportRow(item)` (both `List<String>`). Update
    `ExcelExporter.kt` and `CsvExporter.kt` to source those columns from
    `EstimationMethodRegistry.require(EstimationMethod.THREE_POINT_PERT)`
    — hardcoded, since only one method exists (do NOT use
    `estimation.method`; that field arrives in task-099). POI/CSV
    formatting stays in the backend writers. The existing
    `ExcelExporterTreeTest.kt` / `CsvExporterTreeTest.kt` must still pass
    unchanged (byte-identical output).
  - |
    Add a JUnit 5 unit test at
    `src/domain/src/test/kotlin/io/pythia/method/threepoint/ThreePointMethodModuleTest.kt`
    (JVM `src/test` source set, `org.junit.jupiter.api` — NOT
    `commonTest`/kotlin.test), resetting the registry with
    `EstimationMethodRegistry.clear()` in `@BeforeEach`/`@AfterEach`:
      * `calculate` on a `FixedEstimationItem` returns the same
        values the pre-refactor path produced (assert against
        hand-computed numbers or against
        `EstimationVersion.calculate()` output for a two-leaf
        version).
      * `exportColumnHeaders().size == exportRow(item).size`.
      * The module is present in the registry after
        `installStandardMethods()`.
  - |
    Update `CLAUDE.md` "Domain model: trees, not flat groups"
    section (the SPI subsection added in task-097) with a one-line note
    that the PERT method module lives in
    `io.pythia.method.threepoint` and is registered by
    `EstimationMethodRegistry.installStandardMethods()` — and that the
    sealed leaf types `FixedEstimationItem` / `TimeRelativeEstimationItem`
    stay in `io.pythia.model` (the sealed-class package rule
    means per-method leaf types cannot move out of the sealed root's
    package).
  - |
    Run the domain, backend, and frontend builds to prove
    behaviour parity:
      ./gradlew :domain:build
      ./gradlew :backend:implementation:test
      ./gradlew :frontend:check
      ./gradlew build

validation:
  - |
    The PERT method module and its JUnit 5 test exist:
      test -f src/domain/src/main/kotlin/io/pythia/method/threepoint/ThreePointMethodModule.kt
      test -f src/domain/src/test/kotlin/io/pythia/method/threepoint/ThreePointMethodModuleTest.kt
      grep -q "org.junit.jupiter.api" src/domain/src/test/kotlin/io/pythia/method/threepoint/ThreePointMethodModuleTest.kt
  - |
    The sealed leaf types STAYED in `model` (not moved — sealed-class
    package rule), and the module references them from there:
      test -f src/domain/src/main/kotlin/io/pythia/model/FixedEstimationItem.kt
      test -f src/domain/src/main/kotlin/io/pythia/model/TimeRelativeEstimationItem.kt
      ! test -f src/domain/src/main/kotlin/io/pythia/method/threepoint/FixedEstimationItem.kt
      ! test -f src/domain/src/main/kotlin/io/pythia/method/threepoint/TimeRelativeEstimationItem.kt
  - |
    PERT module registers itself and logs at INFO:
      grep -q "EstimationMethodRegistry.register" src/domain/src/main/kotlin/io/pythia/method/threepoint/ThreePointMethodModule.kt \
        || grep -q "installStandardMethods" src/domain/src/main/kotlin/io/pythia/method/EstimationMethodRegistry.kt
      grep -q "logger.info" src/domain/src/main/kotlin/io/pythia/method/threepoint/ThreePointMethodModule.kt \
        || grep -q "logger.info" src/domain/src/main/kotlin/io/pythia/method/EstimationMethodRegistry.kt
  - |
    Kotlin/JS super-property pitfall: no accidental
    `super.<computed prop>` reintroduced:
      ! grep -rE 'super\.mean|super\.variance|super\.offerPT' \
          src/domain/src/main/kotlin/io/pythia/method/threepoint/
  - |
    CLAUDE.md points at the new package:
      grep -q "io.pythia.method.threepoint" CLAUDE.md
  - |
    Full-stack build is green (behaviour parity):
      ./gradlew build

