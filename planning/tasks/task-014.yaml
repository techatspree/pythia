id: task-014
phase: phase-4
title: Implement EstimationVersion REST endpoints
depends_on: [task-013]
description: |
  Build the Quarkus REST resource for estimation version lifecycle operations.
  Uses DTOs for request/response, delegates to EstimationVersionService (task-011).
  Includes Excel import/export endpoints.

  Endpoints:
    GET  /api/estimations/{estimationId}/versions
      - List all versions for an estimation
      - Response: List<EstimationVersionSummaryDto>

    POST /api/estimations/{estimationId}/versions
      - Create a new version (clones from latest if exists)
      - Response: 201 Created with EstimationVersionDto

    POST /api/estimations/{estimationId}/versions/import
      - Import a new version from an Excel file (multipart upload)
      - Request: multipart/form-data with file
      - Response: 201 Created with EstimationVersionDto

    GET  /api/estimations/{estimationId}/versions/{versionNumber}
      - Get a specific version with full details (items, parameters, phases, etc.)
      - Response: EstimationVersionDto

    PUT  /api/estimations/{estimationId}/versions/{versionNumber}
      - Update a version (only if DRAFT)
      - Request: EstimationVersionUpdateDto
      - Response: EstimationVersionDto
      - Returns 409 Conflict if version is SUBMITTED

    POST /api/estimations/{estimationId}/versions/{versionNumber}/submit
      - Submit a version (DRAFT → SUBMITTED)
      - Response: EstimationVersionDto
      - Returns 409 Conflict if not DRAFT

    GET  /api/estimations/{estimationId}/versions/{versionNumber}/export
      - Export version as Excel file
      - Response: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet

    DELETE /api/estimations/{estimationId}/versions/{versionNumber}
      - Delete a version (only if DRAFT)
      - Response: 204 No Content
      - Returns 409 Conflict if SUBMITTED

  DTOs:
    - EstimationVersionSummaryDto: id, versionNumber, status, totalEffort, createdAt, notes
    - EstimationVersionDto: full version with nested parameters, effortDrivers, phases,
      itemGroups (with items), additionalCosts
    - EstimationVersionUpdateDto: notes, parameters, effortDrivers (for editing DRAFT versions)
    - EstimationItemGroupDto, EstimationItemDto, etc. for nested structures

  Error handling:
    - 404 if estimation or version not found
    - 409 Conflict for illegal state transitions (edit/delete SUBMITTED, submit non-DRAFT)
    - 400 for invalid input (Bean Validation)

steps:
  - create DTO package: io.pythia.rest.dto
  - implement EstimationVersionSummaryDto, EstimationVersionDto, EstimationVersionUpdateDto
  - implement nested DTOs for items, parameters, phases, etc.
  - create mapper functions (entity ↔ DTO) or use extension functions
  - create EstimationVersionResource (@Path, @ApplicationScoped)
  - implement all endpoints delegating to EstimationVersionService
  - handle Excel import via multipart upload (@Consumes(MULTIPART_FORM_DATA))
  - handle Excel export via ExcelExporter (@Produces application/octet-stream)
  - return proper HTTP status codes (201, 204, 404, 409)
  - write @QuarkusTest integration tests for all endpoints
  - test happy paths: list, create, get, submit, export
  - test error cases: 409 on edit SUBMITTED, 409 on submit non-DRAFT, 404 on not found
  - test Excel import via multipart
  - verify OpenAPI/Swagger UI shows all endpoints
validation:
  - all endpoints return correct HTTP status codes
  - PUT on SUBMITTED version returns 409
  - submit on already-SUBMITTED version returns 409
  - DELETE on SUBMITTED version returns 409
  - new version creation clones items from previous version
  - Excel import creates a new version with calculated fields
  - Excel export returns valid .xlsx
  - integration tests cover happy paths and error cases
  - OpenAPI spec includes all endpoints with schemas
  - all existing tests still pass
  - `mvn clean install` from project root succeeds
outputs:
  - src/backend/implementation/src/main/kotlin/io/pythia/rest/EstimationVersionResource.kt
  - src/backend/implementation/src/main/kotlin/io/pythia/rest/dto/*.kt
  - src/backend/implementation/src/test/kotlin/io/pythia/rest/EstimationVersionResourceIT.kt
