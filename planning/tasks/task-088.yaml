  - created: src/backend/implementation/src/main/kotlin/io/pythia/service/DraftSnapshotMapper.kt
  - modified: src/backend/implementation/src/main/kotlin/io/pythia/rest/EstimationVersionResource.kt
  - modified: CLAUDE.md
  - created: src/backend/implementation/src/test/kotlin/io/pythia/service/DraftSnapshotRoundTripIT.kt
