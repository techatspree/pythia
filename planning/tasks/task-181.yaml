id: task-181
phase: phase-18
title: "Recapture the screenshots, reproducible from any fresh seed"
depends_on: [task-180, task-187, task-211, task-212]
description: |
  The committed screenshots in `docs/images/` cannot be regenerated without an
  unexplained diff, and one of them shows nothing at all. This task drops that
  one (`version-compare.png`, see below) and recaptures the remaining five
  once the causes are fixed (task-211, task-212). It proves they are
  reproducible across FRESH stacks, not only across repeated captures on one
  stack, and writes the procedure down.

  ## What was found (first attempt, 2026-10-15)

  The first version of this task assumed that the schedule shots had drifted
  because they were captured from a long-lived dev database full of manual
  edits, with an `AUTOMATIC` phase write-back as the suspect. That was
  **refuted**:

    - Every seeded Webshop phase is `EXPLICIT` and matches the
      `TestDataSeeder` literals (draft: Konzeption 4.0 / Umsetzung 10.0 /
      Abnahme 2.0 weeks; version 1: 3.0 / 12.0 / 2.0).
    - Two completely FRESH stacks (restarted, so `drop-and-create`
      re-seeds; nothing run against them but `gen:screenshots`) produced
      byte-identical images for four shots, but DIFFERENT schedule shots:

      | box | committed | fresh stack A | fresh stack B |
      |---|---|---|---|
      | U01: Konzeption | 7.1 | 9.8 | 8.5 |
      | U02: Frontend Redesign | 13.7 | 16.9 | 11.4 |
      | U03: Backend & Datenbank | 21.3 | 19.7 | 13.0 |
      | U04: Abnahme & Go-live | 4.3 | 4.3 | 4.3 |

      Every LEAF duration was identical across all three. Only the placement
      differed.
    - Repeated captures on ONE stack are byte-identical, which is why task-180
      saw determinism and missed this.

  **Cause (confirmed in code):** the levelled schedule hands free workers to
  ready items in sorted `logicalId` order (`topologicalOrder`/`forwardPass` in
  `src/domain/core/src/main/kotlin/io/pythia/model/ProjectSchedule.kt`), and
  the seeder's `logicalId`s are fresh random UUIDs on every start. Two fixes,
  each its own task, and this task depends on both:
    - **task-211**: the scheduler uses the TREE ORDER as its priority, so a
      schedule no longer depends on ids at all (the product fix);
    - **task-212**: the seeder draws its ids from a fixed-seed generator, so
      every fresh dev database is identical, ids included (the fixture fix).
  With task-211 alone the schedule shots become reproducible; task-212 makes
  everything else that carries an id reproducible too.

  **Note:** the committed schedule shots will change once more after
  task-211, because the tree order replaces the old accidental order.
  That is expected and is the point.

  ## The other shots (same first attempt)

    - `bucket-editor.png` changed: it gained the Phase and Assumptions
      columns, which comes from the task-186 seed change (`3a47d2d`). This is
      expected and should be committed.
    - `estimation-editor.png` and `session-room.png` differ from the committed
      ones only by a few hundred scattered pixels (text rendering, no
      content). This is acceptable to commit, and their content must be
      checked by eye.
    - **`version-compare.png` shows only the app header and "Loading…"**,
      in the committed copy and in every recapture. The capture script shoots
      `/estimations/{id}/compare?a=1&b=draft` after `networkidle` + 900 ms,
      and the comparison never appears. No document references this image
      (`grep -rn version-compare.png README.md docs/` is empty), which is
      presumably why nobody noticed. **Decided 2026-10-15: the shot is
      DROPPED**, not fixed. Even once it loads it would be meaningless:
      `VersionComparisonService` matches nodes by `logicalId`, and the seeder
      builds the Webshop draft from its own nodes rather than copying
      version 1 (task-212), so the two share no id and the comparison would
      list every item as both removed and added. Making the seeded draft a
      real continuation of version 1 would be a separate decision.

  ## Key decisions already made

  - **Drop `version-compare.png`:** delete the file and its `shoot(…)` call
    in `capture-screenshots.mjs`, and fix the script's header comment and its
    closing "6 screenshots" message.
  - **Recapture the remaining five.** For each shot that changes, say what differs and
    why: task-211's new order, the task-186 seed change, or rendering noise.
    An unexplained content change is reported, not committed.
  - **Pristine means a freshly started stack**, i.e. the backend restarted so
    `drop-and-create` re-seeds, with nothing done before capturing. The e2e
    reset `DELETE /api/dev/test-data` (task-176) is NOT a substitute: it
    keeps the seeded projects, including any edits made to them.
  - **The stack must be THIS task's own.** If another `dev.sh` already holds
    :8090 / :5173 / :5432, a new `dev.sh` fails to bind PostgreSQL, Vite moves
    to another port, and `gen:screenshots` silently captures the OTHER stack's
    long-lived database. That happened once on 2026-10-15 (task-187 work),
    and here it would reproduce exactly the drift this task removes. So check
    the three ports are free before each start, and stop only the `dev.sh`
    this task started (its parent process is this session), never another.
  - **Expected numbers.** task-211 measured the seeded Webshop draft's
    dependency editor after the tree-order fix: U01 9.8, U02 11.4, U03 11.4,
    U04 4.3 days, planned length 32.5 days. The new `schedule-dependencies.png`
    must show those spans; a difference means something changed since and is
    explained before committing.
  - **The bucket shot** keeps its capture as it is (`DP-2026-001`, draft,
    which opens in the bucket view with bucket rows collapsed). After task-187
    it must show the "Begleitende Leistungen" row next to the bucket rows.
  - **Prove reproducibility ACROSS fresh stacks:** capture on stack A, stop it
    (SIGTERM), start stack B, capture again, and require identical SHA-256
    hashes for all five. Two captures on one stack prove nothing new; that is
    exactly what misled task-180.
  - **The note** belongs in `docs/development.md`, next to the
    `gen:screenshots` paragraph (task-180 added one there). It says that the
    shots are reproducible from any freshly started dev stack because the
    seed is deterministic (task-212) and the schedule follows the tree order
    (task-211), and how to recapture: fresh start, nothing else first.

steps:
  - |
    Confirm the dependencies are in: `jq -r '.tasks["task-187"].status, .tasks["task-211"].status, .tasks["task-212"].status' planning/status.json`
    prints `done` three times (task-187 adds the accompanying-work row the bucket-editor shot must show). Do not start otherwise.
  - |
    Drop the compare shot: delete `docs/images/version-compare.png`, remove
    its `shoot(…)` line from `src/frontend/scripts/capture-screenshots.mjs`,
    and update that script's header comment ("Five of the six shots …") and
    its closing message ("6 screenshots") to the new count of five.
  - |
    Stack A. First make sure no other stack is running:
      curl -s -o /dev/null -w '%{http_code}' --max-time 3 localhost:8090/q/health   # must not be 200
      curl -s -o /dev/null -w '%{http_code}' --max-time 3 localhost:5173            # must not be 200
      nc -z localhost 5432 && echo "5432 IN USE — stop: another stack is running"
    If any is in use, do NOT continue and do NOT stop it: it is someone
    else's stack. Report it and wait. Otherwise start `./scripts/dev.sh`,
    check its log shows Vite on :5173 (not "Port 5173 is in use"), run
    nothing else, then `cd src/frontend && npm run gen:screenshots` and save
      mkdir -p build/screenshots && shasum -a 256 docs/images/*.png > build/screenshots/shots-a.sha256
    plus a copy of the five PNGs outside the repo.
  - |
    Stack B: stop stack A by SIGTERM to the `dev.sh` THIS task started (find it
    with `pgrep -f scripts/dev.sh` and check its parent process; never
    `pkill`, never another stack's), confirm 5432 is free again, start fresh,
    run `gen:screenshots` again, and save
    `shasum -a 256 docs/images/*.png > build/screenshots/shots-b.sha256`.
    `cmp build/screenshots/shots-a.sha256 build/screenshots/shots-b.sha256`
    must succeed. If it does not, find which shot differs and why before
    going on.
  - |
    Inspect every PNG by opening it. The dependency editor shows the four
    linked group boxes with the expected spans (U01 9.8, U02 11.4, U03 11.4,
    U04 4.3 days) plus the isolated "U05: Noch zu schätzen". The Gantt shows
    the pinned 2026-03-02 start, a dark-green critical chain and the dashed
    "Projektbegleitung" row. The bucket editor shows the "Begleitende
    Leistungen" row. Compare each with the committed version and state what
    changed and why (see "The other shots").
  - |
    Re-read the alt texts of the shots in `README.md` and `docs/scheduling.md`
    (they describe content, e.g. "with the critical path highlighted") and
    correct any the new images no longer match.
  - |
    Write the note into `docs/development.md` next to the `gen:screenshots`
    paragraph, as described under "Key decisions".
  - |
    Stop the stack this task started (SIGTERM to its own `dev.sh`) and confirm
    no orphaned Dev Services PostgreSQL container is left holding 5432.
  - |
    Run the gate and the full build:
      ./gradlew :frontend:check
      ./gradlew build

validation:
  - |
    jq -e '.tasks["task-187"].status == "done" and .tasks["task-211"].status == "done" and .tasks["task-212"].status == "done"' planning/status.json
  - |
    The compare shot is gone, from the images and from the script:
      test ! -e docs/images/version-compare.png
      ! grep -q "version-compare" src/frontend/scripts/capture-screenshots.mjs
      ! grep -q "6 screenshots" src/frontend/scripts/capture-screenshots.mjs
  - |
    All five screenshots are present, real PNGs, and none is a blank or failed
    capture:
      test "$(ls docs/images/*.png | wc -l)" -eq 5
      for f in docs/images/*.png; do
        test "$(wc -c < "$f")" -gt 15000
        head -c 8 "$f" | od -An -tx1 | tr -d ' \n' | grep -q "^89504e470d0a1a0a$"
      done
  - |
    The two schedule shots kept their expected geometry (dependency editor =
    content-sized canvas, task-179; Gantt = the taller full-width chart):
      python3 -c "import struct;d=open('docs/images/schedule-dependencies.png','rb').read(33);w,h=struct.unpack('>II',d[16:24]);print('dependencies',w,h);exit(0 if w<2000 and h>400 else 1)"
      python3 -c "import struct;d=open('docs/images/schedule-gantt.png','rb').read(33);w,h=struct.unpack('>II',d[16:24]);print('gantt',w,h);exit(0 if w>2000 and h>1000 else 1)"
  - |
    No two screenshots are byte-identical to one another:
      for a in docs/images/*.png; do
        for b in docs/images/*.png; do
          [ "$a" = "$b" ] && continue
          if cmp -s "$a" "$b"; then echo "$a and $b are identical"; exit 1; fi
        done
      done
  - |
    REPRODUCIBLE ACROSS FRESH STACKS (from steps 3 and 4): both captures
    exist, hash all five, and agree, and the committed images are those
    captures:
      test "$(wc -l < build/screenshots/shots-a.sha256)" -eq 5
      cmp build/screenshots/shots-a.sha256 build/screenshots/shots-b.sha256
      shasum -a 256 docs/images/*.png | cmp - build/screenshots/shots-b.sha256
  - |
    The procedure is written down next to the workflow it constrains:
      W=$(grep -iE -A20 "gen:screenshots" docs/development.md)
      printf '%s' "$W" | grep -qiE "fresh|pristine|restart"
      printf '%s' "$W" | grep -q "task-212"
      printf '%s' "$W" | grep -q "task-211"
  - |
    The gate and the full build stay green:
      ./gradlew :frontend:check
      ./gradlew build

outputs:
  - modified: src/frontend/scripts/capture-screenshots.mjs
  - deleted: docs/images/version-compare.png
  - modified: docs/images/schedule-dependencies.png
  - modified: docs/images/schedule-gantt.png
  - modified: docs/images/bucket-editor.png
  # Rendering noise only; committed with the set so all five come from one capture:
  - modified: docs/images/estimation-editor.png
  - modified: docs/images/session-room.png
  - modified: docs/development.md
  # Only if an alt text no longer matches its image:
  - modified: README.md
  - modified: docs/scheduling.md
