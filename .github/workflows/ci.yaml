name: CI

# The public quality gate. Deployment is a separate, internal pipeline whose
# coordinates are deliberately not in this repository (see docs/deployment.md).
#
# `pull_request`, never `pull_request_target`: the latter runs with a
# privileged token in the context of the base repository, which would hand
# fork code write access. Nothing here needs a secret of any kind.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The main gate. One Gradle invocation covers :domain (JVM tests plus the
  # Kotlin/JS + TypeScript packaging), the backend @QuarkusTest suite against a
  # Dev Services PostgreSQL, and :frontend:check — svelte-check, ESLint, the
  # design-token gate, the e2e lint gate (lintE2e: any ESLint finding under
  # src/frontend/e2e/ fails it, task-191), and the OpenAPI drift gate, which
  # activates because the runner sets CI=true.
  #
  # Docker must be available: the %test profile has no H2, it starts a
  # throwaway PostgreSQL 16 via Quarkus Dev Services / Testcontainers. That is
  # why this runs on ubuntu-latest and not in a container without a socket.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Verifies gradle/wrapper/gradle-wrapper.jar against Gradle's published
      # checksums before anything executes it — on a public repo that accepts
      # fork PRs, a swapped wrapper jar runs arbitrary code with the build.
      #
      # This is NOT redundant with setup-gradle, which validates wrappers by
      # default but only the ones it FINDS. `min-wrapper-count` defaults to 1,
      # so this step also fails when the jar is missing entirely — the exact
      # breakage a blanket `*.jar` line in .gitignore caused once already, and
      # which is invisible locally because every existing checkout still has it.
      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build (domain + backend + frontend, all tests)
        run: ./gradlew build --stacktrace

      # Regression guard for task-194: a DEFAULT production build (this job sets
      # no APP_AUTH_PROVIDER) must contain the Entra auth module and never the
      # forgeable dev one. ArC generates a `<Class>_Bean` only for beans that
      # survive build-time gating, so the generated-bytecode jar is the proof.
      # Before task-194 a default build contained NEITHER module and still
      # started, authenticating nobody.
      - name: Verify the default build carries Entra and not the dev auth module
        run: |
          J=src/backend/implementation/build/quarkus-app/quarkus/generated-bytecode.jar
          unzip -l "$J" | grep -q 'io/pythia/auth/entra/EntraAuthModule_Bean.class' \
            || { echo "default build lacks EntraAuthModule_Bean" >&2; exit 1; }
          if unzip -l "$J" | grep -q 'io/pythia/auth/dev/DevAuthModule_Bean.class'; then
            echo "default build contains the forgeable DevAuthModule_Bean" >&2; exit 1
          fi
          echo "Default build: Entra present, dev absent."

      # Not redundant with `build`. The consolidated report is produced by
      # :frontend:sarifHtmlReport, which is wired into the root staticAnalysis
      # task only — `check` gets npmCheck, npmLintReport and checkDesignTokens
      # but not the aggregator. Without this the upload below finds nothing and
      # `if-no-files-found: warn` hides it. Cheap: detekt and the lint runs are
      # already up to date, so only the SARIF/HTML merge executes.
      - name: Consolidated static-analysis report
        if: always()
        run: ./gradlew staticAnalysis

      # `src/*/build/test-results` looks right and matches exactly one of the
      # five module result directories — hence the recursive glob.
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          if-no-files-found: warn
          path: |
            build/reports/static-analysis/static-analysis.html
            build/reports/static-analysis/static-analysis.sarif
            src/**/build/test-results/**

  # Playwright. playwright.config.ts declares no `webServer`, so this job has to
  # start the dev stack itself. No `needs:` — it runs alongside `build` so PR
  # feedback costs one wall-clock build rather than two in series.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # dev.sh shells out to the system `npm run dev`, so the system Node must
      # match the version the Gradle node plugin pins for npmInstall.
      - uses: actions/setup-node@v7
        with:
          # Must equal nodeVersion in gradle.properties (task-197).
          node-version: 22.14.0

      # Materialises what the Vite dev server needs and the repository does not
      # carry: node_modules, src/lib/domain (the KMP/JS output) and the
      # generated API client.
      - name: Prepare the frontend
        run: ./gradlew :frontend:npmBuild

      - name: Install the Playwright browser
        working-directory: src/frontend
        run: npx playwright install --with-deps chromium

      - name: Start the dev stack
        run: |
          ./scripts/dev.sh > dev-stack.log 2>&1 &
          echo "DEV_PID=$!" >> "$GITHUB_ENV"

      # A silent hang is the worst failure mode here, so the wait is bounded and
      # dumps the stack log before giving up.
      - name: Wait for the dev stack
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8090/q/health > /dev/null \
               && curl -sf http://localhost:5173 > /dev/null; then
              echo "Dev stack ready after $((i * 5))s."
              exit 0
            fi
            sleep 5
          done
          echo "The dev stack did not become ready within 450s." >&2
          cat dev-stack.log >&2
          exit 1

      - name: Run the Playwright suite
        working-directory: src/frontend
        run: npm run test:e2e

      # SIGTERM, so dev.sh's `trap cleanup EXIT INT TERM` runs: that trap is
      # what reaps the Dev Services PostgreSQL container and the Kotlin daemon.
      # Killing the child JVMs directly orphans the container. dev.sh is not a
      # child of this shell, so the wait is a poll rather than `wait`.
      - name: Stop the dev stack
        if: always()
        run: |
          if [ -n "${DEV_PID:-}" ]; then
            kill -TERM "$DEV_PID" 2>/dev/null || true
            for i in $(seq 1 30); do
              kill -0 "$DEV_PID" 2>/dev/null || break
              sleep 1
            done
          fi

      - name: Upload Playwright traces and the stack log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure
          if-no-files-found: warn
          path: |
            src/frontend/test-results/**
            dev-stack.log

  # Verifies both images still build. Publishing them is the internal
  # pipeline's business, not this one's — nothing here pushes.
  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A throwaway registry for the multi-arch push check below (task-196). Plain
    # HTTP on localhost, which both image builds accept for localhost only.
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # `--no-build-cache` is load-bearing, not belt-and-braces.
      #
      # Building the image happens INSIDE the Quarkus augmentation
      # (`quarkusAppPartsBuild`), and Gradle's build cache replays a task's file
      # outputs — not its side effects. The `build` job populates the cache
      # WITHOUT `quarkus.container-image.build`, and that entry then satisfies
      # this job: the log reads `quarkusAppPartsBuild FROM-CACHE`, the whole
      # thing reports BUILD SUCCESSFUL in 12s, and no image ever reaches the
      # Docker daemon — so the very next step fails with "No such image".
      #
      # This disables only the TASK-OUTPUT cache; the dependency cache still
      # applies, so the job stays fast. Do not remove it to shave a minute.
      #
      # The frontend needs no such flag: `:frontend:imageBuild` (jib-core,
      # task-195) declares itself never up to date and has no cacheable outputs.
      # It loads into this runner's daemon because the job pushes nothing; with
      # -PfrontendImagePush=true it would push with no Docker at all.
      - name: Build both container images
        run: |
          ./gradlew :backend:implementation:imageBuild \
            -Dquarkus.container-image.build=true --no-build-cache
          ./gradlew :frontend:imageBuild

      - name: Assert both image references exist
        run: |
          docker image inspect pythia/pythia-backend:1.0.0-SNAPSHOT > /dev/null
          docker image inspect pythia/pythia-frontend:1.0.0-SNAPSHOT > /dev/null

      # The daemon builds above can only ever produce and check linux/amd64. This
      # pushes both images to the throwaway registry and asserts each index lists
      # linux/amd64 AND linux/arm64 — proving the arm64 half is buildable and that
      # pushing implies multi-arch (task-196). quarkusAppPartsBuild is where the
      # backend image is built and pushed; `--rerun` keeps the push from depending
      # on what ran before it, as everywhere else this task pushes.
      - name: Push multi-arch images to a throwaway registry and check both platforms
        run: |
          ./gradlew :backend:implementation:quarkusAppPartsBuild --rerun \
            :backend:implementation:imageBuild \
            -Dquarkus.container-image.push=true \
            -Dquarkus.container-image.registry=localhost:5000 \
            -Dquarkus.container-image.insecure=true --no-build-cache
          ./gradlew :frontend:imageBuild -PfrontendImagePush=true \
            -PfrontendImageRegistry=localhost:5000
          for img in pythia-backend pythia-frontend; do
            curl -fsS -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
              "http://localhost:5000/v2/pythia/$img/manifests/1.0.0-SNAPSHOT" \
              | jq -e '[.manifests[].platform | "\(.os)/\(.architecture)"] | (index("linux/amd64") != null and index("linux/arm64") != null)' \
              || { echo "$img is not a linux/amd64 + linux/arm64 index" >&2; exit 1; }
          done

      # Guard the reproducibility INPUTS this repository controls.
      #
      # This deliberately does NOT rebuild and compare image digests. That check
      # was tried and can never pass: Quarkus' augmentation emits exactly one
      # non-deterministic file — `quarkus/generated-bytecode.jar`, and within it
      # `io/quarkus/runner/recorded/ResteasyReactiveProcessor$setupDeployment*.class`
      # (1 of 971 entries, verified by building twice and diffing) — so the
      # image id differs across identical builds for reasons no setting here can
      # fix. Asserting byte-identity would fail the pipeline forever.
      #
      # What IS ours: both Jib timestamp flags off, and digest-pinned base
      # images — the backend's Jib base and the frontend's nginx base (task-195),
      # whose jib-core build must never set a creation time from the clock. Those are what keep the build independent of WHEN and WHERE it
      # runs, and they are what the root CLAUDE.md rule protects.
      - name: Verify the image build stays time- and environment-independent
        run: |
          # application.properties since task-198: Quarkus 3.40 no longer reads
          # quarkus.* keys from the module's gradle.properties.
          P=src/backend/implementation/src/main/resources/application.properties
          grep -qx 'quarkus.jib.use-current-timestamp=false' "$P" \
            || { echo "quarkus.jib.use-current-timestamp must stay false" >&2; exit 1; }
          grep -qx 'quarkus.jib.use-current-timestamp-file-modification=false' "$P" \
            || { echo "quarkus.jib.use-current-timestamp-file-modification must stay false" >&2; exit 1; }
          grep -q 'quarkus.jib.base-jvm-image=.*@sha256:' "$P" \
            || { echo "the Jib base image must be pinned by digest, not a floating tag" >&2; exit 1; }
          # The greps above only prove the settings are WRITTEN. Prove they are
          # APPLIED: with the timestamp flags in effect Jib stamps the fixed epoch.
          # This is what caught Quarkus 3.40 silently ignoring the old location.
          created=$(docker image inspect pythia/pythia-backend:1.0.0-SNAPSHOT --format '{{.Created}}')
          case "$created" in
            1970-01-01T00:00:00*) ;;
            *) echo "backend image created at $created: the Jib timestamp flags are not applied" >&2; exit 1 ;;
          esac
          F=src/frontend/build.gradle.kts
          grep -q 'nginx:[^"]*@sha256:' src/frontend/build.gradle.kts \
            || { echo "the frontend nginx base image must be pinned by digest" >&2; exit 1; }
          if grep -qE 'Instant\.now|setCreationTime' "$F"; then
            echo "the frontend image must not take its creation time from the clock" >&2; exit 1
          fi
          echo "Timestamp flags off and both base images digest-pinned."

      # The image exists only on this runner's Docker daemon, so the image scan
      # lives here rather than in the `security` job.
      - name: Scan the backend image
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pythia/pythia-backend:1.0.0-SNAPSHOT
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  # Reports; it does not gate. A CVE published overnight in a transitive
  # dependency would otherwise turn every unrelated PR red. That matters MORE
  # since task-192: both scans now cover dev dependencies, which is a much
  # larger tree, so keep this job non-gating.
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Must equal nodeVersion in gradle.properties (task-197).
          node-version: 22.14.0

      # Dev dependencies are IN scope (task-192). In a SvelteKit adapter-static
      # SPA the Svelte runtime, Kit's client runtime and `devalue` are
      # devDependencies by convention, yet they are compiled into the bundle
      # users download. `--omit=dev` therefore hid real, shipped findings.
      #
      # `--audit-level` sets only the EXIT CODE: every finding, moderates and
      # lows included, is still printed to this log. It is `high`, not
      # `moderate`, because an accepted moderate advisory (esbuild via
      # svelte-i18n) would fail every run and make a new finding look like the
      # known one. The accepted findings, and why each does not apply, are
      # listed under "Dependency vulnerabilities" in docs/development.md.
      - name: Audit the frontend dependencies
        working-directory: src/frontend
        run: npm audit --audit-level=high

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        # Trivy skips dev dependencies in package-lock.json by default; this is
        # the env form of its `--include-dev-deps` flag, for the same reason as
        # the audit above (task-192). Verify it took effect: the scan log should
        # list dev-only packages (vite, svelte, eslint…). If it does not, pass
        # `--include-dev-deps` through the action's `trivy-config` instead.
        env:
          TRIVY_INCLUDE_DEV_DEPS: 'true'
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          # The two Kotlin/JS lock files are the Kotlin Multiplatform toolchain's
          # OWN build dependencies — webpack, karma, mocha and friends. None of
          # it ships: the frontend image serves the built SPA and the domain
          # ships compiled `domain.mjs`, not these tools. Their versions are
          # resolved by the Kotlin Gradle plugin, so they cannot be bumped
          # directly, and a Yarn `resolution` pin would be a permanent treadmill
          # against DoS advisories in code that never reaches production.
          #
          # This is a scoping decision, not a blanket mute: `package-lock.json`
          # (which does ship) is still scanned, and reports 0. If you ever need
          # them audited, drop this line rather than adding CVE-specific ignores.
          skip-files: 'kotlin-js-store/yarn.lock,src/domain/kotlin-js-store/yarn.lock'
