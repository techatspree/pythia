apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: pythia/pythia-frontend:1.0.0-SNAPSHOT
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          volumeMounts:
            # subPath mounts a single FILE into the served root. The trade-off is
            # deliberate: a subPath mount does NOT pick up ConfigMap updates
            # without a pod restart, which is what we want — the SPA reads
            # /config.json once at boot, so a live-changing file would leave
            # already-open tabs disagreeing with newly-opened ones. A config
            # change therefore needs a rollout, exactly like an image change.
            - name: runtime-config
              mountPath: /usr/share/nginx/html/config.json
              subPath: config.json
          resources:
            requests:
              memory: 64Mi
              cpu: 100m
            limits:
              memory: 128Mi
              cpu: 200m
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: runtime-config
          configMap:
            name: frontend-config
