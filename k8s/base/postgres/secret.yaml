apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
type: Opaque
# The database credentials. task-161 moved these out of application.properties,
# where `%prod.quarkus.datasource.password=estimation` was a committed default;
# this is the other half of that move.
#
# The values below are the LOCAL MINIKUBE shape, matching
# `%dev-minikube.quarkus.datasource.password` in application.properties. They
# are safe only because that cluster is a developer's laptop.
#
# Every DEPLOYED overlay overrides POSTGRES_PASSWORD with the `${POSTGRES_PASSWORD}`
# placeholder, which scripts/deploy.sh refuses to leave unset — so a staging or
# production deploy cannot fall back to the value written here. The user and the
# database name are not secrets and stay the same everywhere.
#
# POSTGRES_PASSWORD only takes effect when the data directory is INITIALISED.
# Changing it against an existing PVC does not change the database's password —
# it changes what the backend presents, and the next backend restart then fails
# to authenticate. See "Rotating the database password" in docs/deployment.md.
stringData:
  POSTGRES_USER: estimation
  POSTGRES_PASSWORD: estimation
  POSTGRES_DB: estimation
