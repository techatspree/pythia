apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
# Deploy-time coordinates. `${REGISTRY}`, `${BACKEND_DIGEST}` and
# `${FRONTEND_DIGEST}` survive `kubectl kustomize` as literal text and are
# resolved by envsubst in scripts/deploy.sh — kustomize itself cannot read the
# environment, and the registry host must not be committed to a public
# repository. The images are pinned by the digest of a released multi-arch
# index (task-199), which the release bundle's release.env provides. Never
# deploy a floating tag: with imagePullPolicy IfNotPresent a moving tag silently
# keeps serving the image already on the node, and a digest cannot move.
images:
  - name: pythia/pythia-backend
    newName: ${REGISTRY}/pythia/pythia-backend
    digest: ${BACKEND_DIGEST}
  - name: pythia/pythia-frontend
    newName: ${REGISTRY}/pythia/pythia-frontend
    digest: ${FRONTEND_DIGEST}
replicas:
  - name: backend
    count: 2
patches:
  - path: backend-oidc.yaml
    target:
      kind: ConfigMap
      name: backend-config
  - path: frontend-config.yaml
    target:
      kind: ConfigMap
      name: frontend-config
  - path: ingress-tls.yaml
    target:
      kind: Ingress
      name: estimation

  # The database password is a real secret and must not come from the base's
  # committed local-development value. scripts/deploy.sh discovers this
  # placeholder in the rendered manifests and refuses to deploy when it is
  # unset, so there is no path by which a deploy quietly uses `estimation`.
  # The substituted value never touches disk: deploy.sh renders to a temp file
  # BEFORE envsubst and pipes the substituted output straight into kubectl.
  - target:
      kind: Secret
      name: postgres-credentials
    patch: |-
      - op: replace
        path: /stringData/POSTGRES_PASSWORD
        value: ${POSTGRES_PASSWORD}
