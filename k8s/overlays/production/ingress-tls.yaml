apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: estimation
spec:
  tls:
    - hosts:
        - estimation.example.com
      secretName: estimation-tls
  rules:
    - host: estimation.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
