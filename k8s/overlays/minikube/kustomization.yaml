apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  # Inject the Entra OIDC config for minikube. The ${ENTRA_*} placeholders in
  # this patch are resolved by envsubst in scripts/minikube-deploy.sh at apply
  # time (not by kustomize).
  - path: backend-oidc.yaml
    target:
      kind: ConfigMap
      name: backend-config
  # Verbose, plain-text backend logs in minikube (overrides the %prod JSON+INFO
  # defaults). Merges into the same backend-config ConfigMap.
  - path: backend-logging.yaml
    target:
      kind: ConfigMap
      name: backend-config
