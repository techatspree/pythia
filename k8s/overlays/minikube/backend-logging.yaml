apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  # Developer-friendly logs in minikube: override the image's baked %prod
  # defaults (structured JSON at INFO) with a plain-text console and DEBUG for
  # the application package. Env-var config wins over application.properties, and
  # these keys merge into backend-config (injected via the Deployment's envFrom).
  # The env-var name maps to quarkus.log.category."io.github.theestimator".level.
  QUARKUS_LOG_CONSOLE_JSON_ENABLED: "false"
  QUARKUS_LOG_CATEGORY__IO_GITHUB_THEESTIMATOR__LEVEL: "DEBUG"
