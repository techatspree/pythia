apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  # Run the dedicated dev-minikube profile (not the default prod). It carries the
  # Entra auth + PostgreSQL + plain-text/DEBUG logging config in
  # application.properties. QUARKUS_PROFILE is a dot-free env var that maps
  # cleanly (unlike quarkus.log.category."io.pythia".level, whose dots
  # can't survive env-var mapping — hence the log level lives in the profile).
  QUARKUS_PROFILE: "dev-minikube"
  # Minikube runs the Entra (OIDC) auth module. The ${ENTRA_*} placeholders are
  # substituted with the exported values at deploy time (scripts/minikube-deploy.sh
  # pipes the rendered manifests through envsubst) — kustomize can't do env
  # substitution itself, and these tenant ids are per-user secrets not committed here.
  # These runtime env vars override the empty base values AND the image's baked
  # OIDC properties, so every ${ENTRA_*}-bearing property resolves.
  QUARKUS_OIDC_ENABLED: "true"
  QUARKUS_OIDC_AUTH_SERVER_URL: "https://login.microsoftonline.com/${ENTRA_TENANT_ID}/v2.0"
  QUARKUS_OIDC_CLIENT_ID: "${ENTRA_API_CLIENT_ID}"
  # Accept BOTH audience forms. v1.0 access tokens carry aud=api://<client-id>;
  # v2.0 tokens (accessTokenAcceptedVersion=2 on the API app registration) carry
  # the bare aud=<client-id>. Listing both (comma-separated) makes the backend
  # agnostic to the token version. NOTE: this env var OVERRIDES the image's baked
  # application.properties value, so the audience must be kept correct HERE too —
  # editing only application.properties has no effect on minikube.
  QUARKUS_OIDC_TOKEN_AUDIENCE: "api://${ENTRA_API_CLIENT_ID},${ENTRA_API_CLIENT_ID}"
