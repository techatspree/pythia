apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  # Run the dedicated dev-minikube profile (not the default prod). It carries the
  # Entra auth + PostgreSQL + plain-text/DEBUG logging config in
  # application.properties. QUARKUS_PROFILE is a dot-free env var that maps
  # cleanly (unlike quarkus.log.category."io.pythia".level, whose dots
  # can't survive env-var mapping — hence the log level lives in the profile).
  QUARKUS_PROFILE: "dev-minikube"

  # Minikube runs the Entra (OIDC) auth module.
  APP_AUTH_PROVIDER: "entra"

  # ONE placeholder convention across every overlay (task-161): provider-neutral
  # ${OIDC_*} names carrying FULL values, never identity-provider-specific
  # fragments that a manifest then has to compose into a URL. The auth layer is
  # modular (dev | entra | keycloak), so the manifests should not be named after
  # one provider. scripts/minikube-deploy.sh derives these from the ENTRA_* ids
  # it already asks for and resolves them with envsubst at apply time —
  # kustomize cannot do env substitution itself, and these ids are per-user
  # values that are not committed here.
  QUARKUS_OIDC_ENABLED: "true"
  QUARKUS_OIDC_AUTH_SERVER_URL: "${OIDC_AUTH_SERVER_URL}"
  QUARKUS_OIDC_CLIENT_ID: "${OIDC_CLIENT_ID}"
  # Accept BOTH audience forms. v1.0 access tokens carry aud=api://<client-id>;
  # v2.0 tokens (accessTokenAcceptedVersion=2 on the API app registration) carry
  # the bare aud=<client-id>. Listing both (comma-separated) makes the backend
  # agnostic to the token version.
  QUARKUS_OIDC_TOKEN_AUDIENCE: "${OIDC_TOKEN_AUDIENCE}"
