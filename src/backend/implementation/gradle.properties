# Quarkus platform coordinates (consumed by build.gradle.kts).
quarkusPlatformGroupId=io.quarkus.platform
quarkusPlatformArtifactId=quarkus-bom
quarkusPlatformVersion=3.35.1

# --- Container image (Jib) ---
quarkus.container-image.build=false
quarkus.container-image.group=pythia
quarkus.container-image.name=pythia-backend
# Pinned to the multi-arch INDEX of release 1.21-1.1741781258 (task-196), not
# to one platform's manifest: an index is what makes an arm64 variant possible.
# Its amd64 member is the previously pinned sha256:87aadb88…, so amd64 images
# are unchanged. Upgrading the JRE release is a separate, deliberate edit.
quarkus.jib.base-jvm-image=registry.access.redhat.com/ubi9/openjdk-21-runtime@sha256:360822c35c5741f542ab78fe123e6c4d9b68e0113a88d6e0250bb1f377b17f29
# The single-platform DAEMON default. A push builds amd64 + arm64 instead
# (build.gradle.kts): a daemon load takes one image, a registry an index.
quarkus.jib.platforms=linux/amd64
# Reproducible image: BOTH timestamp flags MUST stay false (see CLAUDE.md
# "Reproducible Jib backend image"). Setting only one yields non-reproducible
# builds.
quarkus.jib.use-current-timestamp=false
quarkus.jib.use-current-timestamp-file-modification=false
