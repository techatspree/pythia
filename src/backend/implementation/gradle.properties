# Quarkus platform coordinates (consumed by build.gradle.kts).
quarkusPlatformGroupId=io.quarkus.platform
quarkusPlatformArtifactId=quarkus-bom
quarkusPlatformVersion=3.35.1

# --- Container image (Jib) ---
quarkus.container-image.build=false
quarkus.container-image.group=pythia
quarkus.container-image.name=pythia-backend
quarkus.jib.docker-environment-type=local
quarkus.jib.base-jvm-image=registry.access.redhat.com/ubi9/openjdk-21-runtime@sha256:87aadb888d0ca7709f09136466fe5c735654c11f7542d6a711f66c1ebdfcbba0
quarkus.jib.platforms=linux/amd64
# Reproducible image: BOTH timestamp flags MUST stay false (see CLAUDE.md
# "Reproducible Jib backend image"). Setting only one yields non-reproducible
# builds.
quarkus.jib.use-current-timestamp=false
quarkus.jib.use-current-timestamp-file-modification=false
