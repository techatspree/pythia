# OpenAPI / Swagger UI
quarkus.smallrye-openapi.info-title=TheEstimator API
quarkus.smallrye-openapi.info-version=${quarkus.application.version:1.0.0-SNAPSHOT}
quarkus.smallrye-openapi.store-schema-directory=target/openapi
quarkus.swagger-ui.always-include=true

# --- Modular auth provider switch (dev | entra | keycloak) ---
app.auth.provider=dev
%dev-local.app.auth.provider=dev
%dev.app.auth.provider=dev
%test.app.auth.provider=dev
%prod.app.auth.provider=entra
%dev-minikube.app.auth.provider=entra

# --- Dev module default-user fallback ---
# Empty/unset = strict mode (unauthenticated → 401).
# dev-local sets this to dev-admin as a developer convenience so
# curl smoke calls keep working; every other profile leaves it
# empty so the dev gate is real.
app.auth.dev.default-user=
%dev-local.app.auth.dev.default-user=dev-admin
%dev.app.auth.dev.default-user=dev-admin
# %test keeps the convenience fallback so existing @QuarkusTest IT cases
# (which don't send auth headers) continue to pass; the strict mode is
# exercised explicitly by scripts/dev-local-strict.sh on port 8081 via
# the APP_AUTH_DEV_DEFAULT_USER= env override.
%test.app.auth.dev.default-user=dev-admin
%dev-minikube.app.auth.dev.default-user=
%prod.app.auth.dev.default-user=

# --- dev-local profile: H2 in-memory, no Docker, no OIDC ---
%dev-local.quarkus.datasource.db-kind=h2
%dev-local.quarkus.datasource.jdbc.url=jdbc:h2:mem:estimation;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
%dev-local.quarkus.datasource.username=sa
%dev-local.quarkus.datasource.password=
%dev-local.quarkus.hibernate-orm.database.generation=drop-and-create
%dev-local.quarkus.flyway.enabled=false
%dev-local.quarkus.oidc.enabled=false
%dev-local.quarkus.datasource.devservices.enabled=false

# --- dev-minikube profile: PostgreSQL on minikube, container image built ---
%dev-minikube.quarkus.datasource.db-kind=postgresql
%dev-minikube.quarkus.datasource.username=estimation
%dev-minikube.quarkus.datasource.password=estimation
%dev-minikube.quarkus.datasource.jdbc.url=jdbc:postgresql://postgres:5432/estimation
%dev-minikube.quarkus.hibernate-orm.database.generation=validate
%dev-minikube.quarkus.flyway.migrate-at-start=true
%dev-minikube.quarkus.oidc.enabled=true
%dev-minikube.quarkus.oidc.auth-server-url=https://login.microsoftonline.com/${ENTRA_TENANT_ID}/v2.0
%dev-minikube.quarkus.oidc.client-id=${ENTRA_API_CLIENT_ID}
%dev-minikube.quarkus.oidc.application-type=service
%dev-minikube.quarkus.oidc.token.audience=api://${ENTRA_API_CLIENT_ID}
%dev-minikube.quarkus.oidc.roles.role-claim-path=roles
%dev-minikube.quarkus.datasource.devservices.enabled=false

# --- prod profile ---
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=estimation
%prod.quarkus.datasource.password=estimation
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/estimation
%prod.quarkus.hibernate-orm.database.generation=validate
%prod.quarkus.flyway.migrate-at-start=true
%prod.quarkus.oidc.auth-server-url=https://login.microsoftonline.com/${ENTRA_TENANT_ID}/v2.0
%prod.quarkus.oidc.client-id=${ENTRA_API_CLIENT_ID}
%prod.quarkus.oidc.application-type=service
%prod.quarkus.oidc.token.audience=api://${ENTRA_API_CLIENT_ID}
%prod.quarkus.oidc.roles.role-claim-path=roles

# --- dev profile (default Quarkus dev mode with Testcontainers) ---
%dev.quarkus.datasource.db-kind=postgresql
%dev.quarkus.oidc.enabled=false
%dev.quarkus.flyway.migrate-at-start=false
%dev.quarkus.hibernate-orm.database.generation=drop-and-create

# --- test profile: H2 in-memory (same as dev-local, no Docker required) ---
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:estimation;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.flyway.enabled=false
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.oidc.enabled=false
