# --- Logging ---
# App code logs at INFO by default; DEBUG in dev/test for finer detail.
# Root level stays at the Quarkus default. The PROD profile emits
# structured JSON (Kubernetes-friendly) via quarkus-logging-json;
# human-readable console stays the default in dev.
quarkus.log.category."io.github.theestimator".level=INFO
%dev.quarkus.log.category."io.github.theestimator".level=DEBUG
%test.quarkus.log.category."io.github.theestimator".level=DEBUG
# min-level is BUILD-TIME and fixed under the profile active when the image is
# PACKAGED (prod). It is the floor below which a category can never log, so a
# runtime profile (dev-minikube) that sets .level=DEBUG would otherwise be
# clamped back to the INFO floor and emit nothing. Keep this UNPROFILED so the
# floor is lowered at build time regardless of the runtime profile; the actual
# level is still governed by the profiled `.level` above (INFO in prod).
quarkus.log.category."io.github.theestimator".min-level=DEBUG
# dev-minikube: DEBUG app logs for local cluster debugging. This MUST live in
# application.properties (not a k8s env var): quarkus.log.category."<name>".level
# with dots in <name> cannot be set via an environment variable — the dots become
# ambiguous underscores and Quarkus can't rediscover the category (whereas the
# QUARKUS_PROFILE env var that selects this profile maps cleanly).
%dev-minikube.quarkus.log.category."io.github.theestimator".level=DEBUG
# dev-minikube also DEBUGs the OIDC token validator + security layer so Entra
# 401/403s show WHY (no bearer token / wrong audience / invalid signature /
# missing role). Same min-level-must-be-unprofiled rule as above.
%dev-minikube.quarkus.log.category."io.quarkus.oidc".level=DEBUG
quarkus.log.category."io.quarkus.oidc".min-level=DEBUG
%dev-minikube.quarkus.log.category."io.quarkus.security".level=DEBUG
quarkus.log.category."io.quarkus.security".min-level=DEBUG
# quarkus-logging-json defaults JSON on for every profile; keep the
# human-readable console everywhere except prod (dev-minikube inherits plain text).
quarkus.log.console.json.enabled=false
%prod.quarkus.log.console.json.enabled=true

# OpenAPI / Swagger UI
quarkus.smallrye-openapi.info-title=TheEstimator API
quarkus.smallrye-openapi.info-version=${quarkus.application.version:1.0.0-SNAPSHOT}
quarkus.smallrye-openapi.store-schema-directory=target/openapi
quarkus.swagger-ui.always-include=true

# --- Modular auth provider switch (dev | entra | keycloak) ---
# No unprofiled default on purpose: app.auth.provider is REQUIRED (AuthConfig's
# @ConfigProperty has no defaultValue), so a profile that fails to set it fails
# to start (fail-closed) rather than silently falling back to the forgeable dev
# module. AuthProviderGuard additionally refuses to boot the dev provider under
# a NORMAL (production) launch.
%dev.app.auth.provider=dev
%test.app.auth.provider=dev
%prod.app.auth.provider=entra
%dev-minikube.app.auth.provider=entra

# --- dev-minikube profile: PostgreSQL on minikube, container image built ---
%dev-minikube.quarkus.datasource.db-kind=postgresql
%dev-minikube.quarkus.datasource.username=estimation
%dev-minikube.quarkus.datasource.password=estimation
%dev-minikube.quarkus.datasource.jdbc.url=jdbc:postgresql://postgres:5432/estimation
%dev-minikube.quarkus.hibernate-orm.schema-management.strategy=validate
%dev-minikube.quarkus.flyway.migrate-at-start=true
%dev-minikube.quarkus.oidc.enabled=true
%dev-minikube.quarkus.oidc.auth-server-url=https://login.microsoftonline.com/${ENTRA_TENANT_ID}/v2.0
%dev-minikube.quarkus.oidc.client-id=${ENTRA_API_CLIENT_ID}
%dev-minikube.quarkus.oidc.application-type=service
%dev-minikube.quarkus.oidc.token.audience=api://${ENTRA_API_CLIENT_ID}
%dev-minikube.quarkus.oidc.roles.role-claim-path=roles
%dev-minikube.quarkus.datasource.devservices.enabled=false

# --- prod profile ---
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=estimation
%prod.quarkus.datasource.password=estimation
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/estimation
%prod.quarkus.hibernate-orm.schema-management.strategy=validate
%prod.quarkus.flyway.migrate-at-start=true
%prod.quarkus.oidc.auth-server-url=https://login.microsoftonline.com/${ENTRA_TENANT_ID}/v2.0
%prod.quarkus.oidc.client-id=${ENTRA_API_CLIENT_ID}
%prod.quarkus.oidc.application-type=service
%prod.quarkus.oidc.token.audience=api://${ENTRA_API_CLIENT_ID}
%prod.quarkus.oidc.roles.role-claim-path=roles

# --- dev profile: canonical local profile — PostgreSQL via Quarkus Dev
#     Services (a throwaway Docker container; Docker must be running) ---
%dev.quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.devservices.image-name=postgres:16
# Pin the Dev Services host port, db name, and credentials so external tools
# (e.g. IntelliJ's Database panel) can connect at a stable
# jdbc:postgresql://localhost:5432/estimation with estimation / estimation
# (without these, Dev Services picks a random port and quarkus/quarkus creds).
%dev.quarkus.datasource.devservices.port=5432
%dev.quarkus.datasource.devservices.db-name=estimation
%dev.quarkus.datasource.devservices.username=estimation
%dev.quarkus.datasource.devservices.password=estimation
%dev.quarkus.oidc.enabled=false
%dev.quarkus.flyway.migrate-at-start=false
%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# --- test profile: PostgreSQL via Dev Services / Testcontainers (Docker
#     required); schema drop-and-created from the entities, no Flyway ---
%test.quarkus.datasource.db-kind=postgresql
%test.quarkus.datasource.devservices.image-name=postgres:16
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.flyway.enabled=false
%test.quarkus.oidc.enabled=false
