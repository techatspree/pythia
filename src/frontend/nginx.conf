server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;

    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Content-hashed build assets never change for a given URL — cache forever.
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        # The SPA shell (index.html) must always be revalidated so a new deploy
        # is picked up immediately; otherwise browsers heuristically cache it and
        # keep serving a stale bundle (e.g. an old dev-auth build) within a
        # session. `no-cache` = cache but revalidate via ETag on every load.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
