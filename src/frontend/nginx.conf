server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;

    location /api/ {
        # The Merlin import/export endpoints POST a whole .mproject document as
        # multipart. nginx' DEFAULT client_max_body_size is 1m, which rejected a
        # ~1.1 MB Merlin file with a bare `413` BEFORE proxying — so nothing
        # appeared in the backend log at all and the feature looked broken only
        # in the cluster (the Vite dev proxy imposes no limit, so local dev
        # never showed it). Keep this in sync with the backend's
        # `quarkus.http.limits.max-body-size`: whichever is smaller is the real
        # limit, and a mismatch just moves the rejection one hop.
        client_max_body_size 32m;

        # Use the FULLY QUALIFIED service name. proxy_pass via a variable defers
        # DNS to request time using the `resolver` above, and nginx's resolver
        # does NOT apply /etc/resolv.conf `search` domains — so the bare name
        # `backend` returns NXDOMAIN ("host not found"). The FQDN resolves
        # directly. (Namespace `estimation` + cluster domain `cluster.local`.)
        set $backend_upstream http://backend.estimation.svc.cluster.local:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Collaborative-session WebSocket channel (task-066). Mirrors the /api block's
    # deferred-resolution resolver pattern, plus the HTTP/1.1 Upgrade handshake
    # headers that turn a proxied request into a WebSocket.
    location /ws/ {
        set $ws_upstream http://backend.estimation.svc.cluster.local:8080;
        proxy_pass $ws_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Content-hashed build assets never change for a given URL — cache forever.
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        # The SPA shell (index.html) must always be revalidated so a new deploy
        # is picked up immediately; otherwise browsers heuristically cache it and
        # keep serving a stale bundle (e.g. an old dev-auth build) within a
        # session. `no-cache` = cache but revalidate via ETag on every load.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
