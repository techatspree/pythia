<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>The Estimator</title>
        <!-- Progressive enhancement: tints the browser chrome on Android Chrome.
            Not yet baseline (Safari ignores it), which is harmless here — the
            PWA theme colour is also carried by static/site.webmanifest. -->
        <!-- eslint-disable-next-line @html-eslint/use-baseline -->
        <meta name="theme-color" content="#009e5a">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link
            rel="preconnect"
            href="https://fonts.gstatic.com"
            crossorigin=""
        >
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
        %sveltekit.head%
    </head>
    <body data-sveltekit-preload-data="hover">
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
