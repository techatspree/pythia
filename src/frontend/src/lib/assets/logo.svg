<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>The Estimator</title>
  <defs>
    <linearGradient id="theEstimatorBrand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#009e5a"/>
      <stop offset="100%" stop-color="#bade4e"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" ry="16" fill="url(#theEstimatorBrand)"/>

  <!-- Pedestal: the crystal ball sits on a tiered dark-green stand. -->
  <ellipse cx="32" cy="52.5" rx="13.5" ry="3.4" fill="#00623a"/>
  <ellipse cx="32" cy="49.8" rx="11" ry="2.5" fill="#2fae72"/>
  <rect x="27" y="44" width="10" height="5" rx="2" fill="#fff" opacity="0.85"/>

  <!-- The forecasting sphere: translucent glass with a bright rim + shine. -->
  <circle cx="32" cy="25" r="20" fill="#fff" opacity="0.16"/>
  <circle cx="32" cy="25" r="20" fill="none" stroke="#fff" stroke-width="1.6" opacity="0.5"/>
  <path d="M18 15 A20 20 0 0 1 27 8.5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

  <!-- The growth it foresees: three rising bars (rooted on a shared baseline). -->
  <rect x="21" y="31" width="5" height="6" rx="1.4" fill="#fff" opacity="0.5"/>
  <rect x="28.5" y="26" width="5" height="11" rx="1.4" fill="#fff" opacity="0.5"/>
  <rect x="36" y="20" width="5" height="17" rx="1.4" fill="#fff" opacity="0.5"/>

  <!-- The estimate: a dotted lead-in becomes a solid trend arrow taking off. -->
  <circle cx="13.5" cy="39.5" r="1.5" fill="#fff" opacity="0.85"/>
  <circle cx="16" cy="37.8" r="1.5" fill="#fff" opacity="0.9"/>
  <path d="M18.5 36 C25 34 28.5 25 39 17.5" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <path d="M39.5 17 L45 13 L41.5 22.5 Z" fill="#fff"/>
</svg>
