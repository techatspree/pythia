org.gradle.parallel=true
org.gradle.caching=true
# In-process Kotlin compilation (below) runs the compiler inside the Gradle
# daemon JVM, so give it room (the 512m/384m defaults exhaust metaspace).
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.code.style=official
# Compile in-process rather than via the Kotlin compile daemon: the daemon is
# shared per-machine by Kotlin version, and a stale daemon from a different
# Kotlin version (the repo previously mixed versions across Maven modules)
# throws NoSuchMethodError on CompilationOptions. In-process keeps builds
# deterministic across modules.
kotlin.compiler.execution.strategy=in-process
# caching does not work, because
# - Task `:domain:prepareTypescriptArtifacts` of type `org.gradle.api.tasks.Copy`: cannot serialize Gradle script object references as these are not supported with the configuration cache.
#   See https://docs.gradle.org/9.4.1/userguide/configuration_cache_requirements.html#config_cache:requirements:disallowed_types
# - Task `:frontend:unpackDomainTypescript` of type `org.gradle.api.tasks.Sync`: cannot serialize Gradle script object references as these are not supported with the configuration cache.
#   See https://docs.gradle.org/9.4.1/userguide/configuration_cache_requirements.html#config_cache:requirements:disallowed_types
org.gradle.configuration-cache=false

# Kotlin/JS: merge the multi-module domain (task-143) into ONE `domain.mjs`
# instead of one bundle per Gradle module. Without this the aggregator emits
# only its own code and the frontend cannot import core types from domain.mjs.
kotlin.js.ir.output.granularity=whole-program

# The ONE Node.js version of the build (task-197): the frontend's gradle-node
# plugin and the Kotlin/JS toolchain of :domain (Kotlin Gradle plugin) both read
# it. Kept on Node 22 LTS rather than 24 on purpose: the Kotlin/JS toolchain
# runs Yarn 1, which calls url.parse(), and Node 24+ prints DEP0169 for that on
# every build (measured 2026-10-11). The two `actions/setup-node` steps in
# .github/workflows/ci.yaml must use the same version.
nodeVersion=22.14.0
