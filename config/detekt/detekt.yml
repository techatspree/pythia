# Shared detekt config used by both src/domain (Gradle) and
# src/backend/implementation (Maven). Defaults inherited from the
# bundled rule set via `buildUponDefaultConfig: true` configured in
# the plugin wiring.
#
# Header: buildUponDefaultConfig: true

build:
  maxIssues: -1  # reports are informational — never fail the build on
                 # findings. A follow-up task can flip this to 0 once
                 # the backlog is triaged.
  weights:
    complexity: 1
    style: 1

complexity:
  LongMethod:
    threshold: 100
  LargeClass:
    threshold: 800

naming:
  ConstructorParameterNaming:
    # The KMP domain models use underscore-prefixed private constructor
    # parameters that back get()-computed properties (the "underscore-forwarding
    # constructor" convention — see CLAUDE.md). Allow an optional leading
    # underscore on private constructor params so this intentional pattern is
    # not reported.
    privateParameterPattern: '_?[a-z][A-Za-z0-9]*'

style:
  MagicNumber:
    ignoreNumbers: ['-1', '0', '1', '2', '6', '10', '100']
  ReturnCount:
    max: 6
  # buildUponDefaultConfig: true is set in the plugin wiring, not
  # this file — kept here as documentation of the intent.
